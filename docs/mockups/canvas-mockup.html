/* ------------------------------------------------------------------ *
 * Non-colour tokens. Declared once; never overridden by a palette.
 * Values from docs/ui-references.md, Family C, "The industrial palette",
 * non-colour properties table.
 * ------------------------------------------------------------------ */
:root {
  --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen", "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "SF Mono", "Monaco", "Inconsolata", "Fira Mono", "Droid Sans Mono", "Source Code Pro", "Consolas", "Liberation Mono", monospace;
  --line-height: 1.6;
  --font-weight: 500;
  --font-weight-bold: 700;
  --font-size-base: 1rem;
  --spacing: 1rem;
  --spacing-sm: 0.5rem;
  --spacing-md: 1rem;
  --spacing-lg: 2rem;
  --border-radius: 0.25rem;
  --border-width: 1px;
  --border-width-thick: 0.125rem;
  --rail-width: 13rem;
  /* THE DOCK'S WIDTH IS THE READER'S, NOT THE STYLESHEET'S.
     At a fixed 26 rem the import-repair case — the surface the spec
     calls the product's differentiator — could not hold one marked
     line and its notice side by side, while the identical content read
     whole the moment the dock stacked full width at a 900 px viewport.
     So the dock starts wider and can be dragged wider still; the value
     is a custom property because the grip writes to it. */
  --dock-width: 34rem;
  --header-height: 3.75rem;
  --row-height: 40px;
}

/* ------------------------------------------------------------------ *
 * WHAT THE PAGE INHERITS RATHER THAN DRAWS.
 *
 * Twelve palette blocks above, and none of them reached the scrollbars,
 * the form controls, the text caret, the default focus ring or the
 * selection wash — because those are painted by the user agent and no
 * sweep over this page's own text or its own shapes has a population
 * that includes them. Every one of them was rendering in the operating
 * system's light chrome over a dark page.
 *
 * THE ROOT CAUSE IS ONE DECLARATION. `prefers-color-scheme` is the
 * detection; `color-scheme` is the statement, and it was never made.
 * It is keyed to the resolved theme rather than to the media query, so
 * a user override moves it exactly as it moves every colour token:
 * applyTheme() always writes data-theme, so the attribute is the
 * resolved answer and the media query is only the no-attribute case.
 * ------------------------------------------------------------------ */
:root { color-scheme: light; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) { color-scheme: dark; }
}
:root[data-theme$="-dark"] { color-scheme: dark; }
:root[data-theme$="-light"] { color-scheme: light; }

/* The scrollbars, in the tokens each palette already declares. Thin,
   because a scrollbar is furniture: at 15 px the dock was spending a
   fortieth of its width twice over on two nested ones. Both spellings
   are given — the standard properties, which inherit from the root, and
   the WebKit pseudo-elements, which do not. No value is invented here:
   the track is the page's inset ground and the thumb its strong border,
   which is what every other divider on the page is drawn in. */
:root {
  /* `scrollbar-color` inherits; `scrollbar-width` does not, which is why
     the root alone gave the page a 10 px scrollbar and left every inner
     one at the operating system's 15 px. Measured, not assumed. */
  scrollbar-color: var(--border-strong) var(--bg-inset);
  /* Native controls — the checkbox, the radio, the number spinner and
     the select's own chevron — take the palette's accent instead of the
     operating system's blue. */
  accent-color: var(--accent);
}
* { scrollbar-width: thin; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--bg-inset); }
::-webkit-scrollbar-thumb {
  background: var(--border-strong);
  border-radius: var(--border-radius);
}
::-webkit-scrollbar-thumb:hover { background: var(--accent); }
::-webkit-scrollbar-corner { background: var(--bg-inset); }

/* The caret, the selection wash and the placeholder: three more surfaces
   whose colour came from the user agent. The caret was already set on
   the code pane's textarea and nowhere else. */
input, select, textarea { caret-color: var(--accent); }
::selection { background: var(--accent-soft); color: var(--text-strong); }
::placeholder { color: var(--text-muted); opacity: 1; }

/* THE DEFAULT FOCUS RING WAS THE USER AGENT'S. Five families of shape
   on this page declare a focus treatment of their own — the map marks,
   the tree nodes, the matrix cells, the person blocks, the add slot —
   and every button, select and tab on the page fell through to whatever
   Chrome draws. One rule, in the accent, ahead of the five so they still
   win where they are more specific. */
:focus-visible { outline: var(--border-width-thick) solid var(--accent); outline-offset: 1px; }

/* The People page: the same angular card language as the canvas, in the
   main area rather than in a panel, because it is a row per client. */
.people-view {
  display: flex; flex-direction: column; gap: var(--spacing);
  max-width: 68rem;
}
.people-card {
  background: var(--bg-surface);
  border: var(--border-width) solid var(--border-color);
  border-radius: var(--border-radius);
  padding: var(--spacing-sm) var(--spacing);
  display: flex; flex-direction: column; gap: var(--spacing-sm);
}
.people-head { display: flex; align-items: baseline; gap: var(--spacing-sm); flex-wrap: wrap; }
.people-head h2 { font-size: 0.9375rem; }
.people-add { display: flex; gap: var(--spacing-sm); align-items: center; flex-wrap: wrap; }
.people-add input {
  background: var(--bg-surface); color: var(--text-primary);
  border: var(--border-width) solid var(--border-color);
  border-radius: var(--border-radius); padding: 0.3rem 0.4rem; min-width: 14rem;
}
.people-list { display: flex; flex-wrap: wrap; gap: var(--spacing-sm); }
.person {
  display: inline-flex; align-items: baseline; gap: 0.4rem;
  border: var(--border-width) solid var(--border-color);
  border-left: var(--border-width-thick) solid var(--accent);
  border-radius: var(--border-radius);
  background: var(--bg-inset); padding: 0.25rem 0.45rem; font-size: 0.8125rem;
}
.person-count { color: var(--text-primary); font-variant-numeric: tabular-nums; font-size: 0.6875rem; }
.people-filter { display: flex; align-items: center; gap: 0.35rem; margin-left: auto; }
/* The table scrolls sideways rather than cutting a person's name: the
   same treatment, in the same words, as the interface traffic matrix.
   A name half-printed in a selector is a wrong name. */
.people-scroll { overflow-x: auto; max-width: 100%; }
.people-table { min-width: 40rem; }
.owner-cell select { width: 100%; min-width: 9rem; }
.people-table td, .people-table th { vertical-align: baseline; }
.people-table tr.is-unowned td:first-child { border-left: var(--border-width-thick) solid var(--border-strong); }

/* ------------------------------------------------------------------ *
 * Structure. Cloudflare Radar's composition: a left rail, a scoped
 * header carrying the selectors, angular cards with a one-line
 * explanation under each title.
 * ------------------------------------------------------------------ */
* { box-sizing: border-box; }
/* ONE RULE FOR THE ATTRIBUTE, NOT ONE PER ELEMENT THAT USES IT.
   `hidden` is a user-agent `display: none`, so any class rule setting a
   display beats it — `.grid { display: grid }` kept the canvas on screen
   with `hidden` set on it, under the People page. Eight elements had a
   `[hidden]` rule of their own written after the symptom showed up on
   each; the ninth did not, and that is the shape of the defect. */
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-family);
  font-weight: var(--font-weight);
  font-size: var(--font-size-base);
  line-height: var(--line-height);
  background: var(--bg-app);
  color: var(--text-primary);
}
h1, h2, h3, h4 { font-weight: var(--font-weight-bold); line-height: 1.2; margin: 0; color: var(--text-strong); }
a { color: var(--link); }
button, select, input { font-family: inherit; font-size: 0.8125rem; font-weight: var(--font-weight); }

/* min-height rather than height: the header carries two rows that sit
   side by side while there is room and stack when there is not, and a
   fixed height is exactly what pushes controls outside the box. */
.app-header {
  position: sticky; top: 0; z-index: 300;
  min-height: var(--header-height);
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--spacing-sm) var(--spacing); flex-wrap: wrap;
  padding: var(--spacing-sm) var(--spacing);
  background: var(--bg-raised);
  border-bottom: var(--border-width) solid var(--border-color);
}
.header-row { display: flex; align-items: center; gap: var(--spacing-sm); min-width: 0; }
.header-row-identity { gap: var(--spacing); }
.brand { display: flex; align-items: baseline; gap: 0.5rem; min-width: 0; }
.brand-name { font-size: 1.125rem; font-weight: var(--font-weight-bold); letter-spacing: 0.02em; white-space: nowrap; }
/* THE RAISED GROUNDS TAKE --text-primary, BY MEASUREMENT.
   The header bar, the rail, the feed rows and the map counter tiles are
   drawn on --bg-raised, which no token was derived against: in Nord dark
   that ground put --text-muted at 3.68:1 and --text-secondary at 3.85:1
   on the strings that say what the AC7 numbers are. The sweep names
   them; they take the page's own text colour. */
.brand-sub { font-size: 0.75rem; color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.header-controls { flex-wrap: wrap; justify-content: flex-end; }
/* The sheet control replaces the rail, and only where the rail is gone. */
#rail-toggle { display: none; }
.control-group { display: flex; align-items: center; gap: 0.35rem; }
.control-group > label { font-size: 0.6875rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-primary); }

.app-body { display: flex; align-items: stretch; min-height: calc(100vh - var(--header-height)); }

.rail {
  width: var(--rail-width); flex: 0 0 var(--rail-width);
  background: var(--bg-raised);
  border-right: var(--border-width) solid var(--border-color);
  padding: var(--spacing);
  display: flex; flex-direction: column; gap: var(--spacing);
}
/* The rail is --bg-raised, so its headings take the page's own ink for
   the same reason the header bar's do — see THE RAISED GROUNDS above.
   Measured at 3.85:1 in Nord dark on --text-secondary. */
.rail-section-title {
  font-size: 0.6875rem; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--text-primary); margin-bottom: 0.35rem;
}
.rail-link {
  display: block; width: 100%; text-align: left;
  background: var(--bg-surface); color: var(--text-primary);
  border: var(--border-width) solid var(--border-color);
  border-radius: var(--border-radius);
  padding: 0.4rem 0.55rem; margin-bottom: 0.35rem; cursor: pointer;
  font-size: 0.8125rem;
}
.rail-link:hover { border-color: var(--accent); }
/* A rail link says which state it is in, whichever attribute it uses to
   say it: the canvases mark themselves current, the two tools mark
   themselves pressed. Both are "you are here". */
.rail-link[aria-current="true"],
.rail-link[aria-pressed="true"] {
  background: var(--accent); border-color: var(--accent-hover);
  color: var(--on-accent); font-weight: var(--font-weight-bold);
}

.main { flex: 1; min-width: 0; padding: var(--spacing) var(--spacing) var(--spacing-lg); }

/* THE CODE VIEW IS DOCKED BESIDE THE RENDERED CANVAS, NOT OVER IT.
   It was a full-viewport modal with a backdrop, and a modal hides the
   rendering: the whole point of a code surface next to a dashboard is
   that an edit and its effect are on screen together. It is a column of
   the body, sticky under the header so it stays in view while the
   canvas scrolls, and the canvas narrows to make room rather than
   disappearing behind it. */
.doc-dock {
  flex: 0 0 var(--dock-width); width: var(--dock-width); min-width: 0;
  align-self: flex-start;
  position: sticky; top: var(--header-height);
  max-height: calc(100vh - var(--header-height));
  display: flex; flex-direction: column; gap: var(--spacing-sm);
  padding: var(--spacing-sm) var(--spacing);
  background: var(--bg-raised);
  border-left: var(--border-width) solid var(--border-color);
}
/* ONE SCROLLER IN THIS COLUMN, NEVER TWO NESTED IN IT.
   The dock had three at once — the page's, its own body's, and the
   preview's or the code pane's — each with its own 15 px native
   scrollbar, in a 544 px column. The preview is gone; the code pane
   scrolls itself, because a caret has to be able to reach the end of a
   four-hundred-line document, so on the two code tabs the body around
   it does not scroll and the pane fills the height instead. The form
   tab has no inner scroller, so the body is the one that scrolls. */
.doc-dock-body { overflow: auto; flex: 1; min-height: 0; display: flex; flex-direction: column; }
.doc-dock-body.is-code { overflow: hidden; }
/* The grip that widens the dock. It is a control, so it is in the tab
   order and answers the arrow keys as well as the pointer. */
.dock-grip {
  position: absolute; left: -0.3rem; top: 0; bottom: 0; width: 0.6rem;
  background: none; border: none; padding: 0; cursor: col-resize; z-index: 5;
}
.dock-grip:hover, .dock-grip:focus { background: var(--accent-soft); outline: none; }
.dock-subject {
  margin: 0; font-size: 0.6875rem; color: var(--text-secondary);
  display: flex; flex-direction: column; gap: 0.1rem;
}
.dock-subject .dock-subject-id {
  font-family: var(--font-mono); font-size: 0.625rem; color: var(--text-secondary);
}
.dock-actions { display: flex; align-items: center; gap: var(--spacing-sm); flex-wrap: wrap; }
/* Every notice the pane pins to a line, repeated underneath at the
   page's own text size. The pinned notice has to share a row with the
   line it annotates and is therefore capped; this list is not, so no
   part of an import diagnosis is unreachable at any dock width. */
.code-notice-list {
  margin: var(--spacing-sm) 0 0; padding: 0; list-style: none;
  display: flex; flex-direction: column; gap: 0.25rem;
}
.code-notice-list li {
  font-size: 0.6875rem; line-height: 1.4; color: var(--text-secondary);
  border-left: var(--border-width-thick) solid var(--status-ref);
  padding-left: 0.4rem;
}
.code-notice-list .code-notice-line {
  display: block; font-family: var(--font-mono); font-size: 0.625rem; color: var(--text-secondary);
}

/* The scoped header, Cloudflare Radar's arrangement: the canvas tabs on
   the left, the canvas's own selector on the right. The period is the
   dashboard's primary control, so it is drawn as one — accented, at the
   top right, above everything it governs — rather than being reachable
   only through fifteen separate gears. */
.canvas-bar {
  margin-bottom: var(--spacing);
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: var(--spacing); flex-wrap: wrap;
}
.tabs { display: flex; gap: 0.35rem; flex-wrap: wrap; }
.period-control { display: flex; align-items: center; gap: 0.4rem; flex: 0 0 auto; }
.period-control > label {
  font-size: 0.6875rem; text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--text-secondary);
}
.period-control select { border-color: var(--accent); color: var(--text-primary); font-weight: 600; }
.tab {
  background: var(--bg-inset); color: var(--text-secondary);
  border: var(--border-width) solid var(--border-color);
  border-radius: var(--border-radius);
  padding: 0.35rem 0.75rem; cursor: pointer; font-size: 0.8125rem;
}
.tab:hover { border-color: var(--accent); color: var(--text-primary); }
.tab[aria-selected="true"] {
  background: var(--accent); border-color: var(--accent-hover);
  color: var(--on-accent); font-weight: var(--font-weight-bold);
}
.live-pill {
  display: inline-flex; align-items: center; gap: 0.35rem;
  border: var(--border-width) solid var(--border-color);
  border-radius: var(--border-radius);
  padding: 0.2rem 0.45rem; font-size: 0.6875rem;
  color: var(--text-secondary); background: var(--bg-surface);
  font-variant-numeric: tabular-nums;
}
/* A 7 px dot is the smallest mark on the page and the status hues are
   not fitted against the pill it sits in: Catppuccin light put it at
   1.6:1. It takes the same hairline the map marks took — the hue keeps
   saying what it says and the ring makes the dot findable. */
.live-dot {
  width: 0.45rem; height: 0.45rem; border-radius: 50%;
  background: var(--status-ok); display: inline-block;
  border: var(--border-width) solid var(--text-primary);
}

/* THE COLUMN COUNT IS DECIDED FROM THE CANVAS'S OWN WIDTH, after
   layout, by applyGridLayout(). What is scarce is the container and not
   the window: with the code dock open a 1440 px window leaves the canvas
   769 px, at which a six-of-twelve card is 380 px wide. None of this is
   written back to the document; it is a rendering override, exactly as
   docs/dashboard-format.md, "Placement", requires of a narrow layout. */
.grid {
  display: grid;
  grid-template-columns: repeat(12, minmax(0, 1fr));
  grid-auto-rows: var(--row-height);
  grid-auto-flow: row dense;
  gap: var(--spacing);
}
/* THE AUTHORED HEIGHT IS A FLOOR AT TWELVE COLUMNS TOO.
   It was a ceiling here and a floor everywhere else, and the ceiling is
   what cut mandatory content off the bottom of a card on a wide screen:
   a drawing scales with its card's width, so the same seven-of-twelve
   footprint that fits at a 900 px canvas needs 213 px more at a 1700 px
   one. Measured at 2560 px, the connection tree lost its entire
   right-hand "Outside" level and the rule table lost its own reconciling
   total — the two figures the surrounding rounds were spent making
   correct. The footprint still decides the card's place and its minimum
   size, which is what docs/dashboard-format.md, "Placement", asks of it;
   nothing is written back, and a card that needs more than it was given
   takes it rather than hiding the difference. */
.grid.cols-12 {
  grid-template-columns: repeat(12, minmax(0, 1fr));
  grid-auto-rows: minmax(var(--row-height), auto);
}
/* A REDUCED LAYOUT LETS A CARD BE AS TALL AS ITS CONTENT, which is the
   rule the one-column layout already follows and for the same reason: a
   footprint authored against a twelve-column grid is not a footprint
   against eight, so holding the authored height there would clip
   content the reader asked for. The authored height is the floor, never
   the ceiling, and nothing is written back. */
.grid.cols-8 {
  grid-template-columns: repeat(8, minmax(0, 1fr));
  grid-auto-rows: minmax(var(--row-height), auto);
}
.grid.cols-1 {
  grid-template-columns: minmax(0, 1fr);
  grid-auto-rows: minmax(0, auto);
}

/* A card is a short title and a shape. There is no subtitle line, no
   note, no caption and no footer: the product is looked at. */
.card {
  position: relative;
  background: var(--bg-surface);
  border: var(--border-width) solid var(--border-color);
  border-radius: var(--border-radius);
  padding: var(--spacing-sm) var(--spacing) var(--spacing);
  display: flex; flex-direction: column; gap: var(--spacing-sm);
  overflow: hidden; min-width: 0;
}
.card.is-selected { border-color: var(--accent); box-shadow: 0 0 0 var(--border-width-thick) var(--accent-soft); }
.card.is-dragging { opacity: 0.85; border-color: var(--accent); z-index: 40; }
/* THE HEADER WRAPS BEFORE THE TITLE TRUNCATES.
   At an 843 px canvas the header read "Traffic composition…" with the
   unit chip intact beside it, and at a 420 px card the chip truncated
   to "BY INTERFACE · T…", losing the unit that says what the headline
   number is. Both come from one line that cannot hold both: the title
   had a 7 rem flex-basis, so it never asked for more than 7 rem while
   the chip asked for its whole content. The title now asks for its own
   width and keeps a 7 rem floor, and the row WRAPS rather than
   ellipsising either of them — the chips take a second line on a narrow
   card and are whole on it. */
.card-head { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
/* THE TITLE KEEPS THE WIDTH AND THE CHIP SURRENDERS IT, AT EVERY CARD
   WIDTH. This bargain used to be written only inside a 600 px viewport
   query, so at 1122 px — and at 1440 px with the code dock open — the
   title of a narrow card was given 47 px for 175 px of text and rendered
   as "Traff…" while the chip beside it kept 194 px. What is scarce is
   the card, not the window, so the floor is unconditional: the title
   holds seven rem and the chip shrinks and ellipsises. A title that
   still does not fit is given its whole text in a title attribute by
   fitCardHeaders(). */
.card-title {
  font-size: 0.9375rem; flex: 1 1 auto; min-width: 7rem;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
/* Cloudflare Radar's one line under the title: what this card answers,
   in the catalogue entry's own words. */
/* THE QUESTION LINE TAKES THE SECONDARY WEIGHT, NOT THE MUTED ONE.
   --text-muted is no longer a text colour anywhere on this page: it
   keeps the marks that are not text, and every string is set in
   whichever weight the contrast sweep measures at 4.5:1 or better on
   its own ground. Family C's recorded values are untouched; what
   changed is where they are spent. */
.card-state {
  font-size: 0.625rem; text-transform: uppercase; letter-spacing: 0.05em;
  border: var(--border-width) solid var(--status-warn); color: var(--text-primary);
  --badge-hue: var(--status-warn);
  border-radius: var(--border-radius); padding: 0 0.3rem; white-space: nowrap;
}
/* Neutral header chip. It carries what the card is grouped by and over
   what window — the catalogue requires the grouping dimension to be on
   screen wherever proportions are drawn — and it is deliberately not
   .card-state, which is the warning slot. */
.card-meta {
  font-size: 0.625rem; text-transform: uppercase; letter-spacing: 0.05em;
  border: var(--border-width) solid var(--border-strong); color: var(--text-secondary);
  border-radius: var(--border-radius); padding: 0 0.3rem; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; max-width: 100%; min-width: 0;
  flex: 0 1 auto;
}
/* The gear has a permanent resting state. A control that only exists on
   hover is discoverable by guessing and unreachable by touch, so it is
   always drawn — quietly, at a contrast that does not compete with the
   card's own figures — and comes forward on hover, on focus and while
   its card is selected. */
/* A widget that carries its own period rather than the canvas's. */
.card-period {
  font-size: 0.625rem; text-transform: uppercase; letter-spacing: 0.05em;
  border: var(--border-width) solid var(--accent); color: var(--text-primary);
  --badge-hue: var(--accent);
  border-radius: var(--border-radius); padding: 0 0.3rem; white-space: nowrap;
}
/* A parameter the import kept and this build does not understand. It is
   the reference colour, because it is an import condition — but it is
   not a state panel, because the widget drew everything it was asked
   for. */
.card-kept {
  font-size: 0.625rem; text-transform: uppercase; letter-spacing: 0.05em;
  border: var(--border-width) solid var(--status-ref); color: var(--text-primary);
  --badge-hue: var(--status-ref);
  border-radius: var(--border-radius); padding: 0 0.3rem; white-space: nowrap;
}
.kept-note {
  margin: 0.35rem 0 0; font-size: 0.625rem; line-height: 1.4; color: var(--text-secondary);
  border-top: var(--border-width) dashed var(--border-color); padding-top: 0.2rem;
}
.card-gear {
  background: none; border: var(--border-width) solid var(--border-color);
  border-radius: var(--border-radius); cursor: pointer; padding: 0 0.2rem;
  color: var(--text-secondary); font-size: 0.8125rem; line-height: 1.4;
}
/* The resting state is quieted by its BORDER, not by opacity. An
   `opacity: 0.7` composites the glyph towards the card's own ground and
   takes the measured contrast down with it — 2.69:1 on the ⚙ in
   Catppuccin light, on the only affordance that opens a card's
   settings. The contrast sweep found it; the border carries the
   quietness now and the glyph keeps its weight. */
.card:hover .card-gear, .card.is-selected .card-gear, .card-gear:focus {
  border-color: var(--border-strong); color: var(--text-primary);
}
.card-gear:hover { color: var(--link); border-color: var(--link); }

/* No scrollbar inside a card, ever: if it does not fit, the card is
   wrong. Content is capped to the footprint instead. */
.card-body { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
.card-body > * { flex: 0 0 auto; }
.card-body > .state:only-child { flex: 1 1 auto; }

/* Drag and resize grips. Homarr's mechanics, none of its rounding. */
.grip-edge, .grip-corner { display: none; position: absolute; z-index: 30; }
body.is-editing .grip-edge, body.is-editing .grip-corner { display: block; }
/* Every resize zone is visible while editing, not only the corner: an
   edge you cannot see is an edge nobody drags. */
.grip-e {
  top: 0; right: 0; width: 8px; height: 100%; cursor: ew-resize;
  border-right: var(--border-width-thick) solid var(--border-strong);
}
.grip-s {
  left: 0; bottom: 0; height: 8px; width: 100%; cursor: ns-resize;
  border-bottom: var(--border-width-thick) solid var(--border-strong);
}
.grip-e:hover, .grip-s:hover { border-color: var(--accent); }
.grip-corner {
  right: 0; bottom: 0; width: 14px; height: 14px; cursor: nwse-resize;
  background: linear-gradient(135deg, transparent 50%, var(--accent) 50%);
}
body.is-editing .card { cursor: grab; }
body.is-dragging-active, body.is-dragging-active * { cursor: grabbing !important; user-select: none; }

/* Degraded panels: four conditions, each named, none of them an error. */
.state {
  border: var(--border-width) dashed var(--border-strong);
  border-radius: var(--border-radius);
  background: var(--bg-inset);
  padding: var(--spacing); display: flex; flex-direction: column; gap: var(--spacing-sm);
  min-height: 0;
}
.state-badge {
  align-self: flex-start;
  font-size: 0.6875rem; text-transform: uppercase; letter-spacing: 0.06em;
  border: var(--border-width) solid var(--border-strong);
  border-radius: var(--border-radius);
  padding: 0.1rem 0.4rem; color: var(--text-primary);
}
/* The same roles as the badges below, carried the same way: the hue in
   the border and in the square mark, the WORDS at the page's own text
   colour. These are the words naming a degraded condition — the thing
   AC8 exists for — and as coloured text they measured 1.72:1 in
   Catppuccin light. The unresolved one keeps its shape separation, at
   the heavier border weight rather than as a fill. */
.state-unavailable .state-badge { --badge-hue: var(--status-warn); border-color: var(--status-warn); }
.state-disabled .state-badge { --badge-hue: var(--status-info); border-color: var(--status-info); }
.state-silent .state-badge { --badge-hue: var(--status-ok); border-color: var(--status-ok); }
.state-unresolved .state-badge {
  --badge-hue: var(--status-ref);
  border-color: var(--status-ref); border-width: var(--border-width-thick);
}
.state-gap .state-badge { border-style: dashed; border-color: var(--border-strong); color: var(--text-secondary); }
.state-gap .state-badge::before { background: none; }
.state-text { font-size: 0.8125rem; color: var(--text-primary); margin: 0; }
.state-detail { font-size: 0.75rem; color: var(--text-secondary); margin: 0; }
/* A LINK IS A COLOUR THAT HAS TO BE READ, so it takes --link rather
   than --accent. The accent is derived for a filled control, where the
   text on it is --on-accent; as 12 px text on a card it measured 3.06:1
   in Industrial dark, on the Sources link AC8 requires on every degraded
   widget. --link is each palette's own accent pair, picked per mode so
   the one that is legible on the card ground is the one that carries
   text. No recorded value is re-tuned. */
.link-button {
  background: none; border: none; padding: 0; cursor: pointer;
  color: var(--link); font-size: 0.75rem; text-decoration: underline;
  text-align: left;
}
.link-button:hover { color: var(--link-hover); }

/* Data presentation */
/* Fixed layout so a table can never be wider than its card: the long
   cells truncate instead. No card ever grows a scrollbar. */
table.data { width: 100%; border-collapse: collapse; font-size: 0.75rem; table-layout: fixed; }
table.data th.num, table.data td.num { width: 5.25rem; }
/* A table whose fixed numeric columns no longer fit its card gives them
   up rather than running past the card's edge; the fixed layout then
   shares the width out evenly. Applied by measurement, not by
   breakpoint, because what is scarce is the card's width and not the
   window's. */
table.data.is-squeezed th.num, table.data.is-squeezed td.num { width: auto; }
table.data th, table.data td {
  text-align: left; padding: 0.25rem 0.4rem;
  border-bottom: var(--border-width) solid var(--border-color);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 18rem;
}
table.data th { color: var(--text-secondary); font-weight: var(--font-weight); text-transform: uppercase; font-size: 0.6875rem; letter-spacing: 0.04em; }
table.data td.num, table.data th.num { text-align: right; font-variant-numeric: tabular-nums; }
table.data tr.is-total td { border-top: var(--border-width-thick) solid var(--border-strong); border-bottom: none; font-weight: var(--font-weight-bold); }
/* A row that expands to what is behind it, and the rows it opens. The
   children are indented and set on the inset ground so that the reader
   can see where one parent's answer stops and the next begins. */
.row-expand {
  display: inline-block; width: 1.1rem; margin-right: 0.3rem;
  background: var(--bg-inset); color: var(--text-primary);
  border: var(--border-width) solid var(--border-color);
  border-radius: var(--border-radius);
  font-family: var(--font-mono); font-size: 0.6875rem; line-height: 1.1;
  cursor: pointer; padding: 0;
}
.row-expand:hover, .row-expand:focus-visible { border-color: var(--accent); }
table.data tr.is-child td { background: var(--bg-inset); color: var(--text-primary); }
table.data tr.is-child td:first-child { padding-left: 1.6rem; }
/* A flagged row is named by the badge beside it; it does not also
   take the amber, which on this page means "the source is
   unavailable" and nothing else. */
table.data tr.is-flagged td:first-child { color: var(--text-secondary); }
/* THE HUMAN SENTENCE WINS THE SPACE OVER THE MACHINE IDENTIFIER.
   A diagnostic cell — the sentence that answers "why is this empty?" —
   wraps instead of truncating, and takes whatever width the fixed layout
   leaves. The provider key, the pf rule identifier and the rest of the
   machine strings are the cells that give the width up: they truncate
   with an ellipsis and carry the whole string in a title. */
table.data td.diag, table.data th.diag {
  white-space: normal; overflow: visible; text-overflow: clip;
  max-width: none; word-break: break-word;
}
table.data td.diag .badge { white-space: normal; text-align: left; }
/* THE AVAILABILITY WORD IS NEVER CUT. On a narrow card the fixed columns
   scale down to give the diagnostic sentence its floor, and at the
   bottom of that scale "NOT COLLECTING" lost its last letters. It wraps
   inside its chip instead: a truncated word in the status column of the
   card that answers "why is this empty?" is the wrong thing to give up. */
table.data td.avail, table.data td.avail .badge { white-space: normal; }
.ident {
  display: block; font-family: var(--font-mono); font-size: 0.625rem;
  color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
/* A column that gives up its own cell and comes back as a second line
   inside a neighbouring one, below the width at which it could hold a
   readable label. Only one of the two is ever on screen. */
.second-line {
  display: none; font-size: 0.625rem; color: var(--text-secondary);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.mono { font-family: var(--font-mono); }
.muted { color: var(--text-secondary); }
.badge {
  display: inline-block; font-size: 0.625rem; text-transform: uppercase; letter-spacing: 0.04em;
  border: var(--border-width) solid var(--border-strong); border-radius: var(--border-radius);
  padding: 0 0.25rem; color: var(--text-secondary);
}
/* ONE COLOUR, ONE MEANING.
   Amber used to carry eleven different meanings on this page while also
   being --series-2, so an amber band on the rolling strip meant
   "Servers" and an amber badge forty pixels above it meant anything at
   all. The roles are fixed here and nowhere else:

     .badge            a fact about this row that is none of the five
                       conditions below — neutral, no status colour;
     .badge-unavailable  the source is unavailable (amber);
     .badge-off        the source is present and switched off (blue);
     .badge-ok         the source answered (green);
     .badge-ref        a reference did not resolve, and there is a
                       repair for it — FILLED, and in a hue of its own.
                       It was the accent, which in every palette is the
                       same blue as --status-info: two blues a hand's
                       width apart read as one condition, and filling
                       one of them separated the shapes and not the
                       hues. --status-ref is derived away from the
                       accent and away from all three status hues;
     .badge-kept       a parameter key the import kept and this build
                       does not understand — the reference hue,
                       outlined, because nothing is missing and there is
                       nothing to repair;
     .badge-gap        the model cannot answer — muted and dashed, the
                       treatment this page already uses to mean "no
                       colour key here";
     .badge-blocked    the firewall stopped this traffic. Red, which
                       docs/ui-references.md sanctions for "blocked" and
                       which Pi-hole, NextDNS and Firewalla all use —
                       but NOT the error class, because a rule doing its
                       job is not a failure and an identifier saying so
                       is wrong under CLAUDE.md's vocabulary rule;
     .badge-error      an error, which none of the above is. Nothing on
                       this page is one. */
/* A STATUS HUE IS A BORDER AND A MARK. IT IS NEVER THE TEXT.
   Every one of these variants used to set `color` to its status token,
   at 10 px. The contrast sweep measured that across the twelve
   palette/mode combinations and it fails everywhere it matters: 1.60:1
   on "healthy", 1.99:1 on "not yet probed", 3.82:1 on "105 blocked".
   Family C records each of these as a COLOUR; it does not record "print
   it as 10 px text on a white card", so every recorded value is kept
   untouched and the USE is what changed. The words take --text-primary on the card's own
   ground; the hue is carried by the border and by a square mark before
   the word, which is where a saturated colour is legible. */
.badge[class*="badge-"]::before,
.state-badge::before, .card-state::before, .card-kept::before, .card-period::before {
  content: ""; display: inline-block;
  width: 0.45em; height: 0.45em; margin-right: 0.3em; vertical-align: 0.02em;
  background: var(--badge-hue, var(--border-strong));
  border: var(--border-width) solid var(--badge-hue, var(--border-strong));
}
.badge-unavailable { --badge-hue: var(--status-warn); border-color: var(--status-warn); }
.badge-off { --badge-hue: var(--status-info); border-color: var(--status-info); }
.badge-error { --badge-hue: var(--status-error); border-color: var(--status-error); }
.badge-blocked { --badge-hue: var(--status-blocked); border-color: var(--status-blocked); }
.badge-ok { --badge-hue: var(--status-ok); border-color: var(--status-ok); }
/* A reference that did not resolve, and has a repair: the reference hue
   at the heavier border weight, with a filled mark. It was a solid fill
   with --on-accent text, which measured 3.29:1 in Catppuccin light —
   filling a chip separates its SHAPE, and does nothing for the legibility
   of the words inside it. The shape separation is kept in the border
   weight instead. */
.badge-ref {
  --badge-hue: var(--status-ref);
  border-color: var(--status-ref); border-width: var(--border-width-thick);
}
.badge-gap { border-style: dashed; border-color: var(--border-strong); color: var(--text-secondary); }
.doc-dock-body .badge-gap { color: var(--text-primary); }
.badge-gap::before { background: none; }
/* Kept and not understood: the reference hue, at the thin border weight
   and with a HOLLOW mark, because nothing is missing and there is
   nothing to repair. */
.badge-kept { --badge-hue: var(--status-ref); border-color: var(--status-ref); }
.badge-kept::before { background: none; }

.figures { display: flex; gap: var(--spacing); flex-wrap: wrap; }
.figure { display: flex; flex-direction: column; }
.figure-value { font-size: 1.375rem; font-weight: var(--font-weight-bold); font-variant-numeric: tabular-nums; color: var(--text-strong); }
.figure-label { font-size: 0.6875rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; }
/* The row a card leads with, set wider apart than a run of secondary
   figures. The rate pair OPNsense's own dashboard leads with used to be
   here; it moved out because the composition card beside it prints the
   same three rates in its ring holes, and one band printed them twice. */
.figures-lead { gap: calc(var(--spacing) * 1.5); align-items: flex-start; }

/* A VLAN tag is an identifier the firewall hands back, so it is set as
   one rather than folded into the label. */
.vlan-tag {
  font-family: var(--font-mono); font-size: 0.625rem; padding: 0 0.25rem;
  border: var(--border-width) solid var(--border-color); border-radius: var(--border-radius);
  color: var(--text-secondary); white-space: nowrap;
}

.bar-row { display: grid; grid-template-columns: minmax(4rem, 9rem) minmax(0, 1fr) 6.5rem; gap: 0.5rem; align-items: center; margin-bottom: 0.3rem; font-size: 0.75rem; }
.bar-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-sub { font-size: 0.625rem; color: var(--text-secondary); margin: -0.2rem 0 0.3rem 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-cidr { font-size: 0.625rem; color: var(--text-secondary); display: block; font-family: var(--font-mono); overflow: hidden; text-overflow: ellipsis; }
.bar-track { background: var(--bg-inset); border: var(--border-width) solid var(--border-color); border-radius: var(--border-radius); height: 1.1rem; display: flex; overflow: hidden; }
.bar-fill { height: 100%; }
.bar-fill-ew { background: var(--series-1); }
.bar-fill-ns { background: var(--series-2); }
.bar-fill-plain { background: var(--series-1); }
.bar-value { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

.legend { display: flex; gap: 0.75rem; flex-wrap: wrap; font-size: 0.6875rem; color: var(--text-secondary); }
.legend-item { display: inline-flex; align-items: center; gap: 0.3rem; }
.swatch { width: 0.7rem; height: 0.7rem; border-radius: var(--border-radius); display: inline-block; border: var(--border-width) solid var(--border-color); }
/* A series with no line has no colour key: the slot is kept so the names
   stay aligned, and it is drawn as the dashed outline the missing axis
   already uses, not as a colour. */
.swatch-none { background: none; border-style: dashed; border-color: var(--text-muted); }
/* A swatch inside a headline tile's caption: the band's colour, a dot,
   sitting on the baseline of an uppercase 11 px label. */
.swatch-tile { width: 0.625rem; height: 0.625rem; margin-right: 0.3rem; vertical-align: baseline; }
.sw-1 { background: var(--series-1); }
.sw-2 { background: var(--series-2); }
.sw-3 { background: var(--series-3); }
.sw-5 { background: var(--series-5); }
.sw-6 { background: var(--series-6); }
/* The key for a row that has no dedicated colour: the neutral grey.
   Nothing else on this page is drawn in it, --series-4 having been taken
   out of the series ramp, so grey is never a named series. The dashed
   outline stays, because it says the same thing twice. */
.sw-other { background: var(--text-muted); border-style: dashed; border-color: var(--text-strong); }

.chart-wrap { position: relative; min-width: 0; }
.chart-svg { width: 100%; height: auto; display: block; }
.chart-tooltip {
  position: absolute; pointer-events: none; z-index: 20;
  background: var(--bg-raised); color: var(--text-primary);
  border: var(--border-width) solid var(--border-strong);
  border-radius: var(--border-radius);
  padding: 0.4rem 0.5rem; font-size: 0.6875rem; min-width: 11rem;
  box-shadow: 0 2px 6px var(--shadow-color);
}
.tt-row { display: flex; justify-content: space-between; gap: 0.75rem; }
.tt-head { font-weight: var(--font-weight-bold); margin-bottom: 0.2rem; }

/* THE ONE PLACE A CHART'S TEXT SIZE IS SET. `--text-boost` is written
   on an individual chart by enforceChartTextFloor(), from the size that
   chart is actually rendered at; it is 1 everywhere else. */
svg text { fill: var(--text-secondary); font-family: var(--font-family); font-size: calc(9px * var(--text-boost, 1)); }
svg .axis-line { stroke: var(--border-color); stroke-width: 1; }
svg .grid-line { stroke: var(--border-color); stroke-width: 1; stroke-dasharray: 2 3; }
svg .series-line { fill: none; stroke-width: 1.5; }
svg .s1 { stroke: var(--series-1); }
svg .s2 { stroke: var(--series-2); }
svg .s3 { stroke: var(--series-3); }
svg .s5 { stroke: var(--series-5); }
svg .s6 { stroke: var(--series-6); }
/* THE TAIL IS DASHED, AND IT IS THE ONLY GREY LINE ON THE PAGE. The
   neutral grey carries the collapsed tail and any identity past the
   fifth. --series-4, which is the maintainer's own --fg-muted and is not
   ours to re-tune, has left the series ramp rather than being told apart
   from this grey by a dash alone. The dash stays because it says the
   same thing the colour does: this line has no dedicated colour. */
svg .sother { stroke: var(--text-muted); stroke-dasharray: 3 2; }
/* The same neutral as a FILL, which had no rule at all: a donut slice
   or a sample dot carrying the collapsed tail fell through to the SVG
   default, which is black, and rendered black on every dark palette —
   1.23:1 in Tokyo Night. Found by shapeSweep(); invisible to a sweep
   over strings, because a slice renders none. */
/* The neutral is fitted against the card, and a sample dot of the tail
   series lands on a stacked band instead — 1.65:1 in Catppuccin dark.
   The dot keeps the neutral and takes a hairline, exactly as the map
   marks do, so what makes it findable does not depend on which band it
   happens to fall on. */
svg .fother { fill: var(--text-muted); }
svg circle.sample-dot.fother { stroke: var(--text-primary); stroke-width: 0.4; }
svg .f1 { fill: var(--series-1); }
svg .f2 { fill: var(--series-2); }
svg .f3 { fill: var(--series-3); }
svg .f5 { fill: var(--series-5); }
svg .f6 { fill: var(--series-6); }
svg .area { fill-opacity: 0.35; stroke: none; }
svg .cursor-line { stroke: var(--text-muted); stroke-width: 1; }
/* A series the model cannot fill: its name and its condition, inside the
   plot area, where its line would have been. */
/* A series the model cannot fill is named BELOW the drawing, never
   inside the plot area where it would read as a label on a curve that
   is drawn. Neutral, like the dashed ticks of the axis it has no scale
   for, and at the page's own text size rather than the drawing's. */
.series-gaps { margin-top: 0.35rem; display: flex; flex-direction: column; gap: 0.2rem; }
.series-gap-row {
  display: flex; align-items: baseline; gap: 0.4rem; flex-wrap: wrap;
  font-size: 0.6875rem; color: var(--text-secondary);
  border-left: var(--border-width-thick) dashed var(--border-strong);
  padding: 0.1rem 0 0.1rem 0.45rem;
}
.series-gap-name { color: var(--text-secondary); }
.series-gap-why { min-width: 0; }
svg .sample-dot { stroke: none; }

/* A FLOOR ON EFFECTIVE TEXT SIZE INSIDE A CHART.
   An SVG drawn with a viewBox scales its text with the drawing, so a
   9 px label in a 640-unit viewBox renders at 4.8 CSS px once the card
   is 341 px wide. Five pixels of grey is not a label. Below the floor
   the chart drops its labels rather than shrinking them, and the block
   beneath states the same axis or the same names in HTML text, which is
   not scaled by anything. The decision is taken from the MEASURED size
   after layout, in enforceChartTextFloor(), never from the declared
   one. */
svg.labels-dropped text { display: none; }
.chart-fallback {
  font-size: 0.6875rem; color: var(--text-secondary);
  margin-top: 0.25rem; line-height: 1.45;
}
.chart-fallback ul { list-style: none; margin: 0.15rem 0 0; padding: 0; }
.chart-fallback li { display: flex; justify-content: space-between; gap: 0.75rem; }
.chart-fallback li span:last-child { font-variant-numeric: tabular-nums; color: var(--text-secondary); }
.chart-fallback .fb-head { color: var(--text-secondary); text-transform: uppercase; font-size: 0.625rem; letter-spacing: 0.05em; }

svg .donut-slice { stroke: var(--bg-surface); stroke-width: 1; }
/* The ring, and its hole's figure laid over it in HTML: nothing in the
   centre is scaled by the viewBox, so nothing there can fall below the
   page's nine-pixel floor. */
.donut { position: relative; display: block; width: 124px; max-width: 100%; }
.donut > svg { display: block; width: 100%; height: auto; }
.donut-centre {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 0.05rem;
  pointer-events: none; text-align: center; line-height: 1.1;
}
.donut-centre-value { font-size: 0.875rem; font-weight: var(--font-weight-bold); color: var(--text-strong); }
.donut-centre-label {
  font-size: 0.625rem; color: var(--text-secondary);
  text-transform: uppercase; letter-spacing: 0.06em;
}

/* Composition */
.comp { display: grid; grid-template-columns: 124px minmax(0, 1fr); gap: var(--spacing); align-items: center; }
.comp-legend { font-size: 0.75rem; }
.comp-row { display: grid; grid-template-columns: 0.7rem minmax(0, 1fr) 5.5rem 3.2rem; gap: 0.4rem; align-items: center; padding: 0.08rem 0; }
.comp-row .cl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.comp-row .cv, .comp-row .cp { text-align: right; font-variant-numeric: tabular-nums; }
.comp-row .cp { color: var(--text-secondary); }
/* A category whose engine cannot answer is a state, not a zero: it keeps
   its place in the legend and carries a badge where its number would be. */
.comp-row.is-state { grid-template-columns: 0.7rem minmax(0, 1fr) auto; }
.comp-row.is-state .cl { color: var(--text-secondary); }
/* A category that exists and is counted, but that cannot be attributed
   to one ring. It keeps its number — the number is known — and the badge
   says why it is not in any of them. */
.comp-row.is-unplaced { grid-template-columns: 0.7rem minmax(0, 1fr) 5.5rem auto; }
.comp-row.is-unplaced .cl { color: var(--text-secondary); }
/* The reconciliation row: what the rings add up to. It is here so the
   three rings can be checked against one number without arithmetic. */
.comp-row.is-total { border-top: var(--border-width-thick) solid var(--border-strong); margin-top: 0.2rem; padding-top: 0.25rem; font-weight: var(--font-weight-bold); }

/* ONE CARD, SEVERAL RINGS.
   Family B draws its rings at one size in all three products surveyed —
   ntopng, Pi-hole and Zenarmor — and Zenarmor sets three of them in a
   row, so these are one size and in a row too. EVERY RING CLOSES: a
   composition ring is the composition of its own subject, and its
   categories sum to its own hundred per cent. What equal size would
   otherwise cost is given back by the figure in each hole and by the
   proportional bar under the row, not by an incomplete sweep. One legend
   serves the card, because unlike those three products the rings here
   split the same categories rather than three different dimensions. */
.comp-rings { display: flex; gap: var(--spacing); align-items: flex-start; }
.comp-ring { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 0.15rem; }
.comp-ring svg { width: 100%; height: auto; max-width: 104px; display: block; }
.comp-ring .donut { width: 104px; }
.comp-ring-label { font-size: 0.6875rem; color: var(--text-secondary); text-align: center; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* The relative weight of the three rings, as one proportional bar in the
   order of the rings above. Closed rings are the right shape for a
   composition and the wrong shape for a comparison, so the comparison
   the rings no longer carry is carried here, where a width is a width. */
.comp-weight { display: flex; gap: 2px; margin-top: 0.45rem; height: 0.75rem; }
.comp-weight-seg { background: var(--text-muted); border-radius: var(--border-radius); min-width: 2px; }
/* Three tones, keyed to the direction and not to the position, so a
   direction that cannot be drawn does not shift the tone of the two that
   can. They are three DIFFERENT TOKENS rather than one token at three
   opacities: an opacity is not a colour, and the three segments computed
   to one identical background while the note claimed three tones. No
   series colour: a series colour here would claim to mean what it means
   in the rings, and it does not.

   ALL THREE ARE TEXT TONES, and the third one used to be
   `--border-strong`. shapeSweep() measured it at 2.07:1 against the
   card: a token fitted as the edge of a box, spent as the body of a
   data segment. It is the same defect the text sweep was built for, one
   population over — the segment renders no string, so nothing had ever
   measured it. The text tones are the tones this page already fits
   against its own grounds. */
.comp-weight-inbound { background: var(--text-secondary); }
.comp-weight-outbound { background: var(--text-muted); }
.comp-weight-between { background: var(--text-primary); }
/* The one legend, set in two columns so that three rings and their
   categories fit a card without the card growing a scrollbar — which it
   may not — and without the rings shrinking to Zenarmor's thumbnail
   size. Column flow is down and then across, so a ranked legend is still
   read in rank order. `column-width` collapses it to one column on a
   narrow card by itself. */
.comp-legend-split { margin-top: 0.35rem; font-size: 0.6875rem; columns: 15rem 2; column-gap: var(--spacing); }
.comp-legend-split .comp-row { break-inside: avoid; padding: 0.02rem 0; }
/* What the proportional bar is measuring, written down, in the same
   muted one-line form the rolling strip below already uses for its own
   resolution. */
.comp-scale { margin-top: 0.2rem; }
.comp-row.is-total { font-size: 0.75rem; }

/* World maps */
/* THE SIDE COLUMN WIDENS WITH THE CARD, and that is a height fix.
   Pinned at 13 rem it wrapped its counters and its figure list over
   more and more lines as the card grew, so on a 2560 px window the
   column, not the drawing, was what pushed the AC9 coverage statement
   out of the card. It keeps its 13 rem floor and takes a share of a
   wide card, where there is width to spare and no height to spare. */
.map-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(13rem, 38%); gap: var(--spacing); }
/* THE DRAWING TAKES THE CARD'S HEIGHT. A map drawn at the viewBox's own
   2:1 ratio is as tall as its column is wide and no taller, so on a card
   authored eight rows deep it stopped 62 px short of the bottom and left
   the card with a strip of nothing under it. The frame is now the whole
   of the body that is left, and the drawing fills the frame: what does
   not fit the 2:1 world at zoom 1 is ocean above and below it, which is
   what a map viewport is, and the wheel fills it. */
.card-body > .map-layout { flex: 1 1 auto; min-height: 0; }
.map-svg { width: 100%; height: 100%; display: block; background: var(--bg-inset); border: var(--border-width) solid var(--border-color); border-radius: var(--border-radius); touch-action: none; cursor: grab; }
/* The hand is closed for the whole of a pan, including over a mark,
   whose own pointer cursor would otherwise say the drag was a press. */
.map-svg.is-panning, .map-svg.is-panning * { cursor: grabbing; }
/* The drawing takes the focus so the arrow keys and +/- can reach the
   zoom. Chrome draws its own ring on a focused <svg> even when the
   focus came from a click, so the page's own focus-visible ring is
   declared here and the click-focus ring is dropped. */
.map-svg:focus { outline: none; }
.map-svg:focus-visible { outline: var(--border-width-thick) solid var(--accent); outline-offset: 1px; }
/* One path per country, filled as land and stroked as its border. The
   stroke is the border and the coastline at once, which is why the
   basemap is country polygons rather than a coastline: a mark near
   Ireland has to read as Ireland.

   `non-scaling-stroke` because the whole basemap sits inside one group
   that the zoom scales. Without it a border at zoom 8 is eight times
   the weight of the same border at zoom 1, and the basemap stops being
   a ground and starts being a drawing. It also holds the border at a
   readable weight when the card is narrow and the whole viewBox is
   rendered at half size. */
.map-country {
  fill: var(--border-color); stroke: var(--border-strong); stroke-width: 0.5;
  vector-effect: non-scaling-stroke;
}
.map-graticule { stroke: var(--border-strong); stroke-width: 0.3; fill: none; stroke-opacity: 0.5; vector-effect: non-scaling-stroke; }
/* THE GESTURE IS THE INTERFACE AND THESE ARE THE FALLBACK. The wheel
   zooms about the pointer and the drag pans; this is the stacked pair
   every map has carried in a corner for fifteen years, plus the reset,
   overlaid on the drawing rather than spelled out in words under it.
   They are in the tab order and carry accessible names, which with the
   arrow keys, +, - and 0 on the focused drawing is the whole zoom
   without a mouse. */
.map-controls {
  position: absolute; top: 0.4rem; right: 0.4rem; z-index: 1;
  display: flex; flex-direction: column;
  background: var(--bg-surface);
  border: var(--border-width) solid var(--border-color);
  border-radius: var(--border-radius);
  overflow: hidden;
}
.map-controls button {
  width: 1.4rem; height: 1.4rem; padding: 0;
  display: flex; align-items: center; justify-content: center;
  font: inherit; font-size: 0.875rem; line-height: 1; cursor: pointer;
  background: transparent; color: var(--text-primary); border: none;
}
.map-controls button + button { border-top: var(--border-width) solid var(--border-color); }
.map-controls button:hover { background: var(--bg-inset); }
.map-controls button:focus-visible { outline: var(--border-width-thick) solid var(--accent); outline-offset: -2px; }
.map-frame { min-width: 0; position: relative; height: 100%; }
/* THE MARKS ARE THE WIDGET, SO THEY ARE THE LOUDEST THING ON THE MAP.
   They were drawn at `fill-opacity: 0.55` with the stroke set to the
   same colour as the fill, which composited to 1.46:1 against the
   landmass in dark mode — below the 3:1 WCAG 2.1 asks of a non-text
   mark that carries meaning, and AC6 makes point marks the entire
   representation. ntopng's geomap, which docs/ui-references.md names as
   the reference for this widget, puts fully opaque saturated marks on a
   de-saturated basemap: de-saturating the basemap is pointless if the
   marks are then given the basemap's own value.

   So the fill is opaque and the outline is `--text-primary`, the one
   token every palette already guarantees against a surface. The outline
   is what carries the 3:1 — a series hue cannot, because the eleven
   palettes place their series colours anywhere between the ground and
   the text — and the fill carries the category. shapeSweep() measures
   both, against the land and against the ocean, in all twenty-two
   palette/mode combinations. */
.map-mark { stroke: var(--text-primary); stroke-width: 0.7; cursor: pointer; }
.map-mark-allowed { fill: var(--series-1); }
.map-mark-blocked { fill: var(--series-5); }
/* A picked mark is the same mark with a heavier outline, so picking one
   does not change what its colour or its size is saying. */
.map-mark.is-open { stroke-width: 2.2; }
.map-side { display: flex; flex-direction: column; gap: var(--spacing-sm); }
/* Not a panel. The empty bordered box this replaced read, in both
   states, as somewhere the detail was about to appear. */
.counter {
  border: var(--border-width) solid var(--border-color);
  border-left: var(--border-width-thick) solid var(--status-warn);
  border-radius: var(--border-radius);
  background: var(--bg-inset); padding: 0.4rem 0.5rem; font-size: 0.6875rem;
  color: var(--text-secondary);
}
.counter-value { font-size: 1rem; font-weight: var(--font-weight-bold); color: var(--text-primary); display: block; font-variant-numeric: tabular-nums; }
/* ONE TILE, ONE MEASURE. The headline figure was a connection count
   with no unit sitting above a caption that named a volume, so the two
   read as one quantity. The headline carries its own unit word, and a
   second measure of the same thing gets a line of its own underneath. */
.counter-second { display: block; color: var(--text-secondary); }
.counter-dns { border-left-color: var(--status-info); }
.popup {
  border: var(--border-width) solid var(--border-strong);
  border-radius: var(--border-radius);
  background: var(--bg-raised); padding: 0.5rem; font-size: 0.6875rem;
}
.popup-title { font-weight: var(--font-weight-bold); font-size: 0.75rem; margin-bottom: 0.2rem; }
.popup dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 0.1rem 0.5rem; }
.popup dt { color: var(--text-primary); }
.popup dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
/* A detail opened by a click opens over the canvas, never inside a card
   body. A card body may not scroll and the card keeps its authored
   footprint, so a detail placed inside one is painted into a clipped
   region and, below the stacking breakpoint, lands far down the page.
   The overlay is outside every card, so neither applies to it.

   IT IS A POPOVER, AND IT NO LONGER PRETENDS TO BE A MODAL. It was
   centred on a dimmed page under `aria-modal="true"`, and the dimming
   measured 1.21:1 dark and 1.41:1 light with the panel itself painted
   in the card colour — a dialog nothing on screen announced as one.
   The reference it copies, ntopng's geomap popup
   (docs/ui-references/screenshots/familyb-ntopng-geomap.png), is not
   modal at all, and docs/ui-references.md's recorded preference for the
   world map is a popup carrying everything interesting with the map
   left as background. So the layer no longer paints and no longer takes
   the pointer: the canvas stays live, the panel is placed against the
   mark it belongs to, and a reader comparing two destinations picks the
   second one directly instead of closing the first. */
.detail-layer {
  position: fixed; inset: 0; z-index: 600;
  pointer-events: none;
}
/* Placed by placeDetail(), which writes the two custom properties and
   nothing else — so the phone rule below can put the panel on the
   bottom edge without a breakpoint being restated in JavaScript. */
.detail-pop {
  position: absolute; left: var(--detail-x, 0px); top: var(--detail-y, 0px);
  pointer-events: auto;
  background: var(--bg-raised);
  /* THE PANEL IS OUTLINED IN THE ACCENT, WHICH IS WHAT THE PAGE ALREADY
     PAINTS THE PICKED THING IN — an open person's block takes the same
     border. It sits over cards drawn in its own background colour, so
     `--border-strong`, a token fitted as the edge of a box on its own
     ground, was the only thing telling a raised panel from the card
     under it. No palette value was invented for this: the accent is the
     one colour the palette already reserves for what is picked. */
  border: var(--border-width) solid var(--accent);
  border-radius: var(--border-radius);
  box-shadow: 0 4px 14px var(--shadow-color);
  width: min(27rem, 100%); max-height: 70vh;
  display: flex; flex-direction: column; gap: var(--spacing-sm);
  padding: var(--spacing-sm) var(--spacing) var(--spacing);
}
.detail-head { display: flex; align-items: baseline; gap: var(--spacing-sm); }
.detail-title {
  margin: 0; flex: 1; min-width: 0; font-size: 0.9375rem;
  font-weight: var(--font-weight-bold);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
/* The overlay may scroll. The no-scrollbar rule governs cards, whose
   footprint is authored on a grid; this panel is sized by the viewport
   and has no footprint to respect. */
.detail-body {
  overflow-y: auto; min-height: 0;
  display: flex; flex-direction: column; gap: var(--spacing-sm);
}

/* Matrix */
/* A MATRIX IS THE ONE SHAPE THAT MAY BE WIDER THAN ITS CARD, and it
   gets a scroller of its own rather than spilling. Eight columns of
   nowrap figures cannot be folded, and at 390 px the grid ran 151 px
   past the card's edge with nothing saying so and no way to reach what
   was past it. The rule the page follows everywhere else — a table, a
   diagram or a code block may exceed the body, each inside its own
   overflow-x container, and the page itself never scrolls sideways. */
.matrix-scroll { overflow-x: auto; max-width: 100%; }
.matrix { border-collapse: collapse; font-size: 0.6875rem; width: 100%; }
.matrix th, .matrix td { border: var(--border-width) solid var(--border-color); padding: 0.2rem 0.3rem; text-align: right; white-space: nowrap; }
.matrix th.rowhead, .matrix th.colhead { text-align: left; color: var(--text-secondary); font-weight: var(--font-weight); }
.matrix td.cell { cursor: pointer; font-variant-numeric: tabular-nums; }
.matrix td.cell:hover { background: var(--accent-soft); }
/* A cell the firewall stopped traffic in. Red is the sanctioned
   colour for "blocked"; the class is not called an error, because
   a rule doing its job is not one. */
/* A cell that carries blocked traffic is MARKED, not recoloured: the
   figure is the thing being read and it keeps the text colour. */
.matrix td.has-blocked { box-shadow: inset 0.125rem 0 0 0 var(--status-blocked); }
.matrix .margin { background: var(--bg-inset); font-weight: var(--font-weight-bold); }
.matrix td.empty-cell { color: var(--text-secondary); }
.head-cidr { display: block; font-family: var(--font-mono); font-size: 0.5625rem; color: var(--text-secondary); font-weight: var(--font-weight); }

/* Per-client card */
.client-head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--spacing-sm); margin-bottom: 0.4rem; }
.client-toggle { display: flex; gap: 0.25rem; }

/* Per-owner card: one block per person, that person's machines inside it,
   and the clients nobody has claimed as a block of their own. */
.owners { display: flex; flex-direction: column; gap: var(--spacing-sm); min-width: 0; }
.owner.is-open { border-color: var(--accent); background: var(--accent-soft); }
.owner[data-owner] { cursor: pointer; }
.owner[data-owner]:hover { border-color: var(--accent); }
.owner[data-owner]:focus-visible { outline: var(--border-width-thick) solid var(--accent); outline-offset: 1px; }
/* The other three detail targets, focused. An SVG shape takes no
   outline reliably, so the focus is drawn on the shape's own stroke. */
.matrix td.cell:focus-visible { outline: var(--border-width-thick) solid var(--accent); outline-offset: -2px; }
.map-mark:focus-visible, .tree-node:focus-visible {
  outline: none; stroke: var(--accent); stroke-width: 2.5;
}
/* THE FIFTH FAMILY OF PICKABLE SHAPE. A ring slice picks the way a map
   mark, a tree node, a matrix cell and a person block already pick: the
   pointer says so, the keyboard reaches it, and the shape it opened
   stays marked while its drill-down is up. */
.donut-slice[data-slice] { cursor: pointer; }
.donut-slice[data-slice]:hover { stroke: var(--text-strong); stroke-width: 1.5; }
.donut-slice[data-slice]:focus-visible {
  outline: none; stroke: var(--accent); stroke-width: 2.5;
}
.donut-slice.is-open { stroke: var(--text-strong); stroke-width: 2; }
/* The branch label picks the branch it names. */
.tree-label[data-node] { cursor: pointer; }
.tree-label[data-node]:hover { fill: var(--link); text-decoration: underline; }
.tree-label[data-node]:focus-visible {
  outline: var(--border-width) solid var(--accent); outline-offset: 1px;
}
.chip-id { color: var(--text-secondary); font-size: 0.625rem; }
.owner {
  border: var(--border-width) solid var(--border-color);
  border-left: var(--border-width-thick) solid var(--accent);
  border-radius: var(--border-radius);
  background: var(--bg-inset);
  padding: 0.3rem 0.5rem;
  display: flex; flex-direction: column; gap: 0.2rem;
  overflow: hidden;
}
.owner-unassigned { border-left-color: var(--border-strong); }
.owner-head { display: flex; align-items: baseline; gap: 0.5rem; }
.owner-name { font-size: 0.875rem; font-weight: var(--font-weight-bold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.owner-rate { margin-left: auto; font-size: 1.0625rem; font-weight: var(--font-weight-bold); font-variant-numeric: tabular-nums; white-space: nowrap; }
/* A CHIP TAKES THE WIDTH IT NEEDS AND THE ROW WRAPS.
   The chips were capped at 14rem and clipped with no ellipsis, so a
   client chip holding 349 px of content in 224 px was cut mid-octet:
   `marion-macbook 192.168.10.24 · f0:18:9`. A truncated MAC still looks
   like a MAC, which is worse than not printing one, and the rate — the
   thing the chip exists to carry — was cut off entirely. The row wraps
   onto a second line instead; there was room below it and to the right
   of it, and a chip on the next line still names its client. */
.owner-line { display: flex; align-items: flex-start; gap: 0.4rem; overflow: hidden; }
.line-label { font-size: 0.625rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-secondary); width: 5rem; flex: 0 0 5rem; line-height: 1.6; }
.chips { display: flex; gap: 0.3rem 0.3rem; flex-wrap: wrap; overflow: hidden; min-width: 0; }
.chip {
  display: inline-flex; align-items: baseline; gap: 0.3rem;
  border: var(--border-width) solid var(--border-color);
  border-radius: var(--border-radius);
  background: var(--bg-surface); padding: 0 0.3rem;
  font-size: 0.6875rem; white-space: nowrap; max-width: 100%;
  overflow: hidden; text-overflow: ellipsis;
}
.chip-site { border-left: var(--border-width-thick) solid var(--series-1); }
.chip-more { border-style: dashed; color: var(--text-secondary); }
.chip-value { color: var(--text-secondary); font-variant-numeric: tabular-nums; }

/* Feed */
/* THE NUMBER COLUMN IS NAMED. Twelve rows each ending in a bare figure
   — 2, 3, 426, 1,118 — with no header and no unit read as a connection
   count, a packet count, a port or a rule id, and the reader has no way
   to choose. docs/widget-catalogue.md, "Unified blocked feed", calls
   them "the connection counts" in its Required UI copy clause, so the
   intent was already fixed; the column just never said it. OPNsense's
   own live-log view names its columns, and this is the densest widget
   on the page. The header uses the list's own grid so the names sit
   over the values at every width, including the three-column narrow
   layout below. */
.feed-head {
  display: grid; grid-template-columns: 3.6rem 6.5rem minmax(0, 1fr) 4.75rem; gap: 0.5rem;
  padding: 0 0 0.2rem; font-size: 0.625rem; text-transform: uppercase;
  letter-spacing: 0.05em; color: var(--text-secondary);
  border-bottom: var(--border-width) solid var(--border-strong);
}
.feed-head .num { text-align: right; }
.feed { list-style: none; margin: 0; padding: 0; font-size: 0.75rem; }
.feed li.is-new { background: var(--accent-soft); }
/* The last column is a WIDTH AND NOT `auto`, because the header and the
   rows are two separate grids: sized to content, "CONNECTIONS" made the
   header's column 75 px and the figures made the rows' column 7 px, so
   the name stood nowhere near the numbers it names. */
.feed li { display: grid; grid-template-columns: 3.6rem 6.5rem minmax(0, 1fr) 4.75rem; gap: 0.5rem; padding: 0.25rem 0; border-bottom: var(--border-width) solid var(--border-color); }
.feed .time { color: var(--text-primary); font-variant-numeric: tabular-nums; }
.feed .engine { font-size: 0.625rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-primary); }
.feed .what { overflow: hidden; text-overflow: ellipsis; }
.feed .by { color: var(--text-primary); font-family: var(--font-mono); font-size: 0.6875rem; }
.feed .num { text-align: right; font-variant-numeric: tabular-nums; }

/* THE CARD ON THE CANVAS IS THE PREVIEW, AND THERE IS NO SECOND COPY.
   There was one in this panel. Measured in Chrome at 1920 px: the dock
   is 544 px wide and 823 px tall, the preview took 234 of those 823 —
   28 % of the panel — and its body showed 184 px of 520 px of content
   under `overflow: hidden`, so it displayed about a third of a card
   that was fully drawn on the canvas at the same moment, with nothing
   saying the other two thirds existed. It was also the second of three
   nested scrollers in a 544 px column.
   docs/ui-references.md names Home Assistant's card editor as the
   calibration point for this surface, and what that editor previews is
   the card being edited. Here the card being edited is already on
   screen, full size, beside the panel: it draws the form's pending
   values and marks itself unapplied until Apply. */
.card.is-pending { outline: var(--border-width-thick) solid var(--status-ref); outline-offset: -1px; }
.card-pending {
  font-size: 0.625rem; text-transform: uppercase; letter-spacing: 0.05em;
  color: var(--text-primary);
  border-left: var(--border-width-thick) solid var(--status-ref);
  padding-left: 0.3rem;
}
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: var(--spacing-sm); }
.panel-title { font-size: 0.875rem; }
.panel-tabs { display: flex; gap: 0.35rem; align-items: center; flex-wrap: wrap; }
/* The syntax choice is a sub-mode of the two code tabs, not a fourth
   tab, so it is set off by a rule and carries its own name. */
.panel-subtabs {
  display: flex; gap: 0.35rem; align-items: center;
  padding-left: 0.5rem; margin-left: 0.15rem;
  border-left: var(--border-width) solid var(--border-color);
}
.panel-subtabs-label {
  font-size: 0.625rem; text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--text-primary);
}
/* LONG SCALARS SOFT-WRAP RATHER THAN RUNNING OFF THE RIGHT.
   The two layers wrap identically or they drift by a row, so they are
   given the same font, the same line height, the same padding and the
   same content box, and the line boxes carry no horizontal padding of
   their own. */
.code {
  font-family: var(--font-mono); font-size: 0.6875rem; line-height: 1.5;
  background: var(--bg-inset); border: var(--border-width) solid var(--border-color);
  border-radius: var(--border-radius); padding: 0.5rem; margin: 0;
  white-space: pre-wrap; overflow-wrap: anywhere; word-break: normal; overflow-x: hidden;
}
.code-line { display: block; padding: 0; position: relative; }
.code-line.is-unresolved { background: var(--highlight-bg); }
/* THE WIDGET THE READER CAME HERE FOR. A rule in the accent down the
   left of its run, inside the line box so the two layers stay in exact
   register — no padding, no margin, no inserted row. The lines keep
   their syntax colours: this mark says "here", not "wrong". */
.code-line.is-subject { box-shadow: inset 0.125rem 0 0 0 var(--accent); }
/* The line Apply refused. It stays marked while the reader edits, so
   "line 14" is a place on screen and not a number in a message. */
.code-line.is-error { background: var(--accent-soft); box-shadow: inset 0.125rem 0 0 0 var(--status-error); }
/* A MARKED LINE IS SET IN THE PAGE'S OWN INK.
   The --code-* tokens are derived against the pane's ground, --bg-inset,
   and clear 4.5:1 against it in all twelve combinations. A marked line
   is NOT that ground: the amber wash and the accent wash composite over
   it, and the sweep measures the same tokens at 1.92:1 to 4.06:1 on the
   washed ground — the third occurrence of a token derived for one ground
   being spent on another. The wash stays, because it is what makes the
   marked line visible in place; the syntax colours come off it. A line
   this page has flagged is a line whose colours have stopped carrying
   information anyway: the pinned notice says what is wrong with it. */
.code-line.is-unresolved > span,
.code-line.is-error > span { color: var(--text-primary); }
.code-line.is-unresolved > .code-notice,
.code-line.is-error > .code-notice { color: var(--text-primary); }
.code-line.is-error .code-notice { border-left-color: var(--status-error); color: var(--text-primary); }
/* The notice for an unresolved reference sits ON its line, pinned to the
   right edge, rather than being inserted as a line of its own: the
   highlighted pane is laid exactly over the editable text below it, and
   an inserted line would put the two out of step by one row. */
.code-notice {
  position: absolute; right: 0.3rem; top: 0; max-width: 58%;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  font-family: var(--font-family);
  font-size: 0.625rem; color: var(--text-secondary);
  border-left: var(--border-width-thick) solid var(--status-ref);
  padding-left: 0.3rem; background: var(--bg-inset);
}

/* THE CODE SURFACE EDITS THE DOCUMENT. Two layers in exact register: a
   highlighted, non-interactive pane, and a transparent textarea over it
   that carries the caret and the typing. docs/ui-references.md settles
   the pair of surfaces as "two coordinated surfaces editing one model,
   neither of them the real one", and Home Assistant's minimalism as the
   calibration point — a small highlighted pane, no file tree, no
   minimap, no command palette. */
/* THE PANE USES THE HEIGHT THE DOCK ALREADY RESERVES.
   It was capped at 52vh, which at a 1080 px viewport is 425 px inside a
   dock whose own max-height is 758 px — 25 lines of a 400-line document,
   with 218 px of empty column directly under the Apply button. The dock
   body is a column now and the editor is its growing child. */
.code-editor { position: relative; display: flex; flex-direction: column; }
.doc-dock-body > .code-editor { flex: 1 1 auto; min-height: 14rem; }
.code-editor .code {
  position: relative; z-index: 0; pointer-events: none;
  overflow: hidden; flex: 1 1 auto; min-height: 6rem;
}
.code-input {
  position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%;
  font-family: var(--font-mono); font-size: 0.6875rem; line-height: 1.5;
  padding: 0.5rem; margin: 0; border: var(--border-width) solid transparent;
  background: transparent; color: transparent; caret-color: var(--accent);
  white-space: pre-wrap; overflow-wrap: anywhere; word-break: normal;
  overflow-x: hidden; overflow-y: auto; resize: none;
  -webkit-text-fill-color: transparent;
}
.code-input::selection { background: var(--accent-soft); }
.code-input:focus { outline: var(--border-width-thick) solid var(--accent); outline-offset: 0; }
.code-actions { display: flex; align-items: center; gap: var(--spacing-sm); margin-top: var(--spacing-sm); flex-wrap: wrap; }
.code-error {
  font-size: 0.6875rem; color: var(--text-primary);
  border-left: var(--border-width-thick) solid var(--status-error); padding-left: 0.4rem;
}
.code-hint { font-size: 0.6875rem; color: var(--text-secondary); }
/* THE DOCK IS A RAISED GROUND. Everything set directly on it takes the
   page's own text colour rather than the secondary weight: the sweep
   measures --text-secondary at 3.85:1 on --bg-raised in Nord dark, which
   is the widget's name, the form's field labels and the whole repeated
   import diagnosis. */
.doc-dock .dock-subject,
.doc-dock .dock-subject-id,
.doc-dock .code-notice-list li,
.doc-dock .code-notice-list .code-notice-line,
.doc-dock .code-hint,
.doc-dock .form-field label,
.doc-dock .form-field .hint { color: var(--text-primary); }
/* THE CODE VIEW HAS A SYNTAX SCHEME OF ITS OWN, DERIVED PER MODE.
   It used to borrow the chart series ramp, which is derived once from
   the accent for marks on a card; on a light ground that put the
   document's own values — the strings, the numbers, the booleans a
   reader of an imported file is here to read — between 1.7:1 and 2.6:1.
   The --code-* tokens are fitted to the pane's own ground, --bg-inset,
   in each palette AND in each mode, so the payload is as legible as the
   keys. They are also a space of their own: a value in a document is
   not a chart series and must not share a colour with one. */
.tok-key { color: var(--code-key); }
.tok-str { color: var(--code-str); }
.tok-num { color: var(--code-num); }
.tok-bool { color: var(--code-bool); }
.tok-punct { color: var(--code-punct); }

/* TWO LINES PER FIELD, NOT THREE. Seven fields cost three rows each —
   label, control, and a "in the file: …" line of its own — so a form of
   seven controls ran 571 px inside a 432 px body and hid 139 px of
   itself. The file's own value rides at the end of the label row, where
   it is beside the name of the key it belongs to, and it is printed
   only where the file actually carries the key: where it does not, the
   selector's first option already reads "Not in the file", and a second
   line saying the same thing is the restatement, not the information. */
.form-field { display: flex; flex-direction: column; gap: 0.2rem; margin-bottom: 0.45rem; }
.form-field label { font-size: 0.6875rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-secondary); }
.form-field select, .form-field input {
  background: var(--bg-surface); color: var(--text-primary);
  border: var(--border-width) solid var(--border-color);
  border-radius: var(--border-radius); padding: 0.3rem 0.4rem;
}
.form-field .hint { font-size: 0.625rem; color: var(--text-secondary); }
/* A label carrying a chip stops being a bare uppercase run, so it lays
   its two parts out rather than letting the chip inherit the tracking.
   The file's value is pushed to the far end of the same row. */
.form-field label { display: flex; align-items: baseline; gap: 0.3rem; flex-wrap: wrap; }
.form-field label .hint { margin-left: auto; text-transform: none; letter-spacing: 0; }
.form-field label .badge { text-transform: none; letter-spacing: 0; }
/* The dock is drawn on --bg-raised, so its strings take the page's own
   ink — see THE RAISED GROUNDS above. Both of these measured 3.85:1 on
   --text-secondary in Nord dark, the same figure and the same ground as
   the header bar and the rail; the sweep reached them only once the
   form tab was swept with a widget whose controls are not all drawn. */
.form-footnote {
  font-size: 0.6875rem; color: var(--text-primary);
  margin: var(--spacing-sm) 0 0; padding-top: 0.35rem;
  border-top: var(--border-width) solid var(--border-color);
}
/* The reference colour, not the amber that means "the source is
   unavailable": one colour, one condition. */
.form-field.is-unresolved select { border-color: var(--status-ref); }

.btn {
  background: var(--bg-surface); color: var(--text-primary);
