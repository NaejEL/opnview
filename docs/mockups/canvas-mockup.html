function niceTop(v, formatValue) {
  return formatValue && formatValue.axisBase === 1024 ? niceCeil1024(v) : niceCeil(v);
}

/* A stacked area chart with one band per scope. The fill separates the
 * stacked series; the line on top runs through the same real points. */
function stackedAreaChart(id, labels, series, height, formatValue, mode) {
  mode = mode || "linear";
  var n = labels.length, i, s;
  var innerW = CHART_W - CHART_PADL - CHART_PADR;
  var innerH = height - CHART_PADT - CHART_PADB;
  var stack = [], running = new Array(n);
  for (i = 0; i < n; i++) { running[i] = 0; }
  for (s = 0; s < series.length; s++) {
    var lower = running.slice();
    var upper = new Array(n);
    for (i = 0; i < n; i++) { upper[i] = lower[i] + series[s].values[i]; }
    stack.push({ lower: lower, upper: upper, def: series[s] });
    running = upper;
  }
  var peak = 0;
  for (i = 0; i < n; i++) { if (running[i] > peak) { peak = running[i]; } }
  var top = niceTop(peak, formatValue);
  var xAt = function (i) { return CHART_PADL + (n === 1 ? 0 : innerW * i / (n - 1)); };
  var yAt = function (v) { return CHART_PADT + innerH - innerH * (v / top); };

  var scopeTicks = [0, 1, 2, 3, 4].map(function (g) { return formatValue(top * g / 4); });
  var out = ['<svg class="chart-svg" viewBox="0 0 ' + CHART_W + ' ' + height + '"' +
    boostCapAttr(CHART_PADL, scopeTicks) + ' role="img" aria-label="Traffic over time, stacked by scope">'];
  var g, gy;
  for (g = 0; g <= 4; g++) {
    gy = CHART_PADT + innerH - innerH * g / 4;
    out.push('<line class="grid-line" x1="' + CHART_PADL + '" y1="' + gy.toFixed(1) + '" x2="' + (CHART_W - CHART_PADR) + '" y2="' + gy.toFixed(1) + '"></line>');
    out.push('<text x="' + (CHART_PADL - 4) + '" y="' + (gy + 3).toFixed(1) + '" text-anchor="end">' + esc(formatValue(top * g / 4)) + "</text>");
  }
  for (s = 0; s < stack.length; s++) {
    var xs = [], ys = [], lo = [];
    for (i = 0; i < n; i++) {
      xs.push(xAt(i).toFixed(1));
      ys.push(yAt(stack[s].upper[i]).toFixed(1));
      lo.push(yAt(stack[s].lower[i]).toFixed(1));
    }
    out.push('<path class="area f' + stack[s].def.cls + '" d="' + bandD(xs, ys, lo, mode) +
      '" data-sample-count="' + n + '"></path>');
    out.push(seriesLine(stack[s].def.cls, xs, ys, mode, n));
    /* One mark per measured bucket, on top of the line. */
    out.push(sampleDots(stack[s].def.cls, xs, ys, innerW / Math.max(1, n - 1)));
  }
  out.push('<line class="axis-line" x1="' + CHART_PADL + '" y1="' + (CHART_PADT + innerH) + '" x2="' + (CHART_W - CHART_PADR) + '" y2="' + (CHART_PADT + innerH) + '"></line>');
  for (i = 0; i < n; i += 4) {
    out.push('<text x="' + xAt(i).toFixed(1) + '" y="' + (height - 6) + '" text-anchor="middle">' + esc(labels[i]) + "</text>");
  }
  out.push('<line class="cursor-line" id="' + id + '-cursor" x1="0" y1="' + CHART_PADT + '" x2="0" y2="' + (CHART_PADT + innerH) + '" style="display:none"></line>');
  out.push('<rect id="' + id + '-hit" x="' + CHART_PADL + '" y="' + CHART_PADT + '" width="' + innerW + '" height="' + innerH + '" fill="none" pointer-events="all"></rect>');
  out.push("</svg>");
  /* The axis in HTML text, for the widths at which the axis in the
   * drawing would be too small to read. See enforceChartTextFloor(). */
  out.push(chartFallback("Vertical axis 0 to " + formatValue(top) + " per bucket. " +
    "Horizontal axis " + labels[0] + " to " + labels[n - 1] + ", " + n + " buckets, " +
    "one mark per bucket."));
  return { html: out.join(""), xAt: xAt, innerW: innerW };
}

/* Two unrelated quantities on paired axes. Each legend entry states its
 * unit and which axis it belongs to.
 *
 * A SERIES WITH NO VALUES IS DRAWN AS A LABELLED GAP, never as a line at
 * zero and never silently dropped. docs/widget-catalogue.md, "Custom
 * chart", fixes the rule: the empty state is per series and never
 * collapsed, "because a chart with four series of which one is missing
 * must not look like a chart with three series". Such a series carries
 * `empty: true` and no `values`; its axis keeps its place and its ticks
 * read as dashes, because no scale can be known for a quantity nothing
 * can measure. */
function pairedAxisChart(labels, series, height, fmtLeft, fmtRight, mode) {
  mode = mode || "linear";
  var n = labels.length, i, s;
  var innerW = CHART_W - CHART_PADL - CHART_PADR;
  var innerH = height - CHART_PADT - CHART_PADB;
  var leftMax = 0, rightMax = 0, leftHasValues = false, rightHasValues = false;
  for (s = 0; s < series.length; s++) {
    if (series[s].empty) { continue; }
    if (series[s].axis === "left") { leftHasValues = true; } else { rightHasValues = true; }
    for (i = 0; i < n; i++) {
      if (series[s].axis === "left") { leftMax = Math.max(leftMax, series[s].values[i]); }
      else { rightMax = Math.max(rightMax, series[s].values[i]); }
    }
  }
  leftMax = niceTop(leftMax, fmtLeft); rightMax = niceTop(rightMax, fmtRight);
  var tickLeft = function (v) { return leftHasValues ? fmtLeft(v) : "—"; };
  var tickRight = function (v) { return rightHasValues ? fmtRight(v) : "—"; };
  /* A single-bucket series has no span to divide, so the one mark
   * sits at the left of the plot area rather than at NaN. The stacked
   * chart already guards this; the paired-axis chart and the rolling
   * strip are the same shape and did not. */
  var xAt = function (i) { return CHART_PADL + (n === 1 ? 0 : innerW * i / (n - 1)); };
  var yAt = function (v, axis) {
    var m = axis === "left" ? leftMax : rightMax;
    return CHART_PADT + innerH - innerH * (v / m);
  };
  var pairTicks = [0, 1, 2, 3, 4].map(function (g) { return tickLeft(leftMax * g / 4); })
    .concat([0, 1, 2, 3, 4].map(function (g) { return tickRight(rightMax * g / 4); }));
  var out = ['<svg class="chart-svg" viewBox="0 0 ' + CHART_W + ' ' + height + '"' +
    boostCapAttr(CHART_PADR, pairTicks) + ' role="img" aria-label="Two quantities on paired axes">'];
  var g, gy;
  for (g = 0; g <= 4; g++) {
    gy = CHART_PADT + innerH - innerH * g / 4;
    out.push('<line class="grid-line" x1="' + CHART_PADL + '" y1="' + gy.toFixed(1) + '" x2="' + (CHART_W - CHART_PADR) + '" y2="' + gy.toFixed(1) + '"></line>');
    out.push('<text x="' + (CHART_PADL - 4) + '" y="' + (gy + 3).toFixed(1) + '" text-anchor="end">' + esc(tickLeft(leftMax * g / 4)) + "</text>");
    out.push('<text x="' + (CHART_W - CHART_PADR + 4) + '" y="' + (gy + 3).toFixed(1) + '" text-anchor="start">' + esc(tickRight(rightMax * g / 4)) + "</text>");
  }
  /* A MISSING SERIES IS NOT LABELLED INSIDE THE PLOT AREA.
   *
   * The notice used to be drawn in the plot area, in the warning colour,
   * which put an amber sentence immediately above a drawn curve: it read
   * as a label on that curve, so a reader concluded the curve was the
   * missing series. docs/widget-catalogue.md, "Custom chart", requires
   * the per-series empty state precisely so that a missing series cannot
   * be confused with a drawn one.
   *
   * The notice is therefore below the drawing, in HTML, at the page's
   * own text size and in the same neutral treatment as the dashed axis
   * ticks that stand for the scale nothing can measure. It keeps its
   * place in the series table too, which is the other half of the
   * per-series state. */
  var gapNotices = [];
  for (s = 0; s < series.length; s++) {
    if (series[s].empty) {
      gapNotices.push('<div class="series-gap-row">' +
        '<span class="swatch swatch-none"></span>' +
        '<span class="series-gap-name">' + esc(series[s].label) + "</span>" +
        '<span class="badge">no line drawn</span>' +
        '<span class="series-gap-why">' + esc(series[s].gap) + "</span></div>");
      continue;
    }
    var xs = [], ys = [];
    for (i = 0; i < n; i++) {
      xs.push(xAt(i).toFixed(1)); ys.push(yAt(series[s].values[i], series[s].axis).toFixed(1));
    }
    out.push(seriesLine(series[s].cls, xs, ys, mode, n));
    out.push(sampleDots(series[s].cls, xs, ys, innerW / Math.max(1, n - 1)));
  }
  out.push('<line class="axis-line" x1="' + CHART_PADL + '" y1="' + (CHART_PADT + innerH) + '" x2="' + (CHART_W - CHART_PADR) + '" y2="' + (CHART_PADT + innerH) + '"></line>');
  for (i = 0; i < n; i += 4) {
    out.push('<text x="' + xAt(i).toFixed(1) + '" y="' + (height - 6) + '" text-anchor="middle">' + esc(labels[i]) + "</text>");
  }
  out.push("</svg>");
  /* Both axes in HTML text, for the widths at which the drawing's own
   * text would be too small to read. The gap notices are not in here:
   * they are always rendered, at every width, below the drawing. */
  out.push(chartFallback(
    "Left axis 0 to " + tickLeft(leftMax) + ". Right axis 0 to " + tickRight(rightMax) + ". " +
    "Horizontal axis " + labels[0] + " to " + labels[n - 1] + ", " + n + " buckets."));
  if (gapNotices.length) {
    out.push('<div class="series-gaps">' + gapNotices.join("") + "</div>");
  }
  return out.join("");
}

/* A donut, drawn as annular sectors. The tail is collapsed into one
 * explicit Other slice rather than turned into slivers — the caution
 * docs/ui-references.md records against Malcolm's pie. */
/* EVERY RING CLOSES. A composition ring shows the composition of its own
 * subject: its slices sum to its own hundred per cent and they fill the
 * turn. A ring drawn short of a full turn reads as broken rather than as
 * smaller, so nothing here scales the sweep — the comparison between
 * several rings on one card is carried by the figure in each hole and by
 * the proportional bar beneath the row. */
/* A SLICE IS A PICKABLE SHAPE, AND WHAT IT ANSWERS IS KEPT HERE.
 *
 * It used to be a bare <path> carrying a native SVG <title> and nothing
 * else: no role, no tab index, no handler. The only way to learn a
 * slice's value was a browser tooltip on a long hover — a delay, a
 * position and a style this page does not control, and which does not
 * exist at all for a keyboard or a touch screen. Four other families of
 * pickable shape on this page — map marks, tree nodes, matrix cells,
 * person blocks — are role="button", tabindex="0" and open the anchored
 * drill-down. The rings are the fifth, and they are the first shape on
 * the first card of the first canvas.

 * Keyed on the ring and on the category's own name rather than on an
 * index, because an index is a rank and a rank swaps: standing lesson 2.
 * Rebuilt by renderCanvas() on every draw. */
var SLICE_DETAIL = {};
var SLICE_SEP = "\u0000";
function sliceKey(ring, label) { return ring + SLICE_SEP + label; }

function donutHtml(slices, total, centreValue, centreLabel, opts) {
  opts = opts || {};
  var R = 54, r = 33, cx = 62, cy = 62, a0 = -Math.PI / 2, out = [], i, frac, a1;

   *
   * They were two <text> elements inside a 124-unit viewBox drawn into a
   * 104-pixel box, so the unit word under the figure came out at 5.9
   * effective pixels — below this page's own nine-pixel floor, on the
   * first card of the first canvas, three times over, and with no
   * mechanism to drop it the way a scaled chart drops its axis. Laid
   * over the ring as HTML it is not scaled by anything: the figure and
   * the word read at the size the stylesheet gives them, at every card
   * width. */
  out.push('<div class="donut">');
  /* role="img" makes every child presentational, which would have hidden
     the slice buttons from a screen reader the moment they became
     buttons. A ring whose slices pick is a group of controls. */
  out.push('<svg viewBox="0 0 124 124" width="124" height="124" role="' +
    (opts.widgetId ? "group" : "img") + '" aria-label="' +
    esc(opts.ariaLabel || "Share of the total") + '">');
  if (total <= 0) {
    out.push('<circle cx="62" cy="62" r="' + ((R + r) / 2) + '" fill="none" stroke="var(--border-color)" stroke-width="' + (R - r) + '"></circle>');
  }
  for (i = 0; i < slices.length; i++) {
    frac = total > 0 ? slices[i].value / total : 0;
    a1 = a0 + frac * Math.PI * 2;
    if (frac > 0.9999) { a1 = a0 + Math.PI * 1.9999; }
    /* What this slice answers, registered under the ring and the
     * category's own name, so the drill-down can be raised by a click,
     * by Enter or by Space and can be re-found after the two-second
     * redraw. */
    var shareText = fmtPercent(frac);
    var valueText = opts.fmt ? opts.fmt(slices[i].value) : String(slices[i].value);
    if (opts.widgetId) {
      SLICE_DETAIL[sliceKey(opts.ring || "", slices[i].label)] = {
        widget: opts.widgetId, ring: opts.ring || "", ringLabel: opts.ringLabel || "",
        label: slices[i].label, valueText: valueText, shareText: shareText,
        totalText: opts.fmt ? opts.fmt(total) : String(total),
        measure: opts.measure || "",
        rows: slices[i].detailRows || [],
        parts: slices[i].detailParts || [],
        partsHead: slices[i].detailPartsHead || ""

    }
    out.push('<path class="donut-slice f' + slices[i].cls + '"' +
      (opts.widgetId
        ? ' data-slice="' + esc(slices[i].label) + '" data-slice-ring="' + esc(opts.ring || "") +
          '" data-slice-widget="' + esc(opts.widgetId) + '" role="button" tabindex="0"' +
          ' aria-label="' + esc(slices[i].label + " — " + valueText + ", " + shareText +
            (opts.ringLabel ? " of the " + opts.ringLabel + " ring" : " of this ring") +
            " — open this category") + '"'
        : "") +
      ' d="' +
      "M" + (cx + R * Math.cos(a0)).toFixed(2) + " " + (cy + R * Math.sin(a0)).toFixed(2) +
      " A" + R + " " + R + " 0 " + (a1 - a0 > Math.PI ? 1 : 0) + " 1 " +
      (cx + R * Math.cos(a1)).toFixed(2) + " " + (cy + R * Math.sin(a1)).toFixed(2) +
      " L" + (cx + r * Math.cos(a1)).toFixed(2) + " " + (cy + r * Math.sin(a1)).toFixed(2) +
      " A" + r + " " + r + " 0 " + (a1 - a0 > Math.PI ? 1 : 0) + " 0 " +
      (cx + r * Math.cos(a0)).toFixed(2) + " " + (cy + r * Math.sin(a0)).toFixed(2) + ' Z">' +
      /* THE MEASURED VALUE FIRST, THE SHARE AFTER IT. The card answers
       * "how much is each of these pushing", and a bare percentage does
       * not answer it: a slice worth 8 % of a quiet ring and 8 % of a
       * loud one are different quantities. The value is formatted in the
       * card's own unit — the caller passes the same formatter its
       * legend uses — and the share is the share of this ring, which is
       * also the share of the turn, because the ring closes.
       *
       * IT IS AN EXTRA AND NEVER THE ONLY PATH. The same two figures are
       * in the legend beside the ring, in the slice's aria-label, and in
       * the drill-down a click or Enter raises. */
      "<title>" + esc(slices[i].label + " — " + valueText + ", " +
        shareText + " of this ring") + "</title></path>");

  out.push("</svg>");
  out.push('<div class="donut-centre">' +
    '<span class="donut-centre-value">' + esc(centreValue) + "</span>" +
    '<span class="donut-centre-label">' + esc(centreLabel) + "</span></div>");
  out.push("</div>");
  return out.join("");
}

/* A rolling strip at the resolution the samples actually have: every
 * measured point is drawn as a point, the line joins them, nothing is
 * smoothed and nothing is thinned. New samples enter at the right and
 * the oldest leave at the left. */
function rollingChart(series, height, formatValue, mode, viewWidth) {
  mode = mode || "linear";
  var n = series[0].values.length, w = viewWidth || 640, padR = 6, padT = 6, padB = 12;
  var peak = 0, s, i, running;
  for (i = 0; i < n; i++) {
    running = 0;
    for (s = 0; s < series.length; s++) { running += series[s].values[i]; }
    if (running > peak) { peak = running; }
  }
  var top = niceTop(peak, formatValue) || 1;
  /* THE GUTTER IS CUT FOR THE LABELS THIS CHART ACTUALLY PRINTS.
   * It was a constant 54 user units, and "10.0 packets/s" needs 57: the
   * top label was pushed past the left edge of the viewBox and the card
   * clipped its first character, so an axis that ran 0 / 5 / 10 read
   * 0.0 / 5.0 / 0.0. An axis that prints a wrong number is worse than no
   * axis. The width per character is measured from this font stack at
   * this size and rounded up. */
  var tickLabels = [formatValue(0), formatValue(top / 2), formatValue(top)];
  var padL = axisGutter(tickLabels, 40);
  var innerW = w - padL - padR, innerH = height - padT - padB;
  /* One sample and no span: the mark sits at the left of the plot
   * area rather than at NaN. Same guard as the stacked chart. */
  var xAt = function (k) { return padL + (n === 1 ? 0 : innerW * k / (n - 1)); };
  var yAt = function (v) { return padT + innerH - innerH * (v / top); };
  var out = ['<svg class="chart-svg" viewBox="0 0 ' + w + " " + height + '"' +
    boostCapAttr(padL, tickLabels) + ' role="img" aria-label="Throughput, one point per sample">'];
  var g, gy;
  for (g = 0; g <= 2; g++) {
    gy = padT + innerH - innerH * g / 2;
    out.push('<line class="grid-line" x1="' + padL + '" y1="' + gy.toFixed(1) + '" x2="' + (w - padR) + '" y2="' + gy.toFixed(1) + '"></line>');
    out.push('<text x="' + (padL - 4) + '" y="' + (gy + 3).toFixed(1) + '" text-anchor="end">' + esc(formatValue(top * g / 2)) + "</text>");
  }
  var stackLower = [];
  for (i = 0; i < n; i++) { stackLower.push(0); }
  for (s = 0; s < series.length; s++) {
    var xs = [], ys = [], lo = [], lower = stackLower.slice();
    for (i = 0; i < n; i++) {
      lo.push(yAt(lower[i]).toFixed(1));
      stackLower[i] += series[s].values[i];
      xs.push(xAt(i).toFixed(1)); ys.push(yAt(stackLower[i]).toFixed(1));
    }
    /* The band between this series' lower and upper edge, filled so that
     * two stacked series whose cumulative lines coincide — a category
     * that contributed nothing at this instant — stay told apart. The
     * fill separates the bands; the line and the marks on top of it are
     * drawn through the real sample values and nothing else. */
    out.push('<path class="area f' + series[s].cls + '" d="' + bandD(xs, ys, lo, mode) + '" data-sample-count="' + n + '"></path>');
    out.push(seriesLine(series[s].cls, xs, ys, mode, n));
    /* Every sample in the ring, not every third one. */
    out.push(sampleDots(series[s].cls, xs, ys, innerW / Math.max(1, n - 1)));
  }
  out.push('<line class="axis-line" x1="' + padL + '" y1="' + (padT + innerH) + '" x2="' + (w - padR) + '" y2="' + (padT + innerH) + '"></line>');
  out.push("</svg>");
  /* The same axis in HTML text, shown only when the card is too narrow
   * for the labels to be legible. See enforceChartTextFloor(). */
  out.push(chartFallback("Range 0 to " + formatValue(top) + ", grid at " +
    formatValue(top / 2) + ". " + n + " samples."));
  return out.join("");
}

/* A sparkline is a chart too: it draws one mark per sample, and the line
 * joins them. The marks are inset from the edges so the first and the
 * last are not half-clipped by the viewBox. */
function sparkline(values, cls, w, h, mode) {
  mode = mode || "linear";
  var n = values.length, i, min = Math.min.apply(null, values), max = Math.max.apply(null, values);
  var span = max - min || 1, xs = [], ys = [], inset = 2;
  var innerW = w - inset * 2;
  for (i = 0; i < n; i++) {
    xs.push((inset + (n === 1 ? 0 : innerW * i / (n - 1))).toFixed(1));
    ys.push((h - (h - 4) * (values[i] - min) / span - 2).toFixed(1));
  }
  /* A sparkline in a fixed-layout table cell: the cell can be narrower
   * than the drawing, and a drawing sliced by a cell's overflow is a
   * chart missing its most recent samples with nothing saying so. It
   * scales down with the cell instead. */
  return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" width="' + w + '" height="' + h + '" role="img" aria-label="Recent history, one mark per sample">' +
         seriesLine(cls, xs, ys, mode, n) +
         sampleDots(cls, xs, ys, innerW / Math.max(1, n - 1)) + "</svg>";

/* ====================================================================
 * THE BASEMAP
 *
 * Natural Earth 1:110m Admin 0 - Countries, from that project's own
 * repository: github.com/nvkelso/natural-earth-vector, the file
 * geojson/ne_110m_admin_0_countries.geojson at release v5.1.2,
 * retrieved 2026-09-25. Natural Earth is in the public domain: no
 * attribution is required, so none is printed in the interface, and the
 * provenance is recorded here instead.
 *
 * The geometry is embedded, not fetched. The page still issues no
 * request to any host; baking data into the artefact is the same thing
 * the invented network above does.
 *
 * Simplified with Douglas-Peucker at a 0.15-degree tolerance, then
 * projected into this 720 x 360 equirectangular viewBox and rounded to
 * two decimals of a viewBox unit.
 *
 * One entry per country: [name, one path covering all its rings]. The
 * path is filled as land AND stroked, so the same geometry draws the
 * coastline and every land border; the name is the country's <title>,
 * which is how a country is named at a zoom where a label would not
 * fit.
 * ==================================================================== */

var MAP_W = 720, MAP_H = 360;
function mapX(lon) { return (lon + 180) * MAP_W / 360; }
function mapY(lat) { return (90 - lat) * MAP_H / 180; }

/* ====================================================================
 * THE VIEW ON THE BASEMAP
 *
 * Ten of fifteen marks used to sit inside a 35 x 25 px blob over
 * western Europe, because the whole world was the only view there was.
 * The view is a scale and an offset in viewBox units, applied as one
 * transform on the basemap group; the marks are translated by the same
 * transform but NOT scaled by it, so a mark keeps its radius and the
 * zoom separates the blob instead of magnifying it.
 * ==================================================================== */

var MAP_ZOOM_MIN = 1, MAP_ZOOM_MAX = 16;

/* One view per map widget, held outside the render. The canvas is
 * rebuilt every two seconds by the live tick, and a view stored in the
 * DOM would throw the reader back out to the whole world on every tick
 * he was not touching the map. */
var MAP_VIEW = {};
function mapView(id) {
  if (!MAP_VIEW[id]) { MAP_VIEW[id] = { k: 1, tx: 0, ty: 0 }; }
  return MAP_VIEW[id];
}
/* The bounds. The map cannot be lost: at zoom 1 the only view is the
 * whole world, and at any zoom the drawing still covers the frame. */
function clampMapView(v) {
  v.k = Math.min(MAP_ZOOM_MAX, Math.max(MAP_ZOOM_MIN, v.k));
  v.tx = Math.min(0, Math.max(-(v.k - 1) * MAP_W, v.tx));
  v.ty = Math.min(0, Math.max(-(v.k - 1) * MAP_H, v.ty));
  return v;
}

function basemapHtml() {
  if (BASEMAP_CACHE !== null) { return BASEMAP_CACHE; }
  var out = [], i, lat;
  for (i = -150; i <= 150; i += 30) {
    out.push('<line class="map-graticule" x1="' + mapX(i).toFixed(1) + '" y1="0" x2="' + mapX(i).toFixed(1) + '" y2="' + MAP_H + '"></line>');
  }
  for (lat = -60; lat <= 60; lat += 30) {
    out.push('<line class="map-graticule" x1="0" y1="' + mapY(lat).toFixed(1) + '" x2="' + MAP_W + '" y2="' + mapY(lat).toFixed(1) + '"></line>');
  }
  for (i = 0; i < COUNTRIES.length; i++) {
    out.push('<path class="map-country" d="' + COUNTRIES[i][1] + '"><title>' +
             esc(COUNTRIES[i][0]) + "</title></path>");
  }
  BASEMAP_CACHE = out.join("");
  return BASEMAP_CACHE;
}

/* Point marks sized by volume, on a de-saturated basemap, with the
 * detail in a popup rather than on the canvas. */
function worldMapHtml(widgetId, marks, sizeKey, markClass) {
  var maxV = 1, i, r, m, x, y;
  for (i = 0; i < marks.length; i++) { maxV = Math.max(maxV, marks[i][sizeKey]); }
  var v = clampMapView(mapView(widgetId));
  var out = ['<div class="map-frame">'];
  out.push('<svg class="map-svg" data-map-svg="' + widgetId + '" viewBox="0 0 ' + MAP_W + ' ' + MAP_H + '" ' +
           'tabindex="0" role="group" aria-label="Destinations as point marks on a world basemap">');
  /* The basemap is the ground, and the marks over it carry the meaning
   * and their own labels, so the 177 country titles are not 177 more
   * things for a screen reader to walk. A mark names its country. */
  out.push('<g class="map-pan" aria-hidden="true" transform="translate(' + v.tx.toFixed(2) + ' ' + v.ty.toFixed(2) +
           ') scale(' + v.k.toFixed(4) + ')">' + basemapHtml() + "</g>");
  out.push('<g class="map-marks">');
  for (i = 0; i < marks.length; i++) {
    m = marks[i];
    r = 2.5 + 9 * Math.sqrt(m[sizeKey] / maxV);
    x = mapX(m.info.lon); y = mapY(m.info.lat);
    /* Every target that opens a detail is reachable from the keyboard.
     * These were click-only — a pointer, a -1 tab index and no role — so
     * everything behind a click was unreachable without a mouse. */
    out.push('<g class="map-mark-at" data-x="' + x.toFixed(2) + '" data-y="' + y.toFixed(2) + '" ' +
             'transform="translate(' + (v.tx + x * v.k).toFixed(2) + ' ' + (v.ty + y * v.k).toFixed(2) + ')">' +
             '<circle class="map-mark ' + markClass + '" data-map="' + widgetId + '" data-peer="' + esc(m.peer) + '" ' +
             'role="button" tabindex="0" aria-label="' +
             esc(m.info.op + ", " + m.info.country + " — open this destination") + '" ' +
             'r="' + r.toFixed(1) + '">' +
             "<title>" + esc(m.info.op + " — " + m.info.country + " (" + m.info.cc + ")") + "</title></circle></g>");
  }
  out.push("</g></svg>");
  /* The stacked pair in the corner of the drawing, and the reset under
   * it. They are in the tab order and each carries an accessible name;
   * the focused drawing also takes the arrow keys, + and -, and 0. */
  out.push('<div class="map-controls">' +
    '<button type="button" data-map-zoom="in" data-map-for="' + widgetId + '" aria-label="Zoom in">+</button>' +
    '<button type="button" data-map-zoom="out" data-map-for="' + widgetId + '" aria-label="Zoom out">−</button>' +
    '<button type="button" data-map-zoom="reset" data-map-for="' + widgetId + '" aria-label="Reset the view">' +
      '<svg viewBox="0 0 12 12" width="11" height="11" aria-hidden="true" focusable="false">' +
      '<path d="M1.5 4V1.5H4M8 1.5h2.5V4M10.5 8v2.5H8M4 10.5H1.5V8" fill="none" ' +
      'stroke="currentColor" stroke-width="1.4"></path></svg>' +
    "</button>" +
    "</div>");
  out.push("</div>");
  return out.join("");
}

/* The view, written onto a drawing that is already in the document:
 * one transform on the basemap group, and one translation per mark with
 * the scale left out of it. */
function applyMapView(svg) {
  var v = clampMapView(mapView(svg.getAttribute("data-map-svg")));
  var pan = svg.querySelector(".map-pan");
  if (pan) {
    pan.setAttribute("transform", "translate(" + v.tx.toFixed(2) + " " + v.ty.toFixed(2) +
                     ") scale(" + v.k.toFixed(4) + ")");
  }
  svg.querySelectorAll(".map-mark-at").forEach(function (g) {
    var x = Number(g.getAttribute("data-x")), y = Number(g.getAttribute("data-y"));
    g.setAttribute("transform", "translate(" + (v.tx + x * v.k).toFixed(2) + " " + (v.ty + y * v.k).toFixed(2) + ")");
  });
}
/* How many client pixels one viewBox unit is worth. The drawing fills a
 * frame that is not the viewBox's own 2:1, so the viewBox is letterboxed
 * inside it and the bounding rectangle is no longer the mapping: the
 * element's own matrix is, and it is uniform in both axes. */
function mapScale(svg) {
  var m = svg.getScreenCTM ? svg.getScreenCTM() : null;
  return m && m.a ? m.a : 1;
}
/* A client point in viewBox units, through that same matrix. */
function mapPoint(svg, clientX, clientY) {
  var m = svg.getScreenCTM ? svg.getScreenCTM() : null;
  if (!m) { return { x: MAP_W / 2, y: MAP_H / 2 }; }
  var p = svg.createSVGPoint();
  p.x = clientX; p.y = clientY;
  p = p.matrixTransform(m.inverse());
  return { x: p.x, y: p.y };
}
/* Zoom about a point, which is what makes the wheel feel attached to the
 * map: the world coordinate under the pointer is the one that does not
 * move. */
function zoomMapAt(svg, factor, vx, vy) {
  var v = mapView(svg.getAttribute("data-map-svg"));
  var k0 = v.k;
  var k1 = Math.min(MAP_ZOOM_MAX, Math.max(MAP_ZOOM_MIN, k0 * factor));
  if (k1 === k0) { return; }
  var wx = (vx - v.tx) / k0, wy = (vy - v.ty) / k0;
  v.k = k1;
  v.tx = vx - wx * k1;
  v.ty = vy - wy * k1;
  clampMapView(v);
  applyMapView(svg);
}


/* ====================================================================
 * SHARED PIECES
 * ==================================================================== */

/* A condition, named in a few words and nothing more. A state is not
 * prose: it keeps the widget's footprint, shows no zero, no empty chart
 * and no failure, and links to Source availability. */
/* The badge class for a condition already written in words. The words
 * are the page's own, so the mapping is a lookup rather than a guess,
 * and it exists so that one condition cannot wear two colours in two
 * places — which is exactly what "unresolved reference" and "reference
 * not found" were doing on canvas 4. */
/* ====================================================================
 * THE DETECTION-COVERAGE STATEMENT
 *
 * The two standing UI statements — the observation-point limit and the
 * inferred-site-names limit — used to open every canvas as a paragraph
 * under the tabs. They are gone from the page: the maintainer's
 * decision, and the requirement is being removed from
 * docs/widget-catalogue.md, ROADMAP.md and AC5 rather than relocated.
 * They are not a marker, a tooltip or a disclosure either; they are not
 * on the page at all. The reasoning about what the observation point
 * can and cannot see is not printed at the reader.
 * ==================================================================== */

function conditionBadgeClass(words) {
  var t = String(words || "").toLowerCase();
  if (t.indexOf("switched off") >= 0) { return "badge-off"; }
  if (t.indexOf("unavailable") >= 0 || t.indexOf("not reachable") >= 0) { return "badge-unavailable"; }
  if (t.indexOf("not found") >= 0) { return "badge-ref"; }
  if (t.indexOf("not in the model") >= 0 || t.indexOf("no telemetry") >= 0) { return "badge-gap"; }
  return "";
}

function statePanel(kind, words, extra, detail) {
  var badges = {
    unavailable: "Source unavailable",
    disabled: "Switched off",
    silent: "No data in the period",
    unresolved: "Reference not found",
    gap: "Not in the model"
  };
  return '<div class="state state-' + kind + '">' +
    '<span class="state-badge">' + esc(badges[kind]) + "</span>" +
    '<p class="state-text">' + esc(words) + "</p>" +
    (detail ? '<p class="state-detail">' + esc(detail) + "</p>" : "") +
    '<button type="button" class="link-button" data-goto="availability">Sources</button>' +
    (extra || "") + "</div>";
}

/* ====================================================================
 * WIDGET RENDERERS
 * Each returns { body, notes }. Nothing here holds a figure of its own.
 * ==================================================================== */

var RENDER = {};

/* A WIDGET'S REFERENCES SCOPE IT, AND REPAIRING ONE THEREFORE CHANGES
 * WHAT IS DRAWN.
 *
 * The no-code selector's first option reads "every <kind> this
 * installation has", so choosing a named one means restrict to this, and
 * a card that went on rendering all six interfaces after a reference was
 * repaired would be contradicting its own form. These three helpers turn
 * the reference lists into the local keys a renderer filters on; an
 * empty or absent list means no restriction, exactly as the format says.
 * An unresolved reference never reaches here — renderWidget renders the
 * repair state instead of calling the renderer at all. */
function refValues(w, key) {
  var v = w.parameters ? w.parameters[key] : null;
  if (!v || !v.length) { return null; }
  return v.map(function (r) { return r.value; });
}
function scopedInterfaceKeys(w) {
  var ids = refValues(w, "interfaces");
  if (!ids) { return null; }
  var keys = INTERFACES.filter(function (s) { return ids.indexOf(s.identifier) >= 0; })
    .map(function (s) { return s.key; });
  return keys.length ? keys : null;
}
/* A client reference travels by MAC where that is the identity the
 * firewall has for it and by hostname where it is not, so the scope
 * matches on whichever the reference carries. */
function scopedClientKeys(w) {
  var vals = refValues(w, "clients");
  if (!vals) { return null; }
  var keys = CLIENTS.filter(function (d) {
    return vals.indexOf(d.mac) >= 0 || vals.indexOf(d.key) >= 0;
  }).map(function (d) { return d.key; });
  return keys.length ? keys : null;
}
function scopedOwnerKeys(w) {
  var names = refValues(w, "owners");
  if (!names) { return null; }
  var keys = OWNERS.filter(function (o) { return names.indexOf(o.display_name) >= 0; })
    .map(function (o) { return o.key; });
  return keys.length ? keys : null;
}
/* What a scoped card says in its header, so that a restriction is never
 * silent: a narrowed total that does not announce itself is a wrong
 * total. */
function scopeMeta(names) {
  if (!names || names.length === 0) { return null; }
  return "scoped to " + names.join(", ");
}
/* The chip a card wears when aggForWidget() has narrowed its aggregate.
 * Every widget whose figures the interface scope moves calls this, both
 * because the page's own rule is that a narrowed total announces itself
 * and because it is the renderer naming the parameter it is honouring —
 * which is what check-inert-parameters.js looks for. */
function widgetScopeMeta(w) {
  var keys = scopedInterfaceKeys(w);
  return scopeMeta(keys && keys.map(interfaceLabel));
}
function withScope(w, meta) {
  var chip = widgetScopeMeta(w);
  if (!chip) { return meta || null; }
  return meta ? meta + " · " + chip : chip;
}

var GROUP_BY_LABEL = {
  blocking_reason: "blocking reason",
  client: "client",
  interface: "interface",
  protocol: "protocol",
  service_port: "service port"
};

/* A ring that cannot be drawn at all: the grouping has no key for this
 * direction. A dashed track holds the ring's place at the ring's size,
 * and the condition is named beneath it. Neither an empty circle passed
 * off as zero, nor a missing third ring. */
function emptyRingHtml(words) {
  return '<svg viewBox="0 0 124 124" width="124" height="124" role="img" aria-label="' +
    esc("Not drawn — " + words) + '">' +
    '<circle cx="62" cy="62" r="43.5" fill="none" stroke="var(--border-color)" ' +
    'stroke-width="21" stroke-dasharray="4 5"></circle></svg>';
}

RENDER.traffic_composition = function (w) {
  var ifaceScope = scopedInterfaceKeys(w);
  var previousCompScope = COMP_SCOPE;
  COMP_SCOPE = ifaceScope
    ? CLIENTS.filter(function (d) { return ifaceScope.indexOf(d.iface) >= 0; })
        .map(function (d) { return d.key; })
    : null;
  try {
    return compositionBody(w, ifaceScope);
  } finally {
    COMP_SCOPE = previousCompScope;
  }
};

function compositionBody(w, ifaceScope) {
  var groupBy = w.parameters.group_by || "blocking_reason";
  var splitBy = w.parameters.split_by || "none";
  var limit = w.parameters.slices || 6;
  var windowSeconds = w.parameters.window_seconds || 120;
  var byReason = groupBy === "blocking_reason";
  var fmtValue = byReason ? function (v) { return fmtInt(v); } : fmtBits;
  var shape, meta;

  /* The grouping dimension stays in the meta line whether the card draws
   * one ring or three — docs/widget-catalogue.md requires it there, and
   * "21 %" means different things by blocking reason and by client. What
   * separates the rings is written under each ring instead of in the
   * meta, where it would be read once and then truncated. */
  shape = splitBy === "direction"
    ? compositionSplitByDirection(w, groupBy, limit, byReason, fmtValue)
    : compositionSingleRing(w, groupBy, limit, byReason, fmtValue);
  /* THE UNIT FOLLOWS THE QUESTION, AND THE CARD SAYS WHICH IT IS.
   * Inbound, outbound and between-interfaces are bandwidth: the rings
   * divide a rate and their holes carry one. Blocking reason is not
   * bandwidth and cannot be one — a refused lookup carries no byte at
   * all — so that grouping divides a packet count over the period. The
   * two are never mixed in one row of rings, and the chip names whichever
   * is on screen. */
  meta = "by " + GROUP_BY_LABEL[groupBy] +
    /* The unit. A rate is an instant by definition and does not need
     * "now" appended to it; a packet count needs the window it counted
     * over, so that one keeps it. */
    (byReason ? " · packets, " + AGG.periodShort : " · bit/s");

  /* The strip's drawing is cut to the card's footprint, height with
   * width, so its proportions are the same at every span and only its
   * internal scale changes. */
  var stripW = chartViewWidth(w), stripH = Math.round(190 * stripW / 640);
  /* The recorded history when the card covers the whole network; the
   * same function re-evaluated at the same instants when it does not. */
  var ring = ifaceScope ? scopedDecisionRing(ifaceScope) : LIVE.ring;
  /* The window the card asks for, in samples at the strip's own
   * cadence. Everything the legend says about the strip is printed from
   * this count and from LIVE.tickMs, never spelled out beside them. */
  var stripSamples = stripSampleCount(windowSeconds);
  var chart, stripLegend, stripSeries, drawn;
  if (byReason) {
    /* The strip draws exactly the categories the rings draw, a second at
     * a time, so the donut's shape and the strip's shape are the same
     * question asked over two spans — the period above, this minute
     * below. The three classes are the three the categories carry. The
     * DNS list is in neither: a refused lookup is not a packet, and
     * stacking refusals per second on packets per second would band two
     * units into one height. It is counted beside the rings and said so
     * in the legend. */
    stripSeries = stripTail([
      { cls: 3, values: ring.allow },
      { cls: 5, values: ring.rule },
      { cls: 4, values: ring.drop }
    ], stripSamples);
    drawn = stripSeries[0].values.length;
    chart = rollingChart(stripSeries,
      stripH, function (v) { return v.toFixed(1) + " packets/s"; }, lineMode(w),
      stripW);
    stripLegend = "";
  } else {
    /* THE BANDS ARE THE CARD'S OWN CATEGORIES. `shape.strip` is the
     * category list the rings were drawn from, each with the class it
     * was given, so blue means one thing in this whole card. */
    stripSeries = stripTail(compositionStripSeries(groupBy, shape.strip.cats, shape.strip.mode),
      stripSamples);
    drawn = stripSeries.length ? stripSeries[0].values.length : 0;
    chart = rollingChart(stripSeries,
      stripH, function (v) { return fmtBits(v); }, lineMode(w),
      stripW);
    stripLegend = "";
  }

  /* The card holds two shapes and always did: the ring or rings above,
   * the rolling strip below. Splitting the ring changes how many shapes
   * there are, not whether a card may hold more than one. The strip is
   * the card's, not a ring's, and is not split with them. */
  return {
    meta: withScope(w, meta),
    body: shape.html +
      '<div class="chart-wrap">' + chart + "</div>" +
      /* The strip's own x extent, as a unit and not a sentence: how
       * many marks are on screen and how long a span they cover. */
      '<div class="legend">' + stripLegend +
        '<span class="legend-item muted">' + esc(stripWindowWords(drawn, windowSeconds)) + "</span>" +
      "</div>"
  };
}

/* ONE RING — the arrangement the catalogue describes, unchanged. */
function compositionSingleRing(w, groupBy, limit, byReason, fmtValue) {
  var all = compositionSlices(groupBy), slices, tail = [];
  if (byReason) {
    /* Fixed categories: there is no tail to collapse and no Other slice.
     * The category whose engine is not collecting is kept out of the
     * ring, because a slice of unknown size cannot be drawn. */
    slices = all;
  } else {
    var shown = all.slice(0, limit);
    tail = all.slice(limit);
    slices = shown.map(function (s) {
      return { label: s.label, value: s.value, cls: seriesClass("composition:" + groupBy, s.label), members: [s.label] };
    });
    if (tail.length) {
      slices.push({ label: "Other (" + tail.length + ")",
                    value: sum(tail, function (s) { return s.value; }), cls: OTHER_CLS,
                    members: tail.map(function (s) { return s.label; }),
                    /* WHAT THE COLLAPSED TAIL IS MADE OF. The drill-down
                     * on this slice lists the categories inside it with
                     * their own measured values, which is the one answer
                     * the ring cannot draw. */
                    detailPartsHead: "Collapsed into this slice",
                    detailParts: tail.map(function (s) {
                      return { label: s.label, valueText: fmtValue(s.value) };
                    }) });
    }
  }
  var drawn = slices.filter(function (s) { return s.value !== null && s.value !== undefined; });
  var total = sum(drawn, function (s) { return s.value; });
  var legend = slices.map(function (s) {
    /* Counted, and in no ring: the number is known and the badge says why
     * it is not a share of the ring's own hundred per cent. Identical to
     * the treatment the split card gives the same category. */
    if (s.unplaced !== undefined) {
      return '<div class="comp-row is-unplaced" title="' + esc(s.whyLong || s.why) + '">' +
        '<span class="swatch sw-' + s.cls + '"></span>' +
        '<span class="cl">' + esc(s.label) + "</span>" +
        '<span class="cv">' + esc(fmtValue(s.unplaced)) + "</span>" +
        '<span class="badge">' + esc(s.why) + "</span></div>";
    }
    if (s.value === null) {
      /* No swatch: a category with no number has no slice, and a colour
       * key beside it would promise one. */
      return '<div class="comp-row is-state"><span></span>' +
        '<span class="cl">' + esc(s.label) + "</span>" +
        '<span class="badge ' + conditionBadgeClass(s.stateWords) + '">' + esc(s.stateWords) + "</span></div>";
    }
    return '<div class="comp-row"><span class="swatch sw-' + s.cls + '"></span>' +
      '<span class="cl">' + esc(s.label) + "</span>" +
      '<span class="cv">' + esc(fmtValue(s.value)) + "</span>" +
      '<span class="cp">' + esc(total > 0 ? fmtPercent(s.value / total, 0) : "—") + "</span></div>";
  }).join("");
  var centreValue = byReason ? fmtInt(total) : fmtBits(total).split(" ")[0];
  var centreLabel = byReason ? "packets" : fmtBits(total).split(" ")[1];
  return {
    /* What the rolling strip beneath this ring bands: the ring's own
     * categories, with the class each was given. "whole" because an
     * unsplit ring divides each client's whole rate. */
    strip: { mode: "whole", cats: slices.filter(function (s) { return s.members; })
      .map(function (s) { return { label: s.label, cls: s.cls, members: s.members }; }) },
    html: '<div class="comp">' +
      "<div>" + donutHtml(drawn, total, centreValue, centreLabel,
                          { ariaLabel: "Composition by " + GROUP_BY_LABEL[groupBy], fmt: fmtValue,
                            widgetId: w.id, ring: "", measure: byReason ? "packets" : "throughput" }) + "</div>" +
      '<div class="comp-legend">' + legend + "</div></div>"
  };
}

/* THREE RINGS, ONE PER DIRECTION, ONE LEGEND, AND EVERY RING CLOSES.
 *
 * The rings are the same size, as every donut in Family B is — ntopng,
 * Pi-hole and Zenarmor all draw theirs at one size, and Zenarmor sets
 * three of them in a row. Those three products each split a DIFFERENT
 * dimension per ring, so each of their rings carries its own legend.
 * Here the three rings split the SAME categories, so one legend serves
 * all three: three copies of one list is three times the reading for the
 * same information.
 *
 * WHAT IS NOT SHARED IS THE SCALE. Each ring is the composition of its
 * own direction and closes on its own hundred per cent, because that is
 * what a composition ring is and what every product surveyed draws. A
 * ring left short of a full turn reads as broken, not as smaller.
 *
 * The comparison between the three is therefore carried by two things
 * that are honest at a glance and are not the sweep: the figure in each
 * hole — a rate where the question is bandwidth, a packet count where it
 * is decisions — and the proportional bar under the row, where a width
 * is a width. */
function compositionSplitByDirection(w, groupBy, limit, byReason, fmtValue) {
  var built = byReason
    ? { categories: blockingReasonCategories(), states: {} }
    : throughputCategories(groupBy, limit);
  var cats = built.categories, states = built.states;

  var rings = DIRECTIONS.map(function (dir) {
    if (states[dir.key]) { return { label: dir.label, state: states[dir.key] }; }
    var slices = [], total = 0;
    cats.forEach(function (c) {
      if (!c.values) { return; }
      var v = c.values[dir.key] || 0;
      /* The same category in the two other directions, so a picked slice
       * says what its category is doing on the card as a whole rather
       * than only inside the ring it was picked in. Every term is a
       * measured value of this ring set; nothing here is derived from a
       * figure the model cannot produce. */
      var acrossRows = DIRECTIONS.map(function (other) {
        return { label: other.label, valueText: fmtValue(c.values[other.key] || 0) };
      });
      slices.push({ label: c.label, value: v, cls: c.cls,
                    detailPartsHead: "This category, in each ring",
                    detailParts: acrossRows });
      total += v;
    });
    return { key: dir.key, label: dir.label, slices: slices, total: total };
  });

  var placed = sum(rings, function (r) { return r.state ? 0 : r.total; });

  var ringsHtml = '<div class="comp-rings">' + rings.map(function (r) {
    if (r.state) {
      return '<div class="comp-ring">' + emptyRingHtml(r.state) +
        '<span class="comp-ring-label">' + esc(r.label) + "</span>" +
        '<span class="badge ' + conditionBadgeClass(r.state) + '">' + esc(r.state) + "</span></div>";
    }
    var centreValue = byReason ? fmtInt(r.total) : fmtBits(r.total).split(" ")[0];
    var centreLabel = byReason ? "packets" : fmtBits(r.total).split(" ")[1];
    /* THE PERIOD'S VOLUME IS NOT REPEATED HERE. It used to sit under
     * each direction as a secondary figure, and the card beside this one
     * — "Traffic over time by scope" — prints the same three volumes for
     * the same three scopes, where docs/widget-catalogue.md requires
     * them ("the numbers brought forward as totals above the chart").
     * One band of the canvas printed six figures twice. The card that
     * carries more keeps them: the scope card, whose chart is those
     * volumes over time. This card keeps the rate, which is what a ring
     * of "now" is a composition of. */
    return '<div class="comp-ring">' +
      donutHtml(r.slices, r.total, centreValue, centreLabel,
                { ariaLabel: r.label + " — " + fmtValue(r.total) + ", by " + GROUP_BY_LABEL[groupBy],
                  fmt: fmtValue, widgetId: w.id, ring: r.key, ringLabel: r.label,
                  measure: byReason ? "packets" : "throughput" }) +
      '<span class="comp-ring-label">' + esc(r.label) + "</span></div>";
  }).join("") + "</div>";

  /* THE RELATIVE WEIGHT OF THE THREE, AS A WIDTH. The rings close, so
   * they no longer say which direction is the loud one; this row does,
   * in the order of the rings above and in the same measure their holes
   * carry. A direction whose ring could not be drawn has no width here
   * either, and the caption says how many the bar covers. */
  var drawnRings = rings.filter(function (r) { return !r.state; });
  var weightHtml = "";
  if (placed > 0 && drawnRings.length > 1) {
    weightHtml = '<div class="comp-weight" role="img" aria-label="' +
      esc("Relative weight — " + drawnRings.map(function (r) {
        return r.label + " " + fmtPercent(r.total / placed, 0);
      }).join(", ")) + '">' +
      drawnRings.map(function (r) {
        /* DECLARED INERT, and it now can be: the share each segment is
         * worth is printed as text directly under the bar, so the
         * segment carries no answer that is reachable only by hovering
         * it. The `title` stays as a convenience and nothing depends on
         * it. */
        return '<div class="comp-weight-seg comp-weight-' + esc(r.key) +
          '" data-decorative="the share is printed under the bar"' +
          ' title="' + esc(r.label + " — " + fmtValue(r.total) + ", " + fmtPercent(r.total / placed, 0)) +
          '" style="flex: ' + (r.total / placed).toFixed(4) + ' 1 0"></div>';
      }).join("") + "</div>" +
      /* THE KEY, NOT A SENTENCE ABOUT THE KEY. It read "Relative weight
       * of the three rings, left to right — Inbound 16 %, Outbound
       * 58 %, Between interfaces 26 %" — 104 characters of which 44 were
       * the figures and the rest was the bar describing itself. The bar
       * is above it in the same order and the aria-label says what the
       * graphic is; what the reader needs beside it is the numbers. */
      '<div class="legend comp-scale">' +
      drawnRings.map(function (r) {
        return '<span class="legend-item muted"><span class="swatch comp-weight-' + esc(r.key) +
          '"></span>' + esc(r.label + " " + fmtPercent(r.total / placed, 0)) + "</span>";
      }).join("") + "</div>";
  }

  var legend = cats.map(function (c) {
    if (c.stateWords) {
      /* No swatch. A category with no number has no slice in any ring,
       * and a colour key beside it would promise one. */
      return '<div class="comp-row is-state"><span></span>' +
        '<span class="cl">' + esc(c.label) + "</span>" +
        '<span class="badge ' + conditionBadgeClass(c.stateWords) + '">' + esc(c.stateWords) + "</span></div>";
    }
    if (c.unplaced !== undefined) {
      return '<div class="comp-row is-unplaced" title="' + esc(c.whyLong || c.why) + '">' +
        '<span class="swatch sw-' + c.cls + '"></span>' +
        '<span class="cl">' + esc(c.label) + "</span>" +
        '<span class="cv">' + esc(fmtValue(c.unplaced)) + "</span>" +
        '<span class="badge">' + esc(c.why) + "</span></div>";
    }
    var across = sum(DIRECTIONS, function (dir) { return c.values[dir.key] || 0; });
    return '<div class="comp-row"><span class="swatch sw-' + c.cls + '"></span>' +
      '<span class="cl">' + esc(c.label) + "</span>" +
      '<span class="cv">' + esc(fmtValue(across)) + "</span>" +
      '<span class="cp">' + esc(placed > 0 ? fmtPercent(across / placed, 0) : "—") + "</span></div>";
  }).join("");

  /* The reconciliation row. The three ring totals and the legend's own
   * column are the same quantity read two ways, and this row is where
   * they meet: it is the sum across the rings, and nothing outside them
   * is counted into it. It sits outside the two-column legend because a
   * total that landed at the foot of one column would be read as that
   * column's total. */
  var totalRow = '<div class="comp-legend"><div class="comp-row is-total"><span></span>' +
    '<span class="cl">' + (drawnRings.length === 3 ? "All three rings" : "All rings drawn") + "</span>" +
    '<span class="cv">' + esc(fmtValue(placed)) + "</span>" +
    '<span class="cp">' + esc(placed > 0 ? "100 %" : "—") + "</span></div></div>";

  return {
    /* The bands of the rolling strip beneath the row: the same
     * categories, in the same classes, covering the same three
     * directions the three rings cover between them. */
    strip: { mode: "directions", cats: cats.filter(function (c) { return c.members; })
      .map(function (c) { return { label: c.label, cls: c.cls, members: c.members }; }) },
    html: ringsHtml + weightHtml +
      '<div class="comp-legend comp-legend-split">' + legend + "</div>" + totalRow
  };
}

/* One block per person, aggregating that person's machines: what they are
 * consuming now, what they are reaching, and the machines themselves
 * inside the block rather than as cards of their own. The clients nobody
 * has claimed keep their own block: ownership is assigned by hand, an
 * unowned client is the normal state, and a per-person view that dropped
 * them would under-report the network. */
RENDER.owner_activity = function (w) {
  var perOwner = w.parameters.clients_per_card || 4;
  var perDest = w.parameters.destinations_per_owner || 3;
  var sortBy = w.parameters.sort || "volume";
  var rateOf = function (g) {
    return sum(g.clients, function (c) { return LIVE.bps[c.key] || 0; });
  };
  /* An owners list restricts the card to those people. The unassigned
   * block is not one of them: it is the bucket with a NULL owner_id and
   * no display_name to reference, so a scoped card drops it and the
   * header chip says the card is scoped. */
  var ownerScope = scopedOwnerKeys(w);
  var rows = AGG.owners.slice()
    .filter(function (g) { return !ownerScope || ownerScope.indexOf(g.key) >= 0; })
    .sort(function (x, y) {
    /* The unassigned block is last, always: it is a group, not a ranking
     * position, and it must not move under the reader. */
    if (x.unassigned !== y.unassigned) { return x.unassigned ? 1 : -1; }
    if (sortBy === "name") { return x.name < y.name ? -1 : 1; }
    if (sortBy === "bytes") { return y.bytes - x.bytes; }
    return rateOf(y) - rateOf(x);
  });

  var open = detailOpenKey("owner", w.id);
  var html = '<div class="owners">';
  rows.forEach(function (g) {
    var rate = rateOf(g);
    var shown = g.clients.slice(0, perOwner);
    var rest = g.clients.length - shown.length;
    /* Opening a person is a click on the person, the way opening a
     * matrix cell is a click on the cell. The detail opens over the
     * canvas and is drawn from the same aggregate, so it keeps moving
     * with the page. */
    html += '<div class="owner' + (g.unassigned ? " owner-unassigned" : "") +
      (open === g.key ? " is-open" : "") + '" data-owner="' + esc(g.key) +
      '" data-owner-widget="' + esc(w.id) + '" role="button" tabindex="0" ' +
      'aria-expanded="' + (open === g.key) + '">';
    html += '<div class="owner-head"><span class="owner-name">' + esc(g.name) + "</span>" +
      '<span class="badge">' + fmtInt(g.clients.length) + (g.clients.length === 1 ? " client" : " clients") + "</span>" +
      (g.unassigned ? '<span class="badge">no owner assigned</span>' : "") +
      (g.blocked > 0 ? '<span class="badge badge-blocked">' + fmtInt(g.blocked) + " blocked</span>" : "") +
      '<span class="owner-rate">' + esc(fmtBits(rate)) + "</span></div>";

    html += '<div class="owner-line"><span class="line-label">Clients</span><span class="chips">';
    shown.forEach(function (c) {
      /* A client that sent nothing across the firewall in the period
       * carries the condition, not a zero. An address and a MAC are how
       * a client is identified, so both are on the chip and not only in
       * a tooltip. */
      var silent = c.flows === 0 && c.bytes === 0;
      var rateWords = silent ? "no data in the period" : fmtBits(LIVE.bps[c.key] || 0);
      /* The whole of the chip is in its title as well, so that a width
       * narrow enough to clip one still hands the reader the address,
       * the MAC and the rate. */
      html += '<span class="chip" title="' + esc(c.key + " — " + c.addr + " · " + c.mac + " — " + rateWords) + '">' +
        esc(c.key) +
        '<span class="chip-id mono">' + esc(c.addr) + " · " + esc(c.mac) + "</span>" +
        '<span class="chip-value">' + esc(rateWords) + "</span></span>";
    });
    if (rest > 0) {
      html += '<span class="chip chip-more">+' + fmtInt(rest) + " more</span>";
    }
    html += "</span></div>";

    html += '<div class="owner-line"><span class="line-label">Reaching</span><span class="chips">';
    if (g.reached.length === 0) {
      html += '<span class="chip chip-more">no data in the period</span>';
    } else {
      g.reached.slice(0, perDest).forEach(function (d) {
        html += '<span class="chip chip-site" title="' + esc(d.name) + '">' + esc(d.name) +
          '<span class="chip-value">' + esc(fmtBytes(d.bytes)) + "</span></span>";
      });
      if (g.reached.length > perDest) {
        html += '<span class="chip chip-more">+' + fmtInt(g.reached.length - perDest) + " more</span>";
      }
    }
    html += "</span></div></div>";
  });
  html += "</div>";
  return {
    body: html,
    meta: scopeMeta(ownerScope && rows.map(function (g) { return g.name; }))
  };
};

/* The person, opened. Data, not prose, and the same register as the
 * matrix-cell and map-mark details: their interfaces, every client as a
 * row carrying hostname, MAC, address, interface, current rate and the
 * period total, their destinations with a volume each, and the count of
 * their connections the firewall refused. Returns null when the person
 * is gone, so that an open detail closes rather than inventing rows. */
function ownerDetail(ownerKey) {
  var out = [];
  var g = null, i;
  for (i = 0; i < AGG.owners.length; i++) {
    if (AGG.owners[i].key === ownerKey) { g = AGG.owners[i]; }
  }
  if (g === null) { return null; }
  var rate = sum(g.clients, function (c) { return LIVE.bps[c.key] || 0; });
  out.push('<div class="popup"><dl>' +
    "<dt>Now</dt><dd>" + esc(fmtBits(rate)) + "</dd>" +
    "<dt>Period total</dt><dd>" + fmtBytes(g.bytes) + "</dd>" +
    "<dt>Connections</dt><dd>" + fmtInt(g.flows) + "</dd>" +
    "<dt>Blocked</dt><dd>" + fmtInt(g.blocked) + "</dd>" +
    "<dt>Interfaces</dt><dd>" + esc(g.interfaces.map(interfaceLabel).join(", ")) + "</dd></dl></div>");

  out.push('<table class="data"><thead><tr><th>Client</th><th class="num">Now</th><th class="num">Period</th></tr></thead><tbody>');
  g.clients.forEach(function (c) {
    var silent = c.flows === 0 && c.bytes === 0;
    out.push("<tr><td>" + esc(c.key) +
      '<div class="muted mono" style="font-size:0.625rem">' + esc(c.mac) + " · " + esc(c.addr) +
      " · " + esc(interfaceLabel(c.iface)) + "</div></td>" +
      '<td class="num">' + (silent ? '<span class="muted">—</span>' : esc(fmtBits(LIVE.bps[c.key] || 0))) + "</td>" +
      '<td class="num">' + (silent ? '<span class="muted">no data</span>' : fmtBytes(c.bytes)) + "</td></tr>");
  });
  out.push("</tbody></table>");

  out.push('<table class="data"><thead><tr><th>Destination</th><th class="num">Bytes</th></tr></thead><tbody>');
  if (g.reached.length === 0) {
    out.push('<tr><td colspan="2"><span class="muted">no destination in the period</span></td></tr>');
  } else {
    g.reached.slice(0, 6).forEach(function (d) {
      out.push("<tr><td>" + esc(d.name) +
        (d.named ? "" : ' <span class="badge">operator, no site name</span>') + "</td>" +
        '<td class="num">' + fmtBytes(d.bytes) + "</td></tr>");
    });
    if (g.reached.length > 6) {
      out.push('<tr><td>The other ' + (g.reached.length - 6) + " destinations</td>" +
        '<td class="num">' + fmtBytes(sum(g.reached.slice(6), function (d) { return d.bytes; })) + "</td></tr>");
    }
  }
  out.push("</tbody></table>");
  return { title: g.name, body: out.join("") };
}

/* A RING SLICE, OPENED. The category, its measured value in the card's
 * own unit, its share of the ring it was picked in, and — where the
 * page can answer it from the same aggregate — what the category is
 * made of: the tail a collapsed Other slice stands for, or the same
 * category's value in each of the three direction rings. Nothing here
 * is a figure the model cannot produce; a slice with nothing behind it
 * gets the first three rows and no third block.
 *
 * Returns null when the ring no longer draws that category, so an open
 * drill-down closes rather than freezing the last figures it saw. */
function sliceDetail(ring, label) {
  var d = SLICE_DETAIL[sliceKey(ring, label)];
  if (!d) { return null; }
  var out = ['<div class="popup"><dl>' +
    "<dt>" + esc(d.measure === "packets" ? "Packets" : "Now") + "</dt><dd>" + esc(d.valueText) + "</dd>" +
    "<dt>Share of this ring</dt><dd>" + esc(d.shareText) + "</dd>" +
    "<dt>" + esc(d.ringLabel ? d.ringLabel + " ring, all categories" : "This ring, all categories") +
    "</dt><dd>" + esc(d.totalText) + "</dd></dl></div>"];
  if (d.parts.length) {
    out.push('<table class="data"><thead><tr><th>' + esc(d.partsHead) +
      "</th><th class=\"num\">" + esc(d.measure === "packets" ? "Packets" : "Now") + "</th></tr></thead><tbody>");
    d.parts.forEach(function (p) {
      out.push("<tr><td>" + esc(p.label) + '</td><td class="num">' + esc(p.valueText) + "</td></tr>");
    });
    out.push("</tbody></table>");
  }
  return { title: d.ringLabel ? d.label + " — " + d.ringLabel : d.label, body: out.join("") };
}

/* A destination mark, opened: where it is, who announces it, and what
 * crossed the firewall to and from it in the period. Returns null when
 * the mark has gone from the aggregate. */
function peerDetail(peerKey) {
  var p = PEER[peerKey];
  var all = AGG.peerTotals.filter(function (x) { return x.peer === peerKey; })[0];
  if (!p || !all) { return null; }
  return {
    title: p.op,
    body: '<div class="popup"><dl>' +
      '<dt>Address</dt><dd class="mono">' + esc(p.addr) + "</dd>" +
      "<dt>Country</dt><dd>" + esc(p.country + " (" + p.cc + ")") + "</dd>" +
      /* No city row: geo_asn has country_code, country_name, latitude,
       * longitude, asn and operator, and no city column at all. */
      "<dt>Coordinates</dt><dd class=\"mono\">" + esc(p.lat.toFixed(2) + ", " + p.lon.toFixed(2)) + "</dd>" +
      "<dt>AS</dt><dd>AS" + p.asn + "</dd>" +
      "<dt>Bytes</dt><dd>" + fmtBytes(all.bytes) + "</dd>" +
      "<dt>Allowed</dt><dd>" + fmtInt(all.allowed) + "</dd>" +
      "<dt>Blocked</dt><dd>" + fmtInt(all.blocked) + "</dd>" +
      "<dt>Engine</dt><dd>" + (all.blocked > 0 ? "firewall rule" : "not blocked") + "</dd>" +
      "<dt>Interfaces</dt><dd>" + esc(all.interfaces.map(interfaceLabel).join(", ")) + "</dd></dl></div>"
  };
}

/* THE PERIOD'S TOTALS LEAD, AND THE INSTANT'S RATES ARE NOT HERE.
 *
 * This card carried OPNsense's own "Rate In" / "Rate Out" pair above the
 * chart, on the grounds that a reader of that dashboard finds the same
 * two numbers under the same names. The card beside it on this band is
 * "Traffic composition, now", whose three rings are the composition of
 * those same three rates and print them in their holes — so one band of
 * the canvas printed the same three figures twice, a hand's width apart,
 * and then the same three period volumes twice underneath them.
 *
 * The split is by subject. The composition card's subject is the
 * instant, so it keeps the rates. This card's subject is the period, so
 * it keeps the totals — which is also what docs/widget-catalogue.md
 * requires of it: "the numbers brought forward as totals above the
 * chart". The four totals are the same three scopes summed over the
 * period the chart plots, so the figures and the chart cannot disagree.
 * The sparkline of the last minute goes with the rates it belonged to. */
RENDER.traffic_over_time_by_scope = function (w) {
  var out = AGG.nsBytes, inn = AGG.inboundBytes, ew = AGG.ewBytes;
  var buckets = bucketsFor(widgetPeriod(w), AGG.ifaceScope ? AGG : null);
  var series = [
    { label: "Outbound", cls: 1, values: buckets.out },
    { label: "Inbound", cls: 2, values: buckets.inb },
    { label: "Between interfaces", cls: 3, values: buckets.ew }
  ];
  var chart = stackedAreaChart("ts-" + w.id, bucketLabels(widgetPeriod(w)), series, 170,
    fmtBytes, lineMode(w));
  /* ONE WORD PER SERIES, IN ONE ORDER, THREE TIMES OVER.
   *
   * The tiles ran IN / OUT / BETWEEN while the legend ran Outbound /
   * Inbound / Inter-interface, so the same band was called two things
   * and the reader who matched them by colour then found the order
   * swapped. The names are now the legend's, the order is the stacking
   * order, and the stacking order is the order of the catalogue's own
   * question — "left the network, entered it, and stayed between
   * interfaces" — which is verbatim copy and cannot be reworded.
   * "Inter-interface" is gone from this card for the same reason: the
   * question says "between interfaces".
   *
   * Each series tile also carries its band's colour, so a headline
   * figure and the line it summarises are tied without the reader
   * counting bands. The fourth tile is a total of all three and gets no
   * swatch, because no single band is that number. */
  var tileSw = function (cls) { return '<span class="swatch swatch-tile sw-' + cls + '"></span>'; };
  var html = '<div class="figures figures-lead">' +
    '<div class="figure"><span class="figure-value">' + fmtBytes(out) + '</span><span class="figure-label">' + tileSw(1) + 'Outbound, ' + esc(AGG.periodLabel) + '</span></div>' +
    '<div class="figure"><span class="figure-value">' + fmtBytes(inn) + '</span><span class="figure-label">' + tileSw(2) + 'Inbound, ' + esc(AGG.periodLabel) + '</span></div>' +
    '<div class="figure"><span class="figure-value">' + fmtBytes(ew) + '</span><span class="figure-label">' + tileSw(3) + 'Between interfaces</span></div>' +
    '<div class="figure"><span class="figure-value">' + fmtBytes(out + inn + ew) + '</span><span class="figure-label">All scopes</span></div>' +
    "</div>" +
    '<div class="chart-wrap" data-stacked-chart="' + w.id + '">' + chart.html +
      '<div class="chart-tooltip" id="tt-' + w.id + '" hidden></div></div>' +
    '<div class="legend">' +
      '<span class="legend-item"><span class="swatch sw-1"></span>Outbound, bytes</span>' +
      '<span class="legend-item"><span class="swatch sw-2"></span>Inbound, bytes</span>' +
      '<span class="legend-item"><span class="swatch sw-3"></span>Between interfaces, bytes</span>' +
    "</div>";
  return { body: html, meta: withScope(w, null) };
};

/* Under each interface label sit the two things the firewall actually
 * returns for it and the schema actually stores: the configuration
 * identifier and the network device. Its addressing is NOT among them —
 * see the INTERFACES comment and gap G13 — so no CIDR is drawn here. */
/* THE CAVEAT LEADS, AND THE WHOLE LINE IS IN A TITLE.
 * This sub-line ends in an ellipsis whenever the card is narrow, and
 * what fell off the end was the chip saying "1 rule does not log" —
 * on exactly the two rows whose blocked count is 0. So the two rows
 * reading "0 blocked connections" were the two that lost the sentence
 * saying that zero is understated. The chip goes first, where it cannot
 * be the thing that is cut, and the full line is carried in a title. */
function barSub(r, total, scope) {
  var caveat = r.silentRules.length
    ? r.silentRules.length + (r.silentRules.length === 1 ? " rule does not log" : " rules do not log")
    : null;
  var rest = (total > 0 ? fmtPercent(r.bytes / total, 1) +
               (scope ? " of the interfaces in scope · " : " of all interfaces · ") : "") +
             r.clientsSeen + " of " + r.clientsKnown + " clients seen · " +
             fmtInt(r.blocked) + " blocked connections";
  var plain = (caveat ? caveat + " · " : "") + rest +
    (caveat ? " · rules that do not log: " + r.silentRules.join(", ") : "");
  return '<div class="bar-sub" title="' + esc(plain) + '">' +
    (caveat ? '<span class="badge badge-gap" title="' + esc(r.silentRules.join(", ")) + '">' +
      esc(caveat) + "</span> " : "") +
    esc(rest) + "</div>";
}

RENDER.interface_volume_ranking = function (w) {
  var scope = scopedInterfaceKeys(w);
  var rows = AGG.interfaces.slice()
    .filter(function (r) { return !scope || scope.indexOf(r.key) >= 0; })
    .sort(function (a, b) { return b.bytes - a.bytes; });
  if (rows.length === 0) {
    return { body: statePanel("silent", "No interface in scope sent traffic across the firewall in this period.") };
  }
  var meta = scopeMeta(scope && rows.map(function (r) { return r.user_label; }));
  var max = rows[0].bytes || 1, total = sum(rows, function (r) { return r.bytes; });
  /* `limit` is "how many interfaces to show". What it cuts keeps its
   * own row above the total, so the total is still the total of the
   * rows above it. */
  var all = rows;
  rows = all.slice(0, w.parameters.limit || all.length);
  var rest = all.slice(rows.length);
  var html = "";
  rows.forEach(function (r) {
    var ewPct = r.bytes ? (r.ewBytes / max) * 100 : 0;
    var nsPct = r.bytes ? (r.nsBytes / max) * 100 : 0;
    html += '<div class="bar-row">' +
      '<span class="bar-label" title="' + esc(r.description + " · " + r.device) + '">' + esc(r.user_label) +
        " " + (r.vlan ? '<span class="vlan-tag">VLAN ' + esc(r.vlan) + "</span>"
                      : '<span class="vlan-tag">untagged</span>') +
        '<span class="bar-cidr">' + esc(r.identifier + " · " + r.device) + "</span></span>" +
      '<span class="bar-track">' +
        '<span class="bar-fill bar-fill-ew" style="width:' + ewPct.toFixed(2) + '%"></span>' +
        '<span class="bar-fill bar-fill-ns" style="width:' + nsPct.toFixed(2) + '%"></span>' +
      "</span>" +
      '<span class="bar-value">' + fmtBytes(r.bytes) + "</span>" +
      "</div>" +
      barSub(r, total, scope);
  });
  if (rest.length > 0) {
    html += '<div class="bar-row"><span class="bar-label">The other ' + rest.length +
      (rest.length === 1 ? " interface" : " interfaces") +
      '</span><span class="bar-track" style="border:none;background:none"></span>' +
      '<span class="bar-value">' + fmtBytes(sum(rest, function (r) { return r.bytes; })) + "</span></div>";
  }
  html += '<div class="bar-row is-total" style="border-top:var(--border-width-thick) solid var(--border-strong);margin-top:0.3rem;padding-top:0.3rem">' +
    '<span class="bar-label">' + (scope ? "Interfaces in scope" : "All interfaces") +
    '</span><span class="bar-track" style="border:none;background:none"></span><span class="bar-value">' + fmtBytes(total) + "</span></div>";
  html += '<div class="legend"><span class="legend-item"><span class="swatch sw-1"></span>Between interfaces</span>' +
          '<span class="legend-item"><span class="swatch sw-2"></span>In and out of the network</span></div>';
  return { body: html, meta: meta };
};

RENDER.client_volume_ranking = function (w) {
  /* docs/widget-catalogue.md, "Client volume ranking", declares
   * `interfaces` and no `clients`, so this ranking is narrowed by the
   * interfaces its clients sit in. */
  var ifaceScope = scopedInterfaceKeys(w);
  var rows = AGG.clients.slice()
    .filter(function (r) { return !ifaceScope || ifaceScope.indexOf(r.iface) >= 0; })
    .sort(function (a, b) { return b.bytes - a.bytes; });
  if (rows.length === 0) {
    return { body: statePanel("silent", "No client in scope sent traffic across the firewall in this period.") };
  }
  var clientMeta = scopeMeta(ifaceScope && ifaceScope.map(interfaceLabel));
  var limit = w.parameters.limit || 8;
  var shown = rows.slice(0, limit);
  var html = '<table class="data"><thead><tr><th>Client</th><th>Interface</th><th class="num">Bytes</th><th class="num">Blocked</th><th class="num">Destinations</th></tr></thead><tbody>';
  shown.forEach(function (r) {
    /* Both lines truncate on a narrow card, so both carry their whole
     * string in a title: at 1126 px this cell was rendering names as
     * `r…`, `C…` and `hi…` with no way to reach the rest. */
    html += '<tr><td title="' + esc(r.key + " — " + r.mac + " · " + r.addr) + '">' + esc(r.key) +
      (r.randomised ? ' <span class="badge">unstable identity</span>' : "") +
      '<div class="muted mono" style="font-size:0.625rem" title="' + esc(r.mac + " · " + r.addr) + '">' +
      esc(r.mac) + " · " + esc(r.addr) + "</div></td>" +
      "<td>" + esc(interfaceLabel(r.iface)) + "</td>" +
      '<td class="num">' + fmtBytes(r.bytes) + "</td>" +
      '<td class="num">' + fmtInt(r.blocked) + "</td>" +
      '<td class="num">' + fmtInt(r.destinations) + "</td></tr>";
  });
  var shownBytes = sum(shown, function (r) { return r.bytes; });
  var rest = rows.slice(limit);
  var restBytes = sum(rest, function (r) { return r.bytes; });
  /* THE REMAINDER ROW FILLS EVERY COLUMN THE FOOTER TOTALS.
   * Its blocked cell was blank while the footer stated the whole
   * network's blocked count, so the eight visible rows summed to 805
   * against a footer of 1,269 with nothing accounting for the
   * difference — in the column immediately beside the one that
   * reconciles exactly. Destinations is the one column with no total on
   * either row, and that is a fact about the measure rather than an
   * omission: the same destination can be reached by several clients,
   * so the counts are not additive. It says so rather than going
   * blank. */
  var restBlocked = sum(rest, function (r) { return r.blocked; });
  var noSum = '<td class="num muted">not additive</td>';
  if (rest.length > 0) {
    html += '<tr><td colspan="2">The other ' + rest.length + " clients</td>" +
      '<td class="num">' + fmtBytes(restBytes) + '</td>' +
      '<td class="num">' + fmtInt(restBlocked) + "</td>" + noSum + "</tr>";
  }
  html += '<tr class="is-total"><td colspan="2">' +
    (ifaceScope ? "Clients in scope" : "All " + rows.length + " clients") + "</td>" +
    '<td class="num">' + fmtBytes(shownBytes + restBytes) + "</td>" +
    /* Scoped or not, this is the blocked count of the rows above it and
     * never the network's, or the total would not be the table's. It is
     * now the sum of the eight rows plus the remainder row, both of
     * which are printed. */
    '<td class="num">' + fmtInt(sum(rows, function (r) { return r.blocked; })) + "</td>" + noSum + "</tr>";
  html += "</tbody></table>";
  return { body: html, meta: clientMeta };
};

/* THE SCOPE PARAMETERS ARE HONOURED, NOT MERELY OFFERED.
 * The entry declares `interfaces`, `clients` and `min_flows`; the form
 * carried `interfaces` and changed nothing, and `clients` was missing
 * altogether — five controls of six, one of them inert. Every figure
 * below, the attribution rate included, is derived from the same scoped
 * set, so a narrowed card still reconciles with itself; and a scoped
 * card says so in its header, because a narrowed total that does not
 * announce itself is a wrong total. */
RENDER.top_sites = function (w) {
  var limit = w.parameters.limit || 10;
  var minFlows = w.parameters.min_flows || 0;
  var ifaceScope = scopedInterfaceKeys(w), clientScope = scopedClientKeys(w);
  var scopeNames = (ifaceScope ? ifaceScope.map(interfaceLabel) : []).concat(clientScope || []);
  var nsRows = AGG.records.filter(function (r) {
    if (r.scope !== "north_south") { return false; }
    if (ifaceScope && ifaceScope.indexOf(interfaceOf(r.client)) < 0) { return false; }
    if (clientScope && clientScope.indexOf(r.client) < 0) { return false; }
    return true;
  });
  var nsFlows = sum(nsRows, function (r) { return r.flows; });
  /* COLLAPSE SUBDOMAINS — `group_by_registrable_domain`, which the form
   * offers and the renderer used to ignore, so the code view stated a
   * collapse the canvas did not perform.
   *
   * The registrable domain is the last label plus the one before it.
   * That is right for every suffix in this page's invented data and it
   * is NOT a general rule: `example.co.uk` registers at the third label
   * from the right, and only the Public Suffix List knows where. The
   * product resolves this against that list; a mockup that shipped the
   * list would be shipping a third-party data file into a page whose
   * whole point is that it loads nothing, so the heuristic stands here
   * and is named as one. */
  var registrableDomain = function (host) {
    var parts = host.split(".");
    return parts.length <= 2 ? host : parts.slice(parts.length - 2).join(".");
  };
  var collapse = w.parameters.group_by_registrable_domain === true;
  var named = {};
  nsRows.filter(function (r) { return r.site !== null; }).forEach(function (r) {
    var key = collapse ? registrableDomain(r.site) : r.site;
    if (!named[key]) {
      named[key] = { site: key, flows: 0, bytes: 0, peer: r.peer, peerBytes: 0,
                     names: {}, byClient: {} };
    }
    var e = named[key];
    e.flows += r.flows;
    e.bytes += r.bytes;
    e.names[r.site] = true;
    e.byClient[r.client] = (e.byClient[r.client] || 0) + r.bytes;
    /* The operator column names the operator that carries most of the
     * row's volume, not whichever record happened to arrive first. */
    if (r.bytes > e.peerBytes) { e.peerBytes = r.bytes; e.peer = r.peer; }
  });
  var sites = Object.keys(named).map(function (n) {
    var e = named[n];
    var clientKeys = Object.keys(e.byClient).sort(function (a, b) {
      return e.byClient[b] - e.byClient[a];
    });
    return { site: e.site, flows: e.flows, bytes: e.bytes, peer: e.peer,
             collapsedFrom: Object.keys(e.names).length,
             clientKeys: clientKeys, byClient: e.byClient,
             clients: clientKeys.length };
  }).filter(function (e) { return e.flows >= minFlows; })
    .sort(function (a, b) { return b.bytes - a.bytes; });
  if (nsRows.length === 0) {
    return { body: statePanel("silent", "No outbound traffic in scope in this period."),
             meta: scopeMeta(scopeNames) };
  }
  var attributedFlows = sum(sites, function (e) { return e.flows; });
  var attributionRate = nsFlows ? attributedFlows / nsFlows : 0;
  var shown = sites.slice(0, limit);
  var restBytes = sum(sites.slice(limit), function (e) { return e.bytes; });
  var restFlows = sum(sites.slice(limit), function (e) { return e.flows; });
  var html = '<div class="figures"><div class="figure">' +
    '<span class="figure-value">' + fmtPercent(attributionRate) + "</span>" +
    '<span class="figure-label">' + (scopeNames.length ? "Attribution rate in scope" : "Network-wide attribution rate") + "</span></div>" +
    '<div class="figure"><span class="figure-value">' + fmtInt(attributedFlows) + " / " + fmtInt(nsFlows) + "</span>" +
    '<span class="figure-label">Named of outbound flows</span></div></div>';
  html += '<table class="data"><thead><tr><th>Site</th><th class="num">Flows</th><th class="num">Clients</th><th class="num">Bytes</th><th>Operator</th></tr></thead><tbody>';
  shown.forEach(function (s) {
    var p = PEER[s.peer];
    var operator = p.cc + " · AS" + p.asn + " " + p.op;
    /* EACH ROW EXPANDS TO THE CLIENTS BEHIND IT.
     * docs/widget-catalogue.md, "Top sites", "Shows", asks for it in
     * those words; a Clients count answers how many and not which. The
     * open rows are held in state, so the live tick that redraws this
     * card every two seconds does not close what the reader opened. */
    var openKey = w.id + "/" + s.site;
    var open = state.expandedRows[openKey] === true;
    var collapsedNote = s.collapsedFrom > 1
      ? " · " + s.collapsedFrom + " names collapsed into this domain" : "";
    html += '<tr><td title="' + esc(s.site + collapsedNote) + '">' +
      '<button class="row-expand" data-expand-row="' + esc(openKey) + '"' +
      ' aria-expanded="' + open + '" aria-label="' +
      esc((open ? "Hide" : "Show") + " the " + s.clients +
          (s.clients === 1 ? " client" : " clients") + " behind " + s.site) + '">' +
      (open ? "−" : "+") + "</button>" + esc(s.site) +
      (s.collapsedFrom > 1 ? ' <span class="badge">' + s.collapsedFrom + " names</span>" : "") +
      "</td>" +
      '<td class="num">' + fmtInt(s.flows) + "</td>" +
      '<td class="num">' + s.clients + "</td>" +
      '<td class="num">' + fmtBytes(s.bytes) + "</td>" +
      /* The operator name is the first thing this column loses on a
       * narrow card, so the whole of it is in the title. */
      '<td title="' + esc(operator) + '">' + esc(operator) + "</td></tr>";
    if (open) {
      s.clientKeys.forEach(function (ck) {
        var d = CLIENT[ck];
        html += '<tr class="is-child"><td>' +
