      var parts = key.split(":");
      var conns = Number(n.getAttribute("data-conns"));
      var blocked = Number(n.getAttribute("data-blocked"));
      /* BOTH FIGURES THE ENTRY ASKS FOR. The panel gave one — "Weight:
       * 21.5 GiB" — where docs/widget-catalogue.md requires each node's
       * rolled-up volume AND its connection count, with the blocked
       * share of that count named where there is one. */
      setPopup(wid, "node:" + key,
        '<div class="popup-title">' +
          esc(n.getAttribute("data-label") || parts.slice(1).join(":")) + "</div><dl>" +
        "<dt>Level</dt><dd>" + esc(parts[0]) + "</dd>" +
        "<dt>Volume</dt><dd>" + fmtBytes(Number(n.getAttribute("data-bytes"))) + "</dd>" +
        "<dt>Connections</dt><dd>" + fmtInt(conns) + "</dd>" +
        "<dt>Of which blocked</dt><dd>" + (blocked > 0 ? fmtInt(blocked) : "none") + "</dd></dl>");
    });
  });

  /* Matrix cells: the records behind a cell. */
  root.querySelectorAll("[data-cell]").forEach(function (c) {
    onActivate(c, function () {
      var key = c.getAttribute("data-cell"), parts = key.split(">");
      var cell = AGG.matrix[key];
      var card = c.closest(".card");
      if (!card) { return; }
      var ruleNames = Object.keys(cell.rules).map(function (rk) {
        return RULE[rk] ? RULE[rk].description : "rule no longer exists";
      });
      setPopup(card.getAttribute("data-widget-card"), "cell:" + key,
        '<div class="popup-title">' + esc(interfaceLabel(parts[0])) + " → " +
        esc(parts[1] === "__external__" ? "north-south" : interfaceLabel(parts[1])) + "</div><dl>" +
        "<dt>Bytes</dt><dd>" + fmtBytes(cell.bytes) + "</dd>" +
        "<dt>Allowed</dt><dd>" + fmtInt(cell.allowed) + "</dd>" +
        "<dt>Blocked</dt><dd>" + fmtInt(cell.blocked) + "</dd>" +
        "<dt>Rules matched</dt><dd>" + esc(ruleNames.length ? ruleNames.join("; ") : "none") + "</dd></dl>");
    });
  });

  /* The stacked chart's tooltip lists every series at the hovered
   * instant, not the top one only. */
  root.querySelectorAll("[data-stacked-chart]").forEach(function (wrap) {
    var wid = wrap.getAttribute("data-stacked-chart");
    var hit = document.getElementById("ts-" + wid + "-hit");
    var cursor = document.getElementById("ts-" + wid + "-cursor");
    var tip = document.getElementById("tt-" + wid);
    if (!hit) { return; }
    var chartWidget = findWidget(wid);
    var chartPeriod = widgetPeriod(chartWidget);
    var chartBuckets = bucketsFor(chartPeriod);
    var chartLabels = bucketLabels(chartPeriod);
    var out = chartBuckets.out, inn = chartBuckets.inb, ew = chartBuckets.ew;
    hit.addEventListener("mouseenter", function () { LIVE.paused = true; });
    hit.addEventListener("mousemove", function (ev) {
      var box = wrap.getBoundingClientRect();
      var svg = wrap.querySelector("svg").getBoundingClientRect();
      var rel = (ev.clientX - svg.left) / svg.width * CHART_W;
      var innerW = CHART_W - CHART_PADL - CHART_PADR;
      var i = Math.round((rel - CHART_PADL) / innerW * 23);
      if (i < 0) { i = 0; }
      if (i > 23) { i = 23; }
      var x = CHART_PADL + innerW * i / 23;
      cursor.setAttribute("x1", x); cursor.setAttribute("x2", x);
      cursor.style.display = "";
      tip.hidden = false;
      tip.style.left = Math.min(box.width - 190, Math.max(0, ev.clientX - box.left + 12)) + "px";
      tip.style.top = "8px";
      tip.innerHTML = '<div class="tt-head">' + esc(chartLabels[i]) + "</div>" +
        '<div class="tt-row"><span><span class="swatch sw-1"></span> Outbound</span><span>' + fmtBytes(out[i]) + "</span></div>" +
        '<div class="tt-row"><span><span class="swatch sw-2"></span> Inbound</span><span>' + fmtBytes(inn[i]) + "</span></div>" +
        '<div class="tt-row"><span><span class="swatch sw-3"></span> Between interfaces</span><span>' + fmtBytes(ew[i]) + "</span></div>" +
        '<div class="tt-row"><span>All scopes</span><span>' + fmtBytes(out[i] + inn[i] + ew[i]) + "</span></div>";
    });
    hit.addEventListener("mouseleave", function () {
      cursor.style.display = "none";
      tip.hidden = true;
      LIVE.paused = false;
    });
  });
}

/* A FORM EDIT REDRAWS THE CANVAS AND LEAVES THE PANEL ALONE.
 * Everything renderAll does except the two things that must not happen
 * under a reader holding a caret: the focus dance, and rebuilding the
 * configuration surface itself. */
function repaintCanvasOnly() {
  renderCanvas();
  applyPopups();
  renderDetail();
  applyGridLayout();
  fitFixedTables();
  fitCardHeaders();
  markSelection();
  enforceChartTextFloor();
  flagClippedCards();
  placeDetail();
}

/* `fromTick` is true only for the two-second live redraw. It is passed
 * down to the configuration surface, which must not be rebuilt under a
 * reader who is in the middle of using it: see renderConfig. */
/* ====================================================================
 * FOCUS SURVIVES THE REDRAW
 *
 * The tick replaces the whole canvas, and replacing a node that holds
 * the focus hands the focus back to <body>. Measured on a map mark and
 * on a card's gear, both focused, both gone after one tick: a keyboard
 * reader's tab position restarted from the top of the document twice
 * every five seconds, which made the roles, tab indexes and Enter
 * handlers on the marks, the matrix cells and the tree nodes correct in
 * markup and unreachable in practice.
 *
 * The same defect was fixed for the configuration surface by not
 * rebuilding it. The canvas cannot take that fix — it is live data —
 * so the focus is carried across the rebuild instead: the focused
 * element's position under its container, put back on the node that
 * lands in the same position, and only when it is the same kind of
 * element. A text selection goes with it.
 * ==================================================================== */

var FOCUS_ROOT_IDS = ["canvas-root", "detail-body"];

function captureFocus() {
  var el = document.activeElement;
  if (!el || el === document.body) { return null; }
  var i, root, node, path;
  for (i = 0; i < FOCUS_ROOT_IDS.length; i++) {
    root = document.getElementById(FOCUS_ROOT_IDS[i]);
    if (!root || root === el || !root.contains(el)) { continue; }
    path = [];
    node = el;
    while (node && node !== root && node.parentNode) {
      path.push(Array.prototype.indexOf.call(node.parentNode.children, node));
      node = node.parentNode;
    }
    if (node !== root) { return null; }
    path.reverse();
    return {
      rootId: FOCUS_ROOT_IDS[i], path: path, tag: el.tagName,
      start: typeof el.selectionStart === "number" ? el.selectionStart : null,
      end: typeof el.selectionEnd === "number" ? el.selectionEnd : null
    };
  }
  return null;
}

function restoreFocus(saved) {
  if (!saved) { return; }
  var root = document.getElementById(saved.rootId);
  if (!root) { return; }
  var node = root, i;
  for (i = 0; i < saved.path.length; i++) {
    node = node.children ? node.children[saved.path[i]] : null;
    if (!node) { return; }
  }
  /* Same position and same kind of element, or nothing: putting the
   * focus on whatever happens to sit there now would be worse than
   * losing it, because the reader would not know where he was. */
  if (node.tagName !== saved.tag || node === document.activeElement) { return; }
  if (typeof node.focus !== "function") { return; }
  node.focus({ preventScroll: true });
  if (saved.start !== null && typeof node.setSelectionRange === "function") {
    node.setSelectionRange(saved.start, saved.end);
  }
}

function renderAll(fromTick) {
  var focusAt = captureFocus();
  AGG = aggFor(canvasPeriod());
  /* Before the canvas, because the canvas is what draws the pending
   * card. Read off the form's own DOM, which the tick never rebuilds. */
  computePending();
  renderTabs();
  renderPeriodControl();
  /* The main area holds the canvas grid or the People page, never both.
   * Everything below this point measures cards, so a hidden grid is
   * skipped rather than measured at zero width. */
  var onPeople = state.view === "people";
  document.getElementById("canvas-root").hidden = onPeople;
  document.getElementById("people-view").hidden = !onPeople;
  document.querySelector(".period-control").hidden = onPeople;
  if (onPeople) {
    renderPeople();
    renderDetail();
    restoreFocus(focusAt);
    renderConfig(fromTick);
    document.getElementById("live-clock").textContent = liveClock();
    return;
  }
  renderCanvas();
  applyPopups();
  renderDetail();
  /* The column count is read off the canvas container, so it is applied
   * before anything measures a card. */
  applyGridLayout();
  /* Before the cut-off markers are measured: a table that has just been
   * allowed to shrink changes what fits. */
  fitFixedTables();
  fitCardHeaders();
  markSelection();
  /* Measured, not declared: the charts have been laid out by now, so
   * their real scale is knowable and a chart whose labels would render
   * below the floor drops them here. */
  enforceChartTextFloor();
  /* LAST, because everything above changes what fits: the tables have
   * been squeezed and the charts that drop their labels have swapped a
   * drawing for a block of words. Measuring before that flashed the
   * cut-off marker on for a frame on a card that was not cut off. */
  flagClippedCards();
  /* THE PANEL IS PLACED AFTER EVERYTHING THAT MOVES A MARK. It is
   * anchored to the mark it was opened from, and the grid, the squeezed
   * tables and the charts that drop their labels all settle after
   * renderDetail() has filled it — placing it there put it where the
   * mark had been one layout ago. */
  placeDetail();
  /* After the canvas and the drill-down have been rebuilt, and before
   * the configuration surface, which the tick does not touch. */
  restoreFocus(focusAt);
  renderConfig(fromTick);
  document.body.classList.toggle("is-editing", state.editing);
  /* Edit mode said so in `aria-pressed` and in nothing a reader could
   * see. The control now names the state it is in. */
  var editToggle = document.getElementById("edit-toggle");
  editToggle.setAttribute("aria-pressed", String(state.editing));
  editToggle.textContent = state.editing ? "Done editing layout" : "Edit layout";
  editToggle.classList.toggle("is-on", state.editing);
  document.getElementById("live-clock").textContent = liveClock();
}

/* The dashboard document and source availability, reachable from the
 * rail on a wide viewport and from the sheet on a narrow one. Both go
 * through these two functions so the two routes cannot drift. */
function docDockOpen() { return !document.getElementById("doc-dock").hidden; }

/* One way in, from the gear and from every Repair button: select the
 * widget, open the dock if it is closed, and show the tab asked for. */
function openWidgetInDock(id, tab) {
  var same = state.selectedWidget === id && state.dockTab === tab && docDockOpen();
  state.selectedWidget = id;
  state.dockTab = tab;
  state.dockDirty = false;
  state.dockMounted = null;
  if (same) { setDocDock(false); return; }
  if (!docDockOpen()) { setDocDock(true); }
  else { renderAll(); renderConfig(); }
}

/* The dock is a toggle, because it is a column of the page rather than
 * a dialog: pressing "Dashboard editor" again gives the canvas its width
 * back.
 * The two entry points — the rail and the narrow-viewport sheet — say
 * which state they are in. */
function setDocDock(open) {
  document.getElementById("doc-dock").hidden = !open;
  document.getElementById("rail-code").setAttribute("aria-pressed", String(open));
  document.getElementById("sheet-code").setAttribute("aria-pressed", String(open));
  if (open) {
    state.dockDirty = false;
    state.dockMounted = null;
    renderConfig();
  }
  /* The canvas is narrower or wider than it was, so the column count it
   * can pay for has changed with it, and with that every chart's
   * effective text size and every card's measured fit. */
  applyGridLayout();
  fitFixedTables();
  fitCardHeaders();
  enforceChartTextFloor();
  flagClippedCards();
  /* BELOW THE RAIL'S BREAKPOINT THE DOCK IS NOT BESIDE THE CANVAS, IT IS
   * UNDER IT — at a 900 px viewport it opened at y = 3190 with the page
   * still at the top, so pressing the control appeared to do nothing and
   * pressing it again closed it. It is brought into view when it opens
   * somewhere the reader is not looking. */
  if (open) {
    var dock = document.getElementById("doc-dock");
    var box = dock.getBoundingClientRect();
    if (box.top > window.innerHeight - 80 || box.bottom < 80) {
      dock.scrollIntoView({ block: "start" });
    }
  }
}
function openDocView() { setDocDock(!docDockOpen()); }

/* The docked document follows every change a PERSON made — a move, a
 * resize, an Apply, a repair, a canvas switch — and follows no tick. It
 * is a surface with a caret in it, and the live redraw must not take
 * that caret any more than it may take the canvas's focus. An
 * unapplied edit holds the pane as it is. */
function refreshDocDock() {
  if (!docDockOpen() || state.dockDirty) { return; }
  /* REBUILT, NOT LEFT ALONE. This is what a placement change goes
   * through, and the stale pane it used to leave behind is how the card
   * toolbar, the dock and the widget editor came to show three
   * different widths of one widget at the same moment. */
  state.dockMounted = null;
  renderConfig();
}
function openAvailability() {
  state.view = "canvas";
  state.canvas = 1;
  state.selectedWidget = "availability";
  renderAll();
  var card = document.querySelector('[data-widget-card="availability"]');
  if (card) { card.scrollIntoView({ block: "center" }); }
}
function closeRailSheet() {
  var b = document.getElementById("rail-backdrop");
  if (b) { b.hidden = true; }
  var t = document.getElementById("rail-toggle");
  if (t) { t.setAttribute("aria-expanded", "false"); }
}

function wireChrome() {
  document.addEventListener("click", function (ev) {
    var t = ev.target.closest("[data-canvas]");
    if (t) {
      /* A canvas tab is always a way back from the People page. */
      state.view = "canvas";
      state.canvas = Number(t.getAttribute("data-canvas"));
      state.selectedWidget = activeCanvas().widgets[0].id;
      state.dockMounted = null;
      closeRailSheet();
      renderAll();
      refreshDocDock();
      return;
    }
    var p = ev.target.closest("[data-pick]");
    if (p) { addWidget(p.getAttribute("data-pick")); }
  });

  /* The canvas range. It writes into the document and then redraws;
   * there is nowhere else the value lives. */
  document.getElementById("period-select").addEventListener("change", function (ev) {
    var c = activeCanvas();
    c.period = ev.target.value;
    renderAll();
    refreshDocDock();
  });

  var paletteSelect = document.getElementById("palette-select");
  paletteSelect.innerHTML = PALETTES.map(function (p) {
    return '<option value="' + p.key + '"' + (p.key === theme.palette ? " selected" : "") + ">" +
      esc(p.name) + "</option>";
  }).join("");
  paletteSelect.addEventListener("change", function () {
    theme.palette = paletteSelect.value;
    writeStore(STORE_PALETTE, theme.palette);
    applyTheme();
  });

  var modeSelect = document.getElementById("mode-select");
  modeSelect.value = theme.mode;
  modeSelect.addEventListener("change", function () {
    theme.mode = modeSelect.value;
    writeStore(STORE_MODE, theme.mode);
    applyTheme();
  });

  if (window.matchMedia) {
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    if (mq.addEventListener) { mq.addEventListener("change", applyTheme); }
    else if (mq.addListener) { mq.addListener(applyTheme); }
  }

  document.getElementById("edit-toggle").addEventListener("click", function () {
    state.editing = !state.editing;
    renderAll();
  });
  function dockTo(tab) {
    state.dockTab = tab;
    state.dockDirty = false;
    state.dockMounted = null;
    renderConfig();
  }
  document.getElementById("dock-tab-document").addEventListener("click", function () { dockTo("document"); });
  document.getElementById("dock-tab-widget").addEventListener("click", function () { dockTo("widget"); });
  document.getElementById("dock-tab-form").addEventListener("click", function () { dockTo("form"); });
  document.getElementById("syntax-yaml").addEventListener("click", function () {
    state.syntax = "yaml"; state.dockDirty = false; state.dockMounted = null; renderConfig();
  });
  document.getElementById("syntax-json").addEventListener("click", function () {
    state.syntax = "json"; state.dockDirty = false; state.dockMounted = null; renderConfig();
  });
  /* ONE APPLY. It commits the tab that is showing: the whole document,
   * this widget's own lines, or the form. */
  document.getElementById("dock-apply").addEventListener("click", function () {
    if (state.dockTab === "form") { applyForm(); return; }
    if (DOCK_APPLY) { DOCK_APPLY(); }
  });
  document.getElementById("dock-revert").addEventListener("click", function () {
    if (state.dockTab === "form") { return; }
    if (DOCK_REVERT) { DOCK_REVERT(); }
  });

  document.getElementById("rail-people").addEventListener("click", function () {
    setView(state.view === "people" ? "canvas" : "people");
  });
  document.getElementById("sheet-people").addEventListener("click", function () {
    setView("people");
    closeRailSheet();
  });
  document.getElementById("rail-code").addEventListener("click", openDocView);
  document.getElementById("sheet-code").addEventListener("click", function () {
    closeRailSheet(); setDocDock(true);
  });
  document.getElementById("sheet-availability").addEventListener("click", function () {
    closeRailSheet(); openAvailability();
  });
  document.getElementById("rail-toggle").addEventListener("click", function () {
    var b = document.getElementById("rail-backdrop");
    if (b.hidden) {
      b.hidden = false;
      document.getElementById("rail-toggle").setAttribute("aria-expanded", "true");
    } else { closeRailSheet(); }
  });
  document.getElementById("rail-sheet-close").addEventListener("click", closeRailSheet);
  document.getElementById("doc-close").addEventListener("click", function () {
    state.dockDirty = false;
    setDocDock(false);
  });
  document.getElementById("rail-availability").addEventListener("click", openAvailability);
  document.getElementById("picker-close").addEventListener("click", function () {
    document.getElementById("picker-backdrop").hidden = true;
  });

  /* Three ways out of a drill-down, and the fourth is clicking the same
   * person or mark again: the button, the ground around the panel, and
   * the Escape key. */
  document.getElementById("detail-close").addEventListener("click", closeDetail);
  /* The ground around the panel is now the live page, so the dismissal
   * is bound on the document rather than on a sheet of glass that no
   * longer exists. A click on another mark is not a dismissal: its own
   * handler has already opened that one, which is the whole point of a
   * panel that does not block the page. */
  document.addEventListener("click", function (ev) {
    if (!state.detail) { return; }
    var t = ev.target;
    if (t && typeof t.closest === "function" &&
        (t.closest(".detail-pop") || t.closest("[data-peer]") || t.closest("[data-owner]"))) { return; }
    closeDetail();
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape" && state.detail) { closeDetail(); }
  });

  /* A live view has to move. The cadence is deliberate: two seconds is
   * slow enough to read and fast enough to be obviously running. */
  window.setInterval(function () {
    if (drag) { return; }
    liveTick();
    if (LIVE.paused) {
      document.getElementById("live-clock").textContent = liveClock();
      return;
    }
    renderAll(true);
    /* The document pane is NOT redrawn here. It is a code surface, and
     * the tick rebuilding it would take the caret out of it exactly as
     * it used to take the caret out of the per-card one. It is redrawn
     * when it is opened, when the syntax is switched, and on Revert. */
  }, LIVE.tickMs);
}

applyTheme();
wireChrome();
wireDockGrip();
renderAll();
watchCanvasWidth();
</script>
</body>
</html>
