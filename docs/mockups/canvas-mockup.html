  border: var(--border-width) solid var(--border-color);
  border-radius: var(--border-radius);
  padding: 0.3rem 0.6rem; cursor: pointer;
}
.btn:hover { border-color: var(--accent); }
.btn-primary { background: var(--accent); border-color: var(--accent-hover); color: var(--on-accent); font-weight: var(--font-weight-bold); }
.btn-primary:hover { background: var(--accent-hover); }
.btn[aria-pressed="true"], .btn[aria-selected="true"], .btn[aria-checked="true"] { background: var(--accent); border-color: var(--accent-hover); color: var(--on-accent); }
.btn-small { padding: 0.1rem 0.35rem; font-size: 0.6875rem; }
.btn.is-on { border-color: var(--accent); }

/* Edit mode */
.edit-bar {
  display: none; gap: 0.2rem; flex-wrap: wrap; align-items: center;
  border: var(--border-width) dashed var(--accent);
  border-radius: var(--border-radius);
  padding: 0.2rem 0.3rem; background: var(--accent-soft);
}
body.is-editing .edit-bar { display: flex; }
.edit-bar .grip { font-size: 0.625rem; color: var(--text-primary); margin-right: 0.2rem; }
.slot { display: none; }
body.is-editing .slot {
  display: flex; align-items: center; justify-content: center;
  width: 100%; font-family: inherit;
  border: var(--border-width-thick) dashed var(--border-strong);
  border-radius: var(--border-radius);
  background: var(--bg-inset); color: var(--text-primary);
  cursor: pointer; font-size: 0.8125rem;
}
body.is-editing .slot:focus-visible {
  outline: var(--border-width-thick) solid var(--accent); outline-offset: 2px;
}
body.is-editing .slot:hover { border-color: var(--accent); color: var(--link); }

.picker-backdrop {
  position: fixed; inset: 0; z-index: 500;
  background: var(--shadow-color);
  display: flex; align-items: flex-start; justify-content: center; padding: var(--spacing-lg);
}
.picker {
  background: var(--bg-surface); border: var(--border-width) solid var(--border-strong);
  border-radius: var(--border-radius); width: min(42rem, 100%); max-height: 80vh;
  display: flex; flex-direction: column; padding: var(--spacing);
}
.picker-list { overflow: auto; }
.picker-item {
  display: block; width: 100%; text-align: left; cursor: pointer;
  background: var(--bg-inset); color: var(--text-primary);
  border: var(--border-width) solid var(--border-color);
  border-radius: var(--border-radius);
  padding: 0.4rem 0.5rem; margin-bottom: 0.3rem;
}
.picker-item:hover { border-color: var(--accent); }
.picker-item .pi-name { font-weight: var(--font-weight-bold); font-size: 0.8125rem; display: block; }
.picker-item .pi-type { font-family: var(--font-mono); font-size: 0.625rem; color: var(--text-secondary); }

/* Connection tree */
.tree-svg { width: 100%; height: auto; display: block; }
.tree-node { stroke: var(--border-strong); stroke-width: 1; }
/* OPAQUE, FOR THE REASON THE MAP MARKS ARE. A node is the widget's
   representation, not a wash behind one: at 0.7 the right-hand column
   measured 2.32:1 against the card in the industrial light palette.
   Nothing is drawn under a node that the translucency was letting
   through — the edges stop at the node's boundary — so the opacity was
   buying nothing and costing the contrast. */
.tree-node-left { fill: var(--series-1); }
.tree-node-right { fill: var(--series-2); }
.tree-node-root { fill: var(--accent); }
.tree-node.is-open { stroke: var(--text-primary); stroke-width: 2; }
/* The remainder child of a cut level: the same node, drawn hollow,
   because it is a real quantity that simply has no single name. */
.tree-node-remainder { fill: none; stroke-dasharray: 3 2; }
/* The blocked share of a node, drawn ON the node rather than filtered
   out of it: docs/widget-catalogue.md requires a branch that exists
   because something was refused to be visible as such. */
/* The share of a node's connections that were blocked, drawn as a cap
   at the end of the node. It is a mark on a mark, and the two hues are
   a palette's choice rather than a contrast anyone can guarantee:
   translucent over the node it measured 1.29:1, and opaque with a text
   hairline 2.30:1. What separates it is a gap — a hairline in the
   card's own background, which is the one colour on this drawing that
   every palette already fits its marks against. */
.tree-blocked-share { fill: var(--status-blocked); stroke: var(--bg-surface); stroke-width: 1; }
.sw-blocked { background: var(--status-blocked); }
/* Hollow, so its dashed edge is the whole of the mark and has to be
   read as one — `--border-strong` measured 2.07:1 on the industrial
   light card. Same remedy, and same reason, as .spark-placeholder. */
.sw-remainder { background: none; border-style: dashed; border-color: var(--text-muted); }
.tree-edge { stroke: var(--border-strong); fill: none; }
/* Same reason as .map-layout above: the docked panel beside the tree
   is a column of figures, and a narrow column of figures on a wide card
   is tall for no reason. */
.tree-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(12rem, 32%); gap: var(--spacing); }

/* Sankey */
/* Opaque, for the reason the tree nodes are: 0.85 measured 2.59:1
   against the card on the industrial dark palette, and nothing is drawn
   under a node for the translucency to reveal. */
.sankey-node { fill: var(--accent); stroke: var(--border-strong); stroke-width: 0.5; }
.sankey-ribbon { fill: var(--series-1); fill-opacity: 0.30; stroke: none; }
.sankey-ribbon-other { fill: var(--text-muted); fill-opacity: 0.35; }

/* Health tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(8rem, 1fr)); gap: var(--spacing-sm); }
.tile {
  border: var(--border-width) solid var(--border-color);
  border-radius: var(--border-radius); background: var(--bg-inset);
  padding: 0.4rem 0.5rem; display: flex; flex-direction: column; gap: 0.15rem;
}
.tile-label { font-size: 0.625rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-secondary); }
.tile-value { font-size: 1.125rem; font-weight: var(--font-weight-bold); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; min-width: 0; }
.tile-sub { font-size: 0.625rem; color: var(--text-secondary); }
.tile svg { width: 100%; height: auto; }
/* A tile whose metric the model cannot hold: the label and the footprint
   stay, the value is an explicit dash, and the sparkline is a greyed
   area rather than a drawn line. */
.tile-value-empty { color: var(--text-secondary); }
svg.spark { max-width: 100%; height: auto; display: inline-block; vertical-align: middle; }
.spark-placeholder {
  display: block; height: 18px; margin: 0.15rem 0;
  /* The dashed edge is the whole of this shape — the body is the card's
     own raised ground — so the edge is drawn in a token fitted to be
     read. `--border-strong` measured 1:1 against the ground it encloses
     on the industrial light palette, which is to say it was the ground. */
  border: var(--border-width) dashed var(--text-muted);
  border-radius: var(--border-radius);
  background: var(--bg-raised);
}

/* Truncation is never silent. Wherever a list, a table or a row of
   chips stops short of what it holds, it says so on the spot, the way
   "+8 more" and "Other (10)" already do. */
.clip-note {
  font-size: 0.625rem; color: var(--text-secondary);
  border-top: var(--border-width) dashed var(--border-color);
  padding-top: 0.2rem; margin-top: 0.2rem;
}
/* No card scrolls, so a card that cannot fit its content says so on
   itself rather than hiding the remainder in silence. Measured after
   every render; pinned to the card so that showing it cannot itself
   change what fits. */
/* It lives in the header chip row, where there is always space, rather
   than pinned over the content it is describing. It is not a status
   colour: it says nothing about the data, only that this footprint
   cannot hold what the card drew. */
/* Its own ground is --bg-raised, and at 390 px it is the only string on
   the page still drawn on one, so it takes the page's own ink. It is
   also the smallest type here and the copy that matters most exactly
   where it appears. */
.clip-flag {
  flex: 0 0 auto;
  font-size: 0.5625rem; text-transform: uppercase; letter-spacing: 0.05em;
  background: var(--bg-raised); color: var(--text-primary);
  border: var(--border-width) dashed var(--border-strong);
  border-radius: var(--border-radius);
  padding: 0.05rem 0.35rem; white-space: nowrap;
}

/* ------------------------------------------------------------------ *
 * NARROW VIEWPORTS
 *
 * Three designed steps rather than one reflow, because 1100 down to 320
 * is not one layout. docs/dashboard-format.md, "Placement", asks that a
 * narrow viewport render every widget full width in y order and that the
 * narrow arrangement never be written back to placement: the grid
 * columns below are a rendering override and nothing here touches the
 * document.
 *
 * The rule the breakpoints serve: a label either reads or says it was
 * cut. Nothing collapses to a width at which ellipsis prints nothing.
 * ------------------------------------------------------------------ */

/* Under 1100 px the rail is gone, so its two tools move into the header
   behind one control and open as a sheet. No view is reachable through
   nothing. */
/* THE RAIL COSTS THE CANVAS THIRTEEN REM, so it is the first thing to
   go when the canvas is what is short. It used to leave at 1100 px,
   which put the layout in an inversion nobody could explain: at a 1099
   px window the rail was gone and the canvas could pay for a
   twelve-column grid, and at 1101 px the rail came back, took 208 px,
   and the canvas dropped to one column — widening the window made the
   layout coarser. It leaves at 1320 px instead, which is the width at
   which the canvas behind it can still pay for its columns. Its two
   tools and the canvas list come back in the header behind one control
   and open as a sheet, so no view is reachable through nothing. */
@media (max-width: 1320px) {
  .rail { display: none; }
  #rail-toggle { display: inline-flex; }
}

@media (max-width: 1100px) {
  /* The full-width reflow that used to live here is keyed to the canvas
     container's width now, in applyGridLayout() and in .grid.cols-1,
     because the dock produces a narrow canvas at wide window sizes and
     a window-keyed rule never saw it. What stays here is the chrome,
     which genuinely is a function of the window. */
  .map-layout, .tree-layout { grid-template-columns: minmax(0, 1fr); }
  /* There is no "beside" left at this width, so the dock becomes the
     row under the canvas rather than an overlay on top of it: it is
     still docked, and it still leaves the rendering visible. */
  .app-body { flex-wrap: wrap; }
  .doc-dock {
    flex: 1 1 100%; width: 100%; position: static; max-height: 60vh;
    border-left: none; border-top: var(--border-width) solid var(--border-color);
  }
}

/* Tablet portrait and below: the densest grids give up their fixed
   side columns before their labels give up their characters. */
@media (max-width: 860px) {
  .comp { grid-template-columns: minmax(0, 1fr); justify-items: center; }
  .comp-legend { width: 100%; }
  /* A narrow card is as tall as its content, so vertical room is not
     what is scarce here: a direction's name wraps onto a second line
     rather than being cut to fit a 104 px ring. */
  .comp-ring-label { white-space: normal; }
  .matrix { font-size: 0.5625rem; }
  .matrix th, .matrix td { padding: 0.15rem 0.2rem; }
  table.data th, table.data td { max-width: none; padding: 0.22rem 0.3rem; }
  table.data th.num, table.data td.num { width: 4.25rem; }
  /* The fixed side column goes, and its content comes back as a second
     line in the cell beside it, rather than being squeezed to 35 px. */
  .cell-reached { display: none; }
  .second-line { display: block; }
}

/* Phone. The header becomes two rows — identity and liveness on the
   first, palette, mode and edit on the second — the canvas tabs scroll
   sideways instead of wrapping into a block, and every grid that would
   squeeze a name to nothing hands the name a whole line instead. */
@media (max-width: 600px) {
  .app-header { align-items: stretch; }
  .header-row { flex: 1 1 100%; }
  .header-row-identity { justify-content: space-between; }
  .header-controls { justify-content: flex-start; }
  .control-group > label { display: none; }

  .tabs { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 0.2rem; }
  .tab { flex: 0 0 auto; }

  .main { padding: var(--spacing-sm) var(--spacing-sm) var(--spacing-lg); }
  .grid { gap: var(--spacing-sm); }
  .card { padding: var(--spacing-sm); }

  /* At phone width the header is two rows by construction: the title
     on the first, whole, and the chips on the second, whole. Capping
     the chip here is what cut the unit off the end of it. */
  .card-title { flex: 1 1 100%; min-width: 0; }

  /* Label and value on the first line, the bar across the second, so a
     name has the whole card width to be read in. */
  .bar-row { grid-template-columns: minmax(0, 1fr) auto; gap: 0.3rem 0.5rem; }
  .bar-label { grid-column: 1; grid-row: 1; }
  .bar-value { grid-column: 2; grid-row: 1; }
  .bar-track { grid-column: 1 / -1; grid-row: 2; }

  /* The ranked legend keeps its name column above a readable floor and
     surrenders the width of its two numeric columns instead. */
  .comp-row { grid-template-columns: 0.7rem minmax(4.5rem, 1fr) 4.75rem 2.6rem; gap: 0.3rem; }

  /* The label goes above its chips rather than beside them: five rem of
     a 360 px card is five rem the chips do not have. They wrap at every
     width already. */
  .owner-line { flex-direction: column; align-items: stretch; gap: 0.1rem; }
  .line-label { width: auto; flex: 0 0 auto; }
  /* The person's name keeps a readable floor and the badges wrap under
     it, instead of the name being squeezed to nothing. */
  .owner-head { flex-wrap: wrap; }
  .owner-name { flex: 1 1 auto; min-width: 6rem; }

  .feed li { grid-template-columns: 3.2rem minmax(0, 1fr) 4.75rem; gap: 0.1rem 0.4rem; }
  .feed .time { grid-column: 1; grid-row: 1; }
  .feed .what { grid-column: 2; grid-row: 1; }
  .feed .num  { grid-column: 3; grid-row: 1; }
  .feed .engine { grid-column: 1 / -1; grid-row: 2; }
  /* The engine moves to a line of its own in the rows, so its name
     moves out of the header rather than standing over the target
     column. The three remaining names stay over their values. */
  .feed-head { grid-template-columns: 3.2rem minmax(0, 1fr) 4.75rem; gap: 0.4rem; }
  .feed-head .engine { display: none; }

  .picker-backdrop { padding: var(--spacing-sm); }

  /* On a phone the detail comes up from the bottom edge, across the
     whole width, so that it is reachable with a thumb and readable at
     360 CSS px rather than anchored to a mark a few pixels wide. The
     placement properties are simply not read here. */
  .detail-pop {
    position: fixed; left: 0; right: 0; bottom: 0; top: auto;
    width: auto; max-height: 88vh;
    border-left: none; border-right: none; border-bottom: none;
    border-radius: var(--border-radius) var(--border-radius) 0 0;
  }
}
</style>
</head>
<body>
<!-- Two header rows by construction, so that a narrow viewport gets a
     designed break rather than a wrap that lands wherever it lands:
     identity and liveness on one, the controls on the other. -->
<header class="app-header">
  <div class="header-row header-row-identity">
    <div class="brand">
      <span class="brand-name">opnview</span>
      <span class="brand-sub" id="brand-sub">workshop firewall</span>
    </div>
    <span class="live-pill" id="live-pill"><span class="live-dot"></span><span id="live-clock"></span></span>
  </div>
  <div class="header-row header-controls">
    <!-- The rail is not shown on a narrow viewport, so its two tools
         come back behind this one control rather than disappearing. -->
    <button class="btn" id="rail-toggle" aria-haspopup="dialog" aria-expanded="false">Canvases and tools</button>
    <div class="control-group">
      <label for="palette-select">Palette</label>
      <select id="palette-select" class="btn"></select>
    </div>
    <div class="control-group">
      <label for="mode-select">Mode</label>
      <select id="mode-select" class="btn">
        <option value="system">Follow the system</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </div>
    <button class="btn" id="edit-toggle" aria-pressed="false">Edit layout</button>
  </div>
</header>
<div class="app-body">
  <nav class="rail" aria-label="Canvases and tools">
    <div>
      <div class="rail-section-title">Canvases</div>
      <div id="rail-canvases"></div>
    </div>
    <div>
      <div class="rail-section-title">Dashboard</div>
      <button class="rail-link" id="rail-code">Dashboard editor</button>
      <button class="rail-link" id="rail-availability">Sources</button>
    </div>
    <!-- WHERE OWNERSHIP IS ASSIGNED. `client.owner_id` and
         `client.owner_assigned_at` exist in migrations/0001_core.sql and
         nothing on this page could write them: the per-person widget
         read an assignment nobody could make.
         It is not a canvas and not a widget. A canvas is composed of
         catalogue widgets and travels between installations in a
         dashboard file; an owner is this installation's own state, and
         a control that writes it would make a portable document carry
         local configuration and would come and go with the canvas
         somebody had placed it on. It is a tool beside the two tools
         that already sit here, one click from the rail and one from the
         sheet, taking the main area's width because it is a table of
         every client. -->
    <div>
      <div class="rail-section-title">Installation</div>
      <button class="rail-link" id="rail-people">People</button>
    </div>
  </nav>
  <main class="main">
    <div class="canvas-bar">
      <div class="tabs" id="canvas-tabs" role="tablist" aria-label="Canvases"></div>
      <!-- The canvas's period. Every widget inherits it unless it carries
           a period of its own, and the value is written into the canvas
           in the dashboard document like every other setting. -->
      <div class="period-control">
        <label for="period-select">Range</label>
        <select id="period-select" class="btn"></select>
      </div>
    </div>
    <div class="grid" id="canvas-root"></div>
    <section class="people-view" id="people-view" hidden aria-label="People"></section>
  </main>
  <!-- ONE EDITING SURFACE, THREE TABS, ONE APPLY.
       There used to be two: this dock, carrying the whole document, and
       a floating popover carrying one widget's form and one widget's
       code, each with its own syntax toggle and its own Apply. At a
       wide viewport the popover rendered over the dock and hid it, two
       Apply buttons were on screen at once, and the widget's own code
       pane never refreshed on a placement change — so the card toolbar,
       the dock and the popover could show three different widths of the
       same widget at the same moment. The spec's decision 3 asked for a
       side panel with the two editing surfaces AS TABS WITHIN IT, and
       this is that panel. It is a column of the body rather than a
       modal, because a modal hides exactly the thing the edit is aimed
       at. -->
  <aside class="doc-dock" id="doc-dock" hidden aria-label="Dashboard editor">
    <button class="dock-grip" id="dock-grip" type="button"
            aria-label="Widen or narrow the dashboard editor"></button>
    <div class="panel-head">
      <h2 class="panel-title">Dashboard editor</h2>
      <button class="btn btn-small" id="doc-close">Close</button>
    </div>
    <!-- TWO SELECTIONS, TWO CONTROLS. This row rendered as five
         identical pills with two of them carrying aria-selected="true"
         at the same time, no tablist and no boundary — so neither a
         sighted reader nor a screen reader could tell that YAML and
         JSON are a sub-mode of the two code tabs rather than a fourth
         and fifth tab. The three tabs are a tablist; the syntax is a
         named radio group of its own, set off by a rule. -->
    <div class="panel-tabs">
      <div class="panel-tabs" role="tablist" aria-label="Editing surface">
        <button class="btn btn-small" role="tab" id="dock-tab-document" aria-selected="true">Document</button>
        <button class="btn btn-small" role="tab" id="dock-tab-widget" aria-selected="false">This widget</button>
        <button class="btn btn-small" role="tab" id="dock-tab-form" aria-selected="false">Form</button>
      </div>
      <span class="panel-subtabs" id="syntax-tabs" role="radiogroup" aria-label="Syntax">
        <span class="panel-subtabs-label" id="syntax-label">Syntax</span>
        <button class="btn btn-small" role="radio" id="syntax-yaml" aria-checked="true">YAML</button>
        <button class="btn btn-small" role="radio" id="syntax-json" aria-checked="false">JSON</button>
      </span>
    </div>
    <!-- The widget the two right-hand tabs act on, named rather than
         identified: its title first and its document id under it, which
         is the pattern the widget picker already uses. -->
    <p class="dock-subject" id="dock-subject" hidden></p>
    <!-- THE PREVIEW IS THE CARD ITSELF, AND IT IS NOT IN HERE.
         There was a second copy of the card in this panel. Measured in

 * and the strip that is drawn after it has cannot disagree.
 *
 * The four categories are the four engines docs/widget-catalogue.md
 * names under "Unified blocked feed", plus the allowed baseline. The
 * detection engine is not here because it is stopped on this
 * installation: an engine that is not running contributes no rate, and
 * the widget renders that as a state rather than as a zero. */
/* `ifaceKeys` narrows the three tables to one interface scope without
 * changing a single coefficient: the index `i` that seeds every cluster
 * is the row's index in the WHOLE table, so a scoped strip is the
 * unscoped strip with bands removed, not a different simulation. A
 * scoped card and the network-wide card therefore agree wherever they
 * cover the same rows. */
function decisionRatesAt(t, ifaceKeys) {
  var rates = { allow: 0, rule: 0, drop: 0, dns: 0 }, i, r, bpsOf = {};
  var inScope = function (key) { return !ifaceKeys || ifaceKeys.indexOf(interfaceOf(key)) >= 0; };
  CLIENTS.forEach(function (d) {
    var b = BEHAVIOUR[d.key];
    bpsOf[d.key] = Math.max(0, b.bps * behaviourFactor(b.kind, t, b.phase));
  });
  for (i = 0; i < RECORDS.length; i++) {
    r = RECORDS[i];
    if (!inScope(r.client)) { continue; }
    rates.allow += (r.flows / 3600) * (bpsOf[r.client] / (BEHAVIOUR[r.client].bps || 1) + 0.15);
    if (r.rule && r.blocked > 0 && clusterOn(t, 90 + (i % 5) * 17, i * 13, 22)) { rates.rule += 0.55; }
  }
  for (i = 0; i < INBOUND.length; i++) {
    r = INBOUND[i];
    if (ifaceKeys && ifaceKeys.indexOf(r.iface) < 0) { continue; }
    if (r.blocked === 0) { rates.allow += 0.4; }
    else if (clusterOn(t, 110 + i * 23, i * 41, 26)) {
      if (r.rule) { rates.rule += 1.6; } else { rates.drop += 1.6; }
    }
  }
  for (i = 0; i < DNS_BLOCKS.length; i++) {
    if (ifaceKeys && !DNS_BLOCKS[i].clients.some(inScope)) { continue; }
    if (clusterOn(t, 70 + i * 19, i * 29, 18)) { rates.dns += 0.9; }
  }
  return rates;
}

/* The three decision bands of the rolling strip, at the sample times the
 * live rings already hold, for one interface scope. The unscoped card
 * reads LIVE.ring directly — that history is recorded as it happens —
 * and a scoped card re-evaluates the same deterministic function at the
 * same instants, which is exactly how the seed built LIVE.ring in the
 * first place. */
function scopedDecisionRing(ifaceKeys) {
  var n = LIVE.ring.ns.length, dt = LIVE.tickMs / 1000;
  var ring = { allow: [], rule: [], drop: [] }, i, rates;
  for (i = 0; i < n; i++) {
    rates = decisionRatesAt(LIVE.t - (n - 1 - i) * dt, ifaceKeys);
    ring.allow.push(rates.allow);
    ring.rule.push(rates.rule);
    ring.drop.push(rates.drop);
  }
  return ring;
}

function liveClock(extra) {
  var s = Math.floor(LIVE.clockBase + LIVE.t + (extra || 0));
  var hh = Math.floor(s / 3600) % 24, mm = Math.floor(s / 60) % 60, ss = s % 60;
  return (hh < 10 ? "0" : "") + hh + ":" + (mm < 10 ? "0" : "") + mm + ":" + (ss < 10 ? "0" : "") + ss;
}

/* A clock string — "12:44:02" from the live feed, "12:38" from a
 * standing row — as seconds past midnight, so rows written by different
 * engines at different resolutions can be put in one order. */
function timeSeconds(clock) {
  var parts = String(clock).split(":");
  return (Number(parts[0]) || 0) * 3600 + (Number(parts[1]) || 0) * 60 + (Number(parts[2]) || 0);
}

function pushRing(key, value) {
  var r = LIVE.ring[key];
  r.push(value);
  while (r.length > LIVE.ringLen) { r.shift(); }
}

/* THE STRIP'S CADENCE IS DERIVED, NEVER RESTATED BESIDE IT.
 *
 * `LIVE.tickMs` is the only place the rolling strip's resolution is
 * written down, and every word printed about that resolution is
 * computed from it here. A sentence that spells a constant out will
 * disagree with the constant the next time it moves, and this page has
 * now been caught doing exactly that three times — most recently with
 * two legend chips promising "one second at a time" and "120 s, one
 * mark per sample" beneath sixty marks drawn two seconds apart, which
 * answers "one-second burst or two-second mean?" wrongly in both
 * directions at once.
 *
 * The window the card asks for is turned into a sample count at that
 * cadence, the strip is cut to it, and the legend is printed from the
 * marks actually drawn. */
function tickSeconds() { return LIVE.tickMs / 1000; }

/* A span in seconds, without a trailing zero it did not earn. */
function fmtSpanSeconds(s) { return (Math.round(s * 10) / 10) + " s"; }

/* How many samples a window of `seconds` holds at that cadence: never
 * fewer than two, never more history than the ring keeps. */
function stripSampleCount(seconds) {
  var wanted = Math.round(seconds / tickSeconds());
  if (!(wanted >= 2)) { wanted = 2; }
  return Math.min(LIVE.ringLen, wanted);
}

/* The most recent `n` samples of each series, so the span the legend
 * prints is the span on screen. */
function stripTail(series, n) {
  return series.map(function (s) {
    var v = s.values;
    return { cls: s.cls, label: s.label, values: v.slice(Math.max(0, v.length - n)) };
  });
}

/* The strip's extent, as a unit. Where the card asked for a longer
 * window than the ring holds, the span printed is the span drawn, so
 * the legend cannot describe something that is not on screen. */
function stripWindowWords(n, askedSeconds) {
  var span = n * tickSeconds();
  return n + (n === 1 ? " mark" : " marks") + " · " + fmtSpanSeconds(span);
}

/* Seed the rings and the hourly buckets so the page is already running
 * when it opens rather than filling up from an empty chart. */
(function seedLive() {
  var i, t;
  for (i = LIVE.ringLen - 1; i >= 0; i--) {
    t = -i * LIVE.tickMs / 1000;
    var ns = 0, ew = 0;
    CLIENTS.forEach(function (d) {
      var b = BEHAVIOUR[d.key];
      var v = b.bps * behaviourFactor(b.kind, t, b.phase);
      ns += v * SCOPE_SHARE.ns[d.key];
      ew += v * SCOPE_SHARE.ew[d.key];
    });
    LIVE.ring.ns.push(ns);
    LIVE.ring.ew.push(ew);
    LIVE.ring.inb.push(31000000 * (1 + 0.12 * Math.sin(t / 29)));
    var rates = decisionRatesAt(t);
    LIVE.ring.allow.push(rates.allow);
    LIVE.ring.rule.push(rates.rule);
    LIVE.ring.drop.push(rates.drop);
    LIVE.ring.dns.push(rates.dns);
  }
  LIVE.hours = {
    out: distribute(AGG.nsBytes, SHAPE_OUTBOUND),
    inb: distribute(AGG.inboundBytes, SHAPE_INBOUND),
    ew: distribute(AGG.ewBytes, SHAPE_EASTWEST)
  };
  CLIENTS.forEach(function (d) {
    var b = BEHAVIOUR[d.key];
    LIVE.bps[d.key] = Math.max(0, b.bps * behaviourFactor(b.kind, 0, b.phase));
  });
}());

function liveTick() {
  if (LIVE.paused) { return; }
  var dt = LIVE.tickMs / 1000;
  LIVE.t += dt;
  var t = LIVE.t, i, r, b, v;

  /* 1. This instant's rate per client. */
  LIVE.bps = {};
  CLIENTS.forEach(function (d) {
    b = BEHAVIOUR[d.key];
    LIVE.bps[d.key] = Math.max(0, b.bps * behaviourFactor(b.kind, t, b.phase));
  });

  /* 2. Bytes into the rows every widget already reads. */
  var addedNs = 0, addedEw = 0;
  for (i = 0; i < RECORDS.length; i++) {
    r = RECORDS[i];
    v = LIVE.bps[r.client] / 8 * dt * SHARE[i];
    r.bytes += v;
    if (r.scope === "north_south") { addedNs += v; } else { addedEw += v; }
    /* Connections, as whole numbers, at the record's own pace. */
    ACC.flows[i] += (r.flows / 3600) * dt * (LIVE.bps[r.client] / (BEHAVIOUR[r.client].bps || 1) + 0.15);
    while (ACC.flows[i] >= 1) { r.flows += 1; ACC.flows[i] -= 1; }
  }

  /* 3. Blocked connections, in clusters. */
  for (i = 0; i < RECORDS.length; i++) {
    r = RECORDS[i];
    if (!r.rule || r.blocked === 0) { continue; }
    if (!clusterOn(t, 90 + (i % 5) * 17, i * 13, 22)) { continue; }
    ACC.blocked[i] += 0.55 * dt;
    while (ACC.blocked[i] >= 1) {
      r.blocked += 1; r.flows += 1; ACC.blocked[i] -= 1;
      pushFeed("Firewall rule", r.client + " → " + blockedTarget(r),
        RULE[r.rule] ? RULE[r.rule].pf : "rid " + UNKNOWN_RID + ", rule gone");
    }
  }

  /* 4. Inbound: one steady tunnel, two scans that arrive in bursts. */
  var addedIn = 0;
  for (i = 0; i < INBOUND.length; i++) {
    r = INBOUND[i];
    if (r.blocked === 0) {
      v = 9600000 / 8 * dt * (1 + 0.15 * Math.sin((t + i * 30) / 23));
      r.bytes += v; addedIn += v;
      ACC.inFlows[i] += 0.4 * dt;
      while (ACC.inFlows[i] >= 1) { r.flows += 1; ACC.inFlows[i] -= 1; }
    } else if (clusterOn(t, 110 + i * 23, i * 41, 26)) {
      ACC.inBlocked[i] += 1.6 * dt;
      while (ACC.inBlocked[i] >= 1) {
        r.blocked += 1; r.flows += 1; r.bytes += 1100; addedIn += 1100;
        ACC.inBlocked[i] -= 1;
        /* A record whose log_reason is not `match` was decided by no
         * rule, so the feed names the reason instead of naming a rule. */
        pushFeed(r.rule ? "Firewall rule" : "Firewall drop",
                 PEER[r.peer].addr + " → this firewall" + (r.dstPort ? ":" + r.dstPort : ""),
                 r.rule ? RULE[r.rule].pf : "no rule matched · reason " + r.logReason);
      }
    }
  }

  /* 5. Refused lookups, also in clusters. */
  for (i = 0; i < DNS_BLOCKS.length; i++) {
    if (!clusterOn(t, 70 + i * 19, i * 29, 18)) { continue; }
    ACC.dns[i] += 0.9 * dt;
    while (ACC.dns[i] >= 1) {
      /* A refusal is one client's lookup, so the tick credits one
       * asker's row and lets the domain's total follow from it. The
       * askers take turns, which is why the feed names a different one
       * each time a busy domain fires. */
      var ask = DNS_BLOCKS[i].asks[ACC.dnsAsk[i] % DNS_BLOCKS[i].asks.length];
      ACC.dnsAsk[i] += 1;

      pushFeed("DNS list",
        ask.client + " → " + DNS_BLOCKS[i].domain,
        DNS_BLOCKS[i].list

  var nsBps = 0, ewBps = 0;
  CLIENTS.forEach(function (d) {

    ewBps += LIVE.bps[d.key] * SCOPE_SHARE.ew[d.key];

  pushRing("ns", nsBps);
  pushRing("ew", ewBps);
  pushRing("inb", addedIn * 8 / dt);
  var rates = decisionRatesAt(t);
  pushRing("allow", rates.allow);
  pushRing("rule", rates.rule);
  pushRing("drop", rates.drop);
  pushRing("dns", rates.dns);
  LIVE.hours.out[23] += addedNs;
  LIVE.hours.ew[23] += addedEw;
  LIVE.hours.inb[23] += addedIn;

  /* 6b. There is no telemetry step, and there was one here until this
   * pass: a CPU percentage was being derived from throughput and plotted
   * on the custom chart. No table in migrations/ can hold a sampled
   * gauge (G9) and no telemetry source has been surveyed (G10), so that
   * curve was a number the model cannot produce. It is gone, and the
   * custom chart draws that series as a labelled gap instead. */

  /* 7. One recomputation per period, so nothing can disagree with
   * anything else at any range the reader picks. */
  rebuildAggregates();
  AGG = aggFor(canvasPeriod());
}

/* What a refused connection was aimed at: the inferred site name where
 * the resolver gave one, and the destination address with its port
 * otherwise. Never the direction it was refused in — "blocked outbound"
 * names nothing a reader can act on. */
function blockedTarget(r) {
  if (r.site) { return r.site; }
  if (r.scope === "east_west") {
    return (r.dstAddr || "address not recorded") +
           (r.dstPort ? ":" + r.dstPort : "") + " · " + interfaceLabel(r.dstIface);
  }
  return PEER[r.peer].addr + (r.dstPort ? ":" + r.dstPort : "");
}

/* A run of identical decisions is one row carrying its count, not the
 * same line printed six times: a cluster is one event to a reader. */
function pushFeed(engine, what, by) {
  var top = LIVE.feed[0];
  if (top && top.engine === engine && top.what === what && top.by === by) {
    top.count += 1;
    top.time = liveClock();
    return;
  }
  LIVE.feed.unshift({ time: liveClock(), engine: engine, what: what, by: by, count: 1 });
  while (LIVE.feed.length > 40) { LIVE.feed.pop(); }
}

/* The blocking-reason grouping: every decision the firewall and the
 * resolver made over the period, in the four categories
 * docs/widget-catalogue.md fixes under "Unified blocked feed" —
 * firewall rule, DNS list, detection engine — plus the allowed
 * baseline, and plus the drops that no rule decided at all.
 *
 * The measure is PACKETS, not bytes, and it has to be: the filter log
 * records packets — `docs/opnsense-api-survey.md`, Data source 1,
 * *Observation-point limit* — and a rule denial has no volume to divide,
 * only a line in that log. `packet` is OPNsense's own word for one
 * decided line of traffic and is the word used in the ring, the legend,
 * the header chip and the parameter form alike.
 *
 * What that measure excludes is the DNS list: a refused lookup is a
 * `dns_resolution` row that never became a packet, so it is counted
 * beside the ring rather than inside it. The same holds for the
 * detection engine, which has no number at all here.
 *
 * The categories are deliberately not collapsed. `match` and anything
 * else are different answers to "what decided this", and a detection
 * engine that is not running is a different answer again from "it
 * blocked nothing".
 */
function blockingReasonSlices() {
  return [
    { label: "Allowed", value: AGG.allowedDecisions, cls: 3 },
    { label: "Blocked by a firewall rule", value: AGG.ruleBlocked, cls: 5 },
    { label: "Dropped, no rule matched", value: AGG.noRuleDrops, cls: 4 },
    /* Counted, and in no ring. A refused lookup never became a packet, so
     * it cannot be a share of a packet count. It keeps its number where a
     * reader can see it and states why it is aside. */
    { label: "Blocked by a DNS list", cls: 2, unplaced: AGG.dnsBlocked,
      why: DNS_ASIDE.why, whyLong: DNS_ASIDE.whyLong },
    /* No provider is collecting for this one, so it carries a state and
     * not a number. A zero here would assert that the detection engine
     * looked and found nothing. */
    { label: "Blocked by the detection engine", value: null, cls: 6, state: "disabled",
      stateWords: "Switched off" }
  ];
}

/* Why the DNS list is beside the rings and not in them, in one place, so
 * that the split card and the unsplit card give the reader the same
 * answer. Both halves are true and the short badge carries the one that
 * holds whatever the card is split by. */
var DNS_ASIDE = {
  why: "no packet",
  whyLong: "A refused lookup never became traffic: the filter log holds no packet for it, and the model holds no direction."
};

/* One client's throughput added into `acc` under the key the grouping
 * asks for. `bps` is the part of that client's current rate this call is
 * for — the whole of it when the card is not split, that client's
 * outbound or inter-interface share when it is. Every grouping below is
 * a column the schema holds. */
function accumulateClientBps(acc, d, bps, groupBy) {
  var mix = MIX[BEHAVIOUR[d.key].kind], key;
  if (bps <= 0) { return; }
  if (groupBy === "client") {
    acc[d.key] = (acc[d.key] || 0) + bps;
  } else if (groupBy === "interface") {
    key = interfaceLabel(d.iface);
    acc[key] = (acc[key] || 0) + bps;
  } else if (groupBy === "protocol") {
    Object.keys(mix.protocol).forEach(function (pk) {
      acc[pk] = (acc[pk] || 0) + bps * mix.protocol[pk];
    });
  } else {
    Object.keys(mix.port).forEach(function (pk) {
      acc[pk] = (acc[pk] || 0) + bps * mix.port[pk];
    });
  }
}

/* The collapsed tail is not a category and must not borrow a category's
 * colour: with a slice limit of six it would have collided with the
 * sixth one. It gets the neutral grey ntopng gives its own Other slice
 * instead, which is also what keeps the colour of a named category
 * stable when the limit changes. */
var OTHER_CLS = "other";
/* THE MUTED FOREGROUND IS OUT OF THE SERIES RAMP.
 * `--series-4` is the maintainer's own `--fg-muted`, and in every one of
 * the ten palette/mode combinations it is byte-identical to
 * `--text-muted` — the colour this page uses for "no dedicated colour
 * here", for a disabled tick and for a value the model cannot give. The
 * previous pass told the two apart by dashing one of them, which
 * separated the swatches and not the meanings: the Custom chart, whose
 * whole purpose is to demonstrate paired axes, drew its left-axis series
 * in the same grey that means "not available" on the notice below it.
 * Grey now means one thing. The page has FIVE series colours and the
 * sixth identity onward takes the neutral, which is named in words
 * beside every row that carries it. */
var SERIES_RAMP = [1, 2, 3, 5, 6];

/* A SERIES COLOUR IS KEYED TO THE CATEGORY, NEVER TO ITS RANK.
 *
 * The class used to be the sorted position — `(i % 6) + 1` — so blue
 * meant whichever category happened to lead the ranking at that tick.
 * Two categories trading places repainted both of them, and on the
 * rolling strip that repaints two minutes of history backwards: a band
 * the reader has been watching changes colour and shape retroactively,
 * and a stacked time series whose colour key is rewritten backwards
 * cannot be read as a time series. The rule is not "one colour means one
 * thing inside a card" but "one colour means one thing over time".
 *
 * So each identity — an interface, a client, a protocol, a service port,
 * a blocking reason, a firewall rule — is given a class the first time
 * it is seen in its own space and keeps it for the life of the page. The
 * data is a deterministic function of the clock, so first sight is the
 * same order on every load; nothing here depends on the current ranking.
 * The collapsed tail keeps its neutral grey, which is not a series
 * colour at all. */
var SERIES_CLASS_SPACES = {};

/* THERE ARE SIX SERIES COLOURS AND THE SEVENTH IDENTITY GETS NONE.
 *
 * The class used to wrap round — `(reg.next % 6) + 1` — so a space
 * holding seven identities gave two of them the same colour: the
 * firewall-rule space holds seven, and `IoT_no_lan` and
 * `Default_deny_in` were both series 1. That breaks the rule the page
 * now enforces everywhere else, that one colour means one thing.
 *
 * Past the sixth, an identity takes the NEUTRAL GREY the collapsed tail
 * already uses. Grey is not a series colour and has never claimed to
 * name one thing: it is the page's mark for "no dedicated colour", and
 * every row that carries it is named in words beside it. */
function seriesClass(space, identity) {
  var reg = SERIES_CLASS_SPACES[space];
  if (!reg) { reg = SERIES_CLASS_SPACES[space] = { map: {}, next: 0, order: {} }; }
  if (reg.map[identity] === undefined) {
    reg.map[identity] = reg.next < SERIES_RAMP.length ? SERIES_RAMP[reg.next] : OTHER_CLS;
    reg.order[identity] = reg.next;
    reg.next += 1;
  }
  return reg.map[identity];
}

/* A LEGEND THAT RE-SORTS EVERY SECOND CANNOT BE READ.
 *
 * The composition legend was ordered on the instantaneous total, so
 * rows and their colour keys swapped places under the reader's cursor
 * about once a second, and the tail membership — which categories
 * collapse into Other — swapped with them. The rows are ordered by
 * FIRST SIGHT in their own space instead, which is the same order the
 * colours are assigned in and is the same on every load, because the
 * data is a deterministic function of the clock. Who is biggest right
 * now is answered where it belongs: by the arcs, by the figures and by
 * the percentages beside each row, all of which move freely. */
function stableOrder(space, labels) {
  var reg = SERIES_CLASS_SPACES[space];
  labels.forEach(function (l) { seriesClass(space, l); });
  reg = SERIES_CLASS_SPACES[space];
  return labels.slice().sort(function (a, b) { return reg.order[a] - reg.order[b]; });
}

function accToSlices(acc) {
  return Object.keys(acc).map(function (k) { return { label: k, value: acc[k] }; })
    .sort(function (a, b) { return b.value - a.value; });
}

/* THE COMPOSITION CARD'S OWN SCOPE.
 *
 * Every other widget is narrowed by aggForWidget(), which recomputes the
 * aggregate from the scoped records. This card is not drawn from the
 * aggregate: its rings are the CURRENT rate of each client, which is a
 * function of the simulated clock and of BEHAVIOUR, and its strip is the
 * same function evaluated at sixty past instants. So the scope is
 * carried here, as the client keys in scope, and read by the three
 * accumulators and by the decision-rate function. Set for the length of
 * one render by RENDER.traffic_composition and put back afterwards,
 * exactly as AGG is. */
var COMP_SCOPE = null;
function compositionClients() {
  if (!COMP_SCOPE) { return CLIENTS; }
  return CLIENTS.filter(function (d) { return COMP_SCOPE.indexOf(d.key) >= 0; });
}

/* Current throughput, grouped the way the widget was asked to group it. */
function compositionSlices(groupBy) {
  var acc = {};
  if (groupBy === "blocking_reason") { return blockingReasonSlices(); }
  compositionClients().forEach(function (d) { accumulateClientBps(acc, d, LIVE.bps[d.key] || 0, groupBy); });
  return accToSlices(acc);
}

/* The three directions the model can tell apart, in the order a reader
 * asks about them: what is arriving, what is leaving, what never left.
 * The keys match `AGG.byDirection`. */
var DIRECTIONS = [
  { key: "inbound",  label: "Inbound" },
  { key: "outbound", label: "Outbound" },
  { key: "between",  label: "Between interfaces" }
];

/* The same throughput, for ONE direction.
 *
 * Outbound and between-interfaces come from the clients, each weighted
 * by the share of that client's volume the period's own rows put in
 * that scope — `SCOPE_SHARE`, which is computed from `flow.traffic_scope`
 * and from nothing else.
 *
 * Inbound is a different set of rows, and it has to be: nothing inside
 * the network originated it, so no client rate can be apportioned to it.
 * It comes from the inbound table instead, and that table is also what
 * limits what the ring can be grouped by.
 *

 * that cannot, and carries { unplaced } for a part of a direction the
 * grouping has no key for. */
function compositionAccFor(groupBy, dirKey) {
  var acc = {}, shareOf;
  if (dirKey !== "inbound") {
    shareOf = dirKey === "outbound" ? SCOPE_SHARE.ns : SCOPE_SHARE.ew;
    compositionClients().forEach(function (d) {
      accumulateClientBps(acc, d, (LIVE.bps[d.key] || 0) * (shareOf[d.key] || 0), groupBy);
    });
    return { acc: acc };
  }
  /* AN INBOUND RECORD HAS NO CLIENT OF THIS INSTALLATION. These flows
   * terminate on the firewall itself: the machine at the other end is
   * outside, and `flow.dst_client_id` is NULL because there is no
   * internal client to point at. A ring grouped by client therefore has
   * nothing to draw here, and says so rather than drawing a zero. */
  if (groupBy === "client") {
    return { state: "No client on an inbound record" };
  }
  return inboundAcc(groupBy, LIVE.ring.inb.length ? LIVE.ring.inb[LIVE.ring.inb.length - 1] : 0);
}

/* THE INBOUND TABLE'S COMPOSITION AT ONE INSTANT, given that instant's
 * inbound rate. The ring calls it with the latest sample; the rolling
 * strip calls it once per sample it draws. One function, so the ring's
 * shape and the strip's shape cannot disagree about what inbound is
 * made of. */
function inboundAcc(groupBy, bps) {
  var acc = {}, rows, totalBytes, unplaced = 0, i, r, key, v;
  rows = AGG.inbound;
  totalBytes = sum(rows, function (x) { return x.bytes; });
  if (totalBytes <= 0 || bps <= 0) { return { acc: acc }; }
  for (i = 0; i < rows.length; i++) {
    r = rows[i];
    v = bps * (r.bytes / totalBytes);
    if (groupBy === "interface") {
      key = interfaceLabel(r.iface);
    } else if (groupBy === "protocol") {
      key = r.proto;
    } else if (r.dstPort === null) {
      /* A record the firewall logged as truncated keeps its protocol and
       * has no port. Grouping by service port cannot place it, and
       * inventing a bucket for it would be inventing the port. */
      unplaced += v;
      continue;
    } else {
      key = String(r.dstPort);
    }
    acc[key] = (acc[key] || 0) + v;
  }
  return { acc: acc, unplaced: unplaced > 0
    ? { label: "Port not recorded", value: unplaced, why: "no port",
        whyLong: "The firewall logged these records as truncated, so they carry a protocol and no port." }
    : null };
}

/* ====================================================================
 * THE ROLLING STRIP FOLLOWS THE CARD'S OWN `group_by`
 *
 * The strip under the rings used to draw a fixed outbound /
 * inter-interface / inbound breakdown whatever the rings were sliced
 * by, and it used the same six series classes the rings use. On a card
 * grouped by interface that made one colour mean "Home" forty pixels
 * above where it meant "Outbound". A colour means one thing inside a
 * card, so the strip is built from the CATEGORIES THE RINGS DREW, with
 * the class each category was given, and the card carries one legend
 * for both shapes.
 *
 * Nothing is apportioned backwards to make this work. Every client's
 * rate is a deterministic function of the simulated clock — the same
 * function the rings read at the current instant — so the strip is that
 * function evaluated at each of the sample times the rings already
 * hold, grouped by exactly the same accumulator. The inbound part is
 * the inbound rate actually recorded at that sample, split by the
 * inbound table through the same inboundAcc() the ring calls.
 * ==================================================================== */

/* The card's categories at one simulated instant. `mode` is "whole" for
 * the unsplit ring, which divides each client's whole rate, and
 * "directions" for the split card, whose three rings between them cover
 * each client's outbound and inter-interface shares plus the inbound
 * table. */
function compositionSampleAcc(groupBy, t, mode, inbBps) {
  var acc = {}, res, k;
  compositionClients().forEach(function (d) {
    var b = BEHAVIOUR[d.key];
    var raw = Math.max(0, b.bps * behaviourFactor(b.kind, t, b.phase));
    var share = mode === "whole"
      ? 1
      : (SCOPE_SHARE.ns[d.key] || 0) + (SCOPE_SHARE.ew[d.key] || 0);
    accumulateClientBps(acc, d, raw * share, groupBy);
  });
  /* An inbound record has no client of this installation, so a card
   * grouped by client has no inbound ring and no inbound band either. */
  if (mode !== "whole" && groupBy !== "client") {
    res = inboundAcc(groupBy, inbBps || 0);
    for (k in res.acc) {
      if (Object.prototype.hasOwnProperty.call(res.acc, k)) {
        acc[k] = (acc[k] || 0) + res.acc[k];
      }
    }
  }
  return acc;
}

/* One band per category the rings drew, over the samples the rings
 * hold. `cats` carries, per band, the class the ring gave it and the
 * labels it stands for — one label for a named category, and the whole
 * collapsed tail for Other. */
function compositionStripSeries(groupBy, cats, mode) {
  var n = LIVE.ring.ns.length, dt = LIVE.tickMs / 1000;
  var series = cats.map(function (c) { return { cls: c.cls, label: c.label, values: [] }; });
  var i, k, m, acc, v;
  for (i = 0; i < n; i++) {
    acc = compositionSampleAcc(groupBy, LIVE.t - (n - 1 - i) * dt, mode, LIVE.ring.inb[i]);
    for (k = 0; k < cats.length; k++) {
      v = 0;
      for (m = 0; m < cats[k].members.length; m++) { v += acc[cats[k].members[m]] || 0; }
      series[k].values.push(v);
    }
  }
  return series;
}

/* ONE CATEGORY, ITS VALUE IN EACH RING.
 *
 * A split card has one legend, so the legend's unit is the CATEGORY, not
 * the ring: one row per category, carrying what that category is worth
 * in each direction. A category with `values` is drawn in the rings; a
 * category with `unplaced` is counted but belongs to no direction; a
 * category with `stateWords` has no number at all. The colour is fixed
 * on the category, which is what makes the same colour mean the same
 * thing in all three rings. */
function blockingReasonCategories() {
  var d = AGG.byDirection;
  return [
    { label: "Allowed", cls: 3,
      values: { inbound: d.inbound.allowed, outbound: d.outbound.allowed, between: d.between.allowed } },
    { label: "Blocked by a firewall rule", cls: 5,
      values: { inbound: d.inbound.ruleBlocked, outbound: d.outbound.ruleBlocked, between: d.between.ruleBlocked } },
    { label: "Dropped, no rule matched", cls: 4,
      values: { inbound: d.inbound.noRuleDrops, outbound: d.outbound.noRuleDrops, between: d.between.noRuleDrops } },
    /* The two that are in no ring come after the three that are, so the
     * legend reads as the rings first and the remainder after.
     *
     * Counted, and in no ring. A refused lookup is a `dns_resolution`
     * row: it never became a flow, so it has no `direction` and no
     * `traffic_scope`, and there is nothing to infer one from. It keeps
     * its number where a reader can see it and states why it is aside. */
    { label: "Blocked by a DNS list", cls: 2, unplaced: AGG.dnsBlocked,
      why: DNS_ASIDE.why, whyLong: DNS_ASIDE.whyLong },
    /* Still a state and still not a zero, split or not. */
    { label: "Blocked by the detection engine", cls: 6, stateWords: "Switched off" }
  ];
}

/* The same shape for the throughput groupings, where the categories are
 * whatever the data holds. They are ranked on the total across the three
 * directions, so the ranking — and therefore the colour — is the card's
 * and not one ring's, and the tail collapses into one Other exactly as
 * the catalogue requires of the unsplit donut. */
function throughputCategories(groupBy, limit) {
  var per = {}, states = {}, totals = {}, labels = [];
  var unplacedTotal = 0, unplacedLabel = null, unplacedWhy = null;
  DIRECTIONS.forEach(function (dir) {
    var res = compositionAccFor(groupBy, dir.key);
    if (res.state) { states[dir.key] = res.state; return; }
    per[dir.key] = res.acc;
    if (res.unplaced) {
      unplacedTotal += res.unplaced.value;
      unplacedLabel = res.unplaced.label;
      unplacedWhy = res.unplaced;
    }
  });
  Object.keys(per).forEach(function (dk) {
    Object.keys(per[dk]).forEach(function (lab) {
      if (totals[lab] === undefined) { totals[lab] = 0; labels.push(lab); }
      totals[lab] += per[dk][lab];
    });
  });
  /* First sight, not this tick's ranking: see stableOrder. The tail is
   * cut from the same stable order, so a category does not fall into
   * Other and climb back out of it between two ticks. */
  labels = stableOrder("composition:" + groupBy, labels);
  var shown = labels.slice(0, limit), tail = labels.slice(limit);
  var cats = shown.map(function (lab) {
    var values = {};
    DIRECTIONS.forEach(function (dir) {
      if (per[dir.key]) { values[dir.key] = per[dir.key][lab] || 0; }
    });
    /* `members` is what the rolling strip sums for this band: a named
     * category stands for itself, and Other stands for the whole
     * collapsed tail. */
    return { label: lab, cls: seriesClass("composition:" + groupBy, lab), values: values, members: [lab] };
  });
  if (tail.length) {
    var otherValues = {};
    DIRECTIONS.forEach(function (dir) {
      if (!per[dir.key]) { return; }
      otherValues[dir.key] = sum(tail, function (lab) { return per[dir.key][lab] || 0; });
    });
    cats.push({ label: "Other (" + tail.length + ")", cls: OTHER_CLS, values: otherValues, members: tail });
  }
  if (unplacedTotal > 0) {
    cats.push({ label: unplacedLabel, cls: OTHER_CLS, unplaced: unplacedTotal,
                why: unplacedWhy.why, whyLong: unplacedWhy.whyLong });
  }
  return { categories: cats, states: states };
}

/* ====================================================================
 * SERIALISERS
 * One in-memory document, two surface syntaxes. Each emitted line
 * carries the document path it came from, so the code view can
 * highlight an unresolved reference in place.
 * ==================================================================== */

function pad(n) { var s = "", i; for (i = 0; i < n; i++) { s += "  "; } return s; }

function isPlainYamlScalar(s) {
  return /^[A-Za-z_][A-Za-z0-9_.:\/-]*$/.test(s) &&
         !/^(true|false|null|yes|no|on|off)$/i.test(s);
}
function yamlScalar(v) {
  if (v === null) { return "null"; }
  if (typeof v === "boolean") { return v ? "true" : "false"; }
  if (typeof v === "number") { return String(v); }
  var s = String(v);
  return isPlainYamlScalar(s) ? s : '"' + s.replace(/"/g, '\\"') + '"';
}

function yamlMap(obj, path, indent, out) {
  Object.keys(obj).forEach(function (k) {
    var v = obj[k], p = path ? path + "." + k : k;
    if (v === null || typeof v !== "object") {
      out.push({ text: pad(indent) + k + ": " + yamlScalar(v), path: p });
    } else if (Object.prototype.toString.call(v) === "[object Array]") {
      if (v.length === 0) { out.push({ text: pad(indent) + k + ": []", path: p }); return; }
      out.push({ text: pad(indent) + k + ":", path: p });
      yamlSeq(v, p, indent + 1, out);
    } else {
      out.push({ text: pad(indent) + k + ":", path: p });
      yamlMap(v, p, indent + 1, out);
    }
  });
}
function yamlSeq(arr, path, indent, out) {
  arr.forEach(function (v, i) {
    var p = path + "[" + i + "]", sub;
    if (v === null || typeof v !== "object") {
      out.push({ text: pad(indent) + "- " + yamlScalar(v), path: p });
    } else if (Object.prototype.toString.call(v) === "[object Array]") {
      out.push({ text: pad(indent) + "-", path: p });
      yamlSeq(v, p, indent + 1, out);
    } else {
      sub = [];
      yamlMap(v, p, indent + 1, sub);
      sub[0].text = pad(indent) + "- " + sub[0].text.slice((indent + 1) * 2);
      sub.forEach(function (l) { out.push(l); });
    }
  });
}
function toYamlLines(doc) {
  var out = [];
  yamlMap(doc, "", 0, out);
  return out;
}

function jsonScalar(v) {
  if (v === null) { return "null"; }
  if (typeof v === "boolean") { return v ? "true" : "false"; }
  if (typeof v === "number") { return String(v); }
  return '"' + String(v).replace(/\\/g, "\\\\").replace(/"/g, '\\"') + '"';
}
function jsonNode(v, path, indent, out, prefix, comma) {
  var keys, i, isArr = Object.prototype.toString.call(v) === "[object Array]";
  if (v === null || typeof v !== "object") {
    out.push({ text: pad(indent) + prefix + jsonScalar(v) + (comma ? "," : ""), path: path });
    return;
  }
  if (isArr) {
    if (v.length === 0) { out.push({ text: pad(indent) + prefix + "[]" + (comma ? "," : ""), path: path }); return; }
    out.push({ text: pad(indent) + prefix + "[", path: path });
    for (i = 0; i < v.length; i++) {
      jsonNode(v[i], path + "[" + i + "]", indent + 1, out, "", i < v.length - 1);
    }
    out.push({ text: pad(indent) + "]" + (comma ? "," : ""), path: path });
    return;
  }
  keys = Object.keys(v);
  if (keys.length === 0) { out.push({ text: pad(indent) + prefix + "{}" + (comma ? "," : ""), path: path }); return; }
  out.push({ text: pad(indent) + prefix + "{", path: path });
  for (i = 0; i < keys.length; i++) {
    jsonNode(v[keys[i]], (path ? path + "." : "") + keys[i], indent + 1, out,
             '"' + keys[i] + '": ', i < keys.length - 1);
  }
  out.push({ text: pad(indent) + "}" + (comma ? "," : ""), path: path });
}
function toJsonLines(doc) {
  var out = [];
  jsonNode(doc, "", 0, out, "", false);
  return out;
}

/* ====================================================================
 * THE PARSERS — the other half of an editable code surface.
 *
 * docs/ui-references.md settles the repair design as two coordinated
 * surfaces that edit the same model, "and neither is the 'real' one".
 * A read-only pane is not one of two editing surfaces, so the code view
 * reads back what is typed into it.
 *
 * JSON is JSON.parse. YAML is parsed for exactly the subset the
 * serialiser above emits — two-space indentation, block maps, block
 * sequences, and scalars — which is the whole of what a dashboard file
 * needs. A syntax the serialiser cannot emit is refused by name and line
 * rather than half-understood: a document editor that silently drops a
 * key it did not recognise would lose the reader's work.
 * ==================================================================== */

function parseYamlScalar(s) {
  s = s.replace(/\s+$/, "");
  if (s === "null" || s === "~") { return null; }
  if (s === "true") { return true; }
  if (s === "false") { return false; }
  if (s === "[]") { return []; }
  if (s === "{}") { return {}; }
  if (/^-?\d+$/.test(s)) { return parseInt(s, 10); }
  if (/^-?\d+\.\d+$/.test(s)) { return parseFloat(s); }
  if (s.charAt(0) === '"') {
    if (s.charAt(s.length - 1) !== '"' || s.length < 2) {
      throw new Error("unterminated quoted value");
    }
    return s.slice(1, -1).replace(/\\"/g, '"');
  }
  return s;
}

var YAML_KEY = /^([A-Za-z0-9_][A-Za-z0-9_.-]*):(?:[ ](.*))?$/;

function parseYaml(text) {
  var lines = [], pos = 0;
  text.split("\n").forEach(function (raw, i) {
    var body = raw.replace(/\t/g, "  ").replace(/\s+$/, "");
    if (body === "") { return; }
    var lead = /^ */.exec(body)[0].length;
    if (lead % 2 !== 0) {
      throw new Error("line " + (i + 1) + ": indentation must be a multiple of two spaces");
    }
    lines.push({ n: i + 1, indent: lead / 2, text: body.slice(lead) });
  });
  if (lines.length === 0) { throw new Error("the document is empty"); }

  function parseBlock(indent) {
    return lines[pos].text.charAt(0) === "-" ? parseSeq(indent) : parseMap(indent);
  }
  function parseMap(indent) {
    var obj = {}, l, m;
    while (pos < lines.length && lines[pos].indent === indent && lines[pos].text.charAt(0) !== "-") {
      l = lines[pos];
      m = YAML_KEY.exec(l.text);
      if (!m) { throw new Error("line " + l.n + ": expected 'key: value' or 'key:'"); }
      pos++;
      if (m[2] !== undefined && m[2] !== "") {
        try { obj[m[1]] = parseYamlScalar(m[2]); }
        catch (e) { throw new Error("line " + l.n + ": " + e.message); }
      } else if (pos < lines.length && lines[pos].indent > indent) {
        obj[m[1]] = parseBlock(lines[pos].indent);
      } else {
        obj[m[1]] = null;
      }
    }
    return obj;
  }
  function parseSeq(indent) {
    var arr = [], l, rest;
    while (pos < lines.length && lines[pos].indent === indent && lines[pos].text.charAt(0) === "-") {
      l = lines[pos];
      rest = l.text.slice(1).replace(/^ /, "");
      if (rest === "") {
        pos++;
        arr.push(pos < lines.length && lines[pos].indent > indent ? parseBlock(lines[pos].indent) : null);
      } else if (YAML_KEY.test(rest)) {
        /* "- key: value" opens a map whose members sit one level in,
         * because the dash and its space occupy exactly one level. */
        lines[pos] = { n: l.n, indent: indent + 1, text: rest };
        arr.push(parseMap(indent + 1));
      } else {
        pos++;
        try { arr.push(parseYamlScalar(rest)); }
        catch (e) { throw new Error("line " + l.n + ": " + e.message); }
      }
    }
    return arr;
  }

  var doc = parseBlock(0);
  if (pos < lines.length) {
    throw new Error("line " + lines[pos].n + ": unexpected indentation");
  }
  return doc;
}

function parseCode(text, syntax) {
  if (syntax === "json") {
    try { return JSON.parse(text); }
    catch (e) { throw new Error(String(e.message)); }
  }
  return parseYaml(text);
}

/* ====================================================================
 * THEME
 * Six palettes. Industrial comes from docs/ui-references.md, Family C;
 * the five named palettes come from the maintainer's own site, each
 * with a dark and a light set. On first launch the theme follows the
 * operating system; a user override persists and takes precedence
 * afterwards.
 * ==================================================================== */

var PALETTES = [
  { key: "industrial",  name: "Industrial (default)" },
  { key: "tokyo-night", name: "Tokyo Night" },
  { key: "dracula",     name: "Dracula" },
  { key: "nord",        name: "Nord" },
  { key: "rose-pine",   name: "Rosé Pine" },
  { key: "catppuccin",  name: "Catppuccin" }
];

var STORE_PALETTE = "opnview.palette";
var STORE_MODE = "opnview.mode";

function readStore(key) {
  try { return window.localStorage.getItem(key); } catch (e) { return null; }
}
function writeStore(key, value) {
  try { window.localStorage.setItem(key, value); } catch (e) { /* storage refused; the page still works */ }
}

var theme = {
  palette: readStore(STORE_PALETTE) || "industrial",
  mode: readStore(STORE_MODE) || "system"
};

function systemPrefersDark() {
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
}
function effectiveMode() {
  return theme.mode === "system" ? (systemPrefersDark() ? "dark" : "light") : theme.mode;
}
function applyTheme() {
  /* Every palette carries both a dark and a light set, so the mode is
   * applied straight to the selected palette: no fallback, and nothing
   * for the picker to warn about. */
  var mode = effectiveMode();
  var known = PALETTES.filter(function (p) { return p.key === theme.palette; })[0];
  var palette = known ? known.key : PALETTES[0].key;
  document.documentElement.setAttribute("data-theme", palette + "-" + mode);
  document.documentElement.setAttribute("data-palette", palette);
}

/* ====================================================================
 * FORMATTING AND SMALL HELPERS
 * ==================================================================== */

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
                  .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function fmtInt(n) {
  return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}
function fmtBytes(n) {
  var units = ["B", "KiB", "MiB", "GiB", "TiB"], i = 0, v = n;
  while (v >= 1024 && i < units.length - 1) { v /= 1024; i += 1; }
  return (i === 0 ? String(v) : v.toFixed(v < 10 ? 2 : 1)) + " " + units[i];
}
/* A RECONCILIATION TABLE EXISTS FOR NO OTHER PURPOSE THAN TO ADD UP.
 * Formatting each term on its own and the total on its own rounds them
 * independently, so a table can print 39.1 + 60.8 and call it 100. Every
 * term here is rounded ONCE, into one unit chosen from the total, and
 * the printed total is the arithmetic sum of the printed terms. */

  var units = ["B", "KiB", "MiB", "GiB", "TiB"], u = 0, div = 1, total = 0, i;

  while (total / div >= 1024 && u < units.length - 1) { div *= 1024; u += 1; }
  var digits = u === 0 ? 0 : (total / div < 10 ? 2 : 1);
  var rounded = [], sum = 0;
  for (i = 0; i < values.length; i++) {
    rounded.push(Number((values[i] / div).toFixed(digits)));
    sum += rounded[i];
  }
  sum = Number(sum.toFixed(digits));
  var one = function (n) { return n.toFixed(digits) + " " + units[u]; };

}

  var units = ["bit/s", "kbit/s", "Mbit/s", "Gbit/s"], i = 0, v = n;
  while (v >= 1000 && i < units.length - 1) { v /= 1000; i += 1; }
  return (v < 10 ? v.toFixed(1) : String(Math.round(v))) + " " + units[i];
}

  return (x * 100).toFixed(digits === undefined ? 1 : digits) + " %";
}
function fmtSeconds(s) {
  return s === null ? "not measured" : s.toFixed(1) + " s";
}
/* A FIGURE THAT DOES NOT EXIST, WRITTEN THE ONE WAY THIS PAGE WRITES IT.
 * The em-dash every numeric column already uses, with the condition in
 * the title so the mark can be read rather than guessed at. Nothing
 * user-visible on this page prints a programming term for a value that
 * has none: `undefined` on a firewall's dashboard reads as a crash, and
 * `CLAUDE.md`'s vocabulary rule does not allow it either. */
function noFigure(why) {
  return '<span class="muted" title="' + esc(why) + '">—</span>';
}
function humanTypeName(type) {
  return CATALOGUE[type] ? CATALOGUE[type].title : type;
}

/* ====================================================================
 * CHARTS
 *
 * THE MEASURED POINTS ARE THE RENDERING. Every chart on this page draws
 * a mark at every sample it holds — the scope chart, the rolling strip,
 * the custom chart and every sparkline. The connecting line is drawn
 * over those marks as an aid to reading a trend, never in place of them:
 * a reader must be able to see how many samples there actually are, and
 * where one of them sits, without inferring it from a line's shape.
 *
 * No curve smoothing and no downsampling: every bucket held in the data
 * gets its own mark, and each element states how many points it drew.
 * ==================================================================== */

/* The two side gutters are wide enough for the longest label these two
 * charts print, at the largest enlargement enforceChartTextFloor() is
 * allowed to apply. They are constants because the hover cursor on the
 * scope chart maps a pixel back to a bucket through them. */
var CHART_W = 640, CHART_PADL = 60, CHART_PADR = 60, CHART_PADT = 10, CHART_PADB = 22;

/* ====================================================================
 * TWO THINGS THAT DECIDE WHETHER A LABEL IS READABLE
 *
 * 1. THE GUTTER. An axis label is anchored at the inner edge of the
 *    plot and grows leftwards into the gutter. Measured on this font
 *    stack at 9 user units, a character is a little over four units
 *    wide; 4.7 is that rounded up, so a label never reaches the edge of
 *    the viewBox and never loses its first character.
 *
 * 2. THE SCALE. An SVG with a viewBox shrinks its text with the
 *    drawing. At 341 CSS px on a phone, a 640-unit chart renders its
 *    9 px labels at 4.8 CSS px. Nothing is done about that here,
 *    because nothing here knows the rendered width: the decision is
 *    taken after layout, from the measured size, in
 *    enforceChartTextFloor(). What is prepared here is the alternative
 *    it switches to — the same axis, or the same names, as HTML text
 *    beneath the chart, which no viewBox scales.
 * ==================================================================== */

var AXIS_CHAR_W = 4.7;          /* one character, in user units, at 9 px */

/* A CHART IN A FIVE-COLUMN CARD IS NOT A CHART IN A TWELVE-COLUMN CARD.
 * Both were drawn into the same 640-unit viewBox, so the narrow one's
 * text came out at two thirds the size for no reason except its
 * footprint. The viewBox follows the footprint instead, which keeps the
 * rendered scale near one whatever the card's width, and keeps the
 * strip's own labels above the floor at the widths where a twelve-column
 * grid is in use. The floor still has the last word: this only makes it
 * easier to clear. */
function chartViewWidth(w) {
  var cols = w && w.placement && w.placement.w ? w.placement.w : 12;
  return Math.max(320, Math.round(640 * cols / 12));
}


function widestLabel(labels) {
  var widest = 0, i;
  for (i = 0; i < labels.length; i++) {
    widest = Math.max(widest, String(labels[i]).length);
  }
  return widest;
}

function axisGutter(labels, minimum) {
  return Math.max(minimum || 0, Math.ceil(widestLabel(labels) * AXIS_CHAR_W) + 8);
}

/* How far THIS chart may enlarge its own text before its longest label
 * runs out of gutter. It is written on the element, because the gutter
 * is cut when the chart is drawn and the enlargement is decided after it
 * is laid out: the first cannot be adjusted to the second, so the first
 * states its limit and the second respects it. */
function boostCapAttr(gutter, labels) {
  var need = widestLabel(labels) * AXIS_CHAR_W;
  var cap = need > 0 ? (gutter - 4) / need : 1;
  return ' data-boost-cap="' + Math.max(1, cap).toFixed(3) + '"';
}

/* The block a chart falls back to when its own labels are too small to
 * read. Hidden until the measurement says otherwise. */
function chartFallback(text, listHtml) {
  return '<div class="chart-fallback" hidden>' + esc(text) + (listHtml || "") + "</div>";
}

/* THE WORDS THAT STAND IN FOR A DRAWING STILL HAVE TO FIT THE CARD.
 * A chart that drops its labels prints the same names as HTML beneath
 * it, and an uncapped list of twenty branches is three hundred pixels
 * of content in a card authored for a drawing. It is capped, and what
 * it does not show it names — the "+N more" bargain this page makes
 * everywhere else it stops short. */
function fallbackList(rows, cap, itemHtml, noun) {
  var shown = rows.slice(0, cap);
  var html = "<ul>" + shown.map(itemHtml).join("") + "</ul>";
  if (rows.length > shown.length) {
    html += '<div class="clip-note">' + (rows.length - shown.length) + " more " + noun +
      ", not listed at this size</div>";
  }
  return html;
}

/* A FLOOR ON EFFECTIVE TEXT SIZE, TAKEN FROM THE COMPUTED SIZE.
 *
 * For every chart on the page: how wide is it really, how wide is its
 * viewBox, and what does the stylesheet actually give its text. Those
 * three give the size the reader sees. Below the floor the chart drops
 * its labels — dropping them is honest, shrinking them to a grey smear
 * is not — and the HTML block beneath it, which is not scaled by
 * anything, says the same thing at the page's own text size.
 *
 * Run after every render and on resize, and idempotent: hiding the text
 * does not change its computed font-size, so the measurement that put
 * the chart below the floor still puts it below the floor. */
var CHART_TEXT_FLOOR = 9;

function enforceChartTextFloor() {
  var svgs = document.querySelectorAll("svg.chart-svg, svg.tree-svg"), i;
  for (i = 0; i < svgs.length; i++) {
    var svg = svgs[i];
    var text = svg.querySelector("text");
    var vb = svg.viewBox.baseVal;
    var fallback = svg.nextElementSibling;
    if (fallback && !fallback.classList.contains("chart-fallback")) { fallback = null; }
    if (!text || !vb || !vb.width) { continue; }
    /* Measure with the enlargement off, so what comes back is what the
     * stylesheet declares and not what the last pass did. */
    svg.style.setProperty("--text-boost", "1");
    var box = svg.getBoundingClientRect();
    var declared = parseFloat(window.getComputedStyle(text).fontSize) || 0;
    if (!box.width || !declared) { continue; }
    var scale = box.width / vb.width;
    /* THE LABEL IS HELD AT THE SIZE THE STYLESHEET DECLARES, in both
     * directions. A drawing rendered larger than its viewBox was
     * printing its axis at two and three times the page's own text size,
     * and one rendered smaller was printing it at half; neither is a
     * decision anyone took. So the text is divided back by the scale.
     *
     * Downwards that always works. Upwards it is capped, because an
     * axis chart's gutters were cut wide enough for exactly this much
     * enlargement and no more — and a tree or a Sankey is not enlarged
     * at all, its labels sitting against each other and against the
     * ribbons with nowhere to grow. Past the cap the floor decides. */
    var cap = parseFloat(svg.getAttribute("data-boost-cap")) || 1;
    var boost = scale > 1 ? 1 / scale : Math.min(cap, 1 / scale);
    var effective = declared * boost * scale;

     * multiplying by it again lands a hair either side of the declared
     * size, and a chart must not drop its labels over the last bit of a
     * floating-point remainder. */
    var below = effective < CHART_TEXT_FLOOR - 0.01;
    if (below) {
      svg.classList.add("labels-dropped");
    } else {
      svg.classList.remove("labels-dropped");

/* One mark per measured sample. r scales with the spacing available so
 * that a dense series stays readable and a sparse one stays visible, but
 * a mark is never dropped: the count drawn always equals the count held. */
/* HOW A SERIES IS DRAWN BETWEEN ITS MEASURED POINTS IS A PARAMETER, NOT
 * A LAW. The marks are the rendering and are drawn in every mode; what
 * the parameter chooses is what, if anything, joins them.
 *
 *   points  — the measured marks alone, nothing joining them.
 *   linear  — a straight segment between consecutive marks. THE DEFAULT.
 *   smooth  — a Catmull-Rom curve through the marks, for a reader who
 *             prefers one. It still passes through every measured value:
 *             the control points are derived from the neighbours, so no
 *             sample is moved and none is dropped.
 *
 * `line_interpolation` and its value set are Grafana's own vocabulary,
 * which docs/ui-references.md names as the charting reference and
 * praises for `fieldConfig.overrides`-class control over how each series
 * renders. The default is unsmoothed because that is the maintainer's
 * stated preference; it is a default and not a prohibition, because the
 * dashboard is a thing each person composes.
 */
var LINE_MODES = ["points", "linear", "smooth"];

function curveD(xs, ys, mode) {

      var x0 = +xs[i > 0 ? i - 1 : 0], y0 = +ys[i > 0 ? i - 1 : 0];
      var x1 = +xs[i], y1 = +ys[i];
      var x2 = +xs[i + 1], y2 = +ys[i + 1];
      var x3 = +xs[i + 2 < n ? i + 2 : i + 1], y3 = +ys[i + 2 < n ? i + 2 : i + 1];
      d.push("C" + (x1 + (x2 - x0) / 6).toFixed(1) + " " + (y1 + (y2 - y0) / 6).toFixed(1) +
             " " + (x2 - (x3 - x1) / 6).toFixed(1) + " " + (y2 - (y3 - y1) / 6).toFixed(1) +
             " " + (+x2).toFixed(1) + " " + (+y2).toFixed(1));
    }
    return d.join(" ");
  }
  for (i = 0; i < n; i++) { d.push((i === 0 ? "M" : "L") + xs[i] + " " + ys[i]); }
  return d.join(" ");
}

/* The joining line for one series, or nothing at all in `points` mode. */
function seriesLine(cls, xs, ys, mode, n) {
  if (mode === "points") { return ""; }
  return '<path class="series-line s' + cls + '" d="' + curveD(xs, ys, mode) +
         '" data-sample-count="' + n + '"></path>';
}

/* A stacked band: the series' own upper edge, then its lower edge in
 * reverse, both drawn with the same interpolation as the line so that
 * the fill cannot disagree with it. */
function bandD(xs, upper, lower, mode) {

  return curveD(xs, upper, mode) + " " + curveD(rx, rl, mode).replace(/^M/, "L") + " Z";
}

function lineMode(w) {
  var v = w && w.parameters ? w.parameters.line_interpolation : null;
  return LINE_MODES.indexOf(v) >= 0 ? v : "linear";
}

  var out = [], i, r = Math.max(0.9, Math.min(2.2, spacing / 4));
  for (i = 0; i < xs.length; i++) {

             '" cy="' + ys[i] + '" r="' + r.toFixed(2) + '"></circle>');
  }

}

  return step * mag;

/* A TICK IS NICE IN THE BASE ITS LABEL IS PRINTED IN.
 *
 * Every axis on this page picked its top with the decimal rule above
 * and then printed it through fmtBytes(), which divides by 1024. The
 * seam shows in one drawing on the paired-axis chart: Mbit/s reading
 * 500 k / 1.0 / 1.5 / 2.0 beside GiB reading 1.16 / 2.33 / 3.49 / 4.66.
 * The second axis is 1.25 / 2.5 / 3.75 / 5 GB relabelled in gibibytes —
 * arithmetically correct and unreadable, because nobody nice-numbers in
 * gibibytes by choosing 4.66.
 *
 * So a byte axis chooses its top on 1024. The step list is the binary
 * ladder restricted to values whose quarter is itself a round number,
 * because every axis here draws five gridlines at 0, ¼, ½, ¾ and 1.
 * A formatter declares its base on itself — `fmtBytes.axisBase` — so
 * the chart functions need no extra argument and a formatter that is
 * passed through a wrapper cannot silently lose the declaration. */
var BINARY_STEPS = [1, 2, 4, 5, 6, 8, 10, 12, 16, 20, 24, 32, 40, 48, 64, 80, 96,
                    128, 160, 192, 256, 320, 384, 512, 640, 768, 1024];
function niceCeil1024(v) {
  if (v <= 0) { return 1; }
  var div = 1, f, i;
  while (v / div >= 1024) { div *= 1024; }
  f = v / div;
  for (i = 0; i < BINARY_STEPS.length; i++) {
    if (f <= BINARY_STEPS[i]) { return BINARY_STEPS[i] * div; }
  }
  return 1024 * div;
}
