          esc(content.kept.map(function (r) { return r.value + ": " + r.label; }).join(", ")) +
          '">kept, not understood</span>'
        : "") +
      /* THE CUT-OFF MARKER SITS IN THE HEADER CHIP ROW, not pinned over
       * the content it describes: on the blocked feed at 1200 px it was
       * covering the reason text of the very row it was reporting. It
       * is measured with the marker hidden and shown afterwards, and it
       * is one line in a header that is already one line tall, so
       * showing it cannot change what fits vertically. */
      '<span class="clip-flag" hidden>cut off at this size</span>' +
      /* A mark, not a sentence: the card is showing what the form holds
       * and the document does not. Where one of the pending keys is a
       * key this build writes but does not draw, the mark names it,
       * because otherwise the card looks as though it ignored the
       * change. */
      (pending
        ? '<span class="card-pending">unapplied' +
          (pending.undrawn.length ? " · " + esc(pending.undrawn.join(", ")) + " not drawn" : "") +
          "</span>"
        : "") +
      '<button class="card-gear" type="button" data-config="' + esc(w.id) + '" ' +
        'title="Configure" aria-label="Configure ' + esc(heading) + '">⚙</button>' +
    "</header>" +
    /* NO EXPLANATION LINE UNDER THE TITLE. Twenty-four cards each
     * carried the catalogue entry's Question field as a sentence:
     * "Public address" told the reader it answers "What address does
     * this installation present to the internet, on which gateway, and
     * when did it last change?", above a card showing an address, a
     * gateway and a date. The Question field is how the catalogue tells
     * a builder what a widget is for; it was never copy. A title names
     * and a figure states. */
    '<div class="card-body">' + result.body + "</div>" +
    '<span class="grip-edge grip-e" data-grip="e" data-widget="' + esc(w.id) + '"></span>' +
    '<span class="grip-edge grip-s" data-grip="s" data-widget="' + esc(w.id) + '"></span>' +
    '<span class="grip-corner" data-grip="se" data-widget="' + esc(w.id) + '"></span>' +
    "</section>";
}

/* THE IMPORT REPORT IS GROUPED BY CANVAS AND THEN BY WIDGET, which is
 * what the acceptance criterion asks and what a reader of an imported
 * file needs: a file may carry several canvases and the same widget id
 * may appear in more than one of them.
 *
 * It is also a card like any other as far as clipping goes. It was not,
 * and it was the one card whose job is to report what the import could
 * not do: it carried no clip flag at all, so at 1512 px its fourth row
 * was sliced through the middle in silence. It now carries the same
 * flag every widget card carries, and `flagClippedCards` reaches it. */
function renderImportReport() {
  var byCanvas = {}, order = [], out = [];
  IMPORT_REPORT.forEach(function (r) {
    if (!byCanvas[r.canvas]) { byCanvas[r.canvas] = { title: r.canvasTitle, widgets: {}, order: [] }; }
    var c = byCanvas[r.canvas];
    if (order.indexOf(r.canvas) < 0) { order.push(r.canvas); }
    if (!c.widgets[r.widget]) { c.widgets[r.widget] = []; c.order.push(r.widget); }
    c.widgets[r.widget].push(r);
  });
  out.push('<section class="card" data-clip-check="import-report" data-import-report="1" ' +
    'data-px="0" data-py="0" data-pw="12" data-ph="6">');
  out.push('<header class="card-head"><h2 class="card-title">Import report</h2>' +
    '<span class="card-meta" title="interface-review.yaml">interface-review.yaml</span>' +
    '<span class="clip-flag" hidden>cut off at this size</span></header>');
  /* The condition column carries a badge of up to three words and was
   * 8.5 rem, which put every badge on two lines while the reference
   * column ran out in white space. The badge is one line now and the
   * reference gives up the width it was not using — and where the card
   * is narrow enough that the fixed columns have to scale, the badge
   * wraps inside itself rather than losing the end of the word that
   * names the condition. */
  out.push('<div class="card-body"><table class="data"><colgroup>' +
    '<col style="width:12rem"><col style="width:11.5rem"><col style="width:15rem"><col>' +
    /* The action column does not scale. It holds one word, "Repair",
     * and a word that has lost its last letters is a wrong word — the
     * scaling exists to give the diagnostic sentence its floor, not to
     * eat a control's name. */
    '<col style="width:4.5rem" data-no-scale="1">' +
    '</colgroup><thead><tr><th>Widget</th><th>Condition</th><th>Reference</th>' +
    "<th>Exported as</th><th></th></tr></thead><tbody>");
  order.forEach(function (cid) {
    var c = byCanvas[cid];
    out.push('<tr class="group-row"><td colspan="5">Canvas — ' + esc(c.title) +
      ' <span class="ident">' + esc(cid) + "</span></td></tr>");
    c.order.forEach(function (wid) {
      c.widgets[wid].forEach(function (r) {
        var ref = r.kind + " · " + r.by + " · " + r.value;
        out.push('<tr><td title="' + esc(r.widgetTitle + " — " + wid) + '">' + esc(r.widgetTitle) +
          '<div class="ident mono" title="' + esc(wid) + '">' + esc(wid) + "</div></td>" +
          '<td class="avail">' + conditionBadge(r.condition) + "</td>" +
          '<td class="mono" title="' + esc(ref) + '">' + esc(ref) + "</td>" +
          '<td title="' + esc(r.label) + '">“' + esc(r.label) + "”</td>" +
          '<td class="avail"><button type="button" class="link-button" data-repair="' + esc(wid) + '">Repair</button></td></tr>');
      });
    });
  });
  out.push("</tbody></table></div></div>");
  out.push("</section>");
  return out.join("");
}

/* ONE CONDITION, ONE COLOUR, WHEREVER IT IS DRAWN. The same unresolved
 * reference used to read amber in this table and blue on the widget, a
 * hand's width apart on the same canvas. The four conditions and the
 * one "kept but not understood" case each have exactly one treatment,
 * and this is the only place the report chooses one. */
function conditionBadge(condition) {
  /* An unknown parameter key is not the amber that means "the source is
   * unavailable", and it is not the filled badge that means "a
   * reference did not resolve and there is a repair for it". Nothing is
   * missing and there is nothing to repair: the key is kept and written
   * back. It takes the reference hue, outlined. */
  var cls = condition === "unknown_parameter_key" ? "badge-kept" : "badge-ref";
  return '<span class="badge ' + cls + '">' + esc(condition.replace(/_/g, " ")) + "</span>";
}

function renderCanvas() {
  /* The slice registry belongs to the drawing that is about to be
   * replaced, so it is emptied before the renderers refill it. */
  SLICE_DETAIL = {};
  var entry = activeEntry(), canvas = activeCanvas();
  var widgets = canvas.widgets.slice().sort(function (a, b) {
    return a.placement.y - b.placement.y || a.placement.x - b.placement.x;
  });
  var html = entry.imported ? renderImportReport() : "";
  widgets.forEach(function (w, i) { html += renderWidget(w, i, widgets.length); });
  /* THE ADD TARGET IS A BUTTON. It was a <div> carrying a click
   * handler and nothing else — no role, not in the tab order — while
   * this page claimed every detail on it is reachable
   * without a mouse. AC16 requires an explicit "add a widget here"
   * target; a target only a pointer can reach is half of one. */
  html += '<button type="button" class="slot" data-add-slot="1" data-px="0" data-py="9999" ' +
    'data-pw="12" data-ph="3">Add a widget here</button>';
  document.getElementById("canvas-root").innerHTML = html;

  document.getElementById("brand-sub").textContent = activeDoc().title;
  wireCanvas();
}

/* ====================================================================
 * THE COLUMN COUNT FOLLOWS THE CANVAS, NOT THE WINDOW
 *
 * What is scarce is the container, not the viewport. A twelve-column
 * grid keyed to the window put a six-of-twelve card at 380 px whenever
 * the code dock was open — at 1440 px with the dock open the canvas is
 * 769 px wide — and at that width a card's rows wrap to twice the height
 * they were authored for and its charts fall through this page's own
 * nine-pixel text floor. The same card is fine at the same window width
 * with the dock closed, so the window was never the right measure.
 *
 * `MIN_CARD_WIDTH` is the measured floor: below roughly 450 px a card
 * authored as half of a twelve-column grid stops holding what it was
 * authored to hold. The layout therefore offers as many columns as the
 * canvas can pay for at that floor:
 *
 *   - canvas >= 1540 px -> twelve columns, the authored placement
 *     honoured exactly;
 *   - canvas wide enough for a half card to clear 420 px, gaps and
 *     padding included -> eight columns, where a card is a half, three
 *     quarters or the whole and never less than a half;
 *   - fewer -> one column, every widget full width in y order, which is
 *     what docs/dashboard-format.md, "Placement", asks of a narrow
 *     layout.
 *
 * This is Homarr's arrangement — named layouts, each with its own column
 * count — with the mapping between them defined here rather than stored
 * per layout, because a mockup has one document and NOTHING BELOW
 * WRITES BACK TO IT. `placement.x` and `placement.w` are read and never
 * assigned; the same document re-exports unchanged at every width.
 * ==================================================================== */
var MIN_CARD_WIDTH = 420;
/* Twelve columns are only worth having when the widest authored card —
 * seven of twelve, which is what the connection tree and the day's
 * chart are drawn at — is wide enough to keep its own labels. Measured,
 * that is 898 px of card. Below it the eight-column layout gives those
 * same cards MORE width, not less, which is the whole point of reducing
 * the count. What that is in canvas pixels is solved rather than
 * written down, because it depends on the grid's own gap and padding. */
var WIDEST_CARD_FLOOR = 898;

/* THE ARITHMETIC INCLUDES THE GAP AND THE PADDING, AND IT DID NOT.
 *
 * The eight-column threshold was a bare 2 x MIN_CARD_WIDTH. A card that
 * is four of eight columns is four column widths PLUS the three gaps
 * inside it, out of a canvas that is eight column widths plus seven
 * gaps and its own padding — so at an 843 px canvas the layout took
 * eight columns and produced 413 px cards, under the 420 px floor the
 * count exists to protect, and fifteen cards flagged themselves cut
 * off. The thresholds are now solved from the measured gap and padding
 * rather than assumed to be zero. */
function gridSpacing() {

  var st = grid ? window.getComputedStyle(grid) : null;

    gap: st ? (parseFloat(st.columnGap) || 16) : 16,
    pad: st ? ((parseFloat(st.paddingLeft) || 0) + (parseFloat(st.paddingRight) || 0)) : 0

/* The canvas width at which a card spanning `span` of `cols` columns is
 * exactly `card` pixels wide. A span of n columns carries n - 1 gaps
 * inside it; the canvas carries cols - 1 gaps and its padding. */
function canvasWidthFor(cols, span, card) {
  var sp = gridSpacing();
  var colW = (card - (span - 1) * sp.gap) / span;

function columnsForCanvas(width) {
  /* Twelve columns are worth having when the widest authored card —
   * seven of twelve — still holds its own labels, measured at 898 px. */
  if (width >= canvasWidthFor(12, 7, WIDEST_CARD_FLOOR)) { return 12; }
  /* Eight columns are worth having when a half card clears the floor. */
  if (width >= canvasWidthFor(8, 4, MIN_CARD_WIDTH)) { return 8; }
  return 1;
}

/* Twelve authored columns onto eight. A card is snapped UP to a whole
 * quarter of the canvas and never below a half, so no card is ever
 * narrower in the reduced layout than the fraction it was authored at —
 * rounding to nearest would have turned seven of twelve into a half and
 * made the narrow case worse than the wide one. Widths therefore no
 * longer add up to eight across a band, and the grid flows the cards
 * onto the next row rather than squeezing them: fewer cards per row,
 * each of them wide enough to read, which is what the canvas can pay
 * for at this width. */
function widthOnEight(w) {
  var quarters = Math.ceil((w * 8 / 12) / 2);
  if (quarters < 2) { quarters = 2; }
  if (quarters > 4) { quarters = 4; }
  return quarters * 2;

/* The canvas's own width is watched rather than the window's, because
 * the two do not move together: opening the dock, hiding the rail and —
 * the case that produced a stale layout at 1512 px — the vertical
 * scrollbar appearing once the cards are drawn all change the canvas
 * without firing a resize on the window. */
var lastCanvasWidth = -1;
function watchCanvasWidth() {
  if (typeof ResizeObserver !== "function") { return; }
  new ResizeObserver(function () {
    var root = document.getElementById("canvas-root");
    if (Math.abs(root.clientWidth - lastCanvasWidth) < 1) { return; }

    fitFixedTables();
    fitCardHeaders();
    enforceChartTextFloor();
    flagClippedCards();

/* Applying a layout can change the canvas's own width: placing the
 * cards makes the document taller, the document scrollbar appears, and
 * the canvas loses fifteen pixels — which at 1512 px was the difference
 * between twelve columns and eight, and left the page in the layout it
 * had measured before it drew. So the measurement is taken again after
 * the layout is applied, and the pass repeats while the answer keeps
 * changing. It settles in two, and is capped at three. */
function applyGridLayout() {
  var i;
  for (i = 0; i < 3; i++) {
    if (!applyGridLayoutOnce()) { return; }
  }
}

function applyGridLayoutOnce() {
  var root = document.getElementById("canvas-root");
  var cols = columnsForCanvas(root.clientWidth);
  var before = root.className;
  lastCanvasWidth = root.clientWidth;
  root.classList.remove("cols-12", "cols-8", "cols-1");
  root.classList.add("cols-" + cols);
  var items = root.children, i, el, px, pw, ph;
  for (i = 0; i < items.length; i++) {
    el = items[i];
    if (!el.hasAttribute("data-pw")) { continue; }
    px = parseInt(el.getAttribute("data-px"), 10);
    pw = parseInt(el.getAttribute("data-pw"), 10);
    ph = parseInt(el.getAttribute("data-ph"), 10);
    if (cols === 12) {
      el.style.gridColumn = (px + 1) + " / span " + pw;
      el.style.gridRow = "span " + ph;
    } else if (cols === 8) {
      /* The authored column offset is dropped: eight columns cannot
       * hold twelve columns' offsets without leaving gaps, so the grid
       * flows the cards in document order, which is the reading order
       * this page already states it is. */
      el.style.gridColumn = "span " + widthOnEight(pw);
      el.style.gridRow = "span " + ph;
    } else {
      el.style.gridColumn = "1 / -1";
      el.style.gridRow = "auto";

   * change the answer, so the caller runs the pass again. */
  lastCanvasWidth = root.clientWidth;
  return columnsForCanvas(root.clientWidth) !== cols || root.className !== before;
}

/* A COLGROUP AUTHORED IN REM CANNOT SHRINK, AND A CARD CAN.
 *
 * The dense tables fix their side columns in rem so that a diagnostic
 * sentence gets the remaining width. That is right while the card is as
 * wide as it was authored, and wrong the moment it is not: at a
 * twelve-column grid on a 1122 px viewport, source availability's six
 * fixed columns needed 512 px in a 392 px card, the table could not
 * shrink, and the sentence column wrapped one word per line — a table
 * 3,746 px tall inside a 546 px body.
 *
 * So the authored widths are kept while they fit and dropped when they
 * do not, and the fixed layout then shares the width out evenly. The
 * authored value is remembered on the column, because a window that
 * narrows can widen again. */
/* How much width a table's one flexible column is entitled to before the
 * fixed ones are made to give any up: twelve rem, which is roughly the
 * width at which a sentence stops being a column of single words. */
var FLEX_COLUMN_FLOOR = 192;

/* TRUNCATION IS MEASURED FROM THE TEXT, NOT FROM `scrollWidth`.
 *
 * `scrollWidth` is an integer, and the content box it is compared with
 * is a fraction: at 1200 px the count 2,197 in "Blocked by firewall
 * rule" measured 29.33 px of text into a 29.2 px box, rendered as
 * "2,1…", and `scrollWidth > clientWidth + 1` never fired — so a count
 * was printed wrong with no tooltip to recover it. A Range over the
 * cell's own contents gives the laid-out width of the text itself, in
 * fractions, and that is what is compared with the content box. */
function textOverflows(el) {
  var style = window.getComputedStyle(el);
  var inner = el.clientWidth -
    (parseFloat(style.paddingLeft) || 0) - (parseFloat(style.paddingRight) || 0);
  if (inner <= 0) { return false; }
  /* Only text is recoverable through a title attribute, so a cell whose
   * content is a drawing is not a truncation this check can answer;
   * it is answered by the drawing scaling to its cell. */
  if (el.textContent.trim() === "") { return false; }

  range.selectNodeContents(el);
  var rects = range.getClientRects(), widest = 0, i;
  for (i = 0; i < rects.length; i++) { widest = Math.max(widest, rects[i].width); }
  range.detach();

  if (style.whiteSpace === "normal" || style.whiteSpace === "pre-wrap") { return false; }
  return widest > inner + 0.5;

/* A CARD TITLE THAT DOES NOT FIT CARRIES ITS OWN NAME IN A TITLE.
 * The stylesheet now gives the title a seven-rem floor at every card
 * width and makes the header chip surrender instead, but a card can
 * still be narrower than the floor; when it is, the card's name must
 * stay recoverable rather than reading "Traff…" and nothing else. */
function fitCardHeaders() {
  var root = document.getElementById("canvas-root");
  root.querySelectorAll(".card-title").forEach(function (el) {
    if (textOverflows(el)) {
      if (!el.getAttribute("title")) {
        el.setAttribute("title", el.textContent.trim());
        el.setAttribute("data-fit-title", "1");
      }
    } else if (el.getAttribute("data-fit-title") === "1") {
      el.removeAttribute("title");
      el.removeAttribute("data-fit-title");
    }
  });
}

function fitFixedTables() {
  var root = document.getElementById("canvas-root");
  root.querySelectorAll("table.data").forEach(function (table) {
    var host = table.parentElement;

     * narrows and widens again gets its own layout back. */

    for (i = 0; i < cols.length; i++) {
      if (cols[i].hasAttribute("data-authored-width")) {
        cols[i].style.width = cols[i].getAttribute("data-authored-width");
      } else {
        cols[i].setAttribute("data-authored-width", cols[i].style.width || "");
      }
    }
    /* THE FLEXIBLE COLUMN KEEPS A FLOOR, AND THE FIXED ONES SCALE.
     * Source availability's five fixed columns take 31rem of a 570 px
     * card, which left the diagnostic sentence 74 px and wrapped it one
     * word per line — the exact opposite of the bargain this page
     * records, that the sentence wins the space and the machine strings
     * give it up. The fixed columns are scaled down until the flexible
     * one has its floor, never past half their authored width. */
    var remPx = parseFloat(window.getComputedStyle(document.documentElement).fontSize) || 16;

      if (m) { fixedRem += parseFloat(m[1]); } else { flexCount += 1; }

      for (i = 0; i < cols.length; i++) { cols[i].style.width = ""; }
    }

     * colgroup, and four of them at 5.25rem overflow a card narrower
     * than 21rem on their own. They give the width up second, after the
     * colgroup and before anything overflows. */
    if (table.getBoundingClientRect().width > host.clientWidth + 1) {
      table.classList.add("is-squeezed");
    }
    /* NO CELL TRUNCATES IN SILENCE. Measured rather than predicted: any

     * text in a title, which is the claim this page makes and
     * which authored titles alone could not keep at every width. */

       * text is one run, and a cell holding several lines separated by
       * <br> can still overflow its box by a few pixels without any one
       * line doing so. A cell that clips is a cell that clips. */
      overflows = textOverflows(kid) || kid.scrollWidth > kid.clientWidth + 0.5;

        kid.setAttribute("title", kid.textContent.trim());
        kid.setAttribute("data-fit-title", "1");

/* A card never grows a scrollbar, so when its footprint cannot hold its
 * content the card has to say so — vertically, where the body runs past
 * its own height, and horizontally, where a row of chips runs past its
 * own width. Both were silent before; neither is now. */
/* A CONTAINER IS SCARCE IN EITHER DIRECTION, AND ONLY ONE WAS TESTED.
 *
 * Every drawing on this page is an SVG with a viewBox, drawn at
 * `width: 100%; height: auto`, so its height is its width divided by
 * its authored aspect. The card's height is a count of grid rows and
 * does not move. Widen the window and the drawing grows downwards
 * while the card does not, and what leaves the card is whatever sits
 * BELOW the drawing — the legend, the coverage note, the scope line.
 * At 2560 px that pushed the AC9 detection-coverage statement out of
 * the blocked-traffic map: in the DOM, off the screen.
 *
 * THE MECHANISM IS FIXED HERE AND THE AUTHORED PLACEMENT IS NOT
 * TOUCHED. Adding rows to the placements would trade this against more
 * of the canvas below the fold at 1280 px, which is the maintainer's
 * call and not this file's. Instead the drawing yields to the words:
 * the overflow is measured after layout and taken off the tallest
 * drawing in the card, which keeps its aspect and is left-aligned at
 * the size that leaves room for the text. The document is untouched,
 * so it still re-exports byte for byte.
 *

 * which is what the flag below is for. */
var DRAWING_FLOOR = 90;

function capDrawingHeights() {

    var body = card.querySelector(".card-body");
    if (!body) { return; }
    var draws = body.querySelectorAll("svg.chart-svg, svg.tree-svg, svg.map-svg");
    var i, guard = 0;
    for (i = 0; i < draws.length; i++) {
      draws[i].style.maxHeight = "";
      draws[i].style.width = "";

       * pinned to 100 % the viewBox would letterbox and the drawing
       * would float in the middle of a band of nothing. Released, the
       * box is exactly the drawing and it stays on the card's left
       * edge, in line with everything else in the body. */

/* A LIST OF EVENTS IS CUT TO WHAT FITS, AND SAYS HOW MUCH IT CUT.

 * count is a guess at a height, and a guess is wrong the moment a row
 * wraps. The rows are measured here and the tail is dropped until the
 * card holds what is left, with the note beneath it counting exactly
 * what went — which is the copy the card already had, made true. */

  var root = document.getElementById("canvas-root");
  root.querySelectorAll("[data-widget-card], [data-clip-check]").forEach(function (card) {
    var body = card.querySelector(".card-body");
    var list = body ? body.querySelector("ul.feed[data-feed-total]") : null;

      list.removeChild(list.lastElementChild);

/* THE LAST THING TO YIELD IS THE WHITE SPACE ABOVE THE LAST LINE.
 *
 * The standing statements and the kept-parameter notes sit at the foot
 * of a card, separated from what is above them by a margin. On the
 * twelve-column layout the row height is pinned, so a card whose
 * content is a few pixels taller than its footprint declared itself cut
 * off while losing nothing but that margin. Spacing gives way before a
 * sentence does: the separator shrinks by exactly the overflow, and
 * only as far as zero, after which the card really is cut off and says
 * so. */
function yieldTrailingSpace() {
  var root = document.getElementById("canvas-root");
  root.querySelectorAll("[data-widget-card], [data-clip-check]").forEach(function (card) {
    var body = card.querySelector(".card-body");
    var last = body ? body.lastElementChild : null;
    if (!last) { return; }
    last.style.marginTop = "";
    var over = body.scrollHeight - body.clientHeight;
    if (over <= 2) { return; }

/* EVERY STRING THAT IS CUT CARRIES THE WHOLE OF ITSELF.
 *

 * ellipsis is reliably the machine identifier rather than the name a
 * person reads. Individual cells were given `title` attributes one
 * defect at a time, which is why 760 px and above passed round 7's scan
 * and 600 px and below did not: at 600 `Thomas Vasseur`, `Léa Caron`,
 * `Unassigned` and `rid 1746002331` were cut with nothing behind them,

 * joined them.

 * already carries a hand-written title — which is usually longer than

 * every attribute written afterwards, so the loop does not reflow the

     * `scrollWidth` and `clientWidth` describe a CSS box; an SVG
     * geometry element has none, and on the axis labels the comparison
     * came out true for text that is not cut at all. The pass was
     * writing `title="100 Mbit/s"` onto a <text> already reading
     * 100 Mbit/s — six attributes that add nothing and put six shapes
     * into the pickable-affordance population for no reason. A drawing
     * that can cut a name authors its own <title> (the tree) or prints
     * the names again as HTML below it (the Sankey, every chart), and
     * enforceChartTextFloor decides when a label is too small to read. */
    if (el.ownerSVGElement) { continue; }
    if (typeof el.scrollWidth !== "number" || typeof el.clientWidth !== "number") { continue; }

    node.removeAttribute("data-auto-title");

function flagClippedCards() {

   * re-measured against the floor at the size they ended up: a card is
   * only cut off once the drawing has yielded everything it can. */
  capDrawingHeights();
  enforceChartTextFloor();
  fitFeedLists();
  yieldTrailingSpace();
  titleTruncatedText();
  var root = document.getElementById("canvas-root");
  /* The import report is a card and clips like one. It was not reached
   * by this selector at all, so at 1512 px it sliced a badge through the
   * middle in silence — on the one card whose job is to report what the
   * import could not do. */
  root.querySelectorAll("[data-widget-card], [data-clip-check]").forEach(function (card) {

      var rows = body.querySelectorAll(".chips"), i, j, box, kids;

/* ====================================================================
 * PEOPLE — WHERE AN OWNER IS ASSIGNED
 *
 * Three things, in one page: create a person, give a client to one, and
 * see what nobody has claimed. `client.owner_id` is NULL-bearing and
 * `client.owner_assigned_at` records when somebody said so; ownership is
 * assigned by hand and never inferred, so nothing here reads a hostname,
 * a MAC prefix, a vendor or an address to guess at it.
 *
 * It writes to this page's own CLIENTS and OWNERS and to nothing else.
 * The firewall is read-only: an owner is opnview's own concept, and no

 * ==================================================================== */

function clientsOf(ownerKey) {
  return CLIENTS.filter(function (c) { return c.owner === ownerKey; });
}

function renderPeople() {
  var host = document.getElementById("people-view");

    '<span class="badge">' + fmtInt(OWNERS.length) + (OWNERS.length === 1 ? " person" : " people") + "</span></div>");

    : OWNERS.map(function (o) {
        var n = clientsOf(o.key).length;
        return '<span class="person">' + esc(o.display_name) +
          '<span class="person-count">' + fmtInt(n) + (n === 1 ? " client" : " clients") + "</span>" +
          '<button type="button" class="btn btn-small" data-person-remove="' + esc(o.key) +

    '<label for="person-name">Add a person</label>' +

  out.push('<div class="people-card">');

    '<span class="badge">' + fmtInt(unowned.length) + " of " + fmtInt(CLIENTS.length) + " unassigned</span>" +

    '<select id="people-filter" class="btn">' +
    '<option value="all"' + (state.peopleFilter === "all" ? " selected" : "") + ">Every client</option>" +
    '<option value="unowned"' + (state.peopleFilter === "unowned" ? " selected" : "") +
    ">Unassigned only</option></select></span></div>");
  out.push('<div class="people-scroll" tabindex="0" role="region" ' +
    'aria-label="Clients and their owners">' +

    "<th>Client</th><th>Interface</th><th>Identified by</th><th>Owner</th><th>Assigned</th>" +
    "</tr></thead><tbody>");
  if (rows.length === 0) {
    out.push('<tr><td colspan="5"><span class="muted">every client has an owner</span></td></tr>');
  }
  rows.forEach(function (c) {
    out.push('<tr' + (c.owner === null ? ' class="is-unowned"' : "") + "><td>" + esc(c.key) +
      '<div class="muted mono" style="font-size:0.625rem">' + esc(c.mac) + " · " + esc(c.addr) + "</div></td>" +
      "<td>" + esc(interfaceLabel(c.iface)) + "</td>" +
      '<td><span class="mono" style="font-size:0.6875rem">' + esc(c.identity) + "</span>" +
      (c.randomised ? ' <span class="badge">unstable identity</span>' : "") + "</td>" +
      '<td class="owner-cell"><select data-assign="' + esc(c.key) + '" aria-label="' +
      esc("Owner of " + c.key) + '">' +
      '<option value=""' + (c.owner === null ? " selected" : "") + ">Nobody</option>" +
      OWNERS.map(function (o) {
        return '<option value="' + esc(o.key) + '"' + (c.owner === o.key ? " selected" : "") + ">" +
          esc(o.display_name) + "</option>";
      }).join("") + "</select></td>" +
      '<td class="mono" style="font-size:0.6875rem">' +
      (c.owner_assigned_at === null ? '<span class="muted">—</span>' : esc(c.owner_assigned_at)) +
      "</td></tr>");
  });

  wirePeople();
}

/* An assignment is a statement somebody made, so the date it was made
 * is written with it — and cleared with it, which is the CHECK
 * migrations/0001_core.sql carries: owner_id and owner_assigned_at are
 * NULL together or neither is. */
function assignOwner(clientKey, ownerKey) {
  CLIENTS.forEach(function (c) {
    if (c.key !== clientKey) { return; }
    c.owner = ownerKey || null;
    c.owner_assigned_at = ownerKey ? todayStamp() : null;
  });
  rebuildAggregates();
  renderAll();
}

function wirePeople() {
  var host = document.getElementById("people-view");
  var nameField = document.getElementById("person-name");
  var error = document.getElementById("person-add-error");

  var add = function () {
    var name = nameField.value.trim();
    if (name === "") { error.textContent = "A person needs a name."; nameField.focus(); return; }
    /* display_name is UNIQUE in the schema, so it is unique here. */
    var taken = OWNERS.filter(function (o) { return o.display_name.toLowerCase() === name.toLowerCase(); });
    if (taken.length) { error.textContent = "Already here."; nameField.focus(); return; }
    /* The key is a slug of the name with its accents folded rather than
     * dropped: "Noé Delaunay" is noe-delaunay, not no-delaunay. The name
     * itself is stored exactly as it was typed. */
    var key = name.normalize("NFD").replace(/[̀-ͯ]/g, "")
      .toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "person";
    var suffix = 1, candidate = key;
    while (OWNERS.filter(function (o) { return o.key === candidate; }).length) {
      suffix += 1; candidate = key + "-" + suffix;
    }
    OWNERS.push({ key: candidate, display_name: name });
    rebuildAggregates();
    renderAll();
    var again = document.getElementById("person-name");
    if (again) { again.focus(); }
  };
  document.getElementById("person-add").addEventListener("click", add);
  nameField.addEventListener("keydown", function (ev) {
    if (ev.key === "Enter") { ev.preventDefault(); add(); }
  });

  host.querySelectorAll("[data-person-remove]").forEach(function (b) {
    b.addEventListener("click", function () {
      var key = b.getAttribute("data-person-remove");
      /* Their machines go back to the unassigned bucket rather than
       * disappearing: a client with no owner is the normal state. */
      CLIENTS.forEach(function (c) {
        if (c.owner === key) { c.owner = null; c.owner_assigned_at = null; }
      });
      OWNERS = OWNERS.filter(function (o) { return o.key !== key; });
      rebuildAggregates();
      renderAll();
    });
  });

  host.querySelectorAll("[data-assign]").forEach(function (sel) {
    sel.addEventListener("change", function () {
      assignOwner(sel.getAttribute("data-assign"), sel.value);
    });
  });

  document.getElementById("people-filter").addEventListener("change", function (ev) {
    state.peopleFilter = ev.target.value;
    renderPeople();
  });
}

function setView(view) {
  if (state.view === view) { return; }

/* ====================================================================
 * THE CODE VIEW
 * A text pane over the real document, syntax-highlighted, with the
 * offending lines highlighted in place. No file tree, no minimap, no
 * command palette, no diff viewer.
 * ==================================================================== */

function highlightYaml(text) {
  var m = text.match(/^(\s*-?\s*)([A-Za-z_][A-Za-z0-9_]*)(:)(.*)$/);
  if (m) {
    return esc(m[1]) + '<span class="tok-key">' + esc(m[2]) + '</span><span class="tok-punct">:</span>' + highlightValue(m[4]);
  }
  return highlightValue(text);
}
function highlightValue(v) {
  if (/^\s*$/.test(v)) { return esc(v); }
  var lead = v.match(/^\s*(- )?/)[0];
  var rest = v.slice(lead.length);
  var cls = "tok-str";
  if (/^-?\d+(\.\d+)?$/.test(rest)) { cls = "tok-num"; }
  else if (/^(true|false|null)$/.test(rest)) { cls = "tok-bool"; }
  else if (/^[[\]{}]$/.test(rest)) { cls = "tok-punct"; }
  return esc(lead) + '<span class="' + cls + '">' + esc(rest) + "</span>";
}
function highlightJson(text) {
  var m = text.match(/^(\s*)("(?:[^"\\]|\\.)*")(:\s*)(.*)$/);
  if (m) {
    return esc(m[1]) + '<span class="tok-key">' + esc(m[2]) + '</span><span class="tok-punct">' + esc(m[3]) + "</span>" + highlightJsonValue(m[4]);
  }
  return highlightJsonValue(text);
}
function highlightJsonValue(v) {
  var lead = v.match(/^\s*/)[0], rest = v.slice(lead.length);
  var tail = "", mm = rest.match(/,$/);
  if (mm) { rest = rest.slice(0, -1); tail = '<span class="tok-punct">,</span>'; }
  var cls = "tok-str";
  if (/^-?\d+(\.\d+)?$/.test(rest)) { cls = "tok-num"; }
  else if (/^(true|false|null)$/.test(rest)) { cls = "tok-bool"; }
  else if (/^[[\]{}]+$/.test(rest)) { cls = "tok-punct"; }
  return esc(lead) + '<span class="' + cls + '">' + esc(rest) + "</span>" + tail;
}
