/* THE HINT DESCRIBES THE FILE, AND ONLY THE FILE.
 *
 * It used to be rewritten from the selector on every change, so it read
 * "in the file: interface" for a key the Document tab — in the same
 * panel, at the same moment — showed the widget's `parameters:` did not
 * carry at all. Those keys are written on Apply and not before, so the
 * sentence was true of the effective value and false of the file, which
 * is the one thing the hint exists to teach.
 *
 * It is therefore built once, from `w.parameters`, and never follows
 * the selector: a reader trying options out is changing what Apply
 * would write, not what the file says now. Where the key is absent the
 * hint names the value the widget falls back to, which is the first
 * option — the same convention addWidget() uses when it seeds a new
 * card. */
/* The entry a field opens on when the file does not carry its key. It
 * is the same shape as the period field's "Follow the canvas", which
 * this page already had: a selector that cannot say "nothing" has to
 * invent an answer, and inventing one is what wrote keys into the
 * document that the reader never chose. */
function unsetOption(value) {
  var label = "Not in the file";
  return '<option value=""' + (value === undefined ? " selected" : "") + ">" + label + "</option>";
}

function rawHint(w, spec) {
  var has = Object.prototype.hasOwnProperty.call(w.parameters, spec.key) &&
            w.parameters[spec.key] !== undefined;
  /* PRINTED ONLY WHERE THE FILE CARRIES THE KEY. Where it does not, the
   * selector's own first option already reads "Not in the file", and a
   * second line under it saying "not in the file" was the same fact
   * twice — a third of the height of every field in the panel. Where
   * the file does carry the key the line is not a restatement: it says
   * what the file holds while the selector shows what Apply would
   * write, and those two differ the moment the reader touches it. */
  if (!has) { return ""; }
  return '<span class="hint mono">' +
    esc(Array.isArray(w.parameters[spec.key]) ? w.parameters[spec.key].join(", ")
                                              : String(w.parameters[spec.key])) + "</span>";
}

function refOptions(refKind, current) {
  var opts = [], list, i;
  if (refKind === "interface") {
    list = INTERFACES.map(function (s) {
      return { value: s.identifier, label: s.user_label + " — " + s.identifier + " (" + s.device + ")" + (s.vlan ? ", VLAN " + s.vlan : "") };
    });
  } else if (refKind === "owner") {
    list = OWNERS.map(function (o) {
      return { value: o.display_name, label: o.display_name };
    });
  } else {
    list = CLIENTS.map(function (d) {
      return { value: d.identity === "mac" ? d.mac : d.key, label: d.key + " — " + interfaceLabel(d.iface) };
    });
  }
  var found = false;
  for (i = 0; i < list.length; i++) {
    if (current && list[i].value === current.value) { found = true; }
  }
  if (current && !found) {
    opts.push('<option value="' + esc(current.value) + '" selected>' +
      esc(current.value + " — " + current.label + " (not found on this installation)") + "</option>");
  }
  list.forEach(function (o) {
    opts.push('<option value="' + esc(o.value) + '"' +
      (current && o.value === current.value ? " selected" : "") + ">" + esc(o.label) + "</option>");
  });
  return opts.join("");
}

function renderForm() {
  var w = findWidget(state.selectedWidget);
  if (!w) {
    w = activeCanvas().widgets[0];
    state.selectedWidget = w.id;
  }
  var entry = CATALOGUE[w.type];
  /* The widget is named in the panel's own subject line above this
   * form, so the form does not repeat the type identifier here. */
  var out = [];
  if (!entry) {
    out.push('<p class="state-text">No form: <span class="mono">' + esc(w.type) + "</span> is not in this build.</p>");
    return out.join("");
  }
  var undrawn = 0;
  entry.params.forEach(function (spec) {
    var value = w.parameters[spec.key];
    var id = "f-" + w.id + "-" + spec.key;
    /* THE MARK RIDES ON THE LABEL, beside the control it is about. It
     * is a mark and not a sentence: the form says which controls this
     * build does not draw by marking them, and says nothing else. */
    var chip = "";
    if (!paramIsDrawn(w.type, spec.key)) {
      undrawn += 1;
      chip = ' <span class="badge badge-gap">not drawn</span>';
    }
    var name = esc(paramLabel(w.type, spec.key)) + chip + rawHint(w, spec);
    if (spec.kind === "enum" && spec.key === "period") {
      /* The period is the one parameter a widget may simply not carry:
       * with no value it takes the canvas's, and the form says which one
       * that is rather than leaving the field looking unset. */
      out.push('<div class="form-field"><label for="' + id + '">' + name + "</label>" +
        '<select id="' + id + '" data-form-key="period" data-form-kind="period">' +
        '<option value=""' + (PERIODS[value] ? "" : " selected") + ">Follow the canvas (" +
        esc(PERIODS[canvasPeriod()].label) + ")</option>" +
        spec.options.map(function (o) {
          return '<option value="' + esc(o) + '"' + (o === value ? " selected" : "") + ">" +
            esc(PERIODS[o] ? PERIODS[o].label : o) + "</option>";
        }).join("") + "</select></div>");
    } else if (spec.kind === "enum") {
      out.push('<div class="form-field"><label for="' + id + '">' + name + "</label>" +
        '<select id="' + id + '" data-form-key="' + esc(spec.key) + '" data-form-kind="enum">' +
        unsetOption(value) +
        spec.options.map(function (o) {
          return '<option value="' + esc(o) + '"' + (o === value ? " selected" : "") + ">" +
            esc(enumLabel(w.type, spec.key, o)) + "</option>";
        }).join("") +
        "</select></div>");
    } else if (spec.kind === "bool") {
      out.push('<div class="form-field"><label for="' + id + '">' + name + "</label>" +
        '<select id="' + id + '" data-form-key="' + esc(spec.key) + '" data-form-kind="bool">' +
        unsetOption(value) +
        '<option value="true"' + (value === true ? " selected" : "") + ">Yes</option>" +
        '<option value="false"' + (value === false ? " selected" : "") +
        '>No</option></select></div>');
    } else if (spec.kind === "int") {
      /* Empty IS the unset state for a number field, and it now says so
       * in the placeholder and carries the same hint every other kind
       * carries. An emptied field used to write a zero. */
      out.push('<div class="form-field"><label for="' + id + '">' + name + "</label>" +
        '<input id="' + id + '" type="number" min="0" step="1" data-form-key="' + esc(spec.key) +
        '" data-form-kind="int" placeholder="Not in the file"' +
        ' value="' + esc(value === undefined ? "" : String(value)) + '"></div>');
    } else if (spec.kind === "enumset") {
      out.push('<div class="form-field"><label for="' + id + '">' + name + "</label>" +
        '<select id="' + id + '" data-form-key="' + esc(spec.key) + '" data-form-kind="enumset" multiple size="' +
        Math.min(6, spec.options.length + 1) + '">' +
        /* "Not in the file" is an entry of the list, and an empty
         * selection is the empty list. Two different facts, two
         * different ways to say them. */
        unsetOption(value) +
        spec.options.map(function (o) {
          return '<option value="' + esc(o) + '"' + (value && value.indexOf(o) >= 0 ? " selected" : "") + ">" +
            esc(enumLabel(w.type, spec.key, o)) + "</option>";
        }).join("") +
        "</select></div>");
    } else if (spec.kind === "ref" || spec.kind === "refs") {
      var current = spec.kind === "ref" ? value : (value && value.length ? value[0] : null);
      var broken = current && activeEntry().imported && reportForPath(
        "canvases[0].widgets[" + activeCanvas().widgets.indexOf(w) + "].parameters." + spec.key + "[0]");
      out.push('<div class="form-field' + (broken ? " is-unresolved" : "") + '"><label for="' + id + '">' +
        name + " — " + esc(spec.refKind) + " reference</label>" +
        '<select id="' + id + '" data-form-key="' + esc(spec.key) + '" data-form-kind="' + spec.kind +
        '" data-ref-kind="' + esc(spec.refKind) + '">' +
        '<option value="">every ' + esc(spec.refKind) + " this installation has</option>" +
        refOptions(spec.refKind, current) + "</select></div>");
    }
  });
  if (w.parameters.series) {
    out.push('<div class="form-field"><label>Series</label>' +
      '<span class="mono" style="font-size:0.6875rem">' + w.parameters.series.length + " — code view</span></div>");
  }
  /* NO FOOTNOTE. It read "n of the m controls above are not yet drawn
   * by this build. Apply writes them to the document — the code view
   * will show the change — and the card will not move. Each one is
   * marked." That is the page explaining itself; the marks above say
   * the same thing without a paragraph, and `undrawn` is still counted
   * because the pending-card chip names the keys it covers. */
  return out.join("");
}

/* ====================================================================
 * THE ONE EDITING SURFACE
 *
 * Three tabs in the dock beside the canvas — Document, This widget,
 * Form — and ONE Apply, which commits whichever tab is showing.
 *
 * It was two surfaces. The dock carried the whole document; a floating
 * popover carried the same widget's form and the same widget's code,
 * with a second syntax toggle and a second Apply. Three consequences,
 * all of them real: at 1920 px the popover rendered over the dock and
 * hid it; two Apply buttons were on screen with nothing saying which
 * committed what; and the popover's code pane, mounted once per widget
 * and never rebuilt, went stale the moment a placement changed, so the
 * card toolbar could read 7x11, the dock w: 7 and the popover w: 5, all
 * three visible at once.
 *
 * One panel cannot disagree with itself. The dock is rebuilt on every
 * render a person asked for — a move, a resize, an Apply, a repair, a
 * tab or syntax switch, a canvas change — and never by the live tick,
 * because it is a surface holding a caret and a reader's unapplied
 * choices. The one exception is the preview, which is the card and
 * therefore moves with the card.
 * ==================================================================== */

function dockSubjectWidget() {
  var w = findWidget(state.selectedWidget);
  if (!w) {
    w = activeCanvas().widgets[0];
    if (w) { state.selectedWidget = w.id; }
  }
  return w;
}

/* The document path of one widget, which is what marks its lines inside
 * the whole file and what the JSON and YAML serialisers both emit. */
function widgetDocPath(w) {
  var ws = activeCanvas().widgets, i;
  for (i = 0; i < ws.length; i++) {
    if (ws[i].id === w.id) {
      return "canvases[" + activeEntry().index + "].widgets[" + i + "]";
    }
  }
  return null;
}

/* Bring the marked run into view. The pane is a transparent textarea
 * over a highlighted <pre>; scrolling the textarea is what moves the
 * reader, and the pane follows it. Two lines of lead-in above the run,
 * so it does not open flush against the top edge. */
function scrollCodeToSubject(idPrefix) {
  var input = document.getElementById(idPrefix + "-input");
  var ghost = document.getElementById(idPrefix + "-ghost");
  if (!input || !ghost) { return; }
  var first = ghost.querySelector(".code-line.is-subject");
  if (!first) { input.scrollTop = 0; ghost.scrollTop = 0; return; }
  var lineHeight = first.getBoundingClientRect().height || 16;
  var top = Math.max(0, first.offsetTop - lineHeight * 2);
  input.scrollTop = top;
  ghost.scrollTop = input.scrollTop;
}

function renderConfig(fromTick) {
  var dock = document.getElementById("doc-dock");
  if (dock.hidden) {
    state.dockMounted = null;
    computePending();
    return;
  }
  var w = dockSubjectWidget();
  var tab = state.dockTab;
  if (tab !== "document" && !w) { tab = state.dockTab = "document"; }

  /* Nothing in this panel moves on a tick. It holds a caret and a
   * reader's unapplied choices; the card those choices preview is on
   * the canvas, and the canvas is what the tick redraws. */
  if (fromTick) { return; }

  document.getElementById("dock-tab-document").setAttribute("aria-selected", String(tab === "document"));
  document.getElementById("dock-tab-widget").setAttribute("aria-selected", String(tab === "widget"));
  document.getElementById("dock-tab-form").setAttribute("aria-selected", String(tab === "form"));
  document.getElementById("syntax-tabs").hidden = tab === "form";
  document.getElementById("syntax-yaml").setAttribute("aria-checked", String(state.syntax === "yaml"));
  document.getElementById("syntax-json").setAttribute("aria-checked", String(state.syntax === "json"));

  /* THE WIDGET IS NAMED, NOT IDENTIFIED. The panel used to be titled
   * with the document id — "live-composition" — and the widget's name
   * appeared only inside the preview. The name leads and the id follows
   * it in muted monospace, which is the pattern the widget picker
   * already uses. */
  var subject = document.getElementById("dock-subject");
  if (tab === "document" || !w) {
    subject.hidden = true;
    subject.innerHTML = "";
  } else {
    var entry = CATALOGUE[w.type];
    subject.hidden = false;
    subject.innerHTML = "<span>" + esc(w.title || (entry ? entry.title : w.type)) + "</span>" +
      '<span class="dock-subject-id">' + esc(w.id) + " · " + esc(w.type) + "</span>";
  }

  var key = tab === "document"
    ? "document|" + state.syntax
    : tab + "|" + w.id + "|" + state.syntax;
  if (state.dockMounted !== key) {
    state.dockMounted = key;
    state.dockDirty = false;
    document.getElementById("dock-hint").textContent = "";
    document.getElementById("dock-error").hidden = true;
    var body = document.getElementById("doc-body");
    body.classList.toggle("is-code", tab !== "form");
    if (tab === "form") {
      body.innerHTML = renderForm();
      /* The card on the canvas answers "what will my change do", so it
       * follows the form as the form is edited rather than waiting for
       * Apply. */
      body.addEventListener("input", onFormEdited);
      body.addEventListener("change", onFormEdited);
    } else if (tab === "widget") {
      body.innerHTML = renderWidgetCode(w);
      wireCodeEditor("widget", applyWidgetCode);
    } else {
      /* THE DOCUMENT TAB OPENS ON THE WIDGET THE READER SELECTED.
       * Its lines are marked inside the whole file and the pane is
       * scrolled to them, which is what the repair flow already does
       * for a form field. Before the two editing surfaces were
       * consolidated the per-widget popover WAS the per-widget view, so
       * nobody had to find one widget inside four hundred lines. */
      body.innerHTML = codeEditorHtml("doc", docLines(), state.syntax,
                                      !!activeEntry().imported, w ? widgetDocPath(w) : null);
      wireCodeEditor("doc", applyDocCode);
      scrollCodeToSubject("doc");
    }
  }
  document.getElementById("dock-revert").hidden = tab === "form";
}

/* THE DOCK IS AS WIDE AS THE READER WANTS IT.
 * Dragged with the pointer, or moved with the arrow keys, because a
 * grip that answers only a pointer is a grip half the readers do not
 * have. */
function wireDockGrip() {
  var grip = document.getElementById("dock-grip");
  var root = document.documentElement;
  var min = 22 * 16, dragging = null;
  function maxWidth() { return Math.min(64 * 16, window.innerWidth - 320); }
  function setWidth(px) {
    var w = Math.max(min, Math.min(maxWidth(), px));
    root.style.setProperty("--dock-width", w + "px");
    applyGridLayout();
    fitFixedTables();
    fitCardHeaders();
    enforceChartTextFloor();
    flagClippedCards();
  }
  function current() {
    return document.getElementById("doc-dock").getBoundingClientRect().width;
  }
  grip.addEventListener("pointerdown", function (ev) {
    ev.preventDefault();
    dragging = { x: ev.clientX, w: current() };
    grip.setPointerCapture(ev.pointerId);
  });
  grip.addEventListener("pointermove", function (ev) {
    if (!dragging) { return; }
    setWidth(dragging.w + (dragging.x - ev.clientX));
  });
  grip.addEventListener("pointerup", function () { dragging = null; });
  grip.addEventListener("pointercancel", function () { dragging = null; });
  grip.addEventListener("keydown", function (ev) {
    if (ev.key === "ArrowLeft") { ev.preventDefault(); setWidth(current() + 32); }
    if (ev.key === "ArrowRight") { ev.preventDefault(); setWidth(current() - 32); }
  });
}

/* THE PREVIEW IS THE CARD ON THE CANVAS.
 *
 * It was a second, smaller, clipped copy of the card inside the dock —
 * 234 px of an 823 px panel showing 184 px of 520 px of content, beside
 * the same card drawn whole on the canvas. The finding that put it
 * there was that a preview must show the EDIT and not the document, and
 * that finding stands: what changed is which card does the showing.
 * While the Form tab holds values the document does not, the selected
 * card draws those pending values, outlines itself in the reference
 * colour and says "unapplied" in its own header. The document is
 * untouched until Apply; Revert and a tab switch put the card back.
 *
 * PENDING is read by renderWidget() and by nothing else. It is computed
 * before every canvas draw, so the two-second tick keeps the pending
 * card pending instead of quietly reverting it under the reader. */
var PREVIEW_REPAIRED = null;
var PENDING = null;

function pendingWidget(w) {
  var params = {}, key;
  for (key in w.parameters) {
    if (Object.prototype.hasOwnProperty.call(w.parameters, key)) { params[key] = w.parameters[key]; }
  }
  var repaired = {};
  if (document.getElementById("doc-body").querySelector("[data-form-key]")) {
    readForm(params, repaired);
  }
  return { widget: { id: w.id, type: w.type, title: w.title, placement: w.placement, parameters: params },
           repaired: repaired };
}

/* Whether the form is holding anything the document is not. Compared by
 * serialisation because a parameter value is a scalar, an array of
 * scalars or a reference object, and all three have to compare the same
 * way. An absent key and a key set to undefined are the same fact. */
function paramsDiffer(a, b) {
  var keys = {}, k;
  for (k in a) { if (Object.prototype.hasOwnProperty.call(a, k)) { keys[k] = true; } }
  for (k in b) { if (Object.prototype.hasOwnProperty.call(b, k)) { keys[k] = true; } }
  for (k in keys) {
    if (JSON.stringify(a[k]) !== JSON.stringify(b[k])) { return true; }
  }
  return false;
}

function computePending() {
  PENDING = null;
  if (document.getElementById("doc-dock").hidden || state.dockTab !== "form") { return; }
  var real = findWidget(state.selectedWidget);
  if (!real) { return; }
  var body = document.getElementById("doc-body");
  if (!body || !body.querySelector("[data-form-key]")) { return; }
  var pending = pendingWidget(real);
  if (!paramsDiffer(real.parameters, pending.widget.parameters)) { return; }
  PENDING = { id: real.id, widget: pending.widget, repaired: pending.repaired,
              undrawn: undrawnChanges(real.type, real.parameters, pending.widget.parameters) };
}

/* A form edit repaints the canvas and nothing else: the panel holds the
 * caret and must not be rebuilt under the reader. */
function onFormEdited() {
  computePending();
  repaintCanvasOnly();
}

/* ====================================================================
 * THE CODE SURFACE, WHICH EDITS THE DOCUMENT
 *
 * Both surfaces — the whole document from the rail, and one widget's own
 * lines in the Code tab — are the same construction: a highlighted,
 * non-interactive pane with a transparent textarea laid exactly over it.
 * The caret and the typing belong to the textarea; the colours and the
 * unresolved-reference highlight belong to the pane. Apply parses what
 * was typed and writes it into the model, and a syntax error is named
 * with its line rather than swallowed.
 *
 * This is the pair docs/ui-references.md settles on — a code editor and
 * a no-code selector, both editing one model, neither of them the real
 * one — held to Home Assistant's minimalism: a small highlighted pane,
 * no file tree, no minimap, no command palette, no diff viewer.
 * ==================================================================== */

/* WHAT THE PANE MARKS, AND HOW IT FINDS IT AGAIN AFTER AN EDIT.
 *
 * The unresolved lines are known by their document path at the moment
 * the pane is built. Once the reader starts typing there are no paths
 * any more — there is text, which may have gained or lost lines above
 * the marked one. So each mark records the LINE AS IT WAS SERIALISED,
 * and after every keystroke the pane looks that line up again in what
 * is now in the buffer. Insert ten lines above it and the mark follows
 * it down; edit the line itself and the mark goes, which is right: the
 * pane marked a reference that did not resolve, and that reference is
 * no longer what is written there. Nothing re-resolves until Apply. */
var CODE_MARKS = {};

function codeMarksFor(idPrefix, rawLines) {
  var anchors = CODE_MARKS[idPrefix] || { unresolved: [], errorLine: null };
  var marks = {}, used = {}, i, a, j;
  /* THE WIDGET THE READER CAME HERE FOR, MARKED INSIDE THE WHOLE FILE.
   * The Document tab shows four hundred lines holding twenty-seven
   * widgets; before this it opened at the top of them with nothing
   * saying which was the one whose gear had just been pressed. The run
   * is anchored on its first line — "- id: <the widget's own id>",
   * which is unique in the file — and re-found after every keystroke,
   * exactly as the unresolved marks are. */
  if (anchors.subject && anchors.subject.first) {
    for (i = 0; i < rawLines.length; i++) {
      if (rawLines[i].replace(/\s+$/, "") === anchors.subject.first.replace(/\s+$/, "")) {
        for (j = i; j < Math.min(rawLines.length, i + anchors.subject.count); j++) {
          marks[j] = { cls: "is-subject", notice: null };
        }
        break;
      }
    }
  }
  for (a = 0; a < anchors.unresolved.length; a++) {
    for (i = 0; i < rawLines.length; i++) {
      if (used[i]) { continue; }
      if (rawLines[i].replace(/\s+$/, "") === anchors.unresolved[a].text.replace(/\s+$/, "")) {
        used[i] = true;
        marks[i] = { cls: (marks[i] ? marks[i].cls + " " : "") + "is-unresolved",
                     notice: anchors.unresolved[a].notice };
        break;
      }
    }
  }
  /* The line Apply refused, kept marked while the reader fixes it. A
   * named line the reader cannot see is a line number and nothing
   * else. */
  j = anchors.errorLine;
  if (j !== null && j >= 0 && j < rawLines.length) {
    marks[j] = { cls: marks[j] ? marks[j].cls + " is-error" : "is-error",
                 notice: marks[j] ? marks[j].notice : anchors.errorNotice };
  }
  return marks;
}

/* The highlighted pane, built from the text that is in the buffer right
 * now rather than from the document. An empty line keeps a zero-width
 * space so that its block still has a line's height: the pane is laid
 * exactly over the textarea, and a collapsed row would put the two out
 * of register for every line below it. */
function codeGhostHtml(rawLines, syntax, marks) {
  var out = [], i, m, body;
  for (i = 0; i < rawLines.length; i++) {
    m = marks[i];
    body = rawLines[i] === ""
      ? "&#8203;"
      : (syntax === "yaml" ? highlightYaml(rawLines[i]) : highlightJson(rawLines[i]));
    out.push('<span class="code-line' + (m ? " " + m.cls : "") + '">' + body +
      (m && m.notice ? '<span class="code-notice">' + m.notice + "</span>" : "") + "</span>");
  }
  return out.join("");
}

/* What the inline notice on a highlighted line says. All four facts
 * docs/dashboard-format.md names — kind, by, value and the exporting
 * label — in the wording each condition actually needs: a parameter key
 * this build does not know is not missing data, it is a key that will
 * be written straight back on export. */
function codeNoticeFor(r) {
  if (r.condition === "unknown_parameter_key") {
    return "kept, not understood — parameter key " + r.value + " (by " + r.by +
      "), value “" + r.label + "”: this build does not know the key and writes it " +
      "back unchanged on export";
  }
  if (r.condition === "unknown_widget_type") {
    return "no data — widget type " + r.value + " (by " + r.by + "), “" + r.label +
      "” on the exporting installation, not implemented by this build";
  }
  return "no data — " + r.kind + " " + r.value + " (by " + r.by + "), “" + r.label +
    "” on the exporting installation, not found here";
}

function codeEditorHtml(idPrefix, lines, syntax, showUnresolved, subjectPrefix) {
  var text = [], seen = {}, anchors = { unresolved: [], errorLine: null, errorNotice: "",
                                        subject: { first: null, count: 0 } };
  lines.forEach(function (l) {
    if (subjectPrefix && l.path &&
        (l.path === subjectPrefix || l.path.indexOf(subjectPrefix + ".") === 0 ||
         l.path.indexOf(subjectPrefix + "[") === 0)) {
      if (anchors.subject.first === null) { anchors.subject.first = l.text; }
      anchors.subject.count += 1;
    }
    var prefix = showUnresolved ? unresolvedPrefixFor(l.path) : null;
    if (prefix && !seen[prefix]) {
      seen[prefix] = true;
      var r = reportForPath(prefix);
      anchors.unresolved.push({
        text: l.text,
        /* THE INLINE "NO DATA" NOTICE NAMES ALL FOUR FACTS.
         * docs/dashboard-format.md, "Two coordinated surfaces, one
         * model", asks for an inline "no data" notice on the
         * highlighted line; "Unresolved references" fixes what it has
         * to name: the kind, the `by`, the value and the exporting
         * installation's label. */
        notice: esc(codeNoticeFor(r))
      });
    }
    text.push(l.text);
  });
  CODE_MARKS[idPrefix] = anchors;
  var out = ['<div class="code-editor"><pre class="code" id="' + idPrefix + '-ghost" aria-hidden="true">'];
  out.push(codeGhostHtml(text, syntax, codeMarksFor(idPrefix, text)));
  out.push("</pre>");
  out.push('<textarea class="code-input" id="' + idPrefix + '-input" spellcheck="false" wrap="off" ' +
    'aria-label="The document as text. Edit it and press Apply.">' + esc(text.join("\n")) + "</textarea>");
  out.push("</div>");
  /* EVERY PINNED NOTICE, REPEATED UNDERNEATH AT THE PAGE'S OWN TEXT
   * SIZE. The notice on the line has to share a row with the line it
   * annotates, so it is capped and ellipsised; this list is not, and it
   * is what makes the end of an import diagnosis reachable at every
   * dock width without horizontal scrolling. */
  if (anchors.unresolved.length) {
    out.push('<ul class="code-notice-list">');
    anchors.unresolved.forEach(function (a) {
      out.push("<li>" + a.notice +
        '<span class="code-notice-line">' + esc(a.text.trim()) + "</span></li>");
    });
    out.push("</ul>");
  }
  /* The Apply, the Revert, the hint and the error live in the dock's
   * own footer: there is one of each on the page, and it commits
   * whichever tab is showing. */
  return out.join("");
}

/* Keep the two layers in step while the reader scrolls or types.
 *
 * THE PANE IS REDRAWN ON EVERY `input`. The textarea is transparent by
 * construction — the colours belong to the pane underneath it — so a
 * pane that is not redrawn is a field in which typing shows nothing at
 * all. Redrawing it is what makes the surface an editor rather than a
 * viewer with a caret in it. */
function wireCodeEditor(idPrefix, onApply) {
  var input = document.getElementById(idPrefix + "-input");
  var ghost = document.getElementById(idPrefix + "-ghost");
  /* One error line, one hint and one Apply on the page: they belong to
   * the dock, not to the pane, because the dock now holds every editing
   * surface this page has. */
  var err = document.getElementById("dock-error");
  var hint = document.getElementById("dock-hint");
  var markDirty = function (v) { state.dockDirty = v; };
  if (!input) { return; }
  var syntaxOf = function () { return state.syntax; };
  var sync = function () {
    ghost.scrollTop = input.scrollTop;
    ghost.scrollLeft = input.scrollLeft;
  };
  var repaint = function () {
    var raw = input.value.split("\n");
    ghost.innerHTML = codeGhostHtml(raw, syntaxOf(), codeMarksFor(idPrefix, raw));
    sync();
  };
  input.addEventListener("scroll", sync);
  input.addEventListener("input", function () {
    markDirty(true);
    hint.textContent = "edited, not applied";
    repaint();
  });
  DOCK_APPLY = function () {
    var parsed, m;
    try {
      parsed = parseCode(input.value, syntaxOf());
    } catch (e) {
      err.hidden = false;
      err.textContent = "Not applied — " + e.message;
      /* Every parser message in this file names its line, and JSON.parse
       * gives a position instead. Whichever it is, the offending line is
       * marked where the reader is looking. */
      m = /line (\d+)/.exec(e.message);
      if (!m) {
        var p = /position (\d+)/.exec(e.message);
        if (p) { m = [null, String(input.value.slice(0, +p[1]).split("\n").length)]; }
      }
      CODE_MARKS[idPrefix].errorLine = m ? (+m[1] - 1) : null;
      CODE_MARKS[idPrefix].errorNotice = esc("not applied — " + e.message);
      repaint();
      scrollMarkIntoView(ghost, input, CODE_MARKS[idPrefix].errorLine);
      return;
    }
    /* THE PARSER IS NOT THE WHOLE OF APPLY. A document can parse and
     * still be one the format cannot hold — a placement whose width is
     * the word "six" parses cleanly as a string. The value check runs
     * here, and its refusal is marked on its line exactly as a syntax
     * error's is. */
    var problem = onApply(parsed);
    if (problem) {
      err.hidden = false;
      err.textContent = "Not applied — " + problem.message;
      var raw2 = input.value.split("\n");
      CODE_MARKS[idPrefix].errorLine =
        findKeyLine(raw2, syntaxOf(), problem.key, problem.value);
      CODE_MARKS[idPrefix].errorNotice = esc("not applied — " + problem.message);
      repaint();
      scrollMarkIntoView(ghost, input, CODE_MARKS[idPrefix].errorLine);
      return;
    }
    err.hidden = true;
    hint.textContent = "";
    CODE_MARKS[idPrefix].errorLine = null;
    markDirty(false);
  };
  DOCK_REVERT = function () {
    err.hidden = true;
    hint.textContent = "";
    CODE_MARKS[idPrefix].errorLine = null;
    markDirty(false);
    state.dockMounted = null;
    renderAll();
    renderConfig();
  };
}

/* What the dock's single Apply and single Revert currently commit. They
 * are set by whichever surface is mounted, so the buttons cannot be
 * wired to a pane that is no longer on screen. */
var DOCK_APPLY = null;
var DOCK_REVERT = null;

/* A REFUSED APPLY PUTS ITS LINE WHERE THE READER IS LOOKING.
 * The line was marked correctly and, at line 33, sat 62 px below the
 * pane — so the message said "line 33" and the reader saw nothing. The
 * pane and the textarea scroll together, so moving one moves both. */
function scrollMarkIntoView(ghost, input, lineIndex) {
  if (!ghost || !input || lineIndex === null || lineIndex === undefined) { return; }
  var line = ghost.children[lineIndex];
  if (!line) { return; }
  /* The textarea is the layer that scrolls; the pane underneath is kept
   * in register with it, so moving the textarea moves the mark. */
  var top = line.offsetTop - ghost.offsetTop;
  if (top < input.scrollTop || top > input.scrollTop + input.clientHeight - 24) {
    input.scrollTop = Math.max(0, top - input.clientHeight / 3);
    ghost.scrollTop = input.scrollTop;
  }
}

/* The same widget, as the document holds it: this widget's own lines. */
function renderWidgetCode(w) {
  var lines = state.syntax === "yaml" ? toYamlLines(w) : toJsonLines(w);
  return codeEditorHtml("widget", lines, state.syntax, false);
}

/* The whole document, in whichever syntax the one toggle is set to. */
function docLines() {
  var doc = activeDoc();
  return state.syntax === "yaml" ? toYamlLines(doc) : toJsonLines(doc);
}

/* ====================================================================
 * STRUCTURAL VALIDATION, WHICH IS FAIL-CLOSED
 *
 * docs/dashboard-format.md, "Import validation", is explicit: a document
 * lacking `format_version` or `canvases`, with an empty `canvases`
 * array, a canvas with no id or title, a widget with no id, type or
 * placement, a duplicate id within its scope, or "a non-integer in
 * `placement`", is refused whole, and "the message names the offending
 * canvas index, widget index and field".
 *
 * Apply used to stop at the parser. `w: six` parsed as a string, was
 * written into the placement, and the card jumped to full width with
 * nothing said. A surface that writes a string into a placement writes a
 * file another installation cannot read, and this document is the thing
 * the product claims is portable between installations. So every value
 * the format defines is checked before anything is written, the refusal
 * names the key and the value, and it is marked on its own line the way
 * a syntax error already is.
 *
 * A problem is { message, key, value }. `key` and `value` are what the
 * line lookup searches the buffer for, so a refusal is a place on screen
 * and not only a rule in a sentence.
 * ==================================================================== */

function isDocInteger(v) {
  return typeof v === "number" && isFinite(v) && Math.floor(v) === v;
}
function isDocSlug(v) {
  return typeof v === "string" && /^[a-z0-9][a-z0-9_-]*$/.test(v);
}
/* The value as the reader typed it, near enough to recognise. Every
 * branch names it in words a reader owns: `null` stays, because it is
 * literally what the document says, and the rest are English. A number
 * the parser cannot hold — four hundred digits, or `1e999` in JSON —
 * becomes the machine word `Infinity` when printed, so it is named
 * here instead. */
function showValue(v) {
  if (typeof v === "string") { return '"' + v + '"'; }
  if (v === undefined) { return "nothing"; }
  if (v === null) { return "null"; }
  if (typeof v === "number" && !isFinite(v)) { return "a number too large to hold"; }
  if (Object.prototype.toString.call(v) === "[object Array]") { return "a list"; }
  if (typeof v === "object") { return "an object"; }
  return String(v);
}

var PLACEMENT_KEYS = ["x", "y", "w", "h"];

function validatePlacement(p, where) {
  var i, k, v;
  if (!p || typeof p !== "object" || Object.prototype.toString.call(p) === "[object Array]") {
    return { message: where + ": placement must be an object of four integers — x, y, w and h.",
             key: "placement" };
  }
  for (i = 0; i < PLACEMENT_KEYS.length; i++) {
    k = PLACEMENT_KEYS[i];
    v = p[k];
    if (v === undefined) {
      return { message: where + ': placement has no "' + k + '". A placement is four integers — x, y, w and h.',
               key: "placement" };
    }
    if (!isDocInteger(v) || v < 0) {
      return { message: where + ": placement." + k + " is " + showValue(v) +
                        "; the format defines it as a non-negative integer.",
               key: k, value: v };
    }
  }
  if (p.w < 1) {
    return { message: where + ": placement.w is " + showValue(p.w) + "; a widget is at least one column wide.",
             key: "w", value: p.w };
  }
  if (p.h < 1) {
    return { message: where + ": placement.h is " + showValue(p.h) + "; a widget is at least one row tall.",
             key: "h", value: p.h };
  }
  return null;
}

function validateWidget(wd, where) {
  if (!wd || typeof wd !== "object" || Object.prototype.toString.call(wd) === "[object Array]") {
    return { message: where + " is not an object." };
  }
  if (!isDocSlug(wd.id)) {
    return { message: where + ": id is " + showValue(wd.id) +
                      "; a widget id is a slug matching [a-z0-9][a-z0-9_-]*.",
             key: "id", value: wd.id };
  }
  if (typeof wd.type !== "string" || wd.type === "") {
    return { message: where + ": type is " + showValue(wd.type) + "; a widget needs a type.",
             key: "type", value: wd.type };
  }
  if (wd.title !== undefined && typeof wd.title !== "string") {
    return { message: where + ": title is " + showValue(wd.title) + "; it must be a string.",
             key: "title", value: wd.title };
  }
  var bad = validatePlacement(wd.placement, where);
  if (bad) { return bad; }
  if (wd.parameters !== undefined &&
      (wd.parameters === null || typeof wd.parameters !== "object" ||
       Object.prototype.toString.call(wd.parameters) === "[object Array]")) {
    return { message: where + ": parameters is " + showValue(wd.parameters) + "; it must be an object.",
             key: "parameters", value: wd.parameters };
  }
  return null;
}

function validateDocument(doc) {
  var i, j, c, wd, bad, seenCanvas = {}, seenWidget;
  if (!doc || typeof doc !== "object" || Object.prototype.toString.call(doc) === "[object Array]") {
    return { message: "a dashboard file is an object." };
  }
  if (!isDocInteger(doc.format_version)) {
    return { message: "format_version is " + showValue(doc.format_version) +
                      "; the format defines it as an integer, and the current value is 1.",
             key: "format_version", value: doc.format_version };
  }
  if (Object.prototype.toString.call(doc.canvases) !== "[object Array]" || doc.canvases.length === 0) {
    return { message: "a dashboard needs a canvases array with at least one canvas.", key: "canvases" };
  }
  for (i = 0; i < doc.canvases.length; i++) {
    c = doc.canvases[i];
    if (!c || typeof c !== "object") { return { message: "canvas " + i + " is not an object." }; }
    if (!isDocSlug(c.id)) {
      return { message: "canvas " + i + ": id is " + showValue(c.id) +
                        "; a canvas id is a slug matching [a-z0-9][a-z0-9_-]*.",
               key: "id", value: c.id };
    }
    if (seenCanvas[c.id]) {
      return { message: "canvas " + i + ": id " + showValue(c.id) + " is used twice in this file.",
               key: "id", value: c.id };
    }
    seenCanvas[c.id] = true;
    if (typeof c.title !== "string" || c.title === "") {
      return { message: "canvas " + i + ": title is " + showValue(c.title) + "; a canvas needs a title.",
               key: "title", value: c.title };
    }
    if (c.period !== undefined && !PERIODS[c.period]) {
      return { message: "canvas " + i + ": period is " + showValue(c.period) +
                        "; the vocabulary is 1h, 24h, 7d and 30d.",
               key: "period", value: c.period };
    }
    if (c.grid !== undefined) {
      if (typeof c.grid !== "object" || c.grid === null) {
        return { message: "canvas " + i + ": grid is " + showValue(c.grid) + "; it must be an object.",
                 key: "grid", value: c.grid };
      }
      if (c.grid.columns !== undefined && (!isDocInteger(c.grid.columns) || c.grid.columns < 1)) {
        return { message: "canvas " + i + ": grid.columns is " + showValue(c.grid.columns) +
                          "; it must be a positive integer.",
                 key: "columns", value: c.grid.columns };
      }
      if (c.grid.row_height !== undefined && (!isDocInteger(c.grid.row_height) || c.grid.row_height < 1)) {
        return { message: "canvas " + i + ": grid.row_height is " + showValue(c.grid.row_height) +
                          "; it must be a positive integer.",
                 key: "row_height", value: c.grid.row_height };
      }
    }
    if (c.widgets === undefined) { c.widgets = []; }
    if (Object.prototype.toString.call(c.widgets) !== "[object Array]") {
      return { message: "canvas " + i + ": widgets is " + showValue(c.widgets) +
                        "; it must be an array, and it may be empty.",
               key: "widgets", value: c.widgets };
    }
    seenWidget = {};
    for (j = 0; j < c.widgets.length; j++) {
      wd = c.widgets[j];
      bad = validateWidget(wd, "canvas " + i + ", widget " + j);
      if (bad) { return bad; }
      if (seenWidget[wd.id]) {
        return { message: "canvas " + i + ", widget " + j + ": id " + showValue(wd.id) +
                          " is used twice in this canvas.",
                 key: "id", value: wd.id };
      }
      seenWidget[wd.id] = true;
    }
  }
  return null;
}

/* Where to mark the refusal. A parser error carries a line number; a
 * value error carries a key and a value instead, so the line is the one
 * in the buffer that writes that key — with that value, where more than
 * one line writes the same key. */
function findKeyLine(rawLines, syntax, key, value) {
  if (!key) { return null; }
  var re = syntax === "json"
    ? new RegExp('^\\s*"' + key + '"\\s*:')
    : new RegExp('^\\s*"?' + key + '"?\\s*:');
  var want = (value === undefined || value === null || typeof value === "object")
    ? null : String(value);
  var i, first = -1;
  for (i = 0; i < rawLines.length; i++) {
    if (!re.test(rawLines[i])) { continue; }
    if (first < 0) { first = i; }
    if (want === null || rawLines[i].indexOf(want) >= 0) { return i; }
  }
  return first >= 0 ? first : null;
}

/* Applying a widget's own lines replaces that widget in its canvas. The
 * id is what everything else points at, so an edit that drops it is
 * refused by name rather than silently creating a second widget.
 * Returns null when applied, or the problem that refused it. */
function applyWidgetCode(parsed) {
  var w = findWidget(state.selectedWidget);
  if (!w) { return { message: "the widget this pane was opened for is gone." }; }
  var bad = validateWidget(parsed, "this widget");
  if (bad) { return bad; }
  var others = activeCanvas().widgets, k;
  for (k = 0; k < others.length; k++) {
    if (others[k] !== w && others[k].id === parsed.id) {
      return { message: "this widget: id " + showValue(parsed.id) +
                        " is already used by another widget on this canvas.",
               key: "id", value: parsed.id };
    }
  }
  if (!parsed.parameters) { parsed.parameters = {}; }
  var widgets = activeCanvas().widgets;
  widgets[widgets.indexOf(w)] = parsed;
  state.selectedWidget = parsed.id;
  /* Applied: the pane is remounted once, so what is on screen is the
   * document's own serialisation of what was just accepted rather than
   * the reader's keystrokes. */
  state.dockMounted = null;
  renderAll();
  refreshDocDock();
  return null;
}

/* Applying the whole document replaces it for every canvas that was
 * reading it — three tabs share one file here — so the tabs, the canvas
 * and the code view cannot end up describing different documents. */
function applyDocCode(parsed) {
  var bad = validateDocument(parsed);
  if (bad) { return bad; }
  var old = activeDoc();
  CANVASES.forEach(function (entry) {
    if (entry.doc === old) { entry.doc = parsed; }
  });
  if (activeEntry().index >= parsed.canvases.length) { activeEntry().index = 0; }
  var widgets = activeCanvas().widgets;
  if (!findWidget(state.selectedWidget) && widgets.length) { state.selectedWidget = widgets[0].id; }
  state.dockMounted = null;
  renderAll();
  renderConfig();
  return null;
}

/* READING THE FORM IS SEPARATE FROM WRITING THE DOCUMENT, so that the
 * preview can render what the form is about to do rather than what the
 * card already shows. `target` is the parameters object being written;
 * `repaired` collects the reference keys the form has just resolved. */
function readForm(target, repaired) {
  var fields = document.getElementById("doc-body").querySelectorAll("[data-form-key]");
  var i, f, key, kind, j;
  for (i = 0; i < fields.length; i++) {
    f = fields[i];
    key = f.getAttribute("data-form-key");
    kind = f.getAttribute("data-form-kind");
    if (kind === "period") {
      if (f.value === "") { delete target.period; }
      else { target.period = f.value; }
    }
    /* An empty value is the "not in the file" entry: the key stays out
     * of the document rather than being written on the reader's behalf.
     * Pressing Apply used to add every key the form offered, which is
     * how the Document tab came to disagree with the Form tab about
     * what the file held. */
    else if (kind === "enum") {
      if (f.value === "") { delete target[key]; } else { target[key] = f.value; }
    }
    else if (kind === "bool") {
      if (f.value === "") { delete target[key]; } else { target[key] = f.value === "true"; }
    }
    /* AN EMPTY NUMBER FIELD IS "NOT IN THE FILE", NOT ZERO. It wrote
     * `parseInt("", 10) || 0`, so clearing a limit added `limit: 0` —
     * a fabricated value the reader never chose, and on a key whose
     * zero means "show nothing". Four field kinds honoured the unset
     * state and two did not, which is the same Form-disagrees-with-
     * Document defect the comment above claims to have closed. */
    else if (kind === "int") {
      if (String(f.value).trim() === "") { delete target[key]; }
      else { target[key] = parseInt(f.value, 10) || 0; }
    }
    else if (kind === "enumset") {
      var chosen = [], unset = false;
      for (j = 0; j < f.options.length; j++) {
        if (!f.options[j].selected) { continue; }
        /* The multi-select carries the same "not in the file" entry the
         * other kinds carry, as its first option. Choosing it means the
         * key stays out; an EMPTY selection means the empty list, which
         * is a different fact and one several entries give a meaning
         * to. The two used to be the same thing, and it was the wrong
         * one: opening the availability form and pressing Apply added
         * `kinds: []` to a widget that carried no `kinds` at all. */
        if (f.options[j].value === "") { unset = true; continue; }
        chosen.push(f.options[j].value);
      }
      if (unset && chosen.length === 0) { delete target[key]; }
      else { target[key] = chosen; }
    } else if (kind === "ref" || kind === "refs") {
      var refKind = f.getAttribute("data-ref-kind");
      if (f.value === "") { delete target[key]; repaired[key] = true; continue; }
      var built = null, k;
      if (refKind === "interface") {
        for (k = 0; k < INTERFACES.length; k++) {
          if (INTERFACES[k].identifier === f.value) { built = interfaceRef(INTERFACES[k].key); }
        }
      } else if (refKind === "owner") {
        for (k = 0; k < OWNERS.length; k++) {
          if (OWNERS[k].display_name === f.value) { built = ownerRef(OWNERS[k].key); }
        }
      } else {
        for (k = 0; k < CLIENTS.length; k++) {
          if ((CLIENTS[k].identity === "mac" ? CLIENTS[k].mac : CLIENTS[k].key) === f.value) { built = clientRef(CLIENTS[k].key); }
        }
      }
      if (built === null) { continue; }
      target[key] = kind === "ref" ? built : [built];

}

function applyForm() {
  var w = findWidget(state.selectedWidget);
  var repaired = {};
  readForm(w.parameters, repaired);
  var idx = activeCanvas().widgets.indexOf(w);
  Object.keys(repaired).forEach(function (key) {
    var path = "canvases[0].widgets[" + idx + "].parameters." + key + "[0]";
    IMPORT_REPORT = IMPORT_REPORT.filter(function (r) { return r.path !== path; });
  });
  UNRESOLVED_PATHS = IMPORT_REPORT.map(function (r) { return r.path; });
  renderAll();
  refreshDocDock();
}

/* ====================================================================
 * EDIT MODE
 *
 * Homarr's mechanics: a card is dragged to move it and dragged at its
 * right edge, bottom edge or bottom-right corner to resize it. Every
 * pointer gesture writes straight through to that widget's placement,
 * and the code view shows the new four integers immediately. The arrow
 * buttons stay as a keyboard-reachable fallback and do the same thing.
 * ==================================================================== */

var drag = null;

function gridMetrics() {
  var grid = document.getElementById("canvas-root");
  var cols = activeCanvas().grid.columns;
  var style = window.getComputedStyle(grid);
  var gap = parseFloat(style.columnGap) || 16;
  var rowGap = parseFloat(style.rowGap) || gap;
  var rowH = parseFloat(style.gridAutoRows) || activeCanvas().grid.row_height;
  var colW = (grid.clientWidth - gap * (cols - 1)) / cols;
  return { cols: cols, colW: colW + gap, rowH: rowH + rowGap };
}

function beginDrag(ev, id, mode) {
  var w = findWidget(id);
  if (!w) { return; }
  ev.preventDefault();
  var m = gridMetrics();
  drag = {
    id: id, mode: mode, metrics: m,
    x0: ev.clientX, y0: ev.clientY,
    px: w.placement.x, py: w.placement.y, pw: w.placement.w, ph: w.placement.h
  };
  LIVE.paused = true;
  state.selectedWidget = id;
  document.body.classList.add("is-dragging-active");
  renderAll();
}

function onDragMove(ev) {
  if (!drag) { return; }
  var w = findWidget(drag.id);
  if (!w) { return; }
  var m = drag.metrics;
  var dx = Math.round((ev.clientX - drag.x0) / m.colW);
  var dy = Math.round((ev.clientY - drag.y0) / m.rowH);
  var nx = w.placement.x, ny = w.placement.y, nw = w.placement.w, nh = w.placement.h;
  if (drag.mode === "move") {
    nx = Math.max(0, Math.min(m.cols - drag.pw, drag.px + dx));
    ny = Math.max(0, drag.py + dy);
  } else {
    if (drag.mode === "e" || drag.mode === "se") {
      nw = Math.max(2, Math.min(m.cols - drag.px, drag.pw + dx));
    }
    if (drag.mode === "s" || drag.mode === "se") {
      nh = Math.max(3, drag.ph + dy);
    }
  }
  if (nx === w.placement.x && ny === w.placement.y && nw === w.placement.w && nh === w.placement.h) { return; }
  w.placement.x = nx; w.placement.y = ny; w.placement.w = nw; w.placement.h = nh;
  renderAll();
  var card = document.querySelector('[data-widget-card="' + drag.id + '"]');
  if (card) { card.classList.add("is-dragging"); }
}

function endDrag() {
  if (!drag) { return; }
  drag = null;
  LIVE.paused = false;
  document.body.classList.remove("is-dragging-active");
  renderAll();
  refreshDocDock();
}

/* Whether a card clips depends on how wide the window is, so the marker
 * is re-measured when the window changes and not only when the page
 * redraws. */
window.addEventListener("resize", function () { fitFixedTables(); flagClippedCards(); enforceChartTextFloor(); });

document.addEventListener("pointermove", onDragMove);
document.addEventListener("pointerup", endDrag);
document.addEventListener("pointercancel", endDrag);

function moveWidget(id, direction) {
  var w = findWidget(id), cols = activeCanvas().grid.columns;
  if (direction === "left" && w.placement.x > 0) { w.placement.x -= 1; }
  if (direction === "right" && w.placement.x + w.placement.w < cols) { w.placement.x += 1; }
  if (direction === "up" && w.placement.y > 0) { w.placement.y -= 1; }
  if (direction === "down") { w.placement.y += 1; }
  renderAll();
  refreshDocDock();
}
function resizeWidget(id, how) {
  var w = findWidget(id), cols = activeCanvas().grid.columns;
  if (how === "narrower" && w.placement.w > 2) { w.placement.w -= 1; }
  if (how === "wider" && w.placement.x + w.placement.w < cols) { w.placement.w += 1; }
  if (how === "shorter" && w.placement.h > 3) { w.placement.h -= 1; }
  if (how === "taller") { w.placement.h += 1; }
  renderAll();
  refreshDocDock();
}

function openPicker() {
  var list = Object.keys(CATALOGUE).map(function (type) {
    var e = CATALOGUE[type];
    return '<button class="picker-item" data-pick="' + esc(type) + '">' +
      '<span class="pi-name">' + esc(e.title) + "</span>" +
      '<span class="pi-type">' + esc(type) + "</span></button>";
  }).join("");
  document.getElementById("picker-list").innerHTML = list;
  document.getElementById("picker-backdrop").hidden = false;
}
/* The value a newly added card starts each enum on, where the first
 * option in the list is not the right answer. */
var ADD_WIDGET_DEFAULTS = {
  period: "24h",
  scope: "all",
  measure: "bytes",
  size_by: "bytes",
  line_interpolation: "linear",
  /* blocking_reason is offered, not the default: an in/out card is
   * opened for bandwidth. */
  "traffic_composition.group_by": "interface",
  /* `none` is the single ring the catalogue describes. */
  "traffic_composition.split_by": "none",
  "unified_blocked_feed.group_by": "none",
  "owner_activity.sort": "volume",
  /* `client_volume_ranking.sort` and `top_sites.sort` used to sit here.
   * Neither entry declares a `sort` key, so neither default was ever
   * read by addWidget: dead weight that would one day have been offered
   * as a control. docs/mockups/check-inert-parameters.js now fails on
   * a default for a key its entry does not declare. */
  sort: "by_volume"
};

function addWidget(type) {
  var canvas = activeCanvas();
  var maxY = 0, i;
  for (i = 0; i < canvas.widgets.length; i++) {
    maxY = Math.max(maxY, canvas.widgets[i].placement.y + canvas.widgets[i].placement.h);
  }
  /* WHAT A NEWLY ADDED CARD OPENS WITH.
   * `options[0]` was seeding every enum, which made a new composition
   * card open on `blocking_reason` — the one grouping this page's own
   * comment above says is offered and is NOT the default — and seeded
   * `sort` from whatever happened to be listed first. The defaults are
   * named here, per key, and the fallback is the first option only
   * where no answer is better than another. */
  var params = {};
  CATALOGUE[type].params.forEach(function (s) {
    if (s.kind === "enum") {
      params[s.key] = ADD_WIDGET_DEFAULTS[type + "." + s.key] ||
                      ADD_WIDGET_DEFAULTS[s.key] || s.options[0];
      if (s.options.indexOf(params[s.key]) < 0) { params[s.key] = s.options[0]; }
    }
    else if (s.kind === "bool") { params[s.key] = true; }
    else if (s.kind === "int") { params[s.key] = 10; }
    else if (s.kind === "enumset") { params[s.key] = s.options.slice(); }
  });
  if (params.period) { params.period = "24h"; }
  var id = type.replace(/_/g, "-") + "-" + (canvas.widgets.length + 1);
  canvas.widgets.push({ id: id, type: type, placement: { x: 0, y: maxY, w: 6, h: 7 }, parameters: params });
  state.selectedWidget = id;
  document.getElementById("picker-backdrop").hidden = true;
  renderAll();
  refreshDocDock();
}

/* ====================================================================
 * THE CONTRAST SWEEP — A MEASURED SELF-CHECK, NOT A LIST
 *
 * Three correction rounds running, a colour token derived against one

/* ====================================================================

/* A picked mark, node or cell survives the two-second redraw: what was
 * opened stays open, and its figures refresh with everything else. */
function setPopup(wid, selKey, html) {
  state.popups[wid] = html;

   * card body holds, and a card that no longer fits has to say so. */

/* ---- The drill-down overlay -------------------------------------- *
 * A card body carries overflow: hidden, because no card may grow a

 * down the page instead. Details opened by a click go here. */

/* Clicking what is already open closes it, the way the gear and the
 * rail sheet already toggle. */
/* THE PANEL TAKES THE FOCUS, AND GIVES IT BACK.
 *
 * Every map mark, matrix cell and tree node is focusable, so the
 * keyboard reaches this panel — and on open `document.activeElement`
 * was still the mark, outside the panel's own container. That left the
 * focus nowhere a reader could act on. The body takes
 * the focus because it is the part that scrolls, and the element that
 * opened the dialog gets it back when the dialog closes. */

 * way to find its replacement: the data attributes the renderers stamp
 * on every openable thing are stable across a redraw. */

    if (v !== null) { parts.push("[" + DETAIL_OPENER_ATTRS[i] + '="' + CSS.escape(v) + '"]'); }

function focusDetail() {
  var body = document.getElementById("detail-body");
  if (body && !document.getElementById("detail-layer").hidden) {
    body.focus({ preventScroll: true });
  }

/* THE PANEL IS PLACED AGAINST THE MARK IT BELONGS TO.
 *
 * A popover that floats in the middle of the screen says nothing about
 * what it was opened from, and this one used to: it was centred on a
 * dimmed page. The anchor is the mark itself — a map point or a
 * person's block — found by the data attributes the renderers stamp,
 * which are stable across the two-second redraw; the card is the
 * fallback when the mark is no longer drawn. */

  var root = document.getElementById("canvas-root");

  } else if (d.kind === "slice") {
    /* Compared as strings: a category name is free text — "Other (3)" —
     * and does not survive being built into an attribute selector. */

    root.querySelectorAll("[data-slice]").forEach(function (m) {
      if (!found && m.getAttribute("data-slice-widget") === d.widget &&
          m.getAttribute("data-slice") === d.key &&
          m.getAttribute("data-slice-ring") === (d.ring || "")) { found = m; }
    });
    return found || document.querySelector('[data-widget-card="' + CSS.escape(d.widget) + '"]');
  } else {
    sel = '[data-owner-widget="' + CSS.escape(d.widget) + '"][data-owner="' + CSS.escape(d.key) + '"]';

/* Below the mark when it fits, above it when it does not, and never
 * past an edge of the viewport. Only the two custom properties are
 * written: on a phone the stylesheet ignores them and the panel is a
 * sheet on the bottom edge, so the breakpoint stays in one file. */

  var a = el.getBoundingClientRect(), box = pop.getBoundingClientRect();
  var gap = 8, edge = 8;
  var x = a.left + a.width / 2 - box.width / 2;
  var maxX = window.innerWidth - box.width - edge;

  if (y + box.height > window.innerHeight - edge) {
    var above = a.top - gap - box.height;
    y = above >= edge ? above : Math.max(edge, window.innerHeight - edge - box.height);

function openDetail(kind, widget, key, ring) {

  if (target === null && back.sel) { target = document.querySelector(back.sel); }

/* A DETAIL BELONGS TO THE CARD IT WAS OPENED FROM.
 * The overlay is positioned against the viewport, so scrolling left it
 * parked mid-screen with a different card behind it — two widgets

/* The mark whose detail is open is marked on the map itself, so the
 * overlay and the canvas cannot disagree about what was picked. */
function markSelection() {
  var root = document.getElementById("canvas-root"), d = state.detail;
  root.querySelectorAll("[data-map], [data-slice]").forEach(function (m) { m.classList.remove("is-open"); });
  if (!d) { return; }
  if (d.kind === "peer") {
    root.querySelectorAll('[data-map="' + d.widget + '"][data-peer="' + d.key + '"]')
      .forEach(function (m) { m.classList.add("is-open"); });
  } else if (d.kind === "slice") {
    /* A category label can hold a bracket or a quote — "Other (3)" does

     * built into an attribute selector. */

/* EVERY DETAIL IS REACHABLE WITHOUT A MOUSE.

 * The map marks, the matrix cells, the connection-tree nodes and the
 * person blocks all open something when they are clicked, and a click
 * was the only way in: a pointer cursor, no role saying what the thing
 * was, and nothing in the tab order. They now carry role="button" and a

    ev.preventDefault();
    ev.stopPropagation();
    run(ev);

 * gesture writes the view onto the transforms of a drawing that is

 * while the canvas itself is rebuilt every two seconds.

 * a mark must not end as a click on it. The threshold is six pixels of

       * mark regression. Capturing on the press sends every later
       * pointer event of the gesture — and with it the compatibility
       * mouseup — to the drawing instead of to the mark under the
       * finger, so the browser resolves the click against the drawing
       * and the mark, on which the button binding sits, is never the
       * click's target. A press that does not move still lands on the
       * mark, which is why a synthetic click and a click from an

      v.ty += (ev.clientY - pan.y) / s;
