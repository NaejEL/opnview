          esc(ck) + (d ? " · " + esc(d.addr) + " · " + esc(interfaceLabel(d.iface)) : "") +
          '</td><td class="num"></td><td class="num"></td>' +
          '<td class="num">' + fmtBytes(s.byClient[ck]) + '</td><td></td></tr>';
      });
    }
  });
  if (sites.length > shown.length) {
    html += "<tr><td>The other " + (sites.length - shown.length) + " named sites</td>" +
      '<td class="num">' + fmtInt(restFlows) + '</td><td class="num"></td><td class="num">' + fmtBytes(restBytes) + "</td><td></td></tr>";
  }
  html += '<tr class="is-total"><td>All named sites' + (minFlows > 0 ? " seen " + minFlows + " times or more" : "") + "</td>" +
    '<td class="num">' + fmtInt(attributedFlows) + "</td>" +
    '<td class="num"></td><td class="num">' + fmtBytes(sum(sites, function (e) { return e.bytes; })) + "</td><td></td></tr>";
  html += "</tbody></table>";
  return { body: html, meta: scopeMeta(scopeNames) };
};

RENDER.sites_by_client = function (w) {
  var per = w.parameters.sites_per_client || 3;
  var all = AGG.clients.slice().sort(function (a, b) { return b.bytes - a.bytes; });
  if (all.length === 0) {
    return { body: statePanel("silent", "No client in scope sent traffic across the firewall in this period."),
             meta: withScope(w, null) };
  }
  var shownClients = all.slice(0, 8);
  var html = '<table class="data"><thead><tr><th>Client</th><th>Top sites</th><th class="num">Attribution</th></tr></thead><tbody>';
  shownClients.forEach(function (d) {
    /* The widget's own aggregate, not the day's global table: this card
     * carries a period and an interface scope, and reading the raw rows
     * here is how it came to print one period's site names beside
     * another period's attribution rate. */
    var named = AGG.records.filter(function (r) {
      return r.scope === "north_south" && r.client === d.key && r.site !== null;
    }).sort(function (a, b) { return b.bytes - a.bytes; });
    var rows = named.slice(0, per);
    var cell;
    if (rows.length === 0) {
      cell = '<span class="muted">no site name could be inferred</span>';
    } else {
      cell = rows.map(function (r) {
        return esc(r.site) + ' <span class="muted">' + fmtInt(r.flows) + " flows · " + fmtBytes(r.bytes) + "</span>";
      }).join("<br>");
      /* The cap is stated where it bites, rather than leaving the
       * reader to assume three sites is all there was. */
      if (named.length > per) {
        cell += '<br><span class="muted">+' + (named.length - per) + " more, not shown</span>";
      }
    }
    /* NO FLOW TO ATTRIBUTE IS NOT A RATE, AND IT IS NOT A CRASH EITHER.
     * Zero named out of zero has no value and "0 %" would be false, so
     * nothing is printed — the em-dash this page uses everywhere else
     * for a figure that does not exist, and the word in the title. It
     * read `undefined` for ten rounds: the arithmetic was right and the
     * word was a programming term printed to a person. */
    var rate = d.nsFlows === 0 ? noFigure("no outbound flow to attribute")
                               : fmtPercent(d.attributed / d.nsFlows);
    html += "<tr><td>" + esc(d.key) + '<div class="muted" style="font-size:0.625rem">' + esc(interfaceLabel(d.iface)) + "</div></td>" +
      "<td>" + cell + "</td>" +
      '<td class="num">' + rate + "</td></tr>";
  });
  html += "</tbody></table>";
  if (all.length > shownClients.length) {
    html += '<div class="clip-note">' + (all.length - shownClients.length) +
      " more clients, not shown at this size</div>";
  }
  return { body: html, meta: withScope(w, null) };
};

RENDER.attribution_rate_per_client = function (w) {
  var ordered = AGG.clients.slice().sort(function (a, b) {
    if (a.nsFlows === 0) { return 1; }
    if (b.nsFlows === 0) { return -1; }
    return (a.attributed / a.nsFlows) - (b.attributed / b.nsFlows);
  });
  if (ordered.length === 0) {
    return { body: statePanel("silent", "No client in scope sent traffic across the firewall in this period."),
             meta: withScope(w, null) };
  }
  var rows = ordered.slice(0, w.parameters.limit || 8);
  var html = '<table class="data"><thead><tr><th>Client</th><th class="num">Outbound flows</th><th class="num">Named</th><th class="num">Rate</th><th class="num">Delay mean / max</th></tr></thead><tbody>';
  rows.forEach(function (d) {
    var dl = DELAYS[d.key];
    var rate, flagged = "";
    if (d.nsFlows === 0) {
      /* Same condition, same mark as the three cells beside it in this
       * very row, which have always printed the em-dash. */
      rate = noFigure("no outbound flow to attribute");
    } else {
      rate = fmtPercent(d.attributed / d.nsFlows);
      if (d.attributed / d.nsFlows < 0.4) { flagged = " is-flagged"; }
    }
    html += '<tr class="' + flagged.trim() + '"><td>' + esc(d.key) +
      '<div class="muted" style="font-size:0.625rem">' + esc(interfaceLabel(d.iface)) + "</div></td>" +
      '<td class="num">' + (d.nsFlows === 0 ? "—" : fmtInt(d.nsFlows)) + "</td>" +
      '<td class="num">' + (d.nsFlows === 0 ? "—" : fmtInt(d.attributed)) + "</td>" +
      '<td class="num">' + rate + "</td>" +
      '<td class="num">' + (dl.mean === null ? "—" : fmtSeconds(dl.mean) + " / " + fmtSeconds(dl.max)) + "</td></tr>";
  });
  html += "</tbody></table>";
  if (ordered.length > rows.length) {
    html += '<div class="clip-note">' + (ordered.length - rows.length) +
      " more clients, not shown at this size</div>";
  }
  return { body: html, meta: withScope(w, null) };
};

RENDER.passed_traffic_world_map = function (w) {
  var marks = AGG.mapAllowed;
  var placedBytes = AGG.mapAllowedPlacedBytes, placedConns = AGG.mapAllowedPlacedConns;
  var unplacedBytes = AGG.unplacedAllowedBytes + AGG.allowedEwBytes;
  var unplacedConns = AGG.unplacedAllowedFlows + AGG.allowedEwFlows;
  var html = '<div class="map-layout"><div>' + worldMapHtml(w.id, marks, "bytes", "map-mark-allowed") + "</div>";
  html += '<div class="map-side">';
  /* This map sizes its marks by volume, so the unplaced counter leads
   * with a volume; the connection count is a second measure and is
   * named as one rather than being the headline figure over a caption
   * that reads as its unit. */
  html += '<div class="counter"><span class="counter-value">' + fmtBytes(unplacedBytes) + "</span>" +
    "unplaced volume" +
    '<span class="counter-second">' + fmtInt(unplacedConns) + " connections not placed</span></div>";
  /* The three volumes are rounded together, so the table adds up in the
   * numbers a reader can see: rounded apart, 39.1 + 60.8 printed a
   * total of 100. */
  var vol = fmtBytesParts([placedBytes, unplacedBytes]);
  html += '<div class="popup"><div class="popup-title">Allowed traffic</div><dl>' +
    "<dt>Placed</dt><dd>" + vol.parts[0] + "</dd>" +
    "<dt>Unplaced</dt><dd>" + vol.parts[1] + "</dd>" +
    "<dt>Total allowed</dt><dd>" + vol.total + "</dd>" +
    "<dt>Connections placed</dt><dd>" + fmtInt(placedConns) + "</dd>" +
    "<dt>Connections unplaced</dt><dd>" + fmtInt(unplacedConns) + "</dd>" +
    "<dt>Connections total</dt><dd>" + fmtInt(placedConns + unplacedConns) + "</dd></dl></div>";
  /* A mark's detail opens over the canvas, not in this column: a card
   * body neither scrolls nor grows, and a nine-row detail dropped into
   * it is cut off at the card's edge. The line that used to say so has
   * gone with it — the marks carry a pointer cursor, a focus ring and a
   * button role, which is the affordance saying it. */
  html += "</div></div>";
  return { body: html, meta: withScope(w, null) };
};

RENDER.blocked_traffic_world_map = function (w) {
  var marks = AGG.mapBlocked;
  var placed = AGG.mapBlockedPlacedConns;
  var unplaced = AGG.mapBlockedUnplacedConns;
  var html = '<div class="map-layout"><div>' + worldMapHtml(w.id, marks, "connections", "map-mark-blocked") + "</div>";
  html += '<div class="map-side">';
  /* This map sizes its marks by connections, so its unplaced counter is
   * a connection count and says so. */
  html += '<div class="counter"><span class="counter-value">' + fmtInt(unplaced) + "</span>" +
    "unplaced connections</div>";
  html += '<div class="counter counter-dns"><span class="counter-value">' + fmtInt(AGG.dnsBlocked) + "</span>" +
    "refused lookups (no address) " +
    /* The refusal count narrows with the scope like every other figure
     * on this card: `dns_resolution` is keyed on the client, so a
     * scoped counter counts only the lookups the clients in scope
     * made. */
    '<button type="button" class="link-button" data-goto="widget:refused-lookups" ' +
    '>Blocked DNS lookups</button></div>';
  /* TWO POPULATIONS, TWO NAMES. The tile and the table below it both
   * said "placed" of different things: 2,318 inbound connections placed
   * by their SOURCE, and 998 outbound connections placed by their
   * DESTINATION. Same word, two counts an inch apart, nothing telling
   * them apart — so AC7's requirement that the counter reconcile in the
   * rendered numbers was not met on screen. Each is named for what it
   * is. */
  html += '<div class="counter"><span class="counter-value">' + fmtInt(AGG.inboundBlocked) + "</span>inbound connections, placed by source</div>";
  html += '<div class="popup"><div class="popup-title">Blocked connections</div><dl>' +
    "<dt>Outbound, placed by destination</dt><dd>" + fmtInt(placed) + "</dd>" +
    "<dt>Outbound, unplaced</dt><dd>" + fmtInt(unplaced) + "</dd>" +
    "<dt>Between interfaces</dt><dd>" + fmtInt(AGG.ewBlocked) + "</dd>" +
    "<dt>Inbound, placed by source</dt><dd>" + fmtInt(AGG.inboundBlocked) + "</dd>" +
    "<dt>Connections total</dt><dd>" + fmtInt(placed + unplaced + AGG.ewBlocked + AGG.inboundBlocked) + "</dd></dl>" +
    /* A refused lookup is not a connection and is therefore not a term
     * of this sum. Its count is on the tile above, in its own unit; the
     * reasoning is in the comment on the counter tile above. */
    "</div>";
  /* A mark's detail opens over the canvas, not in this column: a card
   * body neither scrolls nor grows, and a nine-row detail dropped into
   * it is cut off at the card's edge. The line that used to say so has
   * gone with it — the marks carry a pointer cursor, a focus ring and a
   * button role, which is the affordance saying it. */
  html += "</div></div>";
  return { body: html, meta: withScope(w, null) };
};

RENDER.interface_traffic_matrix = function (w) {
  /* docs/widget-catalogue.md, "Interface traffic matrix": `interfaces`
   * is "an optional list of interface references limiting the rows and
   * columns". The rows and the columns are therefore the scope, and the
   * east-west volume a scoped interface sent to one OUTSIDE the scope
   * gets a column of its own rather than falling out of the grid — a
   * margin that does not account for a row's whole volume is a wrong
   * margin, and this card's margins are the figure a reader checks. */
  var INTERFACES = AGG.interfaces;
  var scoped = AGG.ifaceScope !== null;
  var cols = INTERFACES.map(function (s) { return s.key; }).concat(["__external__"]);
  if (scoped) { cols.push("__out_of_scope__"); }
  var html = '<div class="matrix-scroll" tabindex="0" role="region" ' +
    'aria-label="Interface traffic matrix, scrolls sideways when it is wider than the card">' +
    '<table class="matrix"><thead><tr><th class="rowhead">From \\ To</th>';
  cols.forEach(function (c) {
    /* The axis carries the interface's configuration identifier under
     * its label, which is what the firewall keys everything on. It does
     * NOT carry addressing: gap G13, the schema stores none. */
    var head, sub;
    if (c === "__external__") { head = "Outside the network"; sub = "beyond every interface"; }
    else if (c === "__out_of_scope__") { head = "Interfaces not in scope"; sub = "inside the network, outside this card"; }
    else { head = interfaceLabel(c); sub = IFACE[c].identifier; }
    html += '<th class="colhead">' + esc(head) +
      '<span class="head-cidr">' + esc(sub) + "</span></th>";
  });
  html += '<th class="colhead margin">Row total</th></tr></thead><tbody>';
  var colTotals = {}, grand = 0;
  cols.forEach(function (c) { colTotals[c] = 0; });
  INTERFACES.forEach(function (s) {
    var rowTotal = 0;
    html += '<tr><th class="rowhead">' + esc(s.user_label) +
      '<span class="head-cidr">' + esc(s.identifier) + "</span></th>";
    cols.forEach(function (c) {
      var cell;
      if (c === "__out_of_scope__") {
        /* Every east-west cell of this row whose destination is not a
         * column, rolled into one. It is a cell like any other and it
         * opens the same drill-down, so the row's margin still accounts
         * for the whole of the row. */
        cell = null;
        Object.keys(AGG.matrix).forEach(function (mk) {
          if (mk.indexOf(s.key + ">") !== 0) { return; }
          var dst = mk.slice(s.key.length + 1);
          if (cols.indexOf(dst) >= 0) { return; }
          var from = AGG.matrix[mk];
          if (!cell) { cell = { bytes: 0, allowed: 0, blocked: 0, rules: {} }; }
          cell.bytes += from.bytes; cell.allowed += from.allowed; cell.blocked += from.blocked;
          Object.keys(from.rules).forEach(function (rk) { cell.rules[rk] = true; });
        });
      } else {
        cell = AGG.matrix[s.key + ">" + c];
      }
      if (!cell) {
        html += '<td class="empty-cell">·</td>';
        return;
      }
      rowTotal += cell.bytes; colTotals[c] += cell.bytes; grand += cell.bytes;
      var ruleNames = Object.keys(cell.rules).map(function (rk) {
        return RULE[rk] ? RULE[rk].description : "rule no longer exists";
      });
      if (c === "__out_of_scope__") {
        /* Rolled up from several destinations, so there is no single
         * cell behind it to open. It carries its figures and its whole
         * breakdown in a title, and no drill-down it cannot honour. */
        html += '<td class="cell' + (cell.blocked > 0 ? " has-blocked" : "") + '" title="' +
          esc(fmtBytes(cell.bytes) + " · " + fmtInt(cell.allowed) + " allowed · " + fmtInt(cell.blocked) +
              " blocked · sent to interfaces this card is not scoped to") + '">' +
          fmtBytes(cell.bytes) +
          (cell.blocked > 0 ? '<div style="font-size:0.625rem">' + fmtInt(cell.blocked) + " blocked</div>" : "") +
          "</td>";
        return;
      }
      html += '<td class="cell' + (cell.blocked > 0 ? " has-blocked" : "") + '" ' +
        'role="button" tabindex="0" aria-label="' +
        esc(s.user_label + " to " + (c === "__external__" ? "outside the network" : interfaceLabel(c)) +
            " — open the records behind this cell") + '" ' +
        'data-cell="' + esc(s.key + ">" + c) + '" title="' +
        esc(fmtBytes(cell.bytes) + " · " + fmtInt(cell.allowed) + " allowed · " + fmtInt(cell.blocked) + " blocked" +
            (ruleNames.length ? " · " + ruleNames.join("; ") : "")) + '">' +
        fmtBytes(cell.bytes) +
        (cell.blocked > 0 ? '<div style="font-size:0.625rem">' + fmtInt(cell.blocked) + " blocked</div>" : "") +
        "</td>";
    });
    html += '<td class="margin">' + fmtBytes(rowTotal) + "</td></tr>";
  });
  html += '<tr><th class="rowhead margin">Column total</th>';
  cols.forEach(function (c) { html += '<td class="margin">' + fmtBytes(colTotals[c]) + "</td>"; });
  html += '<td class="margin">' + fmtBytes(grand) + "</td></tr>";
  html += "</tbody></table></div>";
  html += '<div class="popup" id="popup-' + w.id + '" style="margin-top:0.4rem"><div class="popup-title">Pick a cell</div>' +
    "</div>";
  return { body: html, meta: withScope(w, null) };
};

RENDER.traffic_sankey = function (w) {
  var minShare = (w.parameters.min_share || 2) / 100;
  var maxNodes = w.parameters.max_nodes || 7;
  var total = sum(AGG.ribbons, function (r) { return r.bytes; });
  var kept = AGG.ribbons.filter(function (r) { return r.bytes / total >= minShare; }).slice(0, maxNodes);
  var keptBytes = sum(kept, function (r) { return r.bytes; });
  var otherBytes = total - keptBytes;

  var leftKeys = [], rightKeys = [], i;
  kept.forEach(function (r) {
    if (leftKeys.indexOf(r.left) < 0) { leftKeys.push(r.left); }
    if (rightKeys.indexOf(r.rightLabel) < 0) { rightKeys.push(r.rightLabel); }
  });
  if (otherBytes > 0) {
    /* The tail is one explicit band carrying its own total, on both
     * sides, rather than a long tail that makes the diagram unreadable
     * or a remainder that is quietly dropped. */
    kept = kept.concat([{ left: "Other", rightKind: "other", right: "Other", rightLabel: "Other", bytes: otherBytes, blocked: 0 }]);
    leftKeys.push("Other");
    rightKeys.push("Other");
  }

  /* THE GUTTERS ARE CUT FOR THE NAMES THIS DIAGRAM ACTUALLY PRINTS.
   * They were 92 units on each side, and an operator name of the length
   * this widget allows needs 140: the right-hand names ran past the edge
   * of the viewBox and were cut off there. The truncation stays — a name
   * longer than the allowance is elided with a character that says so —
   * but nothing is lost silently to the frame any more. */
  var W = 640, H = Math.max(180, 26 * Math.max(leftKeys.length, rightKeys.length) + 20);
  var rightNames = rightKeys.map(function (k) { return k.length > 28 ? k.slice(0, 27) + "…" : k; });
  var leftNames = leftKeys.map(interfaceLabel);
  var leftGutter = axisGutter(leftNames, 92), rightGutter = axisGutter(rightNames, 92);
  var nodeW = 10, leftX = leftGutter, rightX = W - rightGutter - nodeW;
  var leftTotal = {}, rightTotal = {};
  leftKeys.forEach(function (k) { leftTotal[k] = 0; });
  rightKeys.forEach(function (k) { rightTotal[k] = 0; });
  kept.forEach(function (r) { leftTotal[r.left] += r.bytes; rightTotal[r.rightLabel] += r.bytes; });

  var scale = (H - 20) / Math.max(sum(leftKeys.map(function (k) { return leftTotal[k]; }), function (v) { return v; }),
                                  sum(rightKeys.map(function (k) { return rightTotal[k]; }), function (v) { return v; }));
  var leftY = {}, rightY = {}, y = 10;
  leftKeys.forEach(function (k) { leftY[k] = y; y += leftTotal[k] * scale + 6; });
  y = 10;
  rightKeys.forEach(function (k) { rightY[k] = y; y += rightTotal[k] * scale + 6; });

  var out = ['<svg viewBox="0 0 ' + W + " " + (y + 6) + '" class="tree-svg" role="img" aria-label="Volume from each interface to each operator">'];
  var cursorL = {}, cursorR = {};
  leftKeys.forEach(function (k) { cursorL[k] = leftY[k]; });
  rightKeys.forEach(function (k) { cursorR[k] = rightY[k]; });
  kept.forEach(function (r) {
    var h = r.bytes * scale;
    var y0 = cursorL[r.left], y1 = cursorR[r.rightLabel];
    cursorL[r.left] += h; cursorR[r.rightLabel] += h;
    out.push('<polygon class="sankey-ribbon' + (r.left === "Other" ? " sankey-ribbon-other" : "") + '" points="' +
      (leftX + nodeW) + "," + y0.toFixed(1) + " " + rightX + "," + y1.toFixed(1) + " " +
      rightX + "," + (y1 + h).toFixed(1) + " " + (leftX + nodeW) + "," + (y0 + h).toFixed(1) + '"></polygon>');
  });
  leftKeys.forEach(function (k) {
    out.push('<rect class="sankey-node" x="' + leftX + '" y="' + leftY[k].toFixed(1) + '" width="' + nodeW + '" height="' + (leftTotal[k] * scale).toFixed(1) + '"></rect>');
    out.push('<text x="' + (leftX - 5) + '" y="' + (leftY[k] + leftTotal[k] * scale / 2 + 3).toFixed(1) + '" text-anchor="end">' + esc(interfaceLabel(k)) + "</text>");
  });
  rightKeys.forEach(function (k) {
    out.push('<rect class="sankey-node" x="' + rightX + '" y="' + rightY[k].toFixed(1) + '" width="' + nodeW + '" height="' + (rightTotal[k] * scale).toFixed(1) + '"></rect>');
    out.push('<text x="' + (rightX + nodeW + 5) + '" y="' + (rightY[k] + rightTotal[k] * scale / 2 + 3).toFixed(1) + '" text-anchor="start">' + esc(rightNames[rightKeys.indexOf(k)]) + "</text>");
  });
  out.push("</svg>");
  /* The two ends as HTML text, for the widths at which the names in the
   * drawing would be too small to read. The ribbons still show the
   * shape; this says whose they are. */
  out.push(chartFallback("",
    fallbackList(leftKeys, 4, function (k) {
      return "<li><span>" + esc(interfaceLabel(k)) + "</span><span>" + fmtBytes(leftTotal[k]) + "</span></li>";
    }, "interfaces") +
    fallbackList(rightKeys, 4, function (k) {
      return "<li><span>" + esc(k) + "</span><span>" + fmtBytes(rightTotal[k]) + "</span></li>";
    }, "operators")));

  var html = out.join("") +
    '<table class="data"><tbody>' +
    '<tr><td>Ribbons drawn</td><td class="num">' + fmtBytes(keptBytes) + "</td></tr>" +
    '<tr><td>Other, collapsed below ' + (minShare * 100) + " % of the total</td>" +
    '<td class="num">' + fmtBytes(otherBytes) + "</td></tr>" +
    '<tr class="is-total"><td>All relationships</td><td class="num">' + fmtBytes(total) + "</td></tr></tbody></table>";
  return { body: html, meta: withScope(w, null) };
};

/* THE CONNECTION TREE, AGAINST ITS CATALOGUE ENTRY.
 *
 * docs/widget-catalogue.md, "Connection tree", asks for four things the
 * drawing did not carry: every node's rolled-up volume AND connection
 * count; an explicit remainder child wherever `limit_per_level` cuts a
 * level, so that a node's children sum exactly to the node; blocked
 * connections drawn with a mark of their own rather than filtered out;
 * and the ten parameters it declares, of which the form offered four.
 *
 * The SHAPE is docs/ui-references.md's, not the catalogue's — two
 * mirrored trees from one root, with depth as a control and a docked
 * detail panel. The two documents disagree here and the disagreement is
 * declared here rather than resolved quietly.
 */
function treeLabelFor(kind, o) {
  /* THE OPERATOR'S NAME LEADS, THE AS NUMBER FOLLOWS.
   * "AS15169 Google L…" kept the machine identifier whole and cut the
   * human name — standing lesson 5, verbatim. The tree is the one place
   * on this page where a label is cut by construction, so here the name
   * goes first and the number is what gives way. */
  /* AND THE COUNTRY IS PART OF THE NAME, not an extra the drawing drops.
   * docs/widget-catalogue.md, "Connection tree", "Shows": a destination
   * is named "by its site name where one was inferred and by its
   * operator and country otherwise". The operator level is the
   * otherwise, so the country code belongs in the label the reader
   * sees, and the AS number is what gives way when the label is cut. */
  if (kind === "operator") { return o.op + " · " + o.cc + " · AS" + o.asn; }
  /* A destination the geolocation cache could not place. The entry is
   * imperative about it: the branch is kept and labelled with its
   * lookup_state. The address is what the cache holds — there is no
   * operator and no country to name it by. */
  /* THE LOOKUP STATE LEADS, THE ADDRESS FOLLOWS — standing lesson 5
   * again. With the address first, the cut produced "193.32.162.14 · …"
   * and what fell off was the only part the entry actually requires:
   * the branch is "labelled with its lookup_state". The state is short,
   * so it survives every width; the address is what gives way. */
  if (kind === "unplaced") { return "not placed (" + o.geo + ") · " + o.addr; }
  return o;
}

function treeRemainder(rows, cap, level, noun) {
  /* A LEVEL THAT IS CUT SAYS SO, AND SAYS HOW MUCH.
   * The entry is explicit: a level truncated by `limit_per_level`
   * carries an explicit remainder child rather than quietly losing its
   * tail, because an expansion that does not reconcile teaches the
   * reader to distrust every figure above it. */
  if (rows.length <= cap) { return rows; }
  var kept = rows.slice(0, cap), tail = rows.slice(cap);
  kept.push({
    level: level, remainder: true,
    /* Short in the drawing, whole in the title and in the text list
       beneath it: this label is the one the tree would cut first. */
    label: "+" + tail.length + " more",
    fullLabel: tail.length + " more " + noun + ", not expanded",
    bytes: sum(tail, function (r) { return r.bytes; }),
    conns: sum(tail, function (r) { return r.conns; }),
    blocked: sum(tail, function (r) { return r.blocked; }),
    key: null
  });
  return kept;
}

function treeSort(rows, sortKey) {
  return rows.slice().sort(function (a, b) {
    if (sortKey === "name") { return a.label < b.label ? -1 : (a.label > b.label ? 1 : 0); }
    if (sortKey === "connections") { return b.conns - a.conns; }
    return b.bytes - a.bytes;
  });
}

RENDER.connection_tree = function (w) {
  var p = w.parameters;
  var rootLevel = p.root || "interface";
  var depth = p.depth || 3;
  var cap = p.limit_per_level || 6;
  var measure = p.measure === "connections" ? "connections" : "bytes";
  var sortKey = p.sort || "volume";
  var includeBlocked = p.include_blocked !== false;

  var ifaceScope = scopedInterfaceKeys(w);
  var clientScope = scopedClientKeys(w);
  var ownerScope = scopedOwnerKeys(w);
  var scopeNames = [];
  if (ifaceScope) { scopeNames = scopeNames.concat(ifaceScope.map(interfaceLabel)); }
  if (clientScope) { scopeNames = scopeNames.concat(clientScope); }
  if (ownerScope) {
    scopeNames = scopeNames.concat(AGG.owners.filter(function (o) { return ownerScope.indexOf(o.key) >= 0; })
      .map(function (o) { return o.name; }));
  }

  var inScopeClient = function (c) {
    if (ifaceScope && ifaceScope.indexOf(c.iface) < 0) { return false; }
    if (clientScope && clientScope.indexOf(c.key) < 0) { return false; }
    if (ownerScope && ownerScope.indexOf(c.owner) < 0) { return false; }
    return true;
  };
  var clients = AGG.clients.filter(inScopeClient);
  var clientKeys = clients.map(function (c) { return c.key; });
  var rowsInScope = AGG.records.filter(function (r) { return clientKeys.indexOf(r.client) >= 0; });
  if (!includeBlocked) {
    rowsInScope = rowsInScope.filter(function (r) { return r.flows - r.blocked > 0; });
  }
  if (rowsInScope.length === 0) {
    return { body: statePanel("silent", "No connection in scope crossed the firewall in this period."),
             meta: scopeMeta(scopeNames) };
  }

  /* One node's three figures, from the same rows every time: the volume,
   * the connection count and the blocked share of that count. */
  /* The node keeps the rows it was built from, so a level that expands
   * expands its own rows rather than re-deriving them from a key — the
   * re-derivation is what dropped a whole class of destination, because
   * a key built from an AS number cannot name a peer that has none. */
  var nodeOf = function (level, label, key, rows, parent) {
    return {
      level: level, label: label, key: key, rows: rows,
      parent: parent || null,
      bytes: sum(rows, function (r) { return r.bytes; }),
      conns: sum(rows, function (r) { return includeBlocked ? r.flows : r.flows - r.blocked; }),
      blocked: includeBlocked ? sum(rows, function (r) { return r.blocked; }) : 0
    };
  };

  /* ---- Inside the firewall, on the left. Its first level is the
   * `root` parameter, which docs/ui-references.md names as the lever
   * this widget lives or dies by. */
  var leftRows = [], firstLevel = [];
  if (rootLevel === "client") {
    firstLevel = clients.map(function (c) {
      return nodeOf(1, c.key, "client:" + c.key,
                    rowsInScope.filter(function (r) { return r.client === c.key; }));
    });
  } else if (rootLevel === "owner") {
    firstLevel = AGG.owners.filter(function (o) {
      return o.clients.some(function (c) { return clientKeys.indexOf(c.key) >= 0; });
    }).map(function (o) {
      var keys = o.clients.map(function (c) { return c.key; });
      return nodeOf(1, o.name, "owner:" + o.key,
                    rowsInScope.filter(function (r) { return keys.indexOf(r.client) >= 0; }));
    });
  } else {
    firstLevel = AGG.interfaces.filter(function (s) {
      return clients.some(function (c) { return c.iface === s.key; });
    }).map(function (s) {
      return nodeOf(1, s.user_label, "interface:" + s.key,
                    rowsInScope.filter(function (r) { return interfaceOf(r.client) === s.key; }));
    });
  }
  firstLevel = treeRemainder(treeSort(firstLevel, sortKey), cap, 1,
                             rootLevel === "owner" ? "people" : (rootLevel === "client" ? "clients" : "interfaces"));
  firstLevel.forEach(function (n) {
    leftRows.push(n);
    if (depth < 2 || n.remainder || rootLevel === "client") { return; }
    var children = clients.filter(function (c) {
      return rootLevel === "owner" ? ("owner:" + c.owner) === n.key : ("interface:" + c.iface) === n.key;
    }).map(function (c) {
      return nodeOf(2, c.key, "client:" + c.key,
                    rowsInScope.filter(function (r) { return r.client === c.key; }), n.key);
    }).filter(function (c) { return c.conns > 0 || c.bytes > 0; });
    treeRemainder(treeSort(children, sortKey), cap, 2, "clients")
      .forEach(function (c) { c.parent = n.key; leftRows.push(c); });
  });

  /* ---- Outside the firewall, on the right: operator, then the site
   * names the resolver could infer under it. */
  var nsRows = rowsInScope.filter(function (r) { return r.scope === "north_south"; });
  var rightLevel1 = AGG.operators.filter(function (o) {
    return nsRows.some(function (r) { return PEER[r.peer].asn === o.asn; });
  }).map(function (o) {
    return nodeOf(1, treeLabelFor("operator", o), "operator:" + o.asn,
                  nsRows.filter(function (r) { return PEER[r.peer].asn === o.asn; }));
  });
  /* A DESTINATION THE GEOLOCATION CACHE COULD NOT PLACE KEEPS ITS
   * BRANCH. docs/widget-catalogue.md, "Connection tree", "Data", is
   * imperative about it: such a destination "keeps its branch and is
   * labelled with its lookup_state, never dropped". The level above was
   * built from AGG.operators, which is derived from placed peers only,
   * so every unplaced destination reached this side nowhere — the same
   * volume both world maps report as unplaced for AC7. The branch is
   * built from the peer itself, which is the only thing that exists
   * when there is no operator and no country to name it by. */
  var unplacedKeys = {};
  nsRows.forEach(function (r) {
    if (PEER[r.peer].geo !== "resolved") { unplacedKeys[r.peer] = true; }
  });
  Object.keys(unplacedKeys).forEach(function (pk) {
    rightLevel1.push(nodeOf(1, treeLabelFor("unplaced", PEER[pk]), "unplaced:" + pk,
                            nsRows.filter(function (r) { return r.peer === pk; })));
  });
  var rightRows = [];
  /* The noun is "destinations" and not "operators": since the unplaced
   * branches joined this level, what a cut level cuts is no longer one
   * kind of thing. */
  treeRemainder(treeSort(rightLevel1, sortKey), cap, 1, "destinations").forEach(function (n) {
    rightRows.push(n);
    if (depth < 3 || n.remainder) { return; }
    /* A NODE'S CHILDREN SUM EXACTLY TO THE NODE.
     * Not every connection to a destination carries an inferred site
     * name, and dropping the unnamed ones left this level short of its
     * parent — which is the thing docs/widget-catalogue.md says teaches
     * a reader to distrust every figure above it. The unnamed traffic
     * is a branch of its own, named for the condition rather than
     * hidden: a destination the resolver never named is still a
     * destination. The split is over the node's OWN rows, so an
     * unplaced branch expands by exactly the same rule. */
    var names = {};
    n.rows.forEach(function (r) { names[r.site === null ? "" : r.site] = true; });
    var children = Object.keys(names).map(function (name) {
      var sub = n.rows.filter(function (r) { return (r.site === null ? "" : r.site) === name; });
      return name === ""
        ? nodeOf(2, "no site name inferred", "unnamed:" + n.key, sub, n.key)
        : nodeOf(2, name, "site:" + name, sub, n.key);
    });
    /* A single "no site name inferred" child is the parent restated
     * under another name, so the node is drawn as the leaf it is. */
    if (children.length === 1 && children[0].label === "no site name inferred") { return; }
    treeRemainder(treeSort(children, sortKey), cap, 2, "site names")
      .forEach(function (c) { c.parent = n.key; rightRows.push(c); });
  });

  var weightOf = function (r) { return measure === "connections" ? r.conns : r.bytes; };
  var measureOf = function (r) { return measure === "connections" ? fmtInt(r.conns) + " connections" : fmtBytes(r.bytes); };
  var bothOf = function (r) { return fmtBytes(r.bytes) + " · " + fmtInt(r.conns) + " connections" +
                                     (r.blocked > 0 ? " · " + fmtInt(r.blocked) + " blocked" : ""); };

  var rowH = 20;
  var H = Math.max(leftRows.length, rightRows.length) * rowH + 24;
  var W = 640, cx = W / 2;
  var maxW = Math.max(
    sum(leftRows.filter(function (r) { return r.level === 1; }), weightOf),
    sum(rightRows.filter(function (r) { return r.level === 1; }), weightOf), 1);
  var out = ['<svg viewBox="0 0 ' + W + " " + H + '" class="tree-svg" role="img" ' +
    'aria-label="Two mirrored trees from the firewall: ' + esc(rootLevel) + ' inside, operator outside">'];
  out.push('<rect class="tree-node tree-node-root" x="' + (cx - 30) + '" y="' + (H / 2 - 9) + '" width="60" height="18"></rect>');
  out.push('<text x="' + cx + '" y="' + (H / 2 + 3) + '" text-anchor="middle">firewall</text>');

  function drawSide(rows, sign, cls) {
    rows.forEach(function (r, i) {
      var y = 14 + i * rowH;
      var x = cx + sign * (46 + r.level * 62);
      var wpx = Math.max(6, 46 * Math.sqrt(weightOf(r) / maxW));
      var nodeCls = cls + (r.remainder ? " tree-node-remainder" : "") +
                    (r.blocked > 0 ? " tree-node-blocked" : "");
      var full = (r.fullLabel || r.label) + " — " + bothOf(r);
      out.push('<line class="tree-edge" x1="' + (cx + sign * 30) + '" y1="' + (H / 2) + '" x2="' + x + '" y2="' + y + '"></line>');
      out.push('<rect class="tree-node ' + nodeCls + '"' +
        /* The docked panel names the node the way the drawing names it.
         * It was titling an operator branch "15169" — the AS number
         * alone, off the key — where docs/widget-catalogue.md,
         * "Connection tree", "Shows", asks for the operator AND the
         * country. The label the tree already built carries both. */
        (r.key ? ' data-tree="' + w.id + '" data-node="' + esc(r.key) + '"' +
                 ' data-label="' + esc(r.fullLabel || r.label) + '" role="button" tabindex="0"'
               /* A collapsed remainder is a band, not a branch: there is
                * no node behind it to open. Akvorado's honest tail. Its
                * figure is in the HTML branch list under the drawing, so
                * nothing about it is hover-only. */
               : ' data-decorative="a collapsed remainder band, not a branch"') +
        /* The three figures, the level and the parent key are on the
         * node itself, so docs/mockups/check-tree-reconciliation.js
         * reads what the reader sees rather than a private variable. */
        ' data-bytes="' + r.bytes + '" data-conns="' + r.conns + '" data-blocked="' + r.blocked + '"' +
        ' data-level="' + r.level + '"' + (r.parent ? ' data-parent="' + esc(r.parent) + '"' : "") +
        ' aria-label="' + esc(full + (r.key ? " — open this branch" : "")) + '" ' +
        'x="' + (sign < 0 ? x - wpx : x) + '" y="' + (y - 6) + '" width="' + wpx.toFixed(1) + '" height="12">' +
        "<title>" + esc(full) + "</title></rect>");
      /* BLOCKED CONNECTIONS ARE DRAWN, NOT FILTERED OUT. A branch that
       * exists only because something was refused is visible as such:
       * the node carries a hatched cap sized to its blocked share. */
      if (r.blocked > 0 && r.conns > 0) {
        var bpx = Math.max(2, wpx * (r.blocked / r.conns));
        out.push('<rect class="tree-blocked-share" x="' +
          (sign < 0 ? x - wpx : x + wpx - bpx) + '" y="' + (y - 6) +
          '" width="' + bpx.toFixed(1) + '" height="12"></rect>');
      }
      /* Every label carries its whole text and both of its figures in a
       * <title>, because this is the one drawing on the page that cuts a
       * name by construction.
       *
       * AND THE LABEL PICKS THE NODE IT NAMES. It carried the <title>
       * and nothing else — no role, no tab index, no handler — so the
       * only way to read a cut name was a browser tooltip, on the shape
       * a reader actually aims at: the name, not the bar beside it. It
       * opens the same branch the bar opens, from the same attributes. */
      out.push('<text x="' + (sign < 0 ? x - wpx - 4 : x + wpx + 4) + '" y="' + (y + 3) +
        '" text-anchor="' + (sign < 0 ? "end" : "start") + '"' +
        (r.key ? ' class="tree-label" data-tree="' + w.id + '" data-node="' + esc(r.key) + '"' +
                 ' data-label="' + esc(r.fullLabel || r.label) + '"' +
                 ' data-bytes="' + r.bytes + '" data-conns="' + r.conns + '"' +
                 ' data-blocked="' + r.blocked + '" role="button" tabindex="0"' +
                 ' aria-label="' + esc(full + " — open this branch") + '"'
               : ' data-decorative="a collapsed remainder band, not a branch"') + ">" +
        esc(r.label.length > 17 ? r.label.slice(0, 16) + "…" : r.label) +
        "<title>" + esc(full) + "</title></text>");
    });
  }
  drawSide(leftRows, -1, "tree-node-left");
  drawSide(rightRows, 1, "tree-node-right");
  out.push("</svg>");
  /* The two branches as HTML text, for the widths at which the names in
   * the drawing would be too small to read. A tree whose labels have
   * become a grey smear is a picture of nothing; the same names at the
   * page's own size still answer who is on each side. */
  var branchItem = function (r) {
    return '<li><span' + (r.remainder ? ' class="muted"' : "") + ">" +
      (r.level === 2 ? "&nbsp;&nbsp;" : "") + esc(r.fullLabel || r.label) +
      "</span><span>" + esc(measureOf(r)) + "</span></li>";
  };
  out.push(chartFallback("",
    '<div class="fb-head">Inside</div>' + fallbackList(leftRows, 6, branchItem, "branches") +
    '<div class="fb-head">Outside</div>' + fallbackList(rightRows, 5, branchItem, "branches")));
  var html = '<div class="tree-layout"><div>' + out.join("") + "</div>" +
    '<div class="map-side"><div class="popup" id="popup-' + w.id + '"><div class="popup-title">Pick a node</div>' +
    "</div>" +
    '<div class="legend"><span class="legend-item"><span class="swatch sw-blocked"></span>Blocked share of a node</span>' +
    '<span class="legend-item"><span class="swatch sw-remainder"></span>The rest of a cut level</span></div>' +
    "</div></div>";
  return { body: html, meta: scopeMeta(scopeNames) };
};

RENDER.client_traffic_detail = function (w) {
  var ref = w.parameters.client;
  var clientKey = ref && ref.label && CLIENT[ref.label] ? ref.label : null;
  if (clientKey === null) {
    /* client is a required parameter of this entry. With none chosen the
     * widget states what it needs rather than showing an empty table. */
    return {
      body: statePanel("unresolved", ref ? "Client " + ref.value + " not found here." : "No client chosen.")
    };
  }
  var rows = RECORDS.filter(function (r) { return r.client === clientKey; });
  if (rows.length === 0) {
    return { body: statePanel("silent", "No traffic across the firewall.") };
  }

  /* One subject, one window, two renderings behind a single toggle:
   * activity on one side, raw flows on the other — the shape recorded
   * as the per-client preference in docs/ui-references.md. */
  var view = state.toggles[w.id] || "activity";
  var d = CLIENT[clientKey];
  var bps = LIVE.bps[clientKey] || 0;
  var totBytes = sum(rows, function (r) { return r.bytes; });
  var share = function (r) { return totBytes ? r.bytes / totBytes : 0; };
  var sorted = rows.slice().sort(function (a, b) { return b.bytes - a.bytes; });
  var limit = Math.min(sorted.length, w.parameters.limit || 8, 8);
  var shown = sorted.slice(0, limit);
  var maxShare = share(sorted[0]) || 1;

  var html = '<div class="client-head">' +
    '<div class="figure"><span class="figure-value">' + esc(fmtBits(bps)) + "</span>" +
    '<span class="figure-label">' + esc(d.addr) + " · " + esc(interfaceLabel(d.iface)) + "</span></div>" +
    '<div class="client-toggle">' +
      '<button class="btn btn-small" data-toggle="' + esc(w.id) + '" data-view="activity" aria-selected="' + (view === "activity") + '">Activity</button>' +
      '<button class="btn btn-small" data-toggle="' + esc(w.id) + '" data-view="flows" aria-selected="' + (view === "flows") + '">Flows</button>' +
    "</div></div>";

  if (view === "activity") {
    shown.forEach(function (r) {
      var name = r.scope === "east_west" ? interfaceLabel(r.dstIface)
               : (r.site || PEER[r.peer].op || PEER[r.peer].addr);
      html += '<div class="bar-row">' +
        '<span class="bar-label">' + esc(name) +
          (r.blocked > 0 ? ' <span class="badge badge-blocked">blocked</span>' : "") + "</span>" +
        '<span class="bar-track"><span class="bar-fill bar-fill-plain" style="width:' +
          (share(r) / maxShare * 100).toFixed(2) + '%"></span></span>' +
        '<span class="bar-value">' + esc(fmtBits(bps * share(r))) + "</span></div>";
    });
  } else {
    html += '<table class="data"><thead><tr><th>Flow</th><th class="num">Conn.</th><th class="num">Bytes</th></tr></thead><tbody>';
    shown.forEach(function (r) {
      var far = r.scope === "east_west" ? interfaceLabel(r.dstIface) + ":*" : PEER[r.peer].addr + ":443";
      html += '<tr' + (r.blocked > 0 ? ' class="is-flagged"' : "") + '><td class="mono">' +
        esc(d.addr) + " ⇄ " + esc(far) + "</td>" +
        '<td class="num">' + fmtInt(r.flows) + "</td>" +
        '<td class="num">' + fmtBytes(r.bytes) + "</td></tr>";
    });
    html += "</tbody></table>";
  }
  if (sorted.length > shown.length) {
    html += '<div class="clip-note">' + (sorted.length - shown.length) +
      " more destinations, not shown at this size · " +
      fmtBytes(sum(sorted.slice(limit), function (r) { return r.bytes; })) + "</div>";
  }
  return { body: html };
};

RENDER.unified_blocked_feed = function (w) {
  /* Live at the top, the standing decisions below. New rows arrive as
   * the engines make them; older rows age down the list.
   *
   * Every row names the TARGET it stopped, not the direction it stopped
   * it in: the domain where the resolver saw one, the address and the
   * port otherwise. The rows are built from the blocked records
   * themselves rather than from the per-rule roll-up, because the
   * roll-up has already thrown the target away. */
  var entries = LIVE.feed.slice(0, 6).map(function (e) {
    return { time: e.time, engine: e.engine, what: e.what, by: e.by, count: e.count, fresh: true };
  });
  var stamps = ["12:38", "12:31", "12:19", "11:58", "11:44", "11:12", "11:03", "10:47", "10:22", "09:58"];
  /* THE THREE STANDING LANES COME FROM THE WIDGET'S OWN AGGREGATE, not
   * from the day's global tables. The four figures above them already
   * did, so at any period but the canvas's the feed listed one period's
   * rows under another period's totals — and the interface scope could
   * not reach it at all. */
  var RECORDS = AGG.records, INBOUND = AGG.inbound, DNS_BLOCKS = AGG.dnsRows;
  var outbound = RECORDS.filter(function (r) { return r.blocked > 0; })
    .slice().sort(function (a, b) { return b.blocked - a.blocked; })
    .map(function (r, i) {
      return {
        time: stamps[i % stamps.length],
        engine: "Firewall rule, outbound",
        what: r.client + " → " + blockedTarget(r),
        by: RULE[r.rule] ? RULE[r.rule].pf : "rid " + UNKNOWN_RID + ", rule gone",
        count: r.blocked
      };
    });
  var inbound = INBOUND.filter(function (r) { return r.blocked > 0; }).map(function (r, i) {
    return {
      time: ["12:40", "12:27", "12:06", "11:49"][i % 4],
      engine: r.rule ? "Firewall rule, inbound" : "Firewall drop, inbound",
      what: PEER[r.peer].addr + " → this firewall" + (r.dstPort ? ":" + r.dstPort : ""),
      by: r.rule ? RULE[r.rule].pf : "no rule matched · reason " + r.logReason,
      count: r.blocked
    };
  });
  var refused = DNS_BLOCKS.slice().sort(function (a, b) { return b.count - a.count; })
    .map(function (d, i) {
      return {
        /* The list's name, which the endpoint reports, and the purpose a
         * person assigned to it where somebody has. A list nobody has
         * classified is named and marked, never sorted into a category
         * on the strength of what it is called. */
        time: ["12:41", "12:36", "12:22", "12:04", "11:51", "11:20", "11:07"][i % 7],
        engine: "DNS list",
        what: d.clients[0] + " → " + d.domain,
        by: d.list ? (d.list + " · " + (blocklistPurpose(d.list) || "purpose not assigned"))
                   : "list not recorded",
        count: d.count
      };
    });
  /* THE FEED IS ONE ORDERING, NEWEST FIRST, BY EACH ROW'S OWN TIME.
   *
   * The live rows used to be concatenated ahead of the standing ones and
   * the standing ones interleaved lane by lane, so the card read
   * 12:44:02, 12:44:00, 12:43:58, then 12:38, 12:40, 12:41 — older, and
   * ascending among themselves, with nothing marking the break. A feed
   * that is not in time order is not a feed. Every row now sorts on its
   * own timestamp, which also keeps the engines mixed on their own
   * merits rather than by a lane rotation: a row is above another
   * because it happened later, and for no other reason. */
  entries = entries.concat(outbound, inbound, refused);
  entries.sort(function (a, b) { return timeSeconds(b.time) - timeSeconds(a.time); });
  var html = '<div class="figures">' +
    '<div class="figure"><span class="figure-value">' + fmtInt(AGG.blockedFeedTotal) + '</span><span class="figure-label">Blocked, all engines</span></div>' +
    '<div class="figure"><span class="figure-value">' + fmtInt(AGG.ruleBlocked) + '</span><span class="figure-label">By firewall rules</span></div>' +
    '<div class="figure"><span class="figure-value">' + fmtInt(AGG.dnsBlocked) + '</span><span class="figure-label">By DNS lists</span></div>' +
    /* Not credited to any rule, because no rule decided them: their
     * log_reason is not a match. */
    '<div class="figure"><span class="figure-value">' + fmtInt(AGG.noRuleDrops) + '</span><span class="figure-label">No rule matched</span></div>' +
    "</div>";
  /* THE FEED IS CUT TO WHAT FITS, AFTER LAYOUT, NOT TO A ROW COUNT.
   * Nine rows was a guess at a height: a row wraps to two lines when
   * the client and the domain are long, so the same nine rows fitted
   * the card on one tick and ran twenty-four pixels past it on the
   * next. The list is trimmed by fitFeedLists() once the rows have been
   * measured, and the note below it counts what was actually left out.
   * The whole set is offered here and the count of it is on the list,
   * so the note can be rewritten without re-deriving anything. */
  /* `limit` is how many rows the feed offers before the layout pass
   * trims further; the note below the list counts whatever was left
   * out, by either cut, so the two cannot disagree. */
  var shownFeed = entries.slice(0, Math.min(w.parameters.limit || 12, 12));
  /* The column names, over the list's own grid. "Connections" is
   * docs/widget-catalogue.md's own word for this figure — its Required
   * UI copy clause calls it "the connection counts" — and the
   * observation-point sentence below the card is what qualifies it. */
  html += '<div class="feed-head">' +
    '<span class="time">Time</span><span class="engine">Engine</span>' +
    '<span class="what">What was stopped</span>' +
    '<span class="num">Connections</span></div>';
  html += '<ul class="feed" data-feed-total="' + entries.length + '">';
  shownFeed.forEach(function (e) {
    html += '<li' + (e.fresh ? ' class="is-new"' : "") + '><span class="time">' + esc(e.time) + '</span><span class="engine">' + esc(e.engine) + "</span>" +
      '<span class="what">' + esc(e.what) + ' <span class="by">' + esc(e.by) + "</span></span>" +
      /* Named on the row as well as in the header, because a row read
       * on its own — by a screen reader, or in a title — carries no
       * header with it. */
      '<span class="num" title="' + fmtInt(e.count) + ' connections">' + fmtInt(e.count) + "</span></li>";
  });
  html += "</ul>";
  html += '<div class="clip-note" data-feed-note="1"' +
    (entries.length > shownFeed.length ? "" : " hidden") + ">" +
    fmtInt(entries.length - shownFeed.length) +
    " older blocks, not shown at this size</div>";
  html += '<div class="state state-disabled" style="margin-top:0.4rem">' +
    '<span class="state-badge">Switched off</span>' +
    '<p class="state-text">Detection engine stopped 06:12.</p>' +
    '<button type="button" class="link-button" data-goto="availability">Sources</button></div>';
  return { body: html, meta: withScope(w, null) };
};

RENDER.blocked_by_firewall_rule = function (w) {
  var all = AGG.blockedByRule;
  /* `limit` is "how many rules to show". The rules it cuts are rolled
   * into one explicit row carrying their own blocked count, so the
   * reconciling total below stays the total of everything above it —
   * which is the figure rounds 6 and 7 spent two passes making correct
   * and the one a reader checks first. */
  var limit = w.parameters.limit || all.length;
  var rows = all.slice(0, limit);
  var rest = all.slice(limit);
  /* The rule's NAME is the human sentence here and the pf identifier is
   * the machine string: the name wraps and takes the width, the
   * identifier truncates under it. It was the other way round. */
  /* THE REACHED COLUMN GOES TO A SECOND LINE RATHER THAN TO 35 PIXELS.
   * Below 860 px the four fixed columns left it 35 px holding up to 144,
   * header included — the opposite of the bargain this page states, that
   * the densest grids give up their fixed side columns before their
   * labels give up their characters. It moves into the rule cell as a
   * second line, which is what the unified feed already does with its
   * engine column at the same width. */
  var html = '<table class="data"><colgroup>' +
    '<col style="width:17rem"><col style="width:5rem"><col class="col-reached">' +
    '<col style="width:5.25rem"><col style="width:4.75rem">' +
    '</colgroup><thead><tr><th class="diag">Rule</th><th>Interface</th><th class="cell-reached">Reached</th>' +
    '<th class="num">Blocked</th><th>Recent</th></tr></thead><tbody>';
  rows.forEach(function (r) {
    /* Keyed to the rule, not to where the rule sits in today's ranking:
     * a rule that overtakes another must not swap both their colours. */
    var spark = sparkline(distribute(r.blocked, SHAPE_OUTBOUND.slice(0, 12)),
      seriesClass("firewall_rule", r.known ? r.pf : "rid " + r.rid), 60, 14);
    html += "<tr" + (r.known ? "" : ' class="is-flagged"') + '><td class="diag">' +
      (r.known ? esc(r.description) + '<span class="ident" title="' + esc(r.pf) + '">' + esc(r.pf) + "</span>"
               : '<span class="badge">rule no longer exists</span><span class="ident">rid ' + esc(r.rid) + "</span>");
    var reached = r.interfaces.map(interfaceLabel).join(", ") +
      (r.clients.length ? " · " + r.clients.length + " clients" : " · inbound");
    html += '<span class="second-line" title="' + esc(reached) + '">Reached: ' + esc(reached) + "</span>" +
      "</td><td>" + esc(r.identifier || "unknown") + "</td>";
    html += '<td class="cell-reached" title="' + esc(reached) + '">' + esc(reached) + "</td>" +
      '<td class="num">' + fmtInt(r.blocked) + "</td><td>" + spark + "</td></tr>";
  });
  if (rest.length > 0) {
    html += '<tr><td class="diag">The other ' + rest.length +
      (rest.length === 1 ? " rule" : " rules") + "</td><td></td>" +
      '<td class="cell-reached"></td><td class="num">' +
      fmtInt(sum(rest, function (r) { return r.blocked; })) + "</td><td></td></tr>";
  }
  html += '<tr class="is-total"><td colspan="3">All rules</td><td class="num">' +
    fmtInt(sum(all, function (r) { return r.blocked; })) + "</td><td></td></tr>";
  html += "</tbody></table>";
  return { body: html, meta: withScope(w, null) };
};

/* The list name is observed and the list's purpose is assigned, so both
 * are columns — and a list nobody has classified keeps its row and says
 * so, rather than being filed under a purpose it was never given. */
RENDER.blocked_dns_lookups = function (w) {
  /* The widget's own aggregate, so the rows are this card's period and
   * this card's interface scope. It read the day's global table while
   * printing AGG.dnsBlocked underneath, which is the same table at a
   * different period. */
  var all = AGG.dnsRows.slice().sort(function (a, b) { return b.count - a.count; });
  var limit = w.parameters.limit || all.length;
  var rows = all.slice(0, limit);
  var rest = all.slice(limit);
  if (all.length === 0) {
    return { body: statePanel("silent", "The resolver refused no lookup from the clients in scope in this period."),
             meta: withScope(w, null) };
  }
  var html = '<table class="data"><thead><tr><th>Domain</th><th>List</th><th>Purpose</th><th>Asked by</th><th class="num">Refused</th></tr></thead><tbody>';
  rows.forEach(function (r) {
    var purpose = blocklistPurpose(r.list);
    var asked = r.clients.map(function (d) { return interfaceLabel(CLIENT[d].iface); })
      .filter(function (v, i, a) { return a.indexOf(v) === i; }).join(", ");
    html += '<tr><td title="' + esc(r.domain) + '">' + esc(r.domain) + "</td>" +
      "<td>" + (r.list ? esc(r.list) : '<span class="badge">blocked, list not recorded</span>') + "</td>" +
      /* No list recorded is not the same fact as a list nobody has
       * classified: the first has no purpose to assign. */
      "<td>" + (!r.list ? '<span class="muted">—</span>'
                        : purpose ? esc(purpose)
                                  : '<span class="badge">purpose not assigned</span>') + "</td>" +
      /* Both lines of this cell truncate at a narrow card, so both
       * carry the whole string in a title. */
      '<td title="' + esc(r.clients.join(", ")) + '">' + esc(r.clients.join(", ")) +
      '<div class="muted" style="font-size:0.625rem" title="' + esc(asked) + '">' + esc(asked) +
      "</div></td>" +
      '<td class="num">' + fmtInt(r.count) + "</td></tr>";
  });
  if (rest.length > 0) {
    html += "<tr><td>The other " + rest.length + " domains</td><td></td><td></td><td></td>" +
      '<td class="num">' + fmtInt(sum(rest, function (r) { return r.count; })) + "</td></tr>";
  }
  html += '<tr class="is-total"><td colspan="4">All refused lookups</td><td class="num">' + fmtInt(AGG.dnsBlocked) + "</td></tr>";
  html += "</tbody></table>";
  return { body: html, meta: withScope(w, null) };
};

RENDER.alerts_by_signature = function (w) {
  return {
    body: statePanel("disabled", "Detection engine stopped 06:12.")
  };
};

RENDER.source_availability = function (w) {
  var stateText = { reachable: "healthy", present_but_disabled: "not collecting", unavailable: "unavailable" };
  /* THE DIAGNOSTIC SENTENCE IS THE ANSWER THIS CARD EXISTS TO GIVE.
   *
   * Every degraded panel on the page links here, so the Detail column is
   * what the reader came for — and it was the narrowest column on the
   * card, truncating every one of its cells while the provider key
   * beside it rendered whole. The sentence now has the last and widest
   * column, it wraps rather than truncating, and the columns that give
   * the width up are the short machine ones. */
  var html = '<table class="data"><colgroup>' +
    /* The availability column holds a chip that now carries a square
     * mark as well as its word, so it is a little wider than it was;
     * "UNAVAILABLE" and "NOT COLLECTING" must not be the words this
     * card cuts. */
    '<col style="width:6.5rem"><col style="width:9rem"><col style="width:8.5rem">' +
    '<col style="width:3.5rem"><col style="width:4.5rem"><col>' +
    "</colgroup><thead><tr><th>Kind</th><th>Provider</th><th>Availability</th>" +
    '<th>Active</th><th>Checked</th><th class="diag">Detail</th></tr></thead><tbody>';
  PROVIDERS.forEach(function (p) {
    var text = stateText[p.state];
    var cls = p.state === "reachable" ? "badge-ok" : p.state === "present_but_disabled" ? "badge-off" : "badge-unavailable";
    html += '<tr><td title="' + esc(p.kind) + '">' + esc(p.kind) + "</td>" +
      '<td title="' + esc(p.name + " · " + p.key) + '">' + esc(p.name) +
      '<span class="ident">' + esc(p.key) + "</span></td>" +
      '<td class="avail"><span class="badge ' + cls + '">' + esc(text) + "</span></td>" +
      "<td>" + (p.active ? "yes" : "no") + "</td>" +
      "<td>" + esc(p.live === false ? p.checked : liveClock()) + "</td>" +
      '<td class="diag">' + esc(p.detail) + "</td></tr>";
  });
  html += "</tbody></table>";
  html += '<div class="counter counter-dns" style="margin-top:0.5rem"><span class="counter-value">—</span>' +
    "telemetry: no provider kind</div>";
  return { body: html };
};

/* The card's SHAPE, with none of its values. The model holds no system
 * telemetry at all (G9) and no telemetry source has been surveyed (G10),
 * so every reading this panel would carry is unanswerable today. The
 * tiles keep their labels and their footprint — that is what can be
 * judged — and each carries an explicit dash and a greyed area where its
 * sparkline will go, because a zero CPU percentage and an unknown CPU
 * percentage are different facts. Nothing here is a claim.
 *
 * The metrics parameter still chooses which tiles appear, so the panel
 * the maintainer is being asked to fund can be shaped before it exists. */
var HEALTH_TILES = [
  { metric: "uptime",          label: "Uptime",      sub: "since reboot",         spark: false },
  { metric: "cpu",             label: "CPU",         sub: "percent",              spark: true },
  { metric: "memory",          label: "Memory",      sub: "used of total",        spark: true },
  { metric: "swap",            label: "Swap",        sub: "used of total",        spark: true },
  { metric: "disk",            label: "Disk",        sub: "used of total",        spark: true },
  { metric: "temperature",     label: "Temperature", sub: "degrees Celsius",      spark: true },
  { metric: "gateway_latency", label: "Gateway",     sub: "latency and loss",     spark: true }
];

RENDER.firewall_health_overview = function (w) {
  var chosen = w.parameters.metrics || HEALTH_TILES.map(function (t) { return t.metric; });
  var tiles = HEALTH_TILES.filter(function (t) {
    return chosen.indexOf(t.metric) >= 0 ||
      (t.metric === "gateway_latency" && chosen.indexOf("gateway_loss") >= 0);
  });
  if (tiles.length === 0) { tiles = HEALTH_TILES; }
  var html = '<div class="tiles">';
  tiles.forEach(function (tile) {
    html += '<div class="tile tile-empty"><span class="tile-label">' + esc(tile.label) + "</span>" +
      '<span class="tile-value tile-value-empty">—</span>' +
      '<span class="tile-sub">' + esc(tile.sub) + "</span>" +
      (tile.spark ? '<span class="spark-placeholder" aria-label="No samples: this metric is not in the model"></span>' : "") +
      '<span class="tile-sub">not sampled</span></div>';
  });
  html += "</div>";
  /* THE MODEL CANNOT ANSWER, WHICH IS NOT "THE SOURCE IS UNAVAILABLE".
   * This panel used to wear the amber of an unavailable source, which
   * is a condition that could change by starting something. No table in
   * migrations/ can hold a sampled gauge, so the condition is the
   * model's and it gets the model's own treatment. */
  html += '<div style="margin-top:0.5rem">' + statePanel("gap",
    "No telemetry source registered.") + "</div>";
  return { body: html, badge: "not in the model" };
};

/* THE CARD'S SHAPE, WITH NONE OF ITS VALUES — the same treatment the
 * health overview gets, and for the same reason.
 *
 * docs/data-model.md records addr4, addr6, ipv4[], ipv6[] and gateways[]
 * as dropped: the schema stores no interface address, no gateway name
 * and no address history, and docs/widget-catalogue.md tracks all of it
 * as gap G13, which is open. The addresses this card used to print were
 * therefore values no row can fill. They are gone.
 *
 * What stays is what can be judged: the tiles, their labels, the
 * families and history the parameters choose, and an explicit dash in
 * each. An address rendered here would be a guess, and a zero would be
 * worse — it would assert that we looked. */
RENDER.public_address = function (w) {
  var families = w.parameters.families || ["ipv4", "ipv6"];
  var history = w.parameters.show_history !== false;
  var tiles = [];
  if (families.indexOf("ipv4") >= 0) {
    tiles.push({ label: "IPv4", value: "—", sub: "no address column", mono: true });
  }
  if (families.indexOf("ipv6") >= 0) {
    tiles.push({ label: "IPv6", value: "—", sub: "no address column", mono: true });
  }
  /* Which interface is the upstream one follows from which carries a
   * gateway, and gateways[] is dropped too, so not even this is known. */
  tiles.push({ label: "Carried by", value: "—", sub: "no gateway column" });
  tiles.push({ label: "Gateway", value: "—", sub: "no gateway column" });
  if (history) {
    tiles.push({ label: "Last changed", value: "—", sub: "no address history" });
  }
  var html = '<div class="tiles">';
  tiles.forEach(function (t) {
    html += '<div class="tile tile-empty">' +
      '<span class="tile-label">' + esc(t.label) + "</span>" +
      '<span class="tile-value tile-value-empty' + (t.mono ? " mono" : "") +
      '" style="font-size:1.125rem">' + esc(t.value) + "</span>" +
      '<span class="tile-sub">' + esc(t.sub) + "</span></div>";
  });
  html += "</div>";
  html += '<div class="state state-gap" style="margin-top:0.5rem">' +
    '<span class="state-badge">Not in the model</span>' +
    /* The gap identifier is NOT in this sentence. An identifier from the
     * catalogue's own gap table is an internal reference; on screen it
     * is a code the reader cannot look up. The condition is said in
     * words here, and the identifier travels in the card's `data-gap`
     * attribute, where the checks can find it. */
    '<p class="state-text">Not in the model: interface address, gateway, address history.</p>' +
    '<button type="button" class="link-button" data-goto="availability">Sources</button></div>';
  return { body: html, badge: "not in the model" };
};

/* THE CONDITION IS THE MODEL'S, NOT A SETTING'S. The body used to read
 * "Interface counters not collected", which sends a reader looking for
 * a switch to turn on. There is none: the firewall's own interface
 * counters are gaps G9 and G10 — no table can hold a sampled gauge and
 * no telemetry source has been surveyed — which is exactly what the
 * sibling health card says, and this card now says the same thing in
 * the same words. The identifiers stay in `data-gap` and in the design
 * note. */
RENDER.interface_throughput = function (w) {
  return {
    body: statePanel("unavailable",
      "No telemetry source registered."),
    badge: "not in the model"
  };
};

/* THE CHART'S SHAPE, AND ONLY THE SERIES THE MODEL CAN FILL.
 *
 * THE PAIRED AXES CARRY TWO DRAWN SERIES, one per axis, in two different
 * units. They did not: the only series on the left axis was the
 * telemetry one, which the model cannot fill, so the left axis printed
 * five em-dashes beside a right axis of numbers and the card
 * demonstrated nothing about paired axes at all. The left axis now
 * carries INBOUND THROUGHPUT in bit/s and the right carries OUTBOUND
 * VOLUME in bytes — two quantities the model holds, in two units, which
 * is the whole reason a chart grows a second axis.
 *
 * The two outbound series share the right axis because they share a
 * unit, which is what docs/widget-catalogue.md, "Custom chart",
 * requires: "Series of different units get a secondary axis; series of
 * the same unit share one."
 *
 * The telemetry series stays, and stays undrawn — gaps G9 and G10, no
 * table can hold a sampled gauge and no telemetry source has been
 * surveyed. It carries NO AXIS, in the document and here, because no
 * scale can be known for a quantity nothing can measure and an axis of
 * dashes is worse than no axis: it is a scale that looks like one.
 *
 * All four series are read at the same twenty-four buckets. A bucket's
 * inbound volume becomes a rate by dividing by the seconds that bucket
 * covers; nothing is resampled and no mark is dropped.
 *
 * The empty state is per series and never collapsed, which is what
 * docs/widget-catalogue.md, "Custom chart", requires. */
RENDER.custom_chart = function (w) {
  var period = widgetPeriod(w);
  var buckets = bucketsFor(period);
  var bucketSeconds = PERIODS[period].spanSeconds / 24;
  var servers = null, i;
  for (i = 0; i < AGG.interfaces.length; i++) {
    if (AGG.interfaces[i].key === "servers") { servers = AGG.interfaces[i]; }
  }
  var serversBuckets = distribute(servers ? servers.nsBytes : 0, SHAPE_OUTBOUND);
  var inboundBits = buckets.inb.map(function (v) { return v * 8 / bucketSeconds; });
  var series = [
    { label: "CPU", unit: "percent", cls: 1,
      /* Said in words. The two gap identifiers behind it are on the
       * card, in `data-gap`. */
      empty: true, gap: "not in the model" },
    { label: "Inbound throughput", unit: "bit/s", axis: "left", cls: 5, values: inboundBits },
    { label: "Outbound volume", unit: "bytes per bucket", axis: "right", cls: 2, values: buckets.out },
    { label: "Servers, outbound volume", unit: "bytes per bucket", axis: "right", cls: 3, values: serversBuckets }
  ];
  var html = pairedAxisChart(bucketLabels(period), series, 200,
    fmtBits,
    fmtBytes, lineMode(w));
  /* The Scope cell carries the sentence that says why a series has no
   * line, so it takes the width and wraps; the short columns give it up.
   * A missing series gets no swatch, for the same reason a category with
   * no number gets none in the composition legend: a colour key beside
   * it would promise a line that is not there. */
  html += '<table class="data"><colgroup>' +
    '<col style="width:11rem"><col style="width:4rem"><col style="width:3.5rem">' +
    '<col style="width:7.5rem"><col>' +
    '</colgroup><thead><tr><th>Series</th><th>Unit</th><th>Axis</th><th>Aggregation</th>' +
    '<th class="diag">Scope</th></tr></thead><tbody>';
  html += '<tr class="is-flagged"><td><span class="swatch swatch-none"></span> CPU</td><td>percent</td>' +
    '<td>none</td>' +
    '<td>mean per bucket</td><td class="diag"><span class="badge badge-gap">not in the model</span></td></tr>';
  html += '<tr><td><span class="swatch sw-5"></span> Inbound throughput</td><td>bit/s</td><td>left</td><td>mean per bucket</td><td class="diag">every interface</td></tr>';
  html += '<tr><td><span class="swatch sw-2"></span> Outbound volume</td><td>bytes</td><td>right</td><td>sum per bucket</td><td class="diag">every interface</td></tr>';
  html += '<tr><td><span class="swatch sw-3"></span> Servers, outbound volume</td><td>bytes</td><td>right</td><td>sum per bucket</td><td class="diag">Servers (opt4)</td></tr>';
  html += "</tbody></table>";
  return { body: html, badge: "one series not in the model" };
};

RENDER.destination_operators = function (w) {
  var limit = w.parameters.limit || 10;
  var rows = AGG.operators.slice(0, limit);
  var restOps = AGG.operators.slice(limit);
  var html = '<table class="data"><thead><tr><th>AS</th><th>Operator</th><th class="num">Bytes</th><th class="num">Allowed</th><th class="num">Blocked</th><th class="num">Peers</th><th>Interfaces</th></tr></thead><tbody>';
  rows.forEach(function (o) {
    html += "<tr><td>AS" + o.asn + "</td><td>" + esc(o.op) + "</td>" +
      '<td class="num">' + fmtBytes(o.bytes) + '</td><td class="num">' + fmtInt(o.allowed) + "</td>" +
      '<td class="num">' + fmtInt(o.blocked) + '</td><td class="num">' + o.peers + "</td>" +
      "<td>" + esc(o.interfaces.map(interfaceLabel).join(", ")) + "</td></tr>";
  });
  if (restOps.length > 0) {
    html += "<tr><td>—</td><td>The other " + restOps.length + " operators</td>" +
      '<td class="num">' + fmtBytes(sum(restOps, function (o) { return o.bytes; })) + "</td>" +
      '<td class="num">' + fmtInt(sum(restOps, function (o) { return o.allowed; })) + "</td>" +
      '<td class="num">' + fmtInt(sum(restOps, function (o) { return o.blocked; })) + "</td>" +
      '<td class="num">' + fmtInt(sum(restOps, function (o) { return o.peers; })) + "</td><td></td></tr>";
  }
  html += "<tr><td>—</td><td>No geolocation answer yet</td>" +
    '<td class="num">' + fmtBytes(AGG.unresolvedPeerBytes) + '</td><td class="num">' + fmtInt(AGG.unresolvedPeerFlows) + "</td>" +
    '<td class="num">0</td><td class="num">' + (AGG.missAddresses + AGG.pendingAddresses) + "</td><td>Home</td></tr>";
  html += '<tr class="is-total"><td colspan="2">All operators</td><td class="num">' +
    fmtBytes(sum(AGG.operators, function (o) { return o.bytes; }) + AGG.unresolvedPeerBytes) + "</td>" +
    '<td class="num"></td><td class="num"></td><td class="num"></td><td></td></tr>';
  html += "</tbody></table>";
  return { body: html, meta: withScope(w, null) };
};

/* ====================================================================
 * APPLICATION STATE
 * ==================================================================== */

var state = {
  canvas: 0,
  /* "canvas" or "people". The People page replaces the grid in the main
   * area; the canvas tabs stay on screen, so going back is one click. */
  view: "canvas",
  /* Show every client, or only the ones nobody has claimed. */
  peopleFilter: "all",
  selectedWidget: "live-composition",
  /* WHICH OF THE DOCK'S THREE TABS IS SHOWING: "document" is the whole
   * file, "widget" is the selected widget's own lines, "form" is the
   * no-code selector for the same widget. One panel, one Apply. */
  dockTab: "document",
  syntax: "yaml",
  editing: false,
  /* Unapplied edits in whichever surface is mounted. */
  dockDirty: false,
  /* What the dock body currently holds, as a key. The live tick
   * rebuilds everything else and never this: rebuilding the pane takes
   * the caret, and rebuilding the form takes the reader's unapplied
   * choice. */
  dockMounted: null,
  toggles: {},
  /* Which table rows the reader has expanded, keyed widget/row. Held
   * here for the same reason as the popups: the page redraws every two
   * seconds and an opened row must not shut under the reader. */
  expandedRows: {},
  /* The one drill-down open over the canvas, as { kind, widget, key }.
   * It is redrawn from AGG on every tick, so what is open keeps moving
   * with the page. */
  detail: null,
  /* Popup contents survive a live re-render: the page redraws every two
   * seconds and a picked mark must not vanish under the reader. */
  popups: {},
  popupSel: {}
};

function activeEntry() { return CANVASES[state.canvas]; }
function activeDoc() { return activeEntry().doc; }
function activeCanvas() { return activeDoc().canvases[activeEntry().index]; }
function findWidget(id) {
  var ws = activeCanvas().widgets, i;
  for (i = 0; i < ws.length; i++) { if (ws[i].id === id) { return ws[i]; } }
  return null;
}

/* ====================================================================
 * CARD RENDERING
 * ==================================================================== */

function editBar(w, index, count) {
  /* THE BUTTONS NAME THE CARD, NOT THE DOCUMENT ID.
   *
   * They read "Move live-composition left" and "Make live-composition
   * wider", beside a gear reading "Configure Traffic composition, now"
   * on a card headed "Traffic composition, now" — eight buttons
   * speaking an identifier to a person, in the one place on this page
   * where that happened. The id belongs to the document and is on
   * screen in the code view; the person reads the card's heading, so
   * the buttons use the heading. The rule can now be stated without an
   * exception: nothing on the canvas speaks a document id to a reader.
   */
  var name = esc(w.title || (CATALOGUE[w.type] ? CATALOGUE[w.type].title : w.type));
  function button(attr, value, label, face) {
    return '<button class="btn btn-small" data-' + attr + '="' + value +
      '" data-widget="' + esc(w.id) + '" title="' + label + '" aria-label="' + label + '">' + face + "</button>";
  }
  return '<div class="edit-bar">' +
    '<span class="grip">' + esc(w.placement.x + "," + w.placement.y + " " + w.placement.w + "×" + w.placement.h) + "</span>" +
    /* The four arrows named themselves in a `title` and nowhere else,
     * which is nothing at all to a screen reader and nothing to a
     * touch reader either. Each one says what it moves as well as
     * which way. */
    button("move", "left", "Move " + name + " left", "◀") +
    button("move", "right", "Move " + name + " right", "▶") +
    button("move", "up", "Move " + name + " up", "▲") +
    button("move", "down", "Move " + name + " down", "▼") +
    button("size", "narrower", "Make " + name + " narrower", "– width") +
    button("size", "wider", "Make " + name + " wider", "+ width") +
    button("size", "shorter", "Make " + name + " shorter", "– height") +
    button("size", "taller", "Make " + name + " taller", "+ height") +
    "</div>";
}

/* What a widget draws, independently of where it is drawn. The canvas
 * puts it in a card; the per-card configuration surface puts the same
 * thing in its live preview, so the two cannot disagree about what the
 * widget renders. */
function widgetContent(w) {
  var entry = CATALOGUE[w.type];
  var canvasEntry = activeEntry();
  var unresolved = canvasEntry.imported ? widgetIsUnresolved(w) : null;
  var result, heading, typeLine;

  if (!entry && UNKNOWN_TYPES[w.type]) {
    /* An unknown type is an unresolved reference too — the format says
     * so in as many words — but the four facts read differently for it,
     * so it gets its own sentence rather than the reference one bent to
     * fit. */
    var unknown = widgetIsUnresolved(w);
    result = {
      /* The type and the name the file gives it. What happens to the
       * widget — it keeps its footprint, nothing is removed from the
       * document — is visible: the card is still there, at its own
       * size, and the document in the code view is unchanged. */
      body: statePanel("unresolved",
        w.type + (unknown ? " — “" + unknown.label + "” in the file" : "") +
        " — not implemented by this build")
    };
    heading = w.title || w.type;
    typeLine = w.type + " · not implemented by this build";
  } else if (unresolved) {
    var failed = widgetUnresolvedAll(w);
    result = {
      body: statePanel("unresolved",
        failed.map(unresolvedSentence).join(" "),
        '<button type="button" class="link-button" data-repair="' + esc(w.id) + '">Repair</button>',
        failed.map(unresolvedMatchedBy).join(" "))
    };
    heading = w.title || entry.cardTitle || entry.title;
    typeLine = w.type + " · " + entry.title;
  } else {
    /* One render, at this widget's own period AND its own interface
     * scope: the canvas's period unless the widget overrides it, and the
     * whole network unless the widget carries `interfaces` references.
     * AGG is pointed at that aggregate for the length of the call and
     * put back afterwards, so no renderer has to know that a period
     * selector or a scope selector exists. */
    var previousAgg = AGG;
    AGG = aggForWidget(w);
    try {
      result = RENDER[w.type](w);
    } finally {
      AGG = previousAgg;
    }
    heading = w.title || entry.cardTitle || entry.title;
    typeLine = w.type + " · " + entry.title;
  }
    /* A KEY THIS BUILD KEPT AND DID NOT UNDERSTAND IS MARKED ON ITS OWN
   * WIDGET. The other two import conditions each mark theirs; this one
   * rendered perfectly with nothing on it, and was reported only in the
   * import report three screens up. It is not a degraded state — the
   * widget draws everything it was asked for — so it is a note and a
   * header chip rather than a state panel. */
  var kept = canvasEntry.imported ? widgetKeptKeys(w) : [];
  if (kept.length && result && result.body !== undefined) {
    /* The keys, named. The header chip already reads "kept, not
     * understood"; what a reader cannot get from the chip is which key
     * it means, and that is the only thing this line adds. */
    result.body += '<p class="kept-note">Kept, not drawn: ' +
      kept.map(function (r) {
        return '<span class="mono">' + esc(r.value) + ": " + esc(r.label) + "</span>";
      }).join(", ") + "</p>";
  }
  return { entry: entry, result: result, heading: heading, typeLine: typeLine,
           kept: kept };
}

function renderWidget(w, index, count) {
  /* THE CARD IS THE PREVIEW. While the Form tab holds values the
   * document does not, this card draws those values instead of the
   * document's — same renderer, same placement, same size — and marks
   * itself unapplied. The document is untouched until Apply. */
  var pending = (PENDING && PENDING.id === w.id) ? PENDING : null;
  var content;
  if (pending) {
    var previousAgg = AGG;
    AGG = aggForWidget(pending.widget);
    PREVIEW_REPAIRED = pending.repaired;
    try { content = widgetContent(pending.widget); }
    finally { AGG = previousAgg; PREVIEW_REPAIRED = null; }
  } else {
    content = widgetContent(w);
  }
  var entry = content.entry, result = content.result;
  var heading = content.heading, typeLine = content.typeLine;

  /* A card is a short title and a shape. The type identifier, the
   * parameters and the document text all live in the per-card
   * configuration surface, which is closed until it is asked for. */
  /* WHERE THE GAP IDENTIFIERS LIVE. A widget whose catalogue entry
   * names gaps carries them here, as an attribute, not as copy. On
   * screen the card says the condition in words — "not in the model",
   * and the panel underneath says which column is missing — because an
   * identifier out of a table the reader has never seen tells him
   * nothing. The identifiers are still in the artefact, on the card they
   * belong to. */
  var gapAttr = entry && entry.gaps && entry.gaps.length
    ? ' data-gap="' + esc(entry.gaps.join(" ")) + '"' : "";

  /* THE FOOTPRINT TRAVELS AS DATA, NOT AS AN INLINE STYLE.
   * The grid's column count is decided from the canvas container's own
   * width after layout, so the authored twelve-column placement is put
   * on the card and `applyGridLayout` turns it into a grid position for
   * whichever layout is in force. Nothing here is written back to the
   * document. */
  return '<section class="card' + (w.id === state.selectedWidget ? " is-selected" : "") +
    (pending ? " is-pending" : "") + '" ' +
    'data-widget-card="' + esc(w.id) + '" data-type-line="' + esc(typeLine) + '"' + gapAttr + ' ' +
    'data-px="' + w.placement.x + '" data-py="' + w.placement.y + '" ' +
    'data-pw="' + w.placement.w + '" data-ph="' + w.placement.h + '">' +
    editBar(w, index, count) +
    '<header class="card-head">' +
      '<h2 class="card-title">' + esc(heading) + "</h2>" +
      (result.meta ? '<span class="card-meta" title="' + esc(result.meta) + '">' + esc(result.meta) + "</span>" : "") +
      /* A widget that does not take the canvas's range says so, because
       * otherwise two cards side by side answer over different spans and
       * nothing on screen tells the reader which. */
      (entry && widgetOverridesPeriod(w)
        ? '<span class="card-period">own range · ' +
          esc(PERIODS[w.parameters.period].short) + "</span>"
        : "") +
      (result.badge ? '<span class="card-state">' + esc(result.badge) + "</span>" : "") +
      (content.kept && content.kept.length
        ? '<span class="card-kept" title="' +
