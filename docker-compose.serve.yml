# opnview — running the service, so a browser can reach it.
#
# This is a SECOND compose file on purpose, and the reason is a property of
# Compose rather than a preference: Compose interpolates the whole file before it
# runs anything, so a required variable declared beside `checks` would make
#
#     docker compose run --rm checks
#
# refuse to start until that variable was set. The four project commands must not
# acquire a prerequisite they have no use for, so the service that needs one
# lives here and the base file stays as it was.
#
# Canonical invocation, byte-for-byte identical in PowerShell and in bash except
# for how each shell sets a variable:
#
#     bash:        OPNVIEW_LISTEN=8080 docker compose -f docker-compose.serve.yml run --rm --service-ports serve
#     PowerShell:  $env:OPNVIEW_LISTEN=8080; docker compose -f docker-compose.serve.yml run --rm --service-ports serve
#
# Then open http://localhost:<that port>/setup. The console prints a one-time
# setup token; the setup surface demands it. After the account exists the token
# is spent, the setup surface closes permanently, and the firewall URL and the
# API key and secret are entered from the settings surface.
#
# --service-ports IS NOT OPTIONAL, and it is the one thing here that surprises:
# `docker compose run` ignores a `ports:` declaration unless it is passed, so
# without it the service starts, logs that it is listening, and is reachable from
# nowhere.
#
# OPNVIEW_LISTEN has NO DEFAULT, for the same reason the binary's own --listen
# flag has none: an address written into this repository would be one
# installation's configuration shipped to every other. Compose refuses rather
# than inventing one.
#
# PUSH SOURCES are optional, one override file each, added with a further -f
# (README, "Push sources"). Compose cannot omit a ports: entry whose variable is
# unset, so each listener's port lives in a file of its own, which publishes it
# with its protocol and hands it to the service; the canonical invocation above
# names none and runs unchanged:
#
#     docker-compose.push-syslog-tcp.yml   OPNVIEW_SYSLOG_TCP   syslog over TCP
#     docker-compose.push-syslog-udp.yml   OPNVIEW_SYSLOG_UDP   syslog over UDP
#     docker-compose.push-netflow.yml      OPNVIEW_NETFLOW_UDP  NetFlow over UDP
#
#     bash:  OPNVIEW_LISTEN=8080 OPNVIEW_SYSLOG_TCP=<port> docker compose #              -f docker-compose.serve.yml -f docker-compose.push-syslog-tcp.yml #              run --rm --service-ports serve
#
# None of the three variables has a default either. The serve container runs as
# an unprivileged user, so a port below 1024 -- syslog's registered 514 -- fails
# to bind: choose 1024 or above, which OPNsense's remote target accepts.
#
# Step 8 adds deployment. This file runs the service from source in the
# development toolchain; it is not an install story and it is not a production
# configuration.
#
# THE DATABASE. The service's store is its own PostgreSQL with TimescaleDB,
# db-serve below, which `run serve` starts first and waits for. It publishes no
# port: it is reached by name on this project's private network, by the serve
# container alone. Its password is generated inside it at its first start, never
# written here, and handed to opnview as a passfile on a volume only these two
# services mount; opnview reads its connection from OPNVIEW_DATABASE.

services:
  serve:
    extends:
      file: docker-compose.yml
      service: dev
    # A port on the host and the same port in the container. The container binds
    # 0.0.0.0 rather than loopback because a port published out of a container
    # cannot be reached on the container's own loopback.
    ports:
      - "${OPNVIEW_LISTEN:?set OPNVIEW_LISTEN to the port to serve on, e.g. OPNVIEW_LISTEN=8080}:${OPNVIEW_LISTEN}"
    environment:
      # The installation's own database, by name on the private network, with the
      # password read from the passfile db-serve generated.
      OPNVIEW_DATABASE: "host=db-serve port=5432 user=opnview dbname=opnview passfile=/run/opnview-database/pgpass sslmode=disable"
      # The push listeners' ports, empty unless an override file above sets one.
      OPNVIEW_PUSH_SYSLOG_TCP: ""
      OPNVIEW_PUSH_SYSLOG_UDP: ""
      OPNVIEW_PUSH_NETFLOW_UDP: ""
    volumes:
      - serve-database-secret:/run/opnview-database:ro
    depends_on:
      db-serve:
        condition: service_healthy
    # --data-dir is /data, the named volume the base file mounts: the encryption
    # key file and the plugins' data live there and never in the working tree.
    # That is what makes the key file survive a restart and stay out of git
    # status. The database is db-serve's. The command runs through sh so that
    # $$OPNVIEW_DATABASE is the container's own variable, read when it starts,
    # and so that a push listener is asked for only when its port is set.
    command:
      - "sh"
      - "-c"
      - |
        set --
        [ -n "$$OPNVIEW_PUSH_SYSLOG_TCP" ] && set -- "$$@" --push-listen "syslog/tcp=0.0.0.0:$$OPNVIEW_PUSH_SYSLOG_TCP"
        [ -n "$$OPNVIEW_PUSH_SYSLOG_UDP" ] && set -- "$$@" --push-listen "syslog/udp=0.0.0.0:$$OPNVIEW_PUSH_SYSLOG_UDP"
        [ -n "$$OPNVIEW_PUSH_NETFLOW_UDP" ] && set -- "$$@" --push-listen "netflow/udp=0.0.0.0:$$OPNVIEW_PUSH_NETFLOW_UDP"
        go build $${OPNVIEW_BUILD_FLAGS:-} -o /tmp/opnview ./cmd/opnview
        exec /tmp/opnview --data-dir /data --database "$$OPNVIEW_DATABASE" --listen 0.0.0.0:${OPNVIEW_LISTEN} "$$@"

  # The everyday test database of the base file, declared here because serve
  # extends dev, and dev waits for it: `extends` carries that dependency with it.
  # The project is the same, so it is the same service as the base file's.
  db-test:
    extends:
      file: docker-compose.yml
      service: db-test

  # The installation's database: the pinned TimescaleDB image of the base file
  # (the pin is written once, there), with production durability, its data on a
  # named volume of its own -- never `data` -- and no published port.
  db-serve:
    extends:
      file: docker-compose.yml
      service: db-predeployment
    environment:
      # The test services trust every connection; this one asks for the password.
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
      POSTGRES_USER: "opnview"
      POSTGRES_DB: "opnview"
      POSTGRES_PASSWORD_FILE: "/run/opnview-database/postgres-password"
      # Who owns the passfile: the serve container's user (docker-compose.yml, UID).
      OPNVIEW_SERVE_UID: "${OPNVIEW_UID:-1000}"
      OPNVIEW_SERVE_GID: "${OPNVIEW_GID:-1000}"
    volumes:
      - serve-database:/var/lib/postgresql/data
      - serve-database-secret:/run/opnview-database
    # THE PASSWORD IS GENERATED HERE, at the first start, and kept on the secret
    # volume: 40 random letters and digits, the database's own copy readable by
    # its server alone, and a passfile for opnview readable by the serve
    # container's user alone. A later start keeps them. Then the image's own
    # entrypoint runs as it always does.
    entrypoint:
      - "sh"
      - "-c"
      - |
        set -eu
        secrets=/run/opnview-database
        if [ ! -s "$$secrets/postgres-password" ]; then
          umask 077
          password="$$(head -c 64 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 40)"
          printf '%s' "$$password" > "$$secrets/postgres-password"
          printf 'db-serve:5432:opnview:opnview:%s\n' "$$password" > "$$secrets/pgpass"
        fi
        chown postgres "$$secrets/postgres-password"
        chmod 0400 "$$secrets/postgres-password"
        chown "$$OPNVIEW_SERVE_UID:$$OPNVIEW_SERVE_GID" "$$secrets/pgpass"
        chmod 0600 "$$secrets/pgpass"
        exec docker-entrypoint.sh "$$@"
      - "db-serve"
    # Telemetry off, as on every database of this project. The Apache-2.0
    # edition alone, as every test database runs: opnview uses no feature of the
    # Timescale License. The decision of 12 October 2026 to enable it for
    # continuous aggregates is superseded by Phase E (16 October 2026): no
    # continuous aggregate is exactly equivalent to the table it would replace
    # (docs/data-model.md, "Storage fit"), and enabling an unused licence would be
    # a placeholder. Background workers run, as they do in production.
    command:
      - "postgres"
      - "-c"
      - "timescaledb.telemetry_level=off"
      - "-c"
      - "timescaledb.license=apache"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "opnview", "-d", "opnview"]
      interval: 1s
      timeout: 3s
      retries: 60

# `extends` copies a service definition and nothing else, so the named volumes
# the base file declares have to be declared here too. The names are the same and
# the Compose project is the same, so these resolve to the SAME volumes: the
# account created through this file is the account `docker compose run --rm dev`
# sees, and the Go caches are not rebuilt. serve-database and
# serve-database-secret are this file's own: the installation's database and its
# generated password.
volumes:
  go-mod-cache:
  go-build-cache:
  data:
  predeployment-database:
  test-database-socket:
  serve-database:
  serve-database-secret:
