# opnview -- receiving syslog over TCP: an override of docker-compose.serve.yml, added with a
# further -f (README, "Push sources"). It publishes one port, host port equal to
# container port, with its protocol, and hands it to the service, which then
# listens for syslog over TCP on it.
#
#     OPNVIEW_LISTEN=8080 OPNVIEW_SYSLOG_TCP=<port> docker compose -f docker-compose.serve.yml #         -f docker-compose.push-syslog-tcp.yml run --rm --service-ports serve
#
# OPNVIEW_SYSLOG_TCP has NO DEFAULT, for the reason OPNVIEW_LISTEN has none: a port is
# one installation's configuration. The container runs unprivileged, so choose a
# port of 1024 or above. Only the firewall's own addresses are accepted as
# senders; a Docker setup that rewrites the source address of published tcp
# traffic makes every message refused, which the API catalogue lists.
services:
  serve:
    ports:
      - "${OPNVIEW_SYSLOG_TCP:?set OPNVIEW_SYSLOG_TCP to the port to receive syslog over TCP on}:${OPNVIEW_SYSLOG_TCP}/tcp"
    environment:
      OPNVIEW_PUSH_SYSLOG_TCP: "${OPNVIEW_SYSLOG_TCP}"
